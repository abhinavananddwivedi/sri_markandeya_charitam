page_number_devanagari: "९७"
page_number_arabic: 97
image: "images/pages/p097.jpg"
verses:
  - number: 21
    shlok: |
      संविदं समुपलभ्य सुसिद्धौ
      निर्वृताः प्रतिययुः प्रणिपत्य ।
      प्रेरयन्निजजनानभिगन्तु-
      मैहिकादिफलसिद्धिचणांश्च ॥ २१ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता। पाद ४ में "हि" पर अधिलेखन है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā. In pāda 4, "हि" is overwritten.
    shlok_en:
      author: ai_translation
      text: |
        Having gained knowledge for their success, they bowed and went back content, urging their own people, and those skilled in attaining worldly and other fruits, to go to him. (21)
    translation:
      author: amanuensis
      text: |
        ऐहिकादि फलसिद्धि में चतुर लोगों को जाने के लिए प्रेरित करते हुए सुसिद्धि से समाचार को पाकर प्रणाम कर सुखी हो लौट आये ॥ २१ ॥
    notes:
      author: grandfather
      text: |
        मुनि मृकण्ड के विविध प्रत्यक्ष ज्ञानों की जानकारी, उनकी उग्र (पक्की) इतनी अनुपम सिद्धि जानकर आने वाले लोग अपनी सारी जिज्ञासा पूर्ण कर पूर्ण शान्त स्वस्थ होकर वापस जाते थे, और जो उनके अज्ञात व्यक्ति होते थे और वे विविध कार्यों में अपनी कार्य सिद्धि की अपेक्षा रखते उन्हें भी वे लोग मुनि मृकण्ड के पास जाने के समुत्साहित करते। २१
    translation_en:
      author: ai_translation
      text: |
        Having received tidings for their success, they bowed and returned happy, urging people skilled in attaining worldly and other fruits to go [to him]. (21)
    notes_en:
      author: ai_translation
      text: |
        Learning of Sage Mṛkaṇḍa's many kinds of direct knowledge and of his intense (firm), matchless spiritual attainment, the people who came had all their questions answered and went back fully calm and at ease. Those who did not yet know him, and who hoped for success in their various undertakings, were also encouraged by these people to go to Sage Mṛkaṇḍa. (21)
  - number: 22
    shlok: |
      एवमेव बहुधा श्रुतकीर्ति
      मुद्गलो मुनिवरः कुरुवासी ।
      दाक्षिबोधितसुश्रुतचणः स
      स्वात्मजापरिणयाय समुत्कः ॥ २२ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता। पाद २ में "मुद्गलो" का पूर्व रूप काटकर संशोधित है। पाद ३ "दाक्षिबोधितसुश्रुतचणः स" (दाक्षि द्वारा अवगत कराये गये, सुश्रुत से प्रसिद्ध) — पूर्व निष्कासन का "दाक्षिणात्यचरितं सुश्रुत-वृत्तः" (१२ वर्ण) भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā. In pāda 2, an earlier form of "मुद्गलो" is corrected. Pāda 3 reads "दाक्षिबोधितसुश्रुतचणः स" ("informed by Dākṣi, known for what he had well heard"); the earlier export's "दाक्षिणात्यचरितं सुश्रुत-वृत्तः" (12 syllables) was a misreading.
    shlok_en:
      author: ai_translation
      text: |
        In just this way, having often heard of his fame, Mudgala, the excellent sage dwelling among the Kurus, informed by Dākṣi and well acquainted with what he had heard, became eager to give his own daughter in marriage. (22)
    translation:
      author: amanuensis
      text: |
        इस प्रकार अनेक बार कीर्ति सुनकर तथा दाक्षी द्वारा परिचय पाके सुश्रुत सुनकर कुरुवासी मुनिवर मुद्गल अपनी कन्या के विवाह के लिये उत्कण्ठित हो गये ॥ २२ ॥
    notes:
      author: grandfather
      text: |
        यों उनकी यशस्विता की पताका चारों ओर फैल गयी, उस समय कुरुक्षेत्र निवासी महात्मा मुद्गल ने जिन्हें महर्षि दाक्षी ने इनकी सभी बातें बताकर पूर्ण अभिज्ञ बना दिया था वे सदाचरणशील व्यक्ति थे, अपनी कन्या के विवाह के लिए उत्सुक भी थे। २२
    translation_en:
      author: ai_translation
      text: |
        Having thus heard of his fame many times, and having been introduced [to him] by Dākṣi and heard good report, the excellent sage Mudgala, who lived among the Kurus, became eager for his daughter's marriage. (22)
    notes_en:
      author: ai_translation
      text: |
        Thus the banner of his fame spread in all directions. At that time the great soul Mudgala, a resident of Kurukṣetra, whom Maharṣi Dākṣi had made fully acquainted with him by telling him everything about him, and who was a man of good conduct, was also eager for his daughter's marriage. (22)
source: "Sanskrit, Hindi translation and notes re-read line by line from upright crops of the scan by Claude (Opus 5.5), 2026-10-24, correcting the Gemini 3.1 Pro re-run (kept in superseded/gemini_rerun_2026-10-24/). Metre checked by laghu/guru scansion (Svāgatā). shlok_en translates the Sanskrit; translation_en and notes_en translate the Hindi."
