page_number_devanagari: "११२"
page_number_arabic: 112
image: "images/pages/p112.jpg"
verses:
  - number: 51
    shlok: |
      दर्विकर्करिघटैर्जलपात्र-
      संगतैरपि दुकूलपटैश्च ।
      नारिकेलफलचन्दनखण्डै-
      [unclear: रक्षताः कनकभा उदियायुः] ॥ ५१ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता। पाद १-३ स्पष्ट हैं और अनुवाद से पुष्ट ("दर्वी, जलपात्र, लोटा, गगरा, दुकूल, नारियल, चन्दन")। पाद ४ अस्पष्ट है (अनुवाद: "सोने के समान चमकने वाले पीले अक्षत")। पूर्व निष्कासन का पाद १ "दर्वीकर्करीघटे जलपात्रे" और पाद ४ "रञ्जितैः कनकभाऽक्षतदीप्त्या" हस्तलेख से मेल नहीं खाते।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā. Pādas 1–3 are clear and confirmed by the Hindi ("ladle, water vessels, lotā, pitcher, silks, coconut, sandalwood"). Pāda 4 is unclear (Hindi: "yellow akṣata gleaming like gold"). The earlier export's pāda 1 "दर्वीकर्करीघटे जलपात्रे" and pāda 4 "रञ्जितैः कनकभाऽक्षतदीप्त्या" do not match the manuscript.
    shlok_en:
      author: ai_translation
      text: |
        With ladles, jugs and pitchers, together with water vessels, and also with silk cloths, with coconuts and pieces of sandalwood, [unclear: akṣata grains gleaming like gold went forth]. (51)
    translation:
      author: amanuensis
      text: |
        दर्वी (करछुल) जलपात्र लोटा गिलास के साथ गगरा, दुकूल वस्त्रों के साथ नारियल चन्दन, सोने के समान चमकने वाले पीले अक्षत भी थे ॥ ५१ ॥
    notes:
      author: grandfather
      text: |
        दर्वी (एक लम्बी करछुल) के साथ विशाल जलपात्रों, पानी देने के लिए कमण्डलु (जग) एवं घड़ा आदि पात्रों के साथ, उत्तमकोटि के रेशमी वस्त्र दुपट्टों के साथ नारियल के फल शुद्ध श्वेतचन्दन के विशाल टुकड़ों के समूह, सोने की आभा धारण करने वाले पीले रंग के अक्षतों की शोभा निराली लग रही थी। ५१
    translation_en:
      author: ai_translation
      text: |
        There were also a darvī (ladle), water vessels, a lotā and a glass along with a pitcher (gagrā), coconuts and sandalwood along with silk (dukūl) cloths, and yellow akṣata gleaming like gold. (51)
    notes_en:
      author: ai_translation
      text: |
        Along with the darvī (a long ladle) there were large water vessels and, for giving water, kamaṇḍalus (jugs), pots and other vessels; with fine silk cloths and scarves, coconuts and heaps of large pieces of pure white sandalwood, the yellow akṣata, glowing like gold, looked uniquely beautiful. (51)
  - number: 52
    shlok: |
      मार्गमध्यमधिगम्य जनैस्त-
      द्राजकीयवरणीयमिदं क्व ।
      नीयते च कुत एतदिति वा-
      [unclear: पृच्छ्यता]नेकविधैः कौतुकयुतैः ॥ ५२ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता। पाद ४ का पहला शब्द काटकर पुनर्लिखित है और अस्पष्ट है; यह पाद छन्द से एक वर्ण अधिक प्रतीत होता है। पाद २ "द्राजकीयवरणीयमिदं क्व" अनुवाद "राजकीय वरणीय सामग्री" से पुष्ट।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā. The first word of pāda 4 is struck out and rewritten, and is unclear; this pāda appears to be one syllable longer than the metre allows. Pāda 2 "द्राजकीयवरणीयमिदं क्व" is confirmed by the Hindi "राजकीय वरणीय सामग्री".
    shlok_en:
      author: ai_translation
      text: |
        Coming to the middle of the road, people of many kinds, full of curiosity, [asked]: "Where is this royal betrothal gift being taken, and from where?" (52)
    translation:
      author: amanuensis
      text: |
        मार्ग के बीच आकर अनेकविध कौतूहल से युक्त लोगों ने यह राजकीय वरणीय सामग्री कहाँ से कहाँ ले जायी जा रही है? ऐसा पूछा ॥ ५२ ॥
    notes:
      author: grandfather
      text: |
        इस वरण के सामग्री को रास्ते में ले जाते देखने वाले लोगों में बड़ी उत्सुकता थी उन लोगों ने यह जानना चाहा कि यह इतना विशाल राजकीय वरण की वस्तुयें कहाँ से आ रही हैं तथा कहाँ जा रही हैं, इस प्रकार उत्कण्ठावश लोगों ने रास्ते २ रास्ते में जानना चाहा। साश्चर्य सभी पूछते रहे कि यह अनुपम राजकीय सम्भार कहाँ किसका जा रहा है। ५२
    translation_en:
      author: ai_translation
      text: |
        Coming to the middle of the road, people full of curiosity of many kinds asked: "From where to where are these royal betrothal goods being taken?" (52)
    notes_en:
      author: ai_translation
      text: |
        The people who saw these betrothal goods being carried along the road were very curious. They wanted to know where such a huge royal betrothal consignment was coming from and where it was going; so, out of eagerness, people asked along the road. In wonder, everyone kept asking where, and to whom, this matchless royal consignment was going. (52)
notes_uncertain: true
source: "Sanskrit, Hindi translation and notes re-read line by line from upright crops of the scan by Claude (Opus 5.5), 2026-10-24, correcting the Gemini 3.1 Pro re-run (kept in superseded/gemini_rerun_2026-10-24/). Metre checked by laghu/guru scansion (Svāgatā). shlok_en translates the Sanskrit; translation_en and notes_en translate the Hindi."
