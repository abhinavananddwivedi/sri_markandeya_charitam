page_number_devanagari: "१०७"
page_number_arabic: 107
image: "images/pages/p107.jpg"
verses:
  - number: 41
    shlok: |
      आनयन्तु रजनीं दधि दूर्वां
      पूगतण्डुलसुमानि शुभानि ।
      स्वस्तिवाचनमथो द्विजवृन्दै-
      स्नातकस्य फलदानविधिः स्यात् ॥ ४१ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता। पाद २ "पूगतण्डुलसुमानि शुभानि" तथा पाद ४ "स्नातकस्य फलदानविधिः स्यात्" — दोनों हस्तलेख में स्पष्ट हैं; पूर्व निष्कासन के "पूगतण्डुलसुमोदसुमनोभिः" और "स्नातकार्थे फलदानविधिज्ञैः" हस्तलेख में नहीं हैं। पाद ३ के अन्त में "द्विजवृन्दैः" के विसर्ग का संधि-रूप हस्तलेख में स्पष्ट नहीं।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā. Pāda 2 "पूगतण्डुलसुमानि शुभानि" and pāda 4 "स्नातकस्य फलदानविधिः स्यात्" are both clear in the manuscript; the earlier export's "पूगतण्डुलसुमोदसुमनोभिः" and "स्नातकार्थे फलदानविधिज्ञैः" are not in the manuscript. At the end of pāda 3, the sandhi form of the visarga of "द्विजवृन्दैः" is not clear in the manuscript.
    shlok_en:
      author: ai_translation
      text: |
        "Let them bring turmeric, curd, dūrvā grass, betel nuts, rice and fine flowers; then, with the blessing-recitation (svastivācana) by the assembled brahmins, let the phaladān rite of the snātaka take place." (41)
    translation:
      author: amanuensis
      text: |
        आप लोग हल्दी-दही-दूब-सुपाड़ी-चावल सुन्दर पुष्प ले आवें। ब्राह्मणों के स्वस्तिवाचन किये जाने पर उसे ही स्नातक (वर) का फलदान विधि जानें ॥ ४१ ॥
    notes:
      author: grandfather
      text: |
        तो अब तुरन्त आप लोग हल्दी, दही, दूब, सुपाड़ी, अक्षत (चावल के कण) अन्न विविध प्रकार के सुरभित पुष्पों को ले आवें, ये (और ब्राह्मण मुनिसमूह) स्वस्ति वाचन आरम्भ करें और स्नातक ऋषि मृकण्ड की फलदान (वाग्दान) की प्रक्रिया पूरी हो जाय।
    translation_en:
      author: ai_translation
      text: |
        "Please bring turmeric, curd, dūb grass, betel nuts, rice and fine flowers. Once the brahmins have recited the svastivācana, take that itself as the phaladān rite of the snātaka (the groom)." (41)
    notes_en:
      author: ai_translation
      text: |
        "So now, at once, please bring turmeric, curd, dūb grass, betel nuts, akṣata (grains of rice), grain and fragrant flowers of various kinds. Let these (and the assembly of brahmin sages) begin the svastivācana, and let the phaladān (vāgdān, betrothal) of the snātaka sage Mṛkaṇḍa be completed." (41)
  - number: 42
    shlok: |
      विप्रवर्यमपि स्वजनगुणेभ्यः
      पूजितं किल [unclear: जगद्वि]जनार्दनशाश्वतात् ।
      तद् भवत्सु किल सन्निहितेषु
      पूर्णमस्ति किमतोऽस्ति विचार्यम् ॥ ४२ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता (पाद १, २, ४ छन्द में पूर्णतः ठीक नहीं बैठते; पाठ हस्तलेख के अनुसार)। पाद १ "स्वजनगुणेभ्यः" (अनुवाद "स्वजनगुणों से युक्त" से पुष्ट), पाद २ "...जनार्दनशाश्वतात्" (अनुवाद "जनार्दन शाश्वत से भी अधिक पूजित"), पाद ४ "पूर्णमस्ति किमतोऽस्ति विचार्यम्" (अनुवाद "सब कुछ पूर्ण ही है, अब इसके आगे विचार क्या है")। पूर्व निष्कासन के "स्वजनयुतैश्च", "पूर्यते किमु विनिश्चयोऽत्र" हस्तलेख में नहीं हैं। इस श्लोक के नीचे टिप्पणी के लिए रिक्त स्थान छोड़ा गया है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā (pādas 1, 2 and 4 do not scan perfectly; the text follows the manuscript). Pāda 1 reads "स्वजनगुणेभ्यः" (confirmed by the Hindi "स्वजनगुणों से युक्त"), pāda 2 "...जनार्दनशाश्वतात्" (Hindi "more honoured even than the eternal Janārdana"), and pāda 4 "पूर्णमस्ति किमतोऽस्ति विचार्यम्" (Hindi "everything is complete; what is there to consider beyond this?"). The earlier export's "स्वजनयुतैश्च" and "पूर्यते किमु विनिश्चयोऽत्र" are not in the manuscript. Space for commentary is left blank below this verse.
    shlok_en:
      author: ai_translation
      text: |
        "Even a foremost brahmin is honoured for the virtues of his own people, [more] than the eternal Janārdana; so, with you all present here, everything is complete. What more is there to consider?" (42)
    translation:
      author: amanuensis
      text: |
        स्वजनगुणों से युक्त विप्रवर इष्ट जनार्दन शाश्वत से भी अधिक पूजित है। ऐसे आपलोगों के विद्यमान रहने पर सब कुछ पूर्ण ही है, अब इसके आगे विचार क्या है? ॥ ४२ ॥
    translation_en:
      author: ai_translation
      text: |
        "An excellent brahmin endowed with the virtues of his people is honoured even more than the beloved, eternal Janārdana. With such people as you present, everything is complete; what is left to consider beyond this?" (42)
notes_uncertain: true
source: "Sanskrit, Hindi translation and notes re-read line by line from upright crops of the scan by Claude (Opus 5.5), 2026-10-24, correcting the Gemini 3.1 Pro re-run (kept in superseded/gemini_rerun_2026-10-24/). Metre checked by laghu/guru scansion (Svāgatā). shlok_en translates the Sanskrit; translation_en and notes_en translate the Hindi. Verse 42 has no grandfather's notes; the space below it is blank in the manuscript."
