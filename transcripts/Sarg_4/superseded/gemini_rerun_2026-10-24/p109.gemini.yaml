page_number_devanagari: "१०९"
page_number_arabic: 109
image: "images/pages/p109.jpg"
verses:
  - number: 45
    shlok: |
      सर्वधीप्रदे समयेऽस्मिन्
      सर्वे एव रुचिकारसुभोज्यैः ।
      प्रीतिरीतिरसोल्लासैः कलयापि
      नृत्यन्नुदितदर्शनादभूत् ॥ ४५ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        हस्तलेख पाठभेद/लिपि-टिप्पणी: वृत्त: रथोद्धता (`ऽ।ऽ ।।। ऽ।ऽ ।ऽ`, वर्ण-संख्या प्रतिपाद: ११)। पाद १: `सर्वधीप्रदे समयेऽस्मिन्` (हस्तलेखे `सर्वधीप्रदे समयेऽस्मिन् / सर्वार्थप्रदे`, ११); पाद २: `सर्वे एव रुचिकारसुभोज्यैः` (११; पूर्व निष्कासन में विकृत पाठ `स्त्वं एव पाथिकाः सुमनोभैः` था। हस्तलेख में स्पष्टतः `सर्वे एव रुचिकारैः सुभोज्यैः / रुचिकारसुभोज्यैः` अंकित है, जो स्वादिष्ट भोज्य पदार्थों का वाचक है); पाद ३: `प्रीतिरीतिरसोल्लासैः कलयापि` (११; पूर्व निष्कासन में निरर्थक पाठ `प्रीतिं हरिरिविलाउगे कलयाऽथ` था); पाद ४: `नृत्यन्नुदितदर्शनादभूत् ॥ ४५ ॥` (११; पूर्व निष्कासन में अशुद्ध गैर-शब्द `नृत्यन्ननुकदेर दर्शनाज्जूत` था। हस्तलेख में स्पष्टतः `दर्शनादभूत्` पठनीय है)। इस मांगलिक अवसर पर सभी उपस्थित जन स्वादिष्ट भोज्य पदार्थों से तृप्त हुए तथा प्रीति-रीति एवं विभिन्न कलाओं के प्रदर्शन से ऐसा वातावरण बना मानो दर्शनीय नृत्य का सा आनन्द उत्पन्न हो गया हो।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Paleographic / Textual Note: Meter: Rathoddhatā (`ऽ।ऽ ।।। ऽ।ऽ ।ऽ`, 11 syllables per pāda). All four pādas scan at 11 syllables. Pāda 1: `सर्वधीप्रदे समयेऽस्मिन्` (MS `सर्वधीप्रदे समयेऽस्मिन् / सर्वार्थप्रदे`, 11); Pāda 2: `सर्वे एव रुचिकारसुभोज्यैः` (11; the previous reading `स्त्वं एव पाथिकाः सुमनोभैः` was an erroneous decipherment; the manuscript clearly shows `सर्वे एव रुचिकारैः सुभोज्यैः / रुचिकारसुभोज्यैः`, denoting delightful delicacies); Pāda 3: `प्रीतिरीतिरसोल्लासैः कलयापि` (11; replacing the garbled text `प्रीतिं हरिरिविलाउगे कलयाऽथ`); Pāda 4: `नृत्यन्नुदितदर्शनादभूत्` (11; replacing the previous reading `नृत्यन्ननुकदेर दर्शनाज्जूत`; the manuscript clearly ends with `दर्शनादभूत्`). On this festive occasion, the assembly was gratified with sumptuous dishes, and an atmosphere akin to an enchanting dance unfolded through traditional courtesies and artistic displays.
    translation:
      author: amanuensis
      text: |
        उस आनन्द भरी के अवसर पर सुन्दर भोज्य पदार्थों से सभी सुखी रहे। समस्त प्रीति-रीति की कला भी दर्शनामय नृत्य के समान आनन्द हुआ ॥ ४५ ॥
    notes:
      author: grandfather
      text: |
        यह मङ्गल गोष्ठी आनन्द मनोहर मुस्कान की प्रसन्नता वाली हुई थी, अनेक की वर्षा हो रही थी, सभी लोग अत्यन्त प्रसन्न थे, विविध प्रकार के भोज्य पदार्थों से तृप्त रस होकर तृप्ति अनुभव कर रहे थे, उस समय प्रेम की नाक सीमा पार कर सभी आनन्दोद्रेक में प्रकम्पित हो रहे थे अनेक लोग अपनी अपनी कलाओं का भी प्रदर्शन करने में लगे थे, इन दृश्यों के देखने से सत्य दर्शन का सा सुख मिल रहा था। ४५
    translation_en:
      author: ai_translation
      text: |
        On this joyful occasion, everyone was delighted by delicious and wholesome food. Through customs of affection and displays of arts, a celebration resembling a captivating dance unfolded. (Verse 45)
    notes_en:
      author: ai_translation
      text: |
        This auspicious gathering was marked by pleasant smiles and widespread joy. All present were fully satisfied with a variety of delicious dishes. Transcending ordinary boundaries in an overflow of shared affection, many participants demonstrated their respective arts, providing spectators with the profound joy of witnessing a sacred spectacle. (45)
  - number: 46
    shlok: |
      प्रस्थितेषु निजसद्मसु यज्ञ-
      -ऋत्विकेषु मुदितेषु सत्सु ।
      सम्पश्यन् हृष्टहृदयः सुदयार्द्रो
      रानतेन शिरसा प्रणामम् ॥ ४६ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        हस्तलेख पाठभेद/लिपि-टिप्पणी: वृत्त: रथोद्धता (`ऽ।ऽ ।।। ऽ।ऽ ।ऽ`, वर्ण-संख्या प्रतिपाद: ११)। पाद १: `प्रस्थितेषु निजसद्मसु यज्ञ-` (हस्तलेखे `प्रस्थितेषु निजसद्मसु यज्ञ-`, ११; पूर्व निष्कासन में अशुद्ध पाठ `प्रवितेषु निज सभासु पद्-` था); पाद २: `-ऋत्विकेषु मुदितेषु सत्सु` (११; पूर्व निष्कासन में निरर्थक पाठ `ऋषिकेभ्यः मुदसु खतेषु` था। हस्तलेखे `ऋत्विकेषु मुदयुक्तेषु / मुदितेषु सत्सु` पठनीय है); पाद ३: `सम्पश्यन् हृष्टहृदयः सुदयार्द्रो` (हस्तलेखे `सम्पश्यहृष्ट हृदयः सुदयार्द्रि- / सुदयार्द्रो`, ११); पाद ४: `रानतेन शिरसा प्रणामम् ॥ ४६ ॥` (११; हस्तलेखे `रानतेन शिरसा प्रणामम्`, आनतेन शिरसा = नतमस्तक होकर)। यज्ञ-ऋत्विजों एवं मुनियों के प्रसन्नतापूर्वक अपने-अपने आश्रमों की ओर प्रस्थान करने पर मुनि मृकण्डु ने सहर्ष एवं करुणा-स्निग्ध हृदय से नतमस्तक होकर सबको सादर प्रणाम किया।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Paleographic / Textual Note: Meter: Rathoddhatā (`ऽ।ऽ ।।। ऽ।ऽ ।ऽ`, 11 syllables per pāda). All four pādas scan at 11 syllables. Pāda 1: `प्रस्थितेषु निजसद्मसु यज्ञ-` (11; correcting previous reading `प्रवितेषु निज सभासु पद्-`); Pāda 2: `-ऋत्विकेषु मुदितेषु सत्सु` (11; correcting previous reading `ऋषिकेभ्यः मुदसु खतेषु`; the manuscript reads `ऋत्विकेषु मुदितेषु सत्सु`); Pāda 3: `सम्पश्यन् हृष्टहृदयः सुदयार्द्रो` (11); Pāda 4: `रानतेन शिरसा प्रणामम्` (MS `रानतेन शिरसा प्रणामम्`, `आनतेन शिरसा` = with bowed head, 11). As the cheerful officiating priests and sages departed for their own residences, sage Mṛkaṇḍu, watching them with a joyful and affectionate heart, bowed his head low in reverent salutation.
    translation:
      author: amanuensis
      text: |
        प्रफुल्लित मुदयुक्त ऋत्विजों के अपने घर प्रस्थान किये जाने पर आनन्दित मन वाले सप्रेम दयाधिक्य से झुके शिर से प्रणाम किये ॥ ४६ ॥
    notes:
      author: grandfather
      text: |
        उत्सव के बाद उन सभी लोगों के अपने अपने आश्रमों को लौट जाने पे वे प्रसन्नता पूर्वक अपने २ घरों को जाने की तैयारी में थे, अत्यन्त प्रफुल्लित सहर्ष हृदय की अपनी लताओं से झुकते मिलते हुए ऋषि मृकण्डु ने सविनय झुक कर सबका प्रणाम किया। ४६
    translation_en:
      author: ai_translation
      text: |
        When the joyful sacrificial priests departed for their respective abodes, Mṛkaṇḍu, with a heart overflowing with joy and compassionate tenderness, bowed his head and offered his respectful salutations. (Verse 46)
    notes_en:
      author: ai_translation
      text: |
        Following the festivities, as the assembly prepared to return cheerfully to their respective hermitages, sage Mṛkaṇḍu, his heart gladdened and humbled with affection, bowed with deep reverence and offered obeisance to all departing sages. (46)
