page_number_devanagari: "९८"
page_number_arabic: 98
image: "images/pages/p098.jpg"
verses:
  - number: 23
    shlok: |
      तेन सार्धमभिगम्य विनीतः
      प्रार्थनातिशयमत्र चिकीर्षुः ।
      मार्गजानपद[unclear: वर्धित]चेताः
      प्रह्व तं मुनिमृकण्डुमुवाच ॥ २३ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता। पाद ३ में "पद" के बाद एक शब्द पर अधिलेखन है ("वर्धित"/"हर्षित"; अनुवाद "प्रफुल्लित" दोनों से संगत)। पाद ४ "प्रह्व तं" — पूर्व निष्कासन का "प्रह्वतं" एक शब्द नहीं है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā. In pāda 3 a word after "पद" is overwritten ("वर्धित" or "हर्षित"; the Hindi "प्रफुल्लित" fits either). Pāda 4 reads "प्रह्व तं"; the earlier export's "प्रह्वतं" is not a word.
    shlok_en:
      author: ai_translation
      text: |
        Coming there with him, humble and wishing to make an earnest request, his heart [uplifted] by the country people along the way, he bowed and spoke to the sage Mṛkaṇḍu. (23)
    translation:
      author: amanuensis
      text: |
        अतिशय प्रार्थना करने की इच्छा वाले उनके साथ जाकर जनपद के मार्ग में प्रफुल्लित चित्त वाले मुद्गल मुनि ने मुनिवर मृकण्डु से कहा ॥ २३ ॥
    notes:
      author: grandfather
      text: |
        अत्यन्त विनयशील मुनि मुद्गल अपने सहचरों के साथ चलते हुए अपनी कन्या के विवाह के लिए विनीत भाव से अनुनय विनय करने की अभिलाषा से आ रहे थे, उन्हें रास्ते में विविध जनपदों से होते हुए जाना पड़ रहा था सर्वत्र मुनि मृकण्ड की सिद्धियों विभूतियों की चर्चा सुनते हुए उनके आश्रम में पहुँच कर मुनि मृकण्ड को पाकर उनसे यों कहना शुरू किया। २३
    translation_en:
      author: ai_translation
      text: |
        Going with him, the sage Mudgala, who wished to make an earnest request and whose heart was gladdened along the roads of the countryside, said to the excellent sage Mṛkaṇḍu: (23)
    notes_en:
      author: ai_translation
      text: |
        The most humble Sage Mudgala was coming with his companions, wishing to make a humble request for his daughter's marriage. On the way he had to pass through various districts, and everywhere he heard talk of Sage Mṛkaṇḍa's spiritual powers and greatness. Reaching his hermitage and finding Sage Mṛkaṇḍa, he began to speak to him thus. (23)
  - number: 24
    shlok: |
      स्नातकं समुपश्रुत्य भवन्तं
      पाणिपीडनमहं तनयायाः ।
      कर्तुमागतमवेहि मुने मां
      स्वीकृतिर्हि भवता करणीया ॥ २४ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता। पाद ३ "कर्तुमागतमवेहि मुने मां" तथा पाद ४ "स्वीकृतिर्हि भवता करणीया" — दोनों अनुवाद ("विवाहार्थ आये हुए मुझे जानकर आप स्वीकृति प्रदान करें") से पुष्ट; पूर्व निष्कासन का "कर्तुमागत इहास्मि मुनीन्द्र / स्वीकुरुष्व हि मया क्रियमाणाम्" हस्तलेख में नहीं है। पाद १ में "पश्रु" संयुक्ताक्षर से पूर्व-वर्ण गुरु हो जाता है; कवि ने यहाँ "श्र" को स्थिति-कारक नहीं माना है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā. Pāda 3 "कर्तुमागतमवेहि मुने मां" and pāda 4 "स्वीकृतिर्हि भवता करणीया" are both confirmed by the Hindi ("knowing me to have come for the marriage, please grant your consent"); the earlier export's "कर्तुमागत इहास्मि मुनीन्द्र / स्वीकुरुष्व हि मया क्रियमाणाम्" is not in the manuscript. In pāda 1 the conjunct "श्रु" would make the preceding syllable heavy; the poet does not count "श्र" as making position here.
    shlok_en:
      author: ai_translation
      text: |
        "Having heard that you are a snātaka (unmarried graduate), know me, O sage, to have come to perform my daughter's marriage; your consent must be given." (24)
    translation:
      author: amanuensis
      text: |
        आपको स्नातक सुनकर मैं अपनी कन्या के विवाहार्थ यहाँ आया हूँ। मुनिवर! विवाहार्थ आये हुए मुझे जानकर आप स्वीकृति प्रदान करें ॥ २४ ॥
    notes:
      author: grandfather
      text: |
        हे मुनिपुङ्गव! मैंने सुना है अभी आप स्नातक (अविवाहित) हैं, मैं अपनी कन्या का विवाह करने की अभिलाषा से आया हुआ हूँ, ऐसा आप समझें, मैं आपसे विवाह करने की स्वीकृति चाहता हूँ, विश्वास है आप अवश्य स्वीकार करेंगे। २४
    translation_en:
      author: ai_translation
      text: |
        "Having heard that you are a snātaka, I have come here for my daughter's marriage. Excellent sage, knowing that I have come for the marriage, please give your consent." (24)
    notes_en:
      author: ai_translation
      text: |
        "O best of sages! I have heard that you are still a snātaka (unmarried). Please understand that I have come wishing to give my daughter in marriage. I seek your consent to the marriage, and I trust that you will surely accept." (24)
notes_uncertain: true
source: "Sanskrit, Hindi translation and notes re-read line by line from upright crops of the scan by Claude (Opus 5.5), 2026-10-24, correcting the Gemini 3.1 Pro re-run (kept in superseded/gemini_rerun_2026-10-24/). Metre checked by laghu/guru scansion (Svāgatā). shlok_en translates the Sanskrit; translation_en and notes_en translate the Hindi."
