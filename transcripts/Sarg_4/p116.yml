page_number_devanagari: "११६"
page_number_arabic: 116
image: "images/pages/p116.jpg"
verses:
  - number: 59
    shlok: |
      सर्वमेव वरणीयमुदीर्य पाठैः
      मङ्गलायनमुदीर्य शुभं द्राक् ।
      कुम्भलग्नमपरो करतल्ले
      सम्मदेन पुरतो वितताम ॥ ५९ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता (पाद १ और ३-४ में हस्तलेख का पाठ छन्द से पूर्णतः मेल नहीं खाता; पाठ यथावत्)। पाद १ "सर्वमेव वरणीय[मुदीर्य] पाठैः", पाद २ "मङ्गलायनमुदीर्य शुभं द्राक्", पाद ३ "कुम्भलग्नमपरो करतल्ले", पाद ४ "सम्मदेन पुरतो वितताम" — अनुवाद ("शुभ मङ्गल पाठ करके कुम्भ के स्पर्श करने के लिए ... वर के हाथ में देने के लिए आगे बढ़ाया") से पुष्ट। पाद १ और ३ के कुछ अक्षर अस्पष्ट हैं। पूर्व निष्कासन के "मङ्गलैः", "मथाऽथ कुम्भयुक्", "कराग्रके", "वितस्तरे" हस्तलेख में नहीं हैं।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā (in pāda 1 and pādas 3–4 the manuscript text does not fully fit the metre; it is kept as written). Pāda 1 reads "सर्वमेव वरणीय[मुदीर्य] पाठैः", pāda 2 "मङ्गलायनमुदीर्य शुभं द्राक्", pāda 3 "कुम्भलग्नमपरो करतल्ले", and pāda 4 "सम्मदेन पुरतो वितताम", confirmed by the Hindi ("having recited the auspicious blessing, ... put forward to give into the groom's hand to touch the kumbha"). Some letters in pādas 1 and 3 are unclear. The earlier export's "मङ्गलैः", "मथाऽथ कुम्भयुक्", "कराग्रके" and "वितस्तरे" are not in the manuscript.
    shlok_en:
      author: ai_translation
      text: |
        Having recited with readings all that belongs to the betrothal, and quickly uttered the auspicious blessing, they joyfully held out before him, into his palm, the things that had touched the kumbha. (59)
    translation:
      author: amanuensis
      text: |
        सर्वप्रथम उन्होंने शुभ मङ्गल पाठ करके कुम्भ के स्पर्श करने के लिए प्रेमपूर्वक वर के हाथ में देने के लिए आगे बढ़ाया ॥ ५९ ॥
    notes:
      author: grandfather
      text: |
        विविध माङ्गलिक मन्त्रों के पाठपूर्वक सभी वरणीय (वर को प्रदान करने वाली वस्तुओं को) कुम्भ (वरुण देवता के स्पर्श के साथ) वर के हाथ में देने के लिए सारी वस्तुयें क्रमशः वितरण करते हुए आनन्द का अनुभव किया। ५९
    translation_en:
      author: ai_translation
      text: |
        First of all, having recited the auspicious blessing, they lovingly held [the things] out to give into the groom's hand, to touch the kumbha. (59)
    notes_en:
      author: ai_translation
      text: |
        With the recitation of various auspicious mantras, they joyfully handed over, one after another, all the betrothal gifts (the things to be given to the groom), touched to the kumbha (that is, to the god Varuṇa), to be given into the groom's hand. (59)
  - number: 60
    shlok: |
      कान्तिकारि सहस्रमितास्ता-
      स्त्वञ्जलौ विनिहिताः कनमुद्राः ।
      पीततण्डुलचये व्यतिरेकं
      नापुरीक्षणयुगानि जनानाम् ॥ ६० ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता (पाद १ "कान्तिकारि" में एक लघु वर्ण अधिक प्रतीत होता है)। पाद २ "स्त्वञ्जलौ विनिहिताः कनमुद्राः" ("कन" = कनक, हस्तलेख के अनुसार)। पाद ४ का पहला अक्षर अधिलिखित है; पाठ "नापुरीक्षणयुगानि" (अनुवाद "नेत्रयुगल ... नहीं पा सके" से पुष्ट; पूर्व निष्कासन का "नापुरीक्षित" भ्रान्त था)।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā (pāda 1 "कान्तिकारि" seems to have one extra light syllable). Pāda 2 reads "स्त्वञ्जलौ विनिहिताः कनमुद्राः" ("कन" = kanaka, as written). The first letter of pāda 4 is overwritten; the reading is "नापुरीक्षणयुगानि", confirmed by the Hindi ("the pairs of eyes ... could not find"); the earlier export's "नापुरीक्षित" was wrong.
    shlok_en:
      author: ai_translation
      text: |
        A thousand gleaming gold coins were placed in his cupped hands; amid the heap of yellow rice, the pairs of eyes of the people could not tell them apart. (60)
    translation:
      author: amanuensis
      text: |
        वर की अञ्जली में एक हजार स्वर्णमुद्रा रखी गयी, पीले अक्षतों के समूह में लोगों के नेत्रयुगल व्यतिरेक को नहीं पा सके ॥ ६० ॥
    notes:
      author: grandfather
      text: |
        उस समय वर के हाथों में एक सहस्र स्वर्णमुद्रायें (अतिशय दीप्त) रखी गईं, साथ ही साथ लगे पीले चावल के अक्षतों पर भी दर्शकों की उल्लास पूर्ण दृष्टि विशेष नहीं पड़ सकी, क्योंकि चारों ओर स्वर्णमुद्रा की दीप्ति ही अत्यन्त मुग्धकारी रही। ६०
    translation_en:
      author: ai_translation
      text: |
        A thousand gold coins were placed in the groom's cupped hands; among the heap of yellow akṣata, people's pairs of eyes could not find any difference. (60)
    notes_en:
      author: ai_translation
      text: |
        At that moment a thousand gold coins (exceedingly bright) were placed in the groom's hands. The joyful gaze of the onlookers could not pay any particular attention to the yellow rice akṣata lying alongside, because all around it was the radiance of the gold coins that was so captivating. (60)
source: "Sanskrit, Hindi translation and notes re-read line by line from upright crops of the scan by Claude (Opus 5.5), 2026-10-24, correcting the Gemini 3.1 Pro re-run (kept in superseded/gemini_rerun_2026-10-24/). Metre checked by laghu/guru scansion (Svāgatā). shlok_en translates the Sanskrit; translation_en and notes_en translate the Hindi."
