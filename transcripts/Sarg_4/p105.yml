page_number_devanagari: "१०५"
page_number_arabic: 105
image: "images/pages/p105.jpg"
verses:
  - number: 37
    shlok: |
      गृह्यतां फलमिदं क्रतुसूत्र-
      सम्मितं समनुगृह्य भवद्भिः ।
      अल्पकैरहमहोभिरिहैत्य
      कर्तुमीह उपयन्तृविधिं द्राक् ॥ ३७ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता। पाद १ "क्रतुसूत्र-" (यज्ञसूत्र), पाद २ "सम्मितं समनुगृह्य भवद्भिः" — अनुवाद "यज्ञसूत्र सम्मित इस फल को मेरे लिए अनुग्रह करके आप लोग स्वीकार करें" से पुष्ट। पाद ३ "अल्पकैरहमहोभिरिहैत्य" और पाद ४ "कर्तुमीह उपयन्तृविधिं द्राक्" का पाठ कुछ अनिश्चित है। पूर्व निष्कासन के "प्रभुसूत्रं / त्संप्रीत्या मम नु गृह्यतां प्रहर्षम्" (१२ वर्ण के पाद) हस्तलेख में नहीं हैं।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā. Pāda 1 reads "क्रतुसूत्र-" (the sacrificial thread) and pāda 2 "सम्मितं समनुगृह्य भवद्भिः", confirmed by the Hindi ("please accept, as a favour to me, this fruit together with the sacrificial thread"). The readings of pāda 3 "अल्पकैरहमहोभिरिहैत्य" and pāda 4 "कर्तुमीह उपयन्तृविधिं द्राक्" are somewhat uncertain. The earlier export's "प्रभुसूत्रं / त्संप्रीत्या मम नु गृह्यतां प्रहर्षम्" (12-syllable pādas) is not in the manuscript.
    shlok_en:
      author: ai_translation
      text: |
        "May this fruit, together with the sacrificial thread, be accepted by your honours as a favour. Coming here again in a few days, I wish to carry out the rite of the bridegroom (the wedding) quickly." (37)
    translation:
      author: amanuensis
      text: |
        यज्ञ सूत्र सम्मित इस फल को मेरे लिए अनुग्रह करके आप लोग स्वीकार करें। थोड़े दिनों में सावधान होकर मैं उपस्थित इस माङ्गलिक विधि को सम्पन्न करना चाहता हूँ ॥ ३७ ॥
    notes:
      author: grandfather
      text: |
        महर्षे! आप उदारता पूर्वक मेरे ऊपर अपनी कृपा देखकर यह फलसमन्वित ब्रह्मसूत्र (यज्ञोपवीत) जो आपको फलदान (वररक्षा) स्वरूप प्रदान करता हूँ, इसे स्वीकार करें। मैं पूरी सावधानी के साथ थोड़े ही दिनों में इस वैवाहिक माङ्गलिक कार्य को सविधि पूर्ण करना चाहता हूँ। ३७
    translation_en:
      author: ai_translation
      text: |
        "Please accept, as a favour to me, this fruit together with the sacrificial thread. In a few days I wish, with due care, to carry out this auspicious rite that is at hand." (37)
    notes_en:
      author: ai_translation
      text: |
        "Great sage! Out of generosity, looking on me with your favour, accept this sacred thread (yajñopavīta) with fruit, which I offer you as the phaladān (vara-rakṣā, the betrothal token). With full care I wish to complete this auspicious wedding rite properly in just a few days." (37)
  - number: 38
    shlok: |
      दैवतो यदिह किञ्चिदुपेया-
      त्तद् तद् भवद्भिरधुना ग्रहणीयम् ।
      दिष्टवादिभिरवश्यतया त-
      त्कार्यमेव सकलं हृदयेन ॥ ३८ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता। पाद २ "त्तद् तद्" (हस्तलेख; पाठ "तत्तद्" अपेक्षित) — इस प्रकार पाद ११ वर्णों से एक अधिक है। पाद ३ "दिष्टवादिभिरवश्यतया त-" अनुवाद के "अवश्य" से पुष्ट; पूर्व निष्कासन का "दिष्टवादिभिरतीव यतस्तत्" भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā. Pāda 2 reads "त्तद् तद्" (manuscript; "तत्तद्" is expected), which gives the pāda one syllable more than 11. Pāda 3 "दिष्टवादिभिरवश्यतया त-" is confirmed by the Hindi "अवश्य"; the earlier export's "दिष्टवादिभिरतीव यतस्तत्" was a misreading.
    shlok_en:
      author: ai_translation
      text: |
        "Whatever may come here by fate, each such thing should now be accepted by your honours; for by those who believe in destiny, all of it must surely be done wholeheartedly." (38)
    translation:
      author: amanuensis
      text: |
        भाग्यवशात् जो कुछ यहाँ उपलब्ध हो उसे सम्प्रति आप लोग स्वीकार करें। भाग्यवादियों को भी हृदय से इसे अवश्य करना चाहिए ॥ ३८ ॥
    notes:
      author: grandfather
      text: |
        ईश्वरेच्छा और दैवयोग से जो कुछ भी यहाँ मुझे उपलब्ध हो जायगा मैं समस्त वस्तुजात आपको समर्पित करूँगा आप भी सहर्ष प्रसन्नतापूर्वक उसे स्वीकारें, हम भाग्यवादियों को जो भी दैवयोग से उपस्थित हो जाय उसे सहृदयता पूर्वक अवश्य स्वीकार करना चाहिए। ३८
    translation_en:
      author: ai_translation
      text: |
        "Whatever is available here by fortune, please accept it now. Those who believe in fate should surely do this with all their heart." (38)
    notes_en:
      author: ai_translation
      text: |
        "Whatever I may obtain here by God's will and by fate, I will offer all of it to you; please accept it gladly. We who believe in fate should surely accept wholeheartedly whatever comes to us by fate." (38)
source: "Sanskrit, Hindi translation and notes re-read line by line from upright crops of the scan by Claude (Opus 5.5), 2026-10-24, correcting the Gemini 3.1 Pro re-run (kept in superseded/gemini_rerun_2026-10-24/). Metre checked by laghu/guru scansion (Svāgatā). shlok_en translates the Sanskrit; translation_en and notes_en translate the Hindi."
