page_number_devanagari: "१०८"
page_number_arabic: 108
image: "images/pages/p108.jpg"
verses:
  - number: 43
    shlok: |
      एवमुक्तवति शक्तिसुते [unclear: उ-]
      [unclear: द्दानिते] विधिवद् गौतमेन ।
      आसने समुपवेश्य मृकण्डुं
      तं [unclear: सुसज्ज्यमभितो] विविशुस्ते ॥ ४३ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता। यह श्लोक हल्की स्याही में है और कई अंश अस्पष्ट हैं। पाद १ के आरम्भ में एक शब्द काटा गया है। पाद २ का आरम्भ अस्पष्ट है; "गौतमेन" टिप्पणी के "गौतमीय सहयोगी" तथा अनुवाद के "उस गोत्रीय द्वारा" से संगत है। पाद ३ "आसने समुपवेश्य मृकण्डुं" स्पष्ट है। पाद ४ "तं ...ऽभितो विविशुस्ते" (अनुवाद: "उसके चारों ओर लोग बैठ गये")। पूर्व निष्कासन का "गोप्रदानैर्विधिवद् गोदानैः" हस्तलेख में नहीं है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā. This verse is in faint ink and several parts are unclear. A word is struck out at the start of pāda 1. The start of pāda 2 is unclear; "गौतमेन" fits the notes' "गौतमीय सहयोगी" and the Hindi's "उस गोत्रीय द्वारा". Pāda 3 "आसने समुपवेश्य मृकण्डुं" is clear. Pāda 4 reads "तं ...ऽभितो विविशुस्ते" (Hindi: "people sat around him"). The earlier export's "गोप्रदानैर्विधिवद् गोदानैः" is not in the manuscript.
    shlok_en:
      author: ai_translation
      text: |
        When the son of Śakti had spoken thus, [unclear] Gautama duly seated Mṛkaṇḍu on a seat, and they [having adorned him] sat down around him. (43)
    translation:
      author: amanuensis
      text: |
        उस प्रकार शक्तिपुत्र पराशर के कहने पर विधिवदादि उस [unclear: गोत्रीय] द्वारा रखे गये आसन पर मृकण्डु को बैठाकर तथा उसे सजाकर उसके चारों ओर लोग बैठ गये ॥ ४३ ॥
    notes:
      author: grandfather
      text: |
        इस प्रकार शक्तिपुत्र पराशर जी के कहने पर अभिमत गौतमीय सहयोगी उस मुनि द्वारा बड़े ही कल्याण सुसज्जित आसन आदि तैयार कर दिया गया, जिस पर सुन्दर धूप दीप आदि आसन को सजा धजा कर मुनि मृकण्डु बैठ गये, साथ ही उनके चारों ओर अन्य ऋषिगण उन्हें घेर कर सावधान होकर बैठ गये। ४३
    translation_en:
      author: ai_translation
      text: |
        When Parāśara, the son of Śakti, had spoken thus, Mṛkaṇḍu was seated in due form on the seat placed by that [unclear: "gotrīya", probably the Gautama-born sage], and having adorned him, people sat down all around him. (43)
    notes_en:
      author: ai_translation
      text: |
        When Parāśara, the son of Śakti, had spoken thus, that sage, the esteemed companion of the Gautama line, prepared a very auspicious, finely adorned seat and the like. Having decorated the seat with fine incense, lamps and so on, Sage Mṛkaṇḍu sat on it, and the other sages sat attentively around him, encircling him. (43)
  - number: 44
    shlok: |
      दाक्षिमुख्यमुनिभिः कृतपूर्वे
      मङ्गलाचरणविधौ स्थिरचित्तः ।
      मुद्गलः सफलनिष्कयुगं त-
      त्प्राञ्जलौ सुविनयेन दधार ॥ ४४ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता। पाद २ "मङ्गलाचरणविधौ स्थिरचित्तः" (अनुवाद: "माङ्गलिक विधान किये जाने पर स्थिरचित्त"); पूर्व निष्कासन का "मङ्गलानि विधिवद् विरचित्य" हस्तलेख में नहीं है। पाद ३ के अन्त में "त=" (योजक चिह्न) है, और "मुद्गलः" से पहले एक अक्षर काटा गया है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā. Pāda 2 reads "मङ्गलाचरणविधौ स्थिरचित्तः" (Hindi: "when the auspicious rite had been performed, steady-minded"); the earlier export's "मङ्गलानि विधिवद् विरचित्य" is not in the manuscript. Pāda 3 ends "त=" (a hyphen mark), and a letter is struck out before "मुद्गलः".
    shlok_en:
      author: ai_translation
      text: |
        When the auspicious rite had first been performed by the sages led by Dākṣi, Mudgala, steady of mind, with great humility placed that pair of gold coins (niṣka), with fruit, in [the groom's] joined palms. (44)
    translation:
      author: amanuensis
      text: |
        दाक्षिप्रधान मुनियों के द्वारा पूर्व ही माङ्गलिक विधान किये जाने पर स्थिरचित्त मुद्गल भी फल के साथ दो निष्क (मुद्रा) वर की अञ्जलि में विनयपूर्वक रखा ॥ ४४ ॥
    notes:
      author: grandfather
      text: |
        मुख्य दाक्षि प्रभृति मुनियों द्वारा पहले ही माङ्गलिक वरदानादि का विधान कर दिया गया था, अतः पुनः मुद्गल ऋषि ने शान्त स्वस्थ चित्त होकर मङ्गलों की कामना से उत्तम फलादि के साथ १ जोड़ी स्वर्णमुद्रायें दी जिसे मुनि मृकण्डु ने सविनय अपने दोनों हाथों की अञ्जलि बना कर उसे धारण किया (स्वीकार किया)। ४४
    translation_en:
      author: ai_translation
      text: |
        The auspicious rite having already been performed by the sages led by Dākṣi, the steady-minded Mudgala, too, humbly placed two niṣkas (coins) with fruit in the groom's cupped hands. (44)
    notes_en:
      author: ai_translation
      text: |
        The auspicious rites of blessing and the like had already been performed by the sages headed by Dākṣi. Then Sage Mudgala, calm and composed in mind, wishing for blessings, gave one pair of gold coins together with fine fruits and the like, which Sage Mṛkaṇḍu humbly received in the cup of his two hands (accepted). (44)
notes_uncertain: true
source: "Sanskrit, Hindi translation and notes re-read line by line from upright crops of the scan by Claude (Opus 5.5), 2026-10-24, correcting the Gemini 3.1 Pro re-run (kept in superseded/gemini_rerun_2026-10-24/). Metre checked by laghu/guru scansion (Svāgatā). shlok_en translates the Sanskrit; translation_en and notes_en translate the Hindi."
