page_number_devanagari: "८९"
page_number_arabic: 89
image: "images/pages/p089.jpg"
verses:
  - number: 5
    shlok: |
      बाल्यतोऽपि ततपोभृतशक्तिः
      सप्तभौमभवनं खलु कर्तुम् ।
      ईश्वरोऽपि न तथाकृतलोक-
      शिक्षणाय महतामनुवृत्तिः ॥ ५ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता। पृष्ठ के ऊपर श्लोक ९ का एक प्रारूप ("रज्जुवृन्दयुत सुश्लथनयुक्तं ... बहुकर्मचणान् सः") उसके हिन्दी अनुवाद सहित तिरछी रेखाओं से काटा हुआ है; उसके ऊपर भूल से संख्या "५" लिखी है। अन्तिम पाठ पृष्ठ ९१ पर है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā. At the top of the page a draft of verse 9 ("रज्जुवृन्दयुत सुश्लथनयुक्तं ... बहुकर्मचणान् सः"), with its Hindi translation, is crossed out with an X; it is mistakenly numbered "५". The final text is on page 91.
    shlok_en:
      author: ai_translation
      text: |
        His power nourished by long austerity from childhood, he resolved to build a seven-storeyed house. Even the Lord acted so, to teach the world; the great follow [such a course]. (5)
    translation:
      author: amanuensis
      text: |
        महर्षि मृकण्डु ने सतमहला भवन निर्माणार्थ बाल्यकाल से ही तपःशक्ति अर्जित की थी। ईश्वर भी उस प्रकार लोक शिक्षणार्थ परजनों का अनुवर्तन नहीं किया था ॥ ५ ॥
    notes:
      author: grandfather
      text: |
        मुनि मृकण्ड ने बाल्यकाल से तपस्या की अधिकता से शक्ति सम्पन्नता प्राप्त कर ली थी, उन्होंने सात मंजिला भवन निर्माण करने को सोचा, क्योंकि ईश्वर ने भी लोक शिक्षण के लिए अत्यन्त विशाल सृष्टि की रचना की है।
    translation_en:
      author: ai_translation
      text: |
        Maharṣi Mṛkaṇḍu had acquired the power of austerity from childhood itself, for building a seven-storeyed house. Even God did not imitate others in that way, for the instruction of the world. (5)
    notes_en:
      author: ai_translation
      text: |
        Through the abundance of his austerity from childhood, Sage Mṛkaṇḍa had become endowed with power. He thought of building a seven-storeyed house, for God too has created a vast universe for the instruction of the world. (5)
  - number: 6
    shlok: |
      आजहार सकलं जनताभ्यो
      वास्तुवस्तु स मुनिः ससहायः ।
      दैवशक्तिमनुरुध्य चिकीर्षुः
      सावधानमनसा सुनिदध्यौ ॥ ६ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्वागता।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Svāgatā.
    shlok_en:
      author: ai_translation
      text: |
        With his companion, the sage gathered from the people all the materials for building. Wishing to act in accord with divine power, he meditated with an attentive mind. (6)
    translation:
      author: amanuensis
      text: |
        सहायक के साथ मुनिवर मृकण्डु ने जनता से समस्त वास्तु सामग्री को ले आया। दैवशक्ति को रोककर करने वाले उन्होंने सावधान मन से ध्यान लगाया ॥ ६ ॥
    notes:
      author: grandfather
      text: |
        यों मुनि मृकण्ड ने अपने सहयोगी ऋषि आंगिरस के साथ वहाँ की स्थानीय जनता से सम्पूर्ण गृहनिर्माण के लिए वास्तुविधि पूर्ण करने की सारी वस्तुयें जुटायी और अत्यन्त सावधान मन से दैवी शक्ति का संस्मरण करते हुए अभिनव वृहत्तर भवन निर्माण के लिए सावधान मन से अच्छी तरह विचार किया।
    translation_en:
      author: ai_translation
      text: |
        With his helper, the excellent sage Mṛkaṇḍu brought all the building materials from the people. Wishing to act, holding back divine power [Hindi "रोककर", "holding back", renders Sanskrit "अनुरुध्य", which here more likely means "in accord with"], he meditated with an attentive mind. (6)
    notes_en:
      author: ai_translation
      text: |
        Thus Sage Mṛkaṇḍa, with his companion Sage Āṅgirasa, gathered from the local people all the things needed to complete the building rites for the whole house. Recollecting divine power with a very attentive mind, he considered carefully how to build a new and larger house. (6)
source: "Sanskrit, Hindi translation and notes re-read line by line from upright crops of the scan by Claude (Opus 5.5), 2026-10-24, correcting the Gemini 3.1 Pro re-run (kept in superseded/gemini_rerun_2026-10-24/). Metre checked by laghu/guru scansion (Svāgatā). shlok_en translates the Sanskrit; translation_en and notes_en translate the Hindi."
