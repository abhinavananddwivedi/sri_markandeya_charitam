page_number_devanagari: "१५१"
page_number_arabic: 151
image: "images/pages/p151.jpg"
verses:
  - number: 65
    shlok: |
      इति पथि विविधाभिर्गीर्भिरश्रान्तभावात्
      प्रमुदितमनसस्ते ग्राममासाद्य सद्यः ।
      उपगतवति नैशेऽप्यन्धकारे निवासं
      क्वचिदपि च विधातुं साधु निश्चिक्युरेवम् ॥ ६५ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: मालिनी (।।।।।।ऽऽ ऽ।ऽऽ।ऽऽ) — सर्ग के अन्तिम श्लोकों के लिए वृत्त बदला है। चारों पाद छन्द में बैठते हैं। पाद १: लिखित "विविधाभि र्गीभि" जैसा; "गीर्भिः" (वाणियों से; हिन्दी "विविध वार्तालापों से") पढ़ा गया।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Mālinī (।।।।।।ऽऽ ऽ।ऽऽ।ऽऽ); the metre changes for the closing verses of the canto. All four pādas scan. Pāda 1: written like "विविधाभि र्गीभि"; read as "गीर्भिः" (with words; the Hindi has "with various conversations").
    shlok_en:
      author: ai_translation
      text: |
        So, on the road, delighted in mind with all kinds of talk and never tiring, they soon reached a village; and as the darkness of night came on, they resolved in this way to make a proper lodging somewhere. (65)
    translation:
      author: amanuensis
      text: |
        इस प्रकार मार्ग में अश्रान्त भाव से विविध वार्तालापों से आनन्दित मन वाले वे बराती शीघ्र गाँव को पाकर रात्रिकालीन अन्धकार के होने पर कहीं अपने रुकने के लिए निश्चय किये ॥ ६५ ॥
    notes:
      author: grandfather
      text: |
        यों सारे बराती रास्ते भर अनेक प्रकार की बातों को कहते, सुनते, देखते, रुचि के कारण थकान का [unclear: अनु]भव न करते हुए, अत्यन्त प्रसन्न मन से शाम को किसी ग्राम में आकर, सान्ध्यकालीन घनी काली रात्रि के आ जाने से आगे चलने में असमर्थता के कारण कहीं पर निवास करने को निश्चय किया । ६५
    translation_en:
      author: ai_translation
      text: |
        So the wedding party, untiring on the road and glad at heart from all kinds of conversation, quickly reached a village, and when the darkness of night came on, they decided to stop somewhere. (65)
    notes_en:
      author: ai_translation
      text: |
        So all the members of the wedding party, saying, hearing and seeing many kinds of things all along the road, and because of their interest not feeling tired, came in the evening, very happy at heart, to a village; and since the thick black night of dusk had come and they could not go further, they decided to stay somewhere. (65)
  - number: 66
    shlok: |
      वयमपि च दिनान्ते सद्गृहस्यैकभागे
      क्वचिदपि निजवासं [unclear: संविदध्याम] सम्यक् ।
      उषसि पुनरितो द्रागुत्थिताः स्वीयमार्गं
      प्रचलितहयहेषाप्रस्वनैः संश्रयेम ॥ ६६ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: मालिनी। चारों पाद छन्द में बैठते हैं। पाद २: "निजवासं" के बाद एक शब्द कटा हुआ है; फिर "साविदध्याम" जैसा लिखा है — "संविदध्याम" (हम व्यवस्था करें) पढ़ा गया, जो छन्द (ऽ।ऽऽ।) और हिन्दी ("अपने निवास चुनते हैं") दोनों से मेल खाता है। पाद ४: "हेषा" पर हल्का सुधार।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Mālinī. All four pādas scan. Pāda 2: after "निजवासं" a word is struck out; then something like "साविदध्याम" is written, read as "संविदध्याम" (let us arrange), which fits both the metre (ऽ।ऽऽ।) and the Hindi ("we choose our lodging"). Pāda 4: a light correction on "हेषा".
    shlok_en:
      author: ai_translation
      text: |
        "Let us too, at the day's end, properly arrange a lodging for ourselves somewhere, in one part of a good house; and at dawn, rising quickly from here, let us take to our road again amid the neighing of the horses as they set off." (66)
    translation:
      author: amanuensis
      text: |
        हम सभी किसी अच्छे घर के एक भाग में अपने निवास चुनते हैं । प्रातः होने पर शीघ्र उठकर प्रस्थान सूचक घोड़ों के हिनहिनाहट के साथ अपने मार्ग में चल पड़ेंगे ॥ ६६ ॥
    notes:
      author: grandfather
      text: |
        अरे ! हम लोग भी इस सान्ध्य वेला में गाँव के किसी एक घर के एक हिस्से में अपना ठौर ठिकाने से रहने की व्यवस्था करें । पुनः कल प्रातः सवेरे ही उठकर सारी थकान मिट जाने के बाद प्रसन्नता से हिनहिनाते हुए घोड़ों के ध्वनि के साथ अपने गन्तव्य की ओर चल पड़ेंगे । ६६
    translation_en:
      author: ai_translation
      text: |
        "We will all choose our lodging in one part of some good house. When morning comes we will rise quickly and set off on our way with the neighing of the horses that signals departure." (66)
    notes_en:
      author: ai_translation
      text: |
        "Come! Let us too, at this evening hour, arrange to stay properly settled in one part of some house in the village. Then tomorrow, rising early in the morning, when all our tiredness has gone, we will set off happily toward our destination with the sound of the neighing horses." (66)
notes_uncertain: true
