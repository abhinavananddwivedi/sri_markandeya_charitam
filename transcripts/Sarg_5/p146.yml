page_number_devanagari: "१४६"
page_number_arabic: 146
image: "images/pages/p146.jpg"
verses:
  - number: 55
    shlok: |
      रुचिरकुट्टिममण्डितकूपके
      शुचिनिपानमवेक्ष्य विशश्रमुः ।
      विपणितः प्रतिमृग्य सुमोदका-
      न्बुभुजिरे च पपुर्जलमुत्तमम् ॥ ५५ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: द्रुतविलम्बित। चारों पाद लिखित रूप में छन्द में बैठते हैं। पाद २: "निपान" = पशुओं के पानी पीने का कुण्ड (टिप्पणी में यही व्याख्या)। हिन्दी अनुवाद के अन्त में संख्या "५४" जैसी लिखी है; यह श्लोक ५५ है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Drutavilambita. All four pādas scan as written. Pāda 2: "निपान" = a trough where animals drink (as the note explains). The number at the end of the Hindi translation looks like "५४"; this is verse 55.
    shlok_en:
      author: ai_translation
      text: |
        At a well adorned with a lovely paved floor, seeing a clean drinking-trough, they rested; and, seeking out fine sweets from the market, they ate them and drank excellent water. (55)
    translation:
      author: amanuensis
      text: |
        सुन्दर फर्श से विभूषित कूप के पास पावन अल्प जलाशय को देखकर लोगों ने विश्राम किया । बाजार से सुन्दर लड्डू अन्वेषण कर खाये और उत्तम जल पिये ॥ ५५ ॥
    notes:
      author: grandfather
      text: |
        यों रास्ते में चलते हुए बारातियों ने एक अत्यन्त सुन्दर मनोहारी फर्श (जिसके फर्श [unclear: कणों] अति उत्तम कारीगरों द्वारा भव्य निर्माण किया गया है) से युक्त मनोहर कुएँ को देखकर निपान (अर्थात् कुएँ के समीप उसी तरह फर्श के बने हुए जीवों के पानी पीने का जलाशय) को भी देखकर विश्राम किया तथा बाजार से मिठाई की दुकानों से लाकर लड्डुओं को खाया तथा पानी पीकर पूर्ण सन्तुष्ट हुए ।
    translation_en:
      author: ai_translation
      text: |
        Seeing a small clean pool by a well adorned with a lovely paved floor, the people rested. They sought out fine laddus in the market, ate them and drank excellent water. (55)
    notes_en:
      author: ai_translation
      text: |
        So, walking along the road, the wedding party saw a charming well with a very beautiful, lovely paved floor (whose floor [unclear: …] was splendidly built by very fine craftsmen), and seeing also the nipāna (that is, a pool next to the well, with a paved floor of the same kind, where animals drink water), they rested; and bringing laddus from the sweet-shops of the market, they ate them, drank water and were fully satisfied.
  - number: 56
    shlok: |
      उपगते किल पश्चिमपर्वते
      सवितरि स्वमरीचिसमुज्झिते ।
      निजकुलायसमुन्मुख[unclear: मा]ययुः
      सहचरैः सहिताश्च पतत्त्रिणः ॥ ५६ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: द्रुतविलम्बित। चारों पाद लिखित रूप में छन्द में बैठते हैं। पाद ३: "समुन्मुख" के बाद का अक्षर "मा" या "गा" — "समुन्मुखमाययुः" (अपने घोंसलों की ओर उन्मुख होकर आये) अर्थ और छन्द दोनों में ठीक बैठता है। पाद ४: लिखित "पतत्रिणः"।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Drutavilambita. All four pādas scan as written. Pāda 3: the letter after "समुन्मुख" is "मा" or "गा"; "समुन्मुखमाययुः" (they came, turned toward their nests) fits both sense and metre. Pāda 4: written "पतत्रिणः".
    shlok_en:
      author: ai_translation
      text: |
        When the sun, having given up its own rays, had reached the western mountain, the birds too, with their mates, turned toward their own nests and went. (56)
    translation:
      author: amanuensis
      text: |
        अपने किरणों को छोड़कर भगवान् सूर्य के अस्ताचल पर चले जाने पर समस्त पक्षिगण अपनी सहचरियों के साथ अपने घोंसले की ओर चलने को तत्पर हुए ॥ ५६ ॥
    notes:
      author: grandfather
      text: |
        जब भगवान् सूर्य अपनी किरणों को [unclear: धीरे] छोड़कर (समेटते हुए) पश्चिम दिशा की ओर उन्मुख हो अस्ताचल की ओर जाने के लिए तैयार थे, सभी पक्षियाँ भी सन्ध्या काल में अपनी सहचरियों के साथ अपने अपने घोंसलों (नीडों) की ओर जाने की तैयारी में बड़े मनोहर लग रहे थे । ५६
    translation_en:
      author: ai_translation
      text: |
        When the lord Sun, leaving his rays, had gone to the western mountain, all the birds, with their mates, made ready to go toward their nests. (56)
    notes_en:
      author: ai_translation
      text: |
        When the lord Sun, [unclear: slowly] leaving (drawing in) his rays, had turned toward the west and was ready to go to the western mountain, all the birds too, at dusk, getting ready to go with their mates to their own nests, looked very lovely. (56)
notes_uncertain: true
