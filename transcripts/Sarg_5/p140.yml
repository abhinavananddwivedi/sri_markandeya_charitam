page_number_devanagari: "१४०"
page_number_arabic: 140
image: "images/pages/p140.jpg"
verses:
  - number: 43
    shlok: |
      सितविमानयुतानतुलप्रभा-
      न्पितृगणाध्युषितच्छविसन्निभान् ।
      नभसि सार्धसमुत्पतितानमू-
      न्[unclear: परम]भागवतेन्दुनिवासिनः ॥ ४३ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: द्रुतविलम्बित। पाद ४: पहला शब्द "तपदि"/"सपदि" जैसा भी दिख सकता है; हिन्दी "परम भागवत" के अनुसार "परम" पढ़ा गया (दोनों छन्द में बैठते हैं)। पाद २ "-च्छविसन्निभान्" (पितरों की कान्ति के समान)।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Drutavilambita. Pāda 4: the first word might also look like "तपदि"/"सपदि"; it is read "परम" from the Hindi "परम भागवत" (both scan). Pāda 2 "-च्छविसन्निभान्" (like the radiance of the ancestors).
    shlok_en:
      author: ai_translation
      text: |
        [Look at] these supreme devotees, dwellers of the Moon's world, in white aerial cars, of matchless radiance, radiant like the hosts of ancestors who live there, flying up together in the sky. (43)
    translation:
      author: amanuensis
      text: |
        पितृगणों से परिव्याप्त इसलिये शोभा सम्पन्न सफेद विमान [unclear: युतों] से अतुल प्रभा शाली आकाश में एक साथ उड़ते हुए परम भागवत चन्द्रलोक निवासियों को देखो ॥ ४३ ॥
    notes:
      author: grandfather
      text: |
        अत्यन्त धवल श्वेत विमान में रहनेवाले, अत्यन्त तीव्र कायकान्तिवाले, पितृगणों द्वारा रहने के कारण अत्यन्त तेजस्वी कान्तिवाले, अत्यन्त [unclear: शुभ्र] कान्ति सम्पन्न आकाश मार्ग में उसके साथ ही उड़ते हुए से प्रतीत होने वाले ~~श्री~~ भगवान् चन्द्रलोकवासी लोगों को भी देखें ।
    translation_en:
      author: ai_translation
      text: |
        Look at the supreme devotees who dwell in the Moon's world: pervaded by the hosts of ancestors and therefore splendid, of matchless radiance from their white aerial cars, flying together in the sky. (43)
    notes_en:
      author: ai_translation
      text: |
        Look also at the people of the blessed Moon's world: living in pure white aerial cars, with intensely bright bodies, very glorious in radiance because the ancestors live with them, of very [unclear: bright] lustre, seeming to fly along the sky-path together with it. (43)
  - number: 44
    shlok: |
      कनककुण्डलहारविभूषिता-
      नमलदिव्यमणिप्रतिपूरितान् ।
      शुचिकिरीटचतुःकरशोभिता-
      न्रविनिभान्रविलोकनिवासिनः ॥ ४४ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: द्रुतविलम्बित। पाद २ लिखा है "न्नमल…" (पिछले पाद के अन्त का न् + अमल)। पाद ४ का पहला अक्षर "न"-जैसा, पर हिन्दी ("सूर्य के समान") के अनुसार "रविनिभान्"।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Drutavilambita. Pāda 2 is written "न्नमल…" (the final न् of pāda 1 + अमल). The first letter of pāda 4 looks like "न", but the Hindi ("like the sun") gives "रविनिभान्".
    shlok_en:
      author: ai_translation
      text: |
        [Look at] the dwellers of the Sun's world, like the sun: adorned with golden earrings and necklaces, filled with pure divine gems, resplendent with bright crowns and four hands. (44)
    translation:
      author: amanuensis
      text: |
        स्वच्छ दिव्यमणि जटित स्वर्णनिर्मित कुण्डल हारादिकों से विभूषित पावन मुकुट तथा हस्त ~~[कटा हुआ]~~ चतुष्टय से सुशोभित सूर्य के समान सूर्यलोक में ~~निवासियों~~ निवास करने वालों को देखो ॥ ४४ ॥
    notes:
      author: grandfather
      text: |
        अब आप सूर्य लोक में रहने वालों को तो देखें । ये अतिशय स्वर्ण कुण्डल एवं विविध स्वर्णिम हारों से सदा शोभा सम्पन्न रहने वाले, निर्मल विविध महार्घ मणियों से संयुक्त, अनेक पवित्र मणिमण्डित मुकुटों से युक्त चार हाथों वाले, साक्षात् भगवान् सूर्य के समान प्रभा प्रतिभासित रविलोक वासियों को भी देखें । ४४
    translation_en:
      author: ai_translation
      text: |
        Look at those who dwell in the Sun's world, like the sun: adorned with gold-made earrings, necklaces and the like set with pure divine gems, resplendent with holy crowns and four hands. (44)
    notes_en:
      author: ai_translation
      text: |
        Now do look at those who live in the Sun's world. Look also at these dwellers of the Sun's world: always splendid with abundant golden earrings and various golden necklaces, set with various pure and costly gems, wearing many holy gem-studded crowns, four-handed, shining with a radiance like that of the blessed Sun himself. (44)
notes_uncertain: true
