page_number_devanagari: "१२५"
page_number_arabic: 125
image: "images/pages/p125.jpg"
verses:
  - number: 13
    shlok: |
      परिणये परमेष्ठिनिदेशतो
      [unclear: नवसुताः] किल गोत्रकराः शुभाः ।
      ऋषिगणा अपि शक्तिजशक्तितो
      वरगृहं प्रति सज्जितमाययुः ॥ १३ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: द्रुतविलम्बित। द्वितीय पाद का प्रथम शब्द "नवसुताः"/"नवयुताः" जैसा है (हिन्दी: "नवीन बालाएँ"); छन्द दोनों में ठीक है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Drutavilambita. The first word of pāda 2 looks like "नवसुताः" or "नवयुताः" (Hindi: "new maidens"); either scans.
    shlok_en:
      author: ai_translation
      text: |
        At the wedding, by the command of Parameṣṭhin (Brahmā), auspicious [unclear: young maidens], founders of the gotra, and hosts of sages too, by the power of Śakti's son (Parāśara), came adorned to the bridegroom's house. (13)
    translation:
      author: amanuensis
      text: |
        विवाह में ब्रह्मा के आदेश से गोत्र का सुन्दर नवीन बालाएँ, ऋषिगण तथा शक्तिज पराशर महर्षि की शक्ति से सजधज कर वर के घर आ गये ॥ १३ ॥
    notes:
      author: grandfather
      text: |
        इस वैवाहिक कार्य में विधाता परमेष्ठी के आदेशानुसार मृकण्डु ऋषि के गोत्र प्रवर वाले [unclear: कई सम्बन्धियों] के पूर्व पुरुष स्वयं वहाँ उपस्थित हो गये। शक्तिपुत्र मुनि पराशर जी के शक्ति प्रभाव से अनेक ऋषि प्रवर लोग भी ठीक मृकण्डु के घर सज धज कर स्वयं [unclear: बारात] में सम्मिलित होने के लिए स्वतः वहाँ आ पहुँचे। १३
    translation_en:
      author: ai_translation
      text: |
        At the wedding, by Brahmā's command, the lovely young maidens of the gotra, and the hosts of sages, by the power of the great sage Parāśara, Śakti's son, came adorned to the bridegroom's house. (13)
    notes_en:
      author: ai_translation
      text: |
        At this wedding, by the command of the Creator Parameṣṭhin, the forefathers of [unclear: several relatives] sharing Sage Mṛkaṇḍu's gotra and pravara came there in person. By the power of Parāśara, son of Śakti, many eminent sages too came of their own accord, adorned, right to Mṛkaṇḍu's house, to join the [unclear: wedding party] themselves. (13)
  - number: 14
    shlok: |
      सुतविवाहविलोकनसन्मनाः
      विविधभावविभावनतत्परः ।
      शुभमतिर्जनकोऽस्य सयोषितो-
      ऽनुजयुतः किल सम्मत आययौ ॥ १४ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: द्रुतविलम्बित। तृतीय पाद का अन्तिम शब्द "सयोषितो"/"सयोषणो" जैसा (हिन्दी: "सपत्नीक"); चतुर्थ पाद अवग्रह से आरम्भ ("ऽनुजयुतः")। टिप्पणी में "प्रफुल्लचित्त" बाएँ हाशिये में जोड़ा गया है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Drutavilambita. The last word of pāda 3 looks like "सयोषितो" or "सयोषणो" (Hindi: "with his wife"). Pāda 4 begins with an avagraha ("ऽनुजयुतः"). In the notes, "प्रफुल्लचित्त" is added in the left margin.
    shlok_en:
      author: ai_translation
      text: |
        His heart glad at seeing his son's wedding, absorbed in contemplating many feelings, his father, of auspicious mind, together with his wife and accompanied by his younger brother, came, well pleased. (14)
    translation:
      author: amanuensis
      text: |
        पुत्र के विवाह देखने में प्रसन्न मन अनेक भावों को विचारने में तत्पर इनके पिता धाता सपत्नीक तथा भाई के साथ आये ॥ १४ ॥
    notes:
      author: grandfather
      text: |
        अपने पुत्र के शुभ मंगलपूर्ण विवाह देखने के लिये प्रफुल्लचित्त सपत्नीक उनके पिता धाता विविध भावनाओं की तरङ्गों में डूबते उतराते हुए अपने छोटे भाई विधाता के साथ उस वैवाहिक मङ्गल मण्डप में स्वयं उपस्थित हुए। १४
    translation_en:
      author: ai_translation
      text: |
        Glad at heart to see his son's wedding, intent on weighing many feelings, his father Dhātā came with his wife and his brother. (14)
    notes_en:
      author: ai_translation
      text: |
        To see his son's auspicious, joyful wedding, his father Dhātā, his heart in bloom, with his wife, sinking and rising on waves of many feelings, came in person to that auspicious wedding pavilion with his younger brother Vidhātā. (14)
notes_uncertain: true
