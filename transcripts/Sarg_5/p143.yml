page_number_devanagari: "१४३"
page_number_arabic: 143
image: "images/pages/p143.jpg"
verses:
  - number: 49
    shlok: |
      असितबर्दसमूढविमानगा-
      नसितसर्वपरिच्छदशालिनः ।
      शनिजलोकयुतो वरयात्रिका-
      न्ननु विभावयता[unclear: श्चि]रमुद्गतान् ॥ ४९ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: द्रुतविलम्बित। पाद १: "बर्द" (= बलीवर्द, बैल; हिन्दी "काले बैल")। पाद ३: "वरयात्रिकान्" = बराती। पाद ४: "विभावयत" (समझो) के बाद "ता[श्चि]रमुद्गतान्" लिखा है — "तांश्चिरमुद्गतान्" जैसा अर्थ संदिग्ध (हिन्दी "शीघ्र चलने को उत्सुक"); लिखित रूप छन्द में बैठता है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Drutavilambita. Pāda 1: "बर्द" (= balīvarda, bull; the Hindi has "black bull"). Pāda 3: "वरयात्रिकान्" = members of the wedding procession (barātī). Pāda 4: after "विभावयत" (understand) comes "ता[श्चि]रमुद्गतान्"; a sense like "तांश्चिरमुद्गतान्" is doubtful (the Hindi has "eager to set off quickly"). The written form scans.
    shlok_en:
      author: ai_translation
      text: |
        Understand these, riding aerial cars drawn by black bulls, with all their trappings black, from the world of Śani (Saturn), to be wedding guests [unclear: long since risen and eager]. (49)
    translation:
      author: amanuensis
      text: |
        काले बैल से युक्त विमान पर आरूढ़ तथा समस्त श्याम वेषभूषा वाले शनिलोक के शीघ्र चलने को उत्सुक बराती उन्हें समझो ॥ ४९ ॥
    notes:
      author: grandfather
      text: |
        श्यामवर्ण वाले (काले) बैल पर सवारी के रूप में, विमान सञ्चालित करते ये लोग, जिनकी सभी सामग्रियाँ, परिधानादि काले वेशभूषा में आवृत हैं, ये सूर्यपुत्र भगवान् शनि के लोक निवासी हैं, ये भी बरयात्रा में चलने के लिये समुत्सुक तैयार बैठे हैं, आप इन्हें भी देखें । ४९
    translation_en:
      author: ai_translation
      text: |
        Understand them as wedding guests from Śani's world, mounted on aerial cars drawn by black bulls, all in dark dress, eager to set off quickly. (49)
    notes_en:
      author: ai_translation
      text: |
        These people, driving aerial cars with dark (black) bulls as their mounts, all of whose belongings and garments are covered in black, are dwellers of the world of the blessed Śani, son of the Sun. They too sit ready, eager to go in the wedding procession. Look at them too. (49)
  - number: 50
    shlok: |
      असितशूर्पनिभे वर~~[कटा हुआ]~~सिंहगे
      समधिरूढतमोग्रहवासिनः ।
      अपरकायविवर्जितजीविनः
      प्रहसितानन[unclear: भाज]सुशोभिनः ॥ ५० ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: द्रुतविलम्बित। पाद १ "आसित"/"असित" जैसा; "वर" के बाद एक शब्द काटा गया। "शूर्पनिभे" = सूप के समान (हिन्दी "काले शूप के समान")। पाद ३: "अपरकाय" = शरीर का निचला भाग (हिन्दी "कबन्ध रहित")। पाद ४: "भाज"/"भासुर" अस्पष्ट; दोनों छन्द में बैठते हैं।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Drutavilambita. Pāda 1 looks like "आसित"/"असित"; a word after "वर" is struck out. "शूर्पनिभे" = like a winnowing basket (the Hindi has "like a black winnowing basket"). Pāda 3: "अपरकाय" = the lower body (the Hindi has "without a trunk"). Pāda 4: "भाज"/"भासुर" is unclear; both scan.
    shlok_en:
      author: ai_translation
      text: |
        [Look at] the dwellers of the dark planet (Rāhu), mounted on a fine lion black as a winnowing basket, living without a lower body, resplendent with laughing faces. (50)
    translation:
      author: amanuensis
      text: |
        काले शूप के समान सिंहारूढ़ राहुग्रह निवासी अपर काय अर्थात् कबन्ध रहित जीवित रहने वाले केवल हँसमुख होने से सुशोभित होने वाले उन्हें राहुलोक के बराती जानो ॥ ५० ॥
    notes:
      author: grandfather
      text: |
        भयंकर काले सूर्प के समान काले सुन्दर सिंह पर सवार रहने वाले, तमोग्रह निवासी, जिनके नीचे का धड़ नहीं है, यों ही सदा जीवित रहने वाले, सदा प्रसन्नता से मुस्कराहट बिखेरने वाले ये राहु ग्रह के निवासी हैं, ये भी बरयात्रा के लिए समुत्सुक हैं जानें । ५०
    translation_en:
      author: ai_translation
      text: |
        Know them as the wedding guests from Rāhu's world: dwellers of the planet Rāhu, mounted on lions black as a winnowing basket, living without a lower body, that is, without a trunk, and resplendent simply by their smiling faces. (50)
    notes_en:
      author: ai_translation
      text: |
        Riding on handsome lions, black like a fearsome black winnowing basket, dwellers of the dark planet, with no trunk below, living on just so for ever, always scattering smiles in their delight: these are dwellers of the planet Rāhu. Know that they too are eager for the wedding procession. (50)
notes_uncertain: true
