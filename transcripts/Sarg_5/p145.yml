page_number_devanagari: "१४५"
page_number_arabic: 145
image: "images/pages/p145.jpg"
verses:
  - number: 53
    shlok: |
      केचिद्वाजिप्रचारैः करिगतिभिरथ स्यन्दनारोहभव्यैः
      केचित्सज्जैरनोभिर्वृषयुगगमनैः किङ्किणीस्वानरम्यैः ।
      केचित्पद्भ्यां व्रजन्तः प्रतिनगरजनाञ्छ्रावयन्तः सुवृत्तान्
      शृण्वन्तो देशवेषोचितविविधकथाः प्रोल्लसन्तः प्रयान्ति ॥ ५३ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: स्रग्धरा (ऽऽऽऽ।ऽऽ ।।।।।।ऽ ऽ।ऽऽ।ऽऽ), v52 की तरह। चारों पाद लिखित रूप में छन्द में बैठते हैं। पाद २: लिखित "सज्जैरनोभि" (अनस् = बैलगाड़ी; हिन्दी "दो बैलों द्वारा खींचे जाते सुसज्जित गाड़ियों से")। पाद ३: लिखित "केचिद् पदभ्यां"; अन्त में "सुवृत्ताँ" के बाद एक अक्षर कटा हुआ है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Sragdharā (ऽऽऽऽ।ऽऽ ।।।।।।ऽ ऽ।ऽऽ।ऽऽ), as in v52. All four pādas scan as written. Pāda 2: written "सज्जैरनोभि" (anas = ox-cart; the Hindi has "decorated carts drawn by two oxen"). Pāda 3: written "केचिद् पदभ्यां"; at the end, a letter after "सुवृत्ताँ" is struck out.
    shlok_en:
      author: ai_translation
      text: |
        Some go riding horses, some on elephants' gait, and some mounted on splendid chariots; some in decorated carts drawn by pairs of oxen, lovely with the sound of little bells; some go on foot, telling the people of each town the happy news, listening to many tales suited to each region and its dress, and they go along rejoicing. (53)
    translation:
      author: amanuensis
      text: |
        कुछ घोड़ों पर से कुछ हाथियों से कुछ भव्य रथों से, गले में बन्धे घण्टियों की आवाज से रमणीय दो बैलों द्वारा खींचे जाते सुसज्जित गाड़ियों से, कुछ पैदल बराती इस सुन्दर माङ्गलिक वैवाहिक वृत्त को प्रतिनगरवासियों को सुनाते हुए देशवेषोचित कथाएँ सुनते हुए [unclear: सानन्द] चल रहे हैं ॥ ५३ ॥
    notes:
      author: grandfather
      text: |
        इस बारात में कुछ लोग तो विविध [unclear: उत्तम] घोड़ों पर चढ़कर, कुछ लोग मदमत्त सुसज्जित हाथियों से, कुछ अन्य लोग सजे धजे रथों से, कुछ लोग सजाये गये दो बैलों की जोड़ी जिनके गले में विविध प्रकार की घण्टियाँ रुनझुन कर बजती हुई सुन पड़ रही हैं, से, कुछ लोग पैदल ही चलते हुए, हर नागरिकों को वैवाहिक मंगल कथाओं को सुनाते हुए, देश तथा विविध वेषों के अनुरूप अनेक प्रकार की चर्चायें सुनते हुए अत्यन्त प्रसन्नता के साथ उल्लसित होकर चल रहे हैं ।
    translation_en:
      author: ai_translation
      text: |
        Some on horseback, some on elephants, some in splendid chariots, some in decorated carts drawn by two oxen, lovely with the sound of the bells tied at their necks, and some of the wedding party on foot, telling this lovely auspicious news of the wedding to the people of each town and listening to stories suited to each region and its dress, are going along [unclear: joyfully]. (53)
    notes_en:
      author: ai_translation
      text: |
        In this wedding procession some ride on various [unclear: fine] horses, some on decorated elephants in rut, some others in decked-out chariots, and some in carts drawn by decorated pairs of oxen, at whose necks many kinds of bells are heard jingling; some walk on foot, telling every townsman the auspicious tidings of the wedding and hearing many kinds of talk suited to the region and to the various modes of dress, and they go along delighted, with great happiness.
  - number: 54
    shlok: |
      सरणिके [unclear: कृतयोजननिर्मितौ]
      ह्युभयतस्तरुपङ्क्तिविराजिते ।
      रविमरीचिनिवारणचारुणि
      ससुखमेव ययुर्वरयात्रिणः ॥ ५४ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: द्रुतविलम्बित (फिर से)। चारों पाद लिखित रूप में छन्द में बैठते हैं। पाद १: "सरणिके" (मार्ग में) स्पष्ट; "कृतयोजन" — हिन्दी "प्रतियोजनों पर विश्राम स्थान बनाये गये" से "प्रतियोजन" अपेक्षित, पर लिखा "कृत" जैसा है; अन्तिम शब्द "निर्मितौ" जैसा दिखता है, जबकि बाकी विशेषण ("विराजिते", "चारुणि") सप्तमी एकवचन हैं, अतः "निर्मिते" सम्भव। पाद २: आरम्भिक "ह्यु" "प्यु" जैसा लिखा है (इस लेखक की आदत)।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Drutavilambita again. All four pādas scan as written. Pāda 1: "सरणिके" (on the road) is clear; for "कृतयोजन" the Hindi ("rest-places built at every yojana") would suggest "प्रतियोजन", but it is written like "कृत"; the last word looks like "निर्मितौ", while the other qualifiers ("विराजिते", "चारुणि") are locative singular, so "निर्मिते" is possible. Pāda 2: the initial "ह्यु" is written like "प्यु" (this scribe's habit).
    shlok_en:
      author: ai_translation
      text: |
        Along the road, with [rest-places] built at every yojana, adorned on both sides with rows of trees and lovely for keeping off the sun's rays, the wedding party went in comfort. (54)
    translation:
      author: amanuensis
      text: |
        मार्ग में प्रतियोजनों पर विश्राम स्थान बनाये गये जिनके दोनों ओर वृक्षों की पंक्ति सूर्यताप निवारणार्थ लगाये गये हैं, ऐसे मार्ग में बराती लोग [unclear: सानन्द] चल रहे हैं ॥ ५४ ॥
    notes:
      author: grandfather
      text: |
        बरातियों के सुखद यात्रा के लिए हर एक योजन पर छोटे छोटे पड़ाव बनाये गये हैं जिनके दोनों ओर शीतल छाया प्रदान करने वाली वृक्षों की विविध पंक्तियाँ सुशोभित हो रही हैं जिससे मार्ग में चलने वालों को सूर्य की प्रखर किरणों से सुन्दर सुखद छाया मिलती है, और सभी बराती बड़े आनन्द के साथ हँसी खुशी के साथ चल रहे थे ।
    translation_en:
      author: ai_translation
      text: |
        On the road, rest-places were built at every yojana, with rows of trees planted on both sides to keep off the sun's heat; on such a road the wedding party is going along [unclear: joyfully]. (54)
    notes_en:
      author: ai_translation
      text: |
        For the wedding party's comfortable journey, small halting-places have been built at every yojana, on both sides of which various rows of trees giving cool shade look beautiful, so that those walking on the road get pleasant, comfortable shade from the sun's fierce rays; and the whole wedding party was going along with great joy, laughing and happy.
notes_uncertain: true
