page_number_devanagari: "२७"
page_number_arabic: 27
image: "images/pages/p027.jpg"
verses:
  - number: 53
    shlok: |
      दया च या जीवगता विभाव्यते
      श्रुतौ श्रुतिभ्यां न च नेत्रगोचरा ।
      तदार्द्रता क्वेति कथं विमृश्यतां
      तदार्द्रमूर्तिर्भवती प्रदृश्यते ॥ ५३ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ में पाद ३ नहीं था, और "विमले / श्रुतिभ्यो" भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha (all four pādas scan). The earlier reading lacked pāda 3 entirely, and its "विमले / श्रुतिभ्यो" was wrong.
    shlok_en:
      author: ai_translation
      text: |
        "The compassion that is perceived as dwelling in living beings is heard by the two ears but is not seen by the eye. How, then, should one consider where its tenderness lies? You are seen as its melting form." (53)
    translation:
      author: amanuensis
      text: |
        जीवगता जो दया विभावित (प्रतीत) होती है उसे कानों से सुना जा सकता है वह नेत्र-दृश्य नहीं होती। उस दया से आर्द्रता कहाँ कैसी? विचार करें, नेत्रगोचर वह दया तो अत एव दयार्द्रमूर्ति भगवती गङ्गा दिखाई देती हैं ॥ ५३ ॥
    notes:
      author: grandfather
      text: |
        संसार के सभी प्राणियों में एक आन्तरिक हृदय की स्निग्धता (जिसे दया कहते हैं) वह प्रायः समस्त प्राणियों में अव्यक्त रूप से स्थित रहती है, उसे केवल कानों से ही सुना जाता है वह कभी भी किसी प्राणी के आँखों के समक्ष दिखाई नहीं देती, वह अदृश्य हार्दिक करुणा एवं आर्द्रता (दया) कहाँ कैसी होती है इसका विचार करें तो लगता है कि वही मानवीय हार्दिक दयार्द्रता की प्रत्यक्ष मूर्तिस्वरूपा आप भगवती गङ्गा स्वयं विश्वकल्याणार्थ व्यक्त स्वरूप में प्रत्यक्ष दिखाई देती हैं। ५३
    translation_en:
      author: ai_translation
      text: |
        "The compassion that is felt (perceived) in living beings can be heard of with the ears; it is not seen with the eye. Where and of what kind is the tenderness of that compassion? Consider: that compassion, made visible, is therefore seen as the goddess Gaṅgā, the form melting with compassion." (53)
    notes_en:
      author: ai_translation
      text: |
        "In all the creatures of the world there is an inner tenderness of heart (which is called compassion). It dwells, mostly unmanifest, in all creatures; it is only heard of with the ears and is never seen before anyone's eyes. If we consider where and of what kind that invisible heartfelt pity and tenderness (compassion) is, it seems that you, goddess Gaṅgā, the visible embodiment of that same human, heartfelt tenderness, are yourself plainly seen in manifest form for the good of the world." (53)
  - number: 54
    shlok: |
      द्रुतस्य रासे शिवदर्शनादहो
      ह्यलौकिकस्यास्य महाप्रभोरयम् ।
      पयःप्रवाहो जगतो हितोद्यत-
      स्तदार्द्रमूर्तिर्भवती प्रदृश्यते ॥ ५४ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद २ का अन्त "महाप्रभोरयम्" (अक्षर "महाप्रभोरर्यम्" जैसे दिखते हैं)। पूर्व पाठ में पाद २ नहीं था, और "शिवदर्शनादतो / यः प्रवाहः जगत् हितोद्यतः" भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha (all four pādas scan). Pāda 2 ends "महाप्रभोरयम्" (the letters look like "महाप्रभोरर्यम्"). The earlier reading lacked pāda 2 entirely, and its "शिवदर्शनादतो / यः प्रवाहः जगत् हितोद्यतः" was wrong.
    shlok_en:
      author: ai_translation
      text: |
        "Ah! This stream of water of the unearthly great Lord, who melted in the rāsa at the sight of Śiva, set out for the good of the world: you are seen as its melting form." (54)
    translation:
      author: amanuensis
      text: |
        रासक्रीडा में शिवदर्शन से द्रवित अलौकिक महाप्रभु के जलप्रवाह ही संसार के हितार्थ तत्पर हुआ, अत एव उसी जलप्रवाह आप आर्द्रमूर्ति दिखाई देती हैं ॥ ५४ ॥
    notes:
      author: grandfather
      text: |
        आनन्दकन्द श्रीकृष्णचन्द्र के गोलोक में जब अलौकिक रासक्रीडा चल रही थी उस समय आकस्मिक रूप से भगवान् शम्भु के रासलीला दर्शनार्थ उपस्थित हो जाने पर व्रजेन्द्रनन्दन के शरीर में सहसा विश्वकल्याणार्थ अद्भुत प्रकम्पन हो उठा जिससे उनका सारा शरीर स्वेदबिन्दुओं से व्याप्त जलप्रवाह रूप में द्रवित हो उठा, वही जलप्रवाह विश्व के कल्याणार्थ आर्द्रमूर्ति स्वरूप आप भगवती विष्णुपदी गङ्गा प्रत्यक्ष दिखाई दे रही हैं। ५४
    translation_en:
      author: ai_translation
      text: |
        "In the rāsa play, the stream of water of the unearthly great Lord, melted at the sight of Śiva, became ready for the good of the world; therefore you, that same stream of water, are seen as the melting form." (54)
    notes_en:
      author: ai_translation
      text: |
        "When the unearthly rāsa play was going on in the Goloka of Śrī Kṛṣṇacandra, root of bliss, Lord Śambhu suddenly arrived to see the rāsa-līlā. At that, a wonderful trembling suddenly arose, for the good of the world, in the body of the son of the lord of Vraja, so that his whole body melted into a stream of water covered with drops of sweat. You, goddess Viṣṇupadī Gaṅgā, are that same stream, plainly seen as the melting form for the good of the world." (54)
