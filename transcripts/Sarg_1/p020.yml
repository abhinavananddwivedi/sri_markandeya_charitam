page_number_devanagari: "२०"
page_number_arabic: 20
image: "images/pages/p020.jpg"
verses:
  - number: 39
    shlok: |
      अमुष्य संस्तावममुं निशम्य तौ
      प्रसेदतुर्निश्छलभक्तिभावतः ।
      तथोपदेशं परमं तमूचतुः
      परत्र चात्रापि शुभोदयं प्रति ॥ ३९ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ "संस्तुतमाकर्ण्य / प्रसन्नान्निश्छल… / ततोऽपदेशं… / शुभोदयं प्रति" (पाद ४ अधूरा) भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha (all four pādas scan). The earlier reading ("संस्तुतमाकर्ण्य / प्रसन्नान्निश्छल… / ततोऽपदेशं… / शुभोदयं प्रति", with pāda 4 incomplete) was wrong.
    shlok_en:
      author: ai_translation
      text: |
        Hearing this praise of his, the two were pleased by his guileless devotion, and they spoke to him the highest teaching, for his good fortune both in the next world and in this. (39)
    translation:
      author: amanuensis
      text: |
        मृकण्डु कृत स्तुति को सुनकर तथा उसकी निश्छल भक्तिभाव से वे दोनों प्रसन्न हुए और इस लोक तथा परलोक में शुभोदयार्थ उत्तम उपदेश देते हुए उससे कहने लगे ॥ ३९ ॥
    notes:
      author: grandfather
      text: |
        भार्गव मृकण्डु द्वारा निश्छल भक्तिभावपूर्ण सश्रद्ध स्तुति किये जाने पर उनकी अतिशय उदात्त भक्तिभावना से वे दोनों आद्य मुनि अतिशय प्रसन्न हो उठे, और उन पर अविरल कृपादृष्टि कर कल्याणकारी इहलोक तथा परलोक का भी अभ्युदयकारक अतिशय हितावह उपदेश देते हुए कहना शुरू किया। ३९
    translation_en:
      author: ai_translation
      text: |
        Hearing the praise made by Mṛkaṇḍu, and pleased by his guileless devotion, the two began to speak to him, giving excellent teaching for good fortune in this world and the next. (39)
    notes_en:
      author: ai_translation
      text: |
        When Mṛkaṇḍu, of Bhṛgu's line, had praised them with faith and with guileless devotion, the two primal sages were greatly pleased by his very noble devotion; casting on him their unbroken gracious glance, they began to speak, giving him most beneficial teaching, auspicious and conducive to his rise in this world and in the next. (39)
  - number: 40
    shlok: |
      सदैव सत्यं वद धर्ममाचरे-
      न्न वै विरामोऽध्ययने भवेत्तव ।
      गुरौ जनन्यां जनके च देवव-
      त्सदा भवेः पुत्रक वर्त्मनाऽऽत्मनः ॥ ४० ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद १ में "सत्यं" से पहले एक शब्द काटा गया है। पूर्व पाठ "धर्ममाचर / गुरौ अनन्यो / वर्त्तमात्मनः" भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha (all four pādas scan). In pāda 1 a word before "सत्यं" is struck out. The earlier reading ("धर्ममाचर / गुरौ अनन्यो / वर्त्तमात्मनः") was wrong.
    shlok_en:
      author: ai_translation
      text: |
        "Always speak the truth, practise dharma; let there be no pause in your study. Son, by your own conduct always be [devoted] to your teacher, your mother and your father as to gods." (40)
    translation:
      author: amanuensis
      text: |
        हमेशा सत्य बोलो, धर्म का आचरण करो, तुम्हारा स्वाध्याय में कभी विराम (रुकावट) न आवे। हे पुत्र! अपने सन्मार्ग से गुरु माता-पिता में देवत्व भावना करो ॥ ४० ॥
    notes:
      author: grandfather
      text: |
        वत्स! तुम निरन्तर सत्य सम्भाषण करने में निरत होवो, विधि सम्मत स्वधर्म का परिपालन करते रहो, षडङ्ग वेदाध्ययन में कभी भी कोई व्यवधान न आने पावे, (स्वाध्याय में कोई विघ्न न आये) तुम अपने श्रेष्ठ जनों समादरणीय पूज्य माता और पिता में सदैव देवबुद्धिपूर्वक निष्ठावान बने रहो, इस उत्तम मार्ग से तुम्हारा निरन्तर अतिशय कल्याण होगा। ४०
    translation_en:
      author: ai_translation
      text: |
        "Always speak the truth; practise dharma; let there never be a pause (break) in your study. Son! By your own good path, regard your teacher, mother and father as divine." (40)
    notes_en:
      author: ai_translation
      text: |
        "Child! Be constantly devoted to speaking the truth; keep observing your own dharma as the rules prescribe; let no break ever come in your study of the Veda with its six auxiliaries (let no obstacle come in your study). Always remain faithful to your elders, and to your honoured, venerable mother and father, regarding them as gods. By this excellent path you will continually prosper greatly." (40)
