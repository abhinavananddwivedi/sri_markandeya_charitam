page_number_devanagari: "१४"
page_number_arabic: 14
image: "images/pages/p014.jpg"
verses:
  - number: 27
    shlok: |
      क्वचित्सरन्तीं प्रबलेन रंहसा
      भ्रमिं गभीरामथ तन्वतीं मुहुः ।
      सुरापगां तां कलशब्दकारिणीं
      निरीक्ष्य मेने मनसः कृतार्थताम् ॥ २७ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ। पूर्व पाठ "क्वचिच्चलन्ती … / यद्भिः गभीराम्भ तरङ्गतङ्गाः / समास्वसन्ती कल शब्दकारिणी / … मनसा कृतार्थताम्" भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha. The earlier reading ("क्वचिच्चलन्ती … / यद्भिः गभीराम्भ तरङ्गतङ्गाः / समास्वसन्ती कल शब्दकारिणी / … मनसा कृतार्थताम्") was wrong.
    shlok_en:
      author: ai_translation
      text: |
        Seeing that river of the gods, in places flowing with mighty speed and again and again spreading deep whirlpools, making a sweet murmuring sound, he deemed his mind fulfilled. (27)
    translation:
      author: amanuensis
      text: |
        कहीं प्रबल वेग से आगे बढ़ती हुई कहीं गम्भीर भ्रमि फैलाती हुई, कलकल ध्वनिवाली सुरापगा गङ्गा को देखकर उन्होंने अपने मन की कृतार्थता को माना ॥ २७ ॥
    notes:
      author: grandfather
      text: |
        पुण्यतोया भगवती गङ्गा का अनुसरण कर चलते हुए मुनि मृकण्ड ने देखा कि यह गंगधारा कहीं कहीं अत्यन्त प्रबल वेग से आगे की ओर प्रवाहित हो रही है, तो कहीं भयंकर भ्रमि (भँवरियों) फैलाती हुई जलराशि को आवर्त के रूप में बना रही है, कहीं कलकल निनाद से ध्वनित उस देवनदी गङ्गा को देखकर उन्होंने मनः शान्ति का अनुभव करते हुए अपने जीवन को सदा सर्वदा के लिए धन्य माना। २७
    translation_en:
      author: ai_translation
      text: |
        Seeing the river of the gods, the Gaṅgā, in places moving forward with mighty speed, in places spreading deep whirlpools, with her murmuring sound, he considered his mind fulfilled. (27)
    notes_en:
      author: ai_translation
      text: |
        Following the goddess Gaṅgā of holy waters, the sage Mṛkaṇḍa saw that this Gaṅgā stream in places flowed forward with very great speed, and in places spread fearsome whirlpools and turned the mass of water into eddies; seeing that river of the gods, Gaṅgā, resounding in places with a murmuring sound, he felt peace of mind and considered his life blessed for ever and ever. (27)
  - number: 28
    shlok: |
      स योजनानां चतुरस्तटे सरि-
      न्निपत्य दृष्ट्वा बदरीविहारिणौ ।
      नरञ्च नारायणमादिपूरुषं
      समाजयन् विस्मयमभ्यरोचयत् ॥ २८ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ। पूर्व पाठ "…चतुरस्तटे बरि- / निपत्य … / समाजमन्थिसममम्भरावरयन्त" भ्रान्त था; पाद ४ का पाठ कुछ अनिश्चित है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha. The earlier reading ("…चतुरस्तटे बरि- / निपत्य … / समाजमन्थिसममम्भरावरयन्त") was wrong; the reading of pāda 4 is somewhat uncertain.
    shlok_en:
      author: ai_translation
      text: |
        Having gone four yojanas along the river bank, he saw the two who roam in Badarī, Nara and Nārāyaṇa, the primal person; honouring them, he was filled with wonder. (28)
    translation:
      author: amanuensis
      text: |
        वे नदी के किनारे चतुर्योजन चलकर बदरीवन विहारी नर और आदिपुरुष नारायण को देखकर उन्हें पूजते हुए नियम से चमत्कृत हो गये ॥ २८ ॥
    notes:
      author: grandfather
      text: |
        वे उस देवनदी के सुरम्य गोमुख से नदी के किनारे चार योजन (अर्थात् १६ कोश) नीचे की ओर चलते हुए मुनि मृकण्ड ने बदरीवृक्षों से घनाच्छादित बदरीवन में विहार करने वाले आदिपुरुष नर और नारायण को देखा। सश्रद्ध उनका सविधि अर्चन पूजन किया, तथा अतिशय श्रद्धा विश्वास के साथ चमत्कृत हो अभिभूत हो उठे। २८
    translation_en:
      author: ai_translation
      text: |
        Having gone four yojanas along the river bank, he saw Nara and the primal person Nārāyaṇa, who roam the Badarī forest; worshipping them as prescribed, he was filled with wonder. (28)
    notes_en:
      author: ai_translation
      text: |
        Going downstream along the bank, four yojanas (that is, 16 kos) from the lovely Gomukh of that river of the gods, the sage Mṛkaṇḍa saw the primal persons Nara and Nārāyaṇa, who roam in the Badarī forest, densely covered with badarī trees. With faith he worshipped them with due rites, and, with great faith and trust, was struck with wonder and overwhelmed. (28)
