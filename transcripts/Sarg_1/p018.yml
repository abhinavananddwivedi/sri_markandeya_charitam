page_number_devanagari: "१८"
page_number_arabic: 18
image: "images/pages/p018.jpg"
verses:
  - number: 35
    shlok: |
      समग्रविश्वस्य शमाय जाग्रतौ
      तपोभिरुग्रैर्भगवत्स्वरूपिणौ ।
      न माननीयौ कतमेन रोचिषां
      चयौ भुवां जन्मजुषा वरार्थिना ॥ ३५ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ "शमाय जगतो / तपोभिरास्ते गगनेवरोचिषौ / … धियो / थयो क्षयां जनन्त्युषा यार्थिना" भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha (all four pādas scan). The earlier reading ("शमाय जगतो / तपोभिरास्ते गगनेवरोचिषौ / … धियो / थयो क्षयां जनन्त्युषा यार्थिना") was wrong.
    shlok_en:
      author: ai_translation
      text: |
        "You two, embodiments of the Lord, keep watch through fierce austerities for the peace of the whole world. By which embodied being on earth who seeks a boon are you two, masses of radiance, not to be honoured?" (35)
    translation:
      author: amanuensis
      text: |
        भगवत्स्वरूप आप दोनों अपनी उग्र तपस्या से समस्त विश्व के कल्याणार्थ जागरूक हैं। ऐसी स्थिति में तेजोराशि आप दोनों किस जन्मधारी वरेच्छुओं से माननीय नहीं हैं अर्थात् सभी से मान्य हैं ॥ ३५ ॥
    notes:
      author: grandfather
      text: |
        हे प्रभो! प्रत्यक्ष भगवत्स्वरूप धारण करने वाले आप दोनों अपनी अत्युग्र तपस्या द्वारा समस्त विश्व कल्याणार्थ सतत जागरूक रह रहे हैं। समग्र तेजोराशि के एकान्त पुञ्जस्वरूप हे प्रभो! आप दोनों संसार में रहकर विश्व कल्याण के लिए निज वरप्राप्ति की कामना रखने वाले देहधारियों (प्राणियों) द्वारा सम्माननीय नहीं हैं। ३५
    translation_en:
      author: ai_translation
      text: |
        "You two, embodiments of the Lord, keep watch through your fierce austerity for the welfare of the whole world. This being so, by which embodied being seeking a boon are you two, masses of radiance, not to be honoured? That is, you are honoured by all." (35)
    notes_en:
      author: ai_translation
      text: |
        "Lord! You two, who bear the very form of God before our eyes, remain constantly watchful through your exceedingly fierce austerity for the welfare of the whole world. O Lord, sole concentrated mass of all radiance! Dwelling in the world for its welfare, you two are [not] honoured by embodied beings (creatures) who desire to obtain boons for themselves." [The Hindi reads "सम्माननीय नहीं हैं", "are not honoured"; the verse's rhetorical question, "by whom are you not to be honoured?", is evidently meant.] (35)
  - number: 36
    shlok: |
      अहन्त्विदानीं बत जातसंस्तवो
      मुहुः प्रसीदामि निजोदयं प्रति ।
      चिरादभिज्ञावनभिज्ञमर्हथो
      विबोधुमद्धा व्यवहारवर्त्मनि ॥ ३६ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ "अहन्नित्यादानों बतजात संस्तथो / … प्रसाद्यामि … / चिरादमिशावनमिश्रमध्ये / विवोधुमच्छा सवरम् वलेनि" भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha (all four pādas scan). The earlier reading ("अहन्नित्यादानों बतजात संस्तथो / … प्रसाद्यामि … / चिरादमिशावनमिश्रमध्ये / विवोधुमच्छा सवरम् वलेनि") was wrong.
    shlok_en:
      author: ai_translation
      text: |
        "But now, oh joy, having come to know you, I rejoice again and again in view of my own rise. You two, long all-knowing, ought indeed to instruct me, who am ignorant, in the path of conduct." (36)
    translation:
      author: amanuensis
      text: |
        बड़े हर्ष की बात है मैं परिचय वाला हो गया अतः अपने उत्तरकाल के (तरक्की) के लिए प्रसन्न हो रहा हूँ। आपदोनों जानते हैं अतः व्यवहार मार्ग में मुझे अनभिज्ञ ही समझें ॥ ३६ ॥
    notes:
      author: grandfather
      text: |
        भगवन्! यह बड़े हर्ष की बात है कि मैं आज आप लोगों की कृपा से कृतार्थ हुआ अब मैं अपने भावी अभ्युदय के लिए अतिशय आश्वस्त हूँ एवं प्रसन्नता का अनुभव कर रहा हूँ, आप लोग सर्वथा सर्वज्ञ एवं सर्वसमर्थ हैं; अतः मुझ अनजाने व्यक्ति को आपलोग लौकिक व्यवहार विवेकादि के लिए अवश्य ही समुचित मार्ग निर्देश करने की कृपा करेंगे। ३६
    translation_en:
      author: ai_translation
      text: |
        "It is a matter of great joy that I have come to know you; so I am glad for the sake of my later life (my advancement). You two know [all]; so in the path of conduct consider me simply ignorant." (36)
    notes_en:
      author: ai_translation
      text: |
        "Lord! It is a matter of great joy that today I am fulfilled by your grace. Now I am very assured about my future rise and feel happy. You are wholly all-knowing and all-capable; so you will surely be kind enough to give me, an ignorant person, proper guidance in worldly conduct, discernment and the like." (36)
