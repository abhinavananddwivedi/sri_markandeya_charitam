page_number_devanagari: "२४"
page_number_arabic: 24
image: "images/pages/p024.jpg"
verses:
  - number: 47
    shlok: |
      सरिद्वरेयं सकलाघनाशिनी
      त्रिलोकगा विष्णुपदीति गीयते ।
      समुद्दिधीर्षुः सगरस्य सन्ततिं
      पयोनिधिं प्राच्यमसौ प्रगच्छति ॥ ४७ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ "अरिष्टयः सकलपापनाशिनी / त्रिलोके गङ्गा… / सगरात्मजा… / प्राणदमसो प्रधावति" भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha (all four pādas scan). The earlier reading ("अरिष्टयः सकलपापनाशिनी / त्रिलोके गङ्गा… / सगरात्मजा… / प्राणदमसो प्रधावति") was wrong.
    shlok_en:
      author: ai_translation
      text: |
        "This best of rivers, destroyer of all sins, flowing through the three worlds, is sung as Viṣṇupadī. Wishing to raise up Sagara's descendants, she goes to the eastern ocean." (47)
    translation:
      author: amanuensis
      text: |
        यह समस्तपापनाशिनी त्रिलोकगा सरिद्वरा गङ्गा विष्णुपदी के नाम से गाई जाती है। सगर की सन्ततियों के उद्धारार्थ यह पूर्व समुद्र की ओर प्रवाहित हो रही है ॥ ४७ ॥
    notes:
      author: grandfather
      text: |
        आप देखें, यह गोमुख से निकलने वाली भगवती विष्णुपदी (स्वर्ग मर्त्य पाताल) तीनों भुवनों में समानरूप से प्रवाहित होने वाली सम्पूर्ण पापों की नाशिनी उत्तम सरिता है (नदियों में सर्वश्रेष्ठ है)। इतिहास प्रसिद्ध महाराज सगर के ६० हजार सन्तान परम्परा जिसको महामुनि कपिल के शाप से भस्म होने की अनुभूति है, उनके समुद्धरणार्थ यहाँ से पूर्वी महासागर में मिलने जा रही है। ४७
    translation_en:
      author: ai_translation
      text: |
        "This best of rivers, the Gaṅgā, destroyer of all sins, flowing through the three worlds, is sung by the name Viṣṇupadī. To deliver the descendants of Sagara she flows toward the eastern sea." (47)
    notes_en:
      author: ai_translation
      text: |
        "See: this goddess Viṣṇupadī, rising from Gomukh, flowing alike through the three worlds (heaven, earth and the netherworld), is the excellent river that destroys all sins (the best of rivers). To deliver the sixty thousand descendants of the famous King Sagara, who suffered being burned to ashes by the curse of the great sage Kapila, she goes from here to meet the eastern ocean." (47)
  - number: 48
    shlok: |
      इतो गतेऽल्पेऽध्वनि ते मिलिष्यति
      पदं हरद्वारमिदं महेशितुः ।
      तटोपमार्गं व्रजतो यतो मनः
      प्रवर्तते तत्र निवस्तुमर्हसि ॥ ४८ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद २ "हरद्वारम्" (पूर्व पाठ "हरहाराभिधं" भ्रान्त था); पूर्व पाठ "इतोजगतेऽल्पेऽपि / तदेपमार भजतो" भी भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha (all four pādas scan). Pāda 2 reads "हरद्वारम्" (the earlier "हरहाराभिधं" was wrong); the earlier "इतोजगतेऽल्पेऽपि / तदेपमार भजतो" was also wrong.
    shlok_en:
      author: ai_translation
      text: |
        "When you have gone a short way from here, you will come upon this place of the great Lord (Śiva), Haradvāra. Walking the path along the bank, wherever your mind is drawn, there you should dwell." (48)
    translation:
      author: amanuensis
      text: |
        यहाँ से थोड़े कुछ मार्ग में जाने पर तुम्हें भगवान् शिव का हरद्वार नामक स्थान मिलेगा। तट पर चलते हुए जहाँ तुम्हारा मन रम जाय वहाँ तुम निवास कर सकते हो ॥ ४८ ॥
    notes:
      author: grandfather
      text: |
        प्रिय! आप यहाँ से आगे चलें, कुछ ही दूरी पर आदि देव भगवान् शिव का प्रियस्थान 'हरद्वार' आपको मिलेगा। यह स्थान अद्भुत मनोरम होगा, उस मार्ग से नदी का अनुसरण करते हुए आप जायँ तो जहाँ कहीं भी आपको मनस्तुष्टिपूर्वक स्वाध्याय, तपः प्रसादिनी भूमि दिखे मन रम जाय आप वहीं अपना निवास बनाकर रह सकते हैं। ४८
    translation_en:
      author: ai_translation
      text: |
        "Going a little way from here, you will find the place of Lord Śiva called Haradvāra. Walking along the bank, wherever your mind delights, there you may live." (48)
    notes_en:
      author: ai_translation
      text: |
        "Dear one! Go on from here; a short distance away you will find Haradvāra, the beloved place of the first god, Lord Śiva. This place will be wonderfully lovely. Following the river along that way, wherever you see land that gladdens your heart and favours study and austerity, where your mind delights, there you may make your home." (48)
