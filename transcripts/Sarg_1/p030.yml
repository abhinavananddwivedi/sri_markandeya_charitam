page_number_devanagari: "३०"
page_number_arabic: 30
image: "images/pages/p030.jpg"
extra_images: ["images/pages/p030_overflow.jpg"]
verses:
  - number: 59
    shlok: |
      वृक्षानुन्मूलयन्ती परमपदकृते कोटिशो जन्मजात-
      क्लेशानाकृष्य मातर्न भवति महिमा तावकः कस्य दृश्यः ।
      किञ्चाहंकारमूढान्[unclear: विषयि]भवतो मार्गरोधप्रवृत्ता-
      नुत्तुङ्गानुत्तमाङ्गान्यणुरिव शकलान्याशु चक्रे गिरीणाम् ॥ ५९ ॥
    shlok_en:
      author: ai_translation
      text: |
        Uprooting the trees, and drawing away, for the sake of the highest abode, the afflictions born of millions of births: O Mother, to whom is your greatness not visible? Moreover, the lofty heads of the mountains, deluded by pride and set on blocking your path, you swiftly made into fragments, like atoms. (59)
    translation:
      author: amanuensis
      text: |
        हे माँ गङ्गे! वृक्षों को उखाड़ती हुई परमपद प्राप्ति के लिए उनके करोड़ों जन्मों के क्लेशों को खींच (नाश) कर (अनुपम दया करती हो), इस प्रकार आप में यह महिमा (वैशिष्ट्य) किसने नहीं देखा? इतना ही नहीं, अहंकार से मूढ (मानवरूप) मध्यमार्ग में रुकावट डालने वाले पर्वतों के ऊँचे-ऊँचे शिखरों को आप छोटे टुकड़े के समान कण करती हो ॥ ५९ ॥
    notes:
      author: grandfather
      text: |
        मातर्गङ्गे! आप अपने मार्ग के बाधक स्वरूप विद्यमान विविध सुदृढ़ सुपुष्ट वृक्षावलियों को उखाड़ती हुई, सतत परमपद प्राप्ति के लिए निरन्तर करोड़ों २ जन्मों के कर्मबन्धन रूपी जाल में बँधे रहने वाले प्राणियों के समस्त क्लेशराशि का विनाश करती हुई, उनका समुद्धार करती हो, यह तुम्हारी अद्भुत महिमा इस विश्व में किसने नहीं देखी? इतना ही नहीं माँ, अतिशय अभिमान से अभिभूत ऊँचे सिर उठाकर अपनी श्रेष्ठता तथा → अहंकार का प्रदर्शन करने वाले, सामान्य जन जीवन में व्यवधान बनकर खड़े रहने वाले सजीव क्या? निर्जीव भी अहंकार से ऊँची चोटियों वाले, तुम्हारे मार्ग में व्यवधान बनकर मार्गावरोध करने वाले उन्नततम शिखरों वाले पर्वत श्रेणियों को भी कणकण में विकीर्ण कर, उनका अस्तित्व नष्ट कर, सामान्य कणिका का स्वरूप प्रदान कर उनके अस्तित्व के प्रति सदा जागरूक करती रहती हो। ५९
    translation_en:
      author: ai_translation
      text: |
        O Mother Gaṅgā! Uprooting trees, you draw away (destroy) the afflictions of their millions of births so that they may reach the highest abode (you show matchless compassion); who has not seen this greatness (distinction) in you? Not only that: the lofty peaks of the mountains, deluded by pride (like men), that block the middle path, you turn into particles, like small fragments. (59)
    notes_en:
      author: ai_translation
      text: |
        Mother Gaṅgā! Uprooting the many firm, sturdy rows of trees that stand as obstacles in your path, you destroy the whole mass of afflictions of creatures who remain bound in the net of the bonds of karma through millions upon millions of births, so that they may constantly reach the highest abode; you deliver them. Who in this world has not seen this wonderful greatness of yours? Not only that, Mother: [beings] overcome by great pride, raising their heads high to display their superiority and → ego, standing as obstacles in the life of ordinary people: living beings, what of them? Even the lifeless: the mountain ranges, high-peaked with pride, with their loftiest summits blocking your path as obstacles, you scatter into particles, destroy their existence, give them the form of ordinary specks, and so keep them always mindful of what their existence really is. (59)
  - number: 60
    shlok: |
      गर्जन्ती वैरिवृन्दे सपदि निजरवैः पापिनस्तर्जयन्ती
      मोक्षार्थं भूरिभाग्यानवनितलजुषः सज्जनांस्तारयन्ती ।
      भक्त्युद्रेकात्कुतश्चिच्छरणमुपगतान् पावयन्ती तरङ्गै-
      र्मातर्गङ्गे निजाङ्के कलयसि सततं संसृतेर्गर्तमध्यात् ॥ ६० ॥
    shlok_en:
      author: ai_translation
      text: |
        Roaring at the host of enemies, at once rebuking sinners with your own sounds, carrying across to liberation the most fortunate good people who dwell on the earth, purifying with your waves those who have come to you for refuge from anywhere out of an overflow of devotion: O Mother Gaṅgā, you always take them into your own lap, out of the pit of worldly existence. (60)
    translation:
      author: amanuensis
      text: |
        हे माँ गङ्गे! वैरियों को सावधान होने के लिए गर्जन करती हो, अपनी कलकल ध्वनि से पापियों को [unclear: डाँटती] हो, शीघ्र मोक्षप्राप्त्यर्थ इस पृथ्वीतल स्थित भाग्यशाली सज्जनों को तारती हो। कहीं-कहीं भक्ति के आधिक्य से शरणागत भक्तों को अपने तरङ्गों से पवित्र करती हुई उन्हें संसार के गर्तमध्य से निकाल कर अपनी गोद में लेती हो ॥ ६० ॥
    notes:
      author: grandfather
      text: |
        जननि जाह्नवि! आप अपने भयंकर गर्जन स्वरूप कलकल ध्वनियों से वैरी समूह को सावधान करती हुई, इस भूतल पर रहने वाले अतिशय भाग्यशाली पुरुषों का उद्धारपूर्वक संसार सागर से पार करती हो। अतिशय भक्ति के उद्रेक के कारण अपने शरण में आये हुए भक्तों को अनुपम [unclear: तरङ्ग]रूपी लहरियों से संसार सागर से पार करती हुई, संसाररूप गर्त (समुद्र) से निकाल कर अपनी गोद में लेकर मानवत्व प्रदान करती हो। ६०
    translation_en:
      author: ai_translation
      text: |
        O Mother Gaṅgā! You roar so that enemies may take heed; with your murmuring sound you [unclear: rebuke] sinners; you carry across the fortunate good people living on this earth, for their swift liberation. Purifying with your waves the devotees who in places come to you for refuge out of an abundance of devotion, you lift them out of the pit of worldly life and take them into your lap. (60)
    notes_en:
      author: ai_translation
      text: |
        Mother Jāhnavī! With your murmuring sounds, which are like a fearsome roar, you warn the host of enemies, and you deliver the most fortunate people living on this earth and carry them across the ocean of worldly life. Out of an overflow of great devotion, carrying across the ocean of worldly life, with your matchless [unclear: wave]-like ripples, the devotees who have come to you for refuge, you lift them out of the pit (ocean) of worldly life, take them into your lap, and give them true humanity. (60)
notes_uncertain: true
source: "Transcribed 2026-10-24 by Claude (Opus 5.5) from upright line-level crops of the page-30 scan (raw photo Images/raw/Sarg_1/p031_20260811_172019_page_30.jpg); this page had never been transcribed before. Both verses are in Sragdharā and scan cleanly, except the bracketed word in v59 line 3. The end of v59's notes is written on the facing sheet (images/pages/p030_overflow.jpg) and is joined here. The previous p030.yml (an antigravity 'v58 notes continuation') did not match any scan and has been discarded; it is kept in superseded/canto1_fix_2026-10-24/p030.yaml."
