page_number_devanagari: "३"
page_number_arabic: 3
image: "images/pages/p003.jpg"
verses:
  - number: 5
    shlok: |
      बलिन्तथा वालिसुतं समीरजं
      विभीषणं द्रोणसुतं कृपन्तथा ।
      [unclear: सराममेवं] चिरजीविनां गणं
      स्मराम्यभीष्टार्थवरादिवाञ्छया ॥ ५ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ। पाद ३ का आरम्भ अस्पष्ट है ("सराम…"; अनुवाद "भार्गव राम के साथ" से संगत)। पाद ४ "स्मराम्यभीष्टार्थवरादिवाञ्छया" — पूर्व पाठ "समेधयेयं चिरजीविनो गणं / तथा भार्गवरामेण सह" भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha. The start of pāda 3 is unclear ("सराम…"; it fits the Hindi "with Bhārgava Rāma"). Pāda 4 reads "स्मराम्यभीष्टार्थवरादिवाञ्छया"; the earlier reading ("समेधयेयं चिरजीविनो गणं / तथा भार्गवरामेण सह") was wrong.
    shlok_en:
      author: ai_translation
      text: |
        Bali, and Vāli's son, the son of the Wind, Vibhīṣaṇa, Droṇa's son, and Kṛpa too: this band of the long-lived, [with Rāma], I remember, wishing for the boon of my desired aim. (5)
    translation:
      author: amanuensis
      text: |
        बली- बाली- हनुमान्- विभीषण- द्रोणपुत्र- अश्वत्थामा, कृपाचार्य तथा भार्गव राम के साथ इन सभी चिरजीवियों का स्मरण मैं अभीष्ट वरदान सिद्धि प्राप्ति की कामना से करता हूँ ॥ ५ ॥
    notes:
      author: grandfather
      text: |
        मैं अपने नायक सप्तकल्पान्तजीवी महामुनि मार्कण्डेय दीर्घजीवी सप्तकल्पान्त की चिरजीविता प्राप्त करने वाले के आराध्य शिव की स्तुति के पूर्व उसकी परिपूर्णता के लिए महाराज बलि, महाबली बालि, परम नैष्ठिक ब्रह्मचारी पवन तनय हनुमान्, एकान्त रामभक्त लंकेश महाराज विभीषण, परम साहसिक अप्रतिम योद्धा आचार्य द्रोणपुत्र अश्वत्थामा, महाभारत समर के प्रत्यक्ष साक्षी कौरव पाण्डव के कुलगुरु महर्षि आचार्य कृप, [unclear: ईश्वरशक्तियान्तर] एकनिष्ठ पितृभक्त परशुराम इन सातों चिरजीवियों के समूह को हार्दिक नमस्कार करता हूँ कि ये लोग मेरे इष्टपूर्ति के लिए सम्बल प्रदान करें। ५
    translation_en:
      author: ai_translation
      text: |
        Bali, Vāli, Hanumān, Vibhīṣaṇa, Droṇa's son Aśvatthāmā, Kṛpācārya and Bhārgava Rāma: I remember all these long-lived ones, wishing to obtain the boon of my desired aim. (5)
    notes_en:
      author: ai_translation
      text: |
        Before praising Śiva, the deity worshipped by my hero, the great sage Mārkaṇḍeya, who lives to the end of seven kalpas and attained long life to the end of seven kalpas, I bow from the heart, for the completion of [this work], to this group of seven long-lived ones: King Bali; the mighty Vāli; Hanumān, son of the Wind, a supremely steadfast brahmacārī; Vibhīṣaṇa, king of Laṅkā, single-minded devotee of Rāma; the teacher Droṇa's son Aśvatthāmā, a supremely daring, matchless warrior; the maharṣi and teacher Kṛpa, family teacher of the Kauravas and Pāṇḍavas and eyewitness of the Mahābhārata war; and Paraśurāma, [unclear], single-mindedly devoted to his father: may they give me strength to fulfil my aim. (5)
  - number: 6
    shlok: |
      कवित्वलब्धौ न मनो निमज्जते
      न वा यशः ख्यापयितुं मनाक् स्पृहा ।
      परामृतत्वं लभते यतः स्मृतेः
      कथां ततस्तां गदितुं मनो दधे ॥ ६ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ। पाद १ "लब्धौ" किसी पूर्व शब्द पर अधिलिखित है। पाद २ "स्पृहा" (अनुवाद "इच्छा" से पुष्ट), पाद ४ "गदितुं मनो दधे" — पूर्व पाठ "…कथां ततस्तां जीवेत्तु" भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha. In pāda 1, "लब्धौ" is written over an earlier word. Pāda 2 reads "स्पृहा" (confirmed by the Hindi "इच्छा"), and pāda 4 "गदितुं मनो दधे"; the earlier reading "…कथां ततस्तां जीवेत्तु" was wrong.
    shlok_en:
      author: ai_translation
      text: |
        My mind is not absorbed in gaining poetic skill, nor have I even a little longing to spread my fame; since one gains the highest immortality through remembrance, I have set my mind on telling that story. (6)
    translation:
      author: amanuensis
      text: |
        मेरा मन कवित्व प्राप्ति में संलग्न नहीं, न तो यशः-ख्यापनार्थ थोड़ी ही इच्छा होती है, क्योंकि स्मृति अमरत्व प्राप्त करती है अत एव मेरा मन कथा कहने के लिए तत्पर हुआ है ॥ ६ ॥
    notes:
      author: grandfather
      text: |
        कवि अपने हृद्गत भावना द्वारा कवित्व-स्वाभिमान का परिहार करते हुए कहता है कि:— मैं एक विशिष्ट कवि के रूप में प्रख्यात होऊँ ऐसी भावना नहीं है। मुझे तनिक भी अपने यशः कामना की भी अभिलाषा नहीं, किन्तु स्मृति ही ऐसी वस्तु है जो अमरत्व प्राप्त करती है, अतः मेरे मन में एक ऐसे ईश्वरार्पित सप्तकल्पान्त जीवी, समाराधित मृत्युञ्जय देव के अहैतुकी कृपापात्र, चिरजीवियों में भी श्रेष्ठ महर्षि मार्कण्डेय की कथा कहने की अभिलाषा विवश करती है। ६
    translation_en:
      author: ai_translation
      text: |
        My mind is not engaged in gaining poetic skill, nor have I even a little desire to spread my fame; because remembrance attains immortality, therefore my mind has become ready to tell the story. (6)
    notes_en:
      author: ai_translation
      text: |
        Setting aside, through the feeling in his heart, the pride of being a poet, the poet says: I have no wish to become famous as a distinguished poet. I have not the least desire even for fame; but remembrance is the one thing that attains immortality. So a longing compels my mind to tell the story of Maharṣi Mārkaṇḍeya: devoted to God, living to the end of seven kalpas, recipient of the causeless grace of the god Mṛtyuñjaya whom he worshipped, the best even among the long-lived. (6)
