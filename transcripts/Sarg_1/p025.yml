page_number_devanagari: "२५"
page_number_arabic: 25
image: "images/pages/p025.jpg"
verses:
  - number: 49
    shlok: |
      गुरूपदेशं स निशम्य सत्वरं
      तयोश्चकाराशु पदोपसंग्रहम् ।
      पुनः परिक्रम्य ययौ सुरापगां
      तदाहितं कार्यभरं समुद्वहन् ॥ ४९ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद २ में "चकाराशु" के अक्षर अधिलिखित हैं; हाशिये में एक संशोधन (सम्भवतः "…काराशु") लिखा है। पूर्व पाठ "तथेच्छयाऽऽगृह्य वयोदयंगताः / … मयो सुपूजयन् / … कार्यकरे समुद्यतौ" भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha (all four pādas scan). In pāda 2 the letters of "चकाराशु" are overwritten, and a correction (probably "…काराशु") is written in the margin. The earlier reading ("तथेच्छयाऽऽगृह्य वयोदयंगताः / … मयो सुपूजयन् / … कार्यकरे समुद्यतौ") was wrong.
    shlok_en:
      author: ai_translation
      text: |
        Having heard his teachers' instruction, he quickly clasped the feet of the two; then, circling them once more, he set out for the river of the gods, bearing the burden of the task they had laid on him. (49)
    translation:
      author: amanuensis
      text: |
        गुरुओं के उपदेश को सुनकर शीघ्रतापूर्वक दोनों का चरणस्पर्श कर एवं परिक्रमा कर उनके द्वारा प्रदत्त कार्यभार को धारण करते हुए गङ्गा की ओर चल पड़े ॥ ४९ ॥
    notes:
      author: grandfather
      text: |
        उन गुरुप्रवरों के अमृतमय उपदेश सुनकर सविनय उनके चरणों का स्पर्श करते हुए सविधि उनकी परिक्रमा कर उनके द्वारा आदिष्ट प्रवृत्ति मार्ग सञ्चालन के गुरुतर कार्यभार का सम्पादन करने की अनन्य अभिलाषा लिए आदेश परिपालनार्थ अतिशय शीघ्रतापूर्वक देवधुनी गङ्गा की ओर चल पड़े। ४९
    translation_en:
      author: ai_translation
      text: |
        Having heard the teachers' instruction, he quickly touched the feet of the two, circumambulated them, and, taking up the charge they had given him, set out toward the Gaṅgā. (49)
    notes_en:
      author: ai_translation
      text: |
        Having heard the nectar-like teaching of those excellent teachers, he humbly touched their feet, circumambulated them as prescribed, and, with the single-minded wish to carry out the weighty charge they had laid on him, of directing the path of active life, he set out in great haste toward the divine river Gaṅgā to fulfil their command. (49)
  - number: 50
    shlok: |
      शिरस्यथाधाय समस्तकिल्बिष-
      प्रधर्षिणीः सच्चुलकद्वयीरपः ।
      बहिर्विशुद्धोऽन्तरपि प्रशोधयं-
      स्त्रिराचचामाथ स कायतीर्थतः ॥ ५० ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद २ पाण्डुलिपि में "प्रधर्षिणी सच्चुकद्वयीरपः" जैसा लिखा है; छन्द के लिए "सच्चुलक" (चार अक्षर) चाहिए। पाद ३ "ऽन्तरपि प्रशोधयन्" ("विप्रशोधयन्" जैसा दिखता है; "यौ" ऊपर संशोधित)। पूर्व पाठ "शिरस्यथाधां समस्तेकात्वष / प्रसाध्यार्थिनी सच्युकईयारमः / ह्योर्निंहुडो उत्ता विप्रशोधये / स्थिरा चचायाध स कामतीर्थतः" भ्रान्त था।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha (all four pādas scan). Pāda 2 is written like "प्रधर्षिणी सच्चुकद्वयीरपः"; the metre requires "सच्चुलक" (four syllables). Pāda 3 reads "ऽन्तरपि प्रशोधयन्" (it looks like "विप्रशोधयन्", with "यौ" corrected above the line). The earlier reading ("शिरस्यथाधां समस्तेकात्वष / प्रसाध्यार्थिनी सच्युकईयारमः / ह्योर्निंहुडो उत्ता विप्रशोधये / स्थिरा चचायाध स कामतीर्थतः") was wrong.
    shlok_en:
      author: ai_translation
      text: |
        Then, placing on his head two good handfuls of the water that overpowers all sin, purified outwardly and cleansing himself within as well, he sipped [the water] three times from the kāya-tīrtha [of his palm]. (50)
    translation:
      author: amanuensis
      text: |
        समस्तपापनाशिनी गङ्गा के दो चुल्लू जल को शिर पर धारण कर बाह्यशुद्धि सम्पन्न हो भीतर को शुद्ध करते हुए कायतीर्थ से गङ्गाजल का तीन बार आचमन किया ॥ ५० ॥
    notes:
      author: grandfather
      text: |
        सम्पूर्ण पापराशि की समूलोन्मूलन करने वाली उस भगवती गङ्गा के पावन जल के दो चुल्लुओं से अपने शिर का मार्जन कर बाह्य शुद्धि से पूर्ण सन्तुष्ट होकर अन्तःशुद्धि के लिए काय तीर्थ (अर्थात् दाहिने हाथ के मध्यभाग) द्वारा गङ्गाजल का तीन बार आचमन कर अपने को पूर्ण पवित्र समझा। ५०
    translation_en:
      author: ai_translation
      text: |
        Placing on his head two handfuls of the water of the Gaṅgā, destroyer of all sins, and having achieved outer purity, he sipped Gaṅgā water three times from the kāya-tīrtha, purifying himself within. (50)
    notes_en:
      author: ai_translation
      text: |
        Sprinkling his head with two handfuls of the holy water of the goddess Gaṅgā, who uproots the whole mass of sin, and fully content with his outer purity, he sipped Gaṅgā water three times through the kāya-tīrtha (that is, the middle part of the right hand) for inner purity, and considered himself wholly purified. (50)
