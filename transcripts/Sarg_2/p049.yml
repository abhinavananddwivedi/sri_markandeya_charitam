page_number_devanagari: "४९"
page_number_arabic: 49
image: "images/pages/p049.jpg"
verses:
  - number: 33
    shlok: |
      परं यतिष्ये भवतो मनोरथो
      यथातिशीघ्रं परिपूर्णतां व्रजेत् ।
      सतीव दिव्या सुहृदोऽस्ति कन्यका
      मरुद्वती मुद्गलनामकस्य मे ॥ ३३ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद २ "परिपूर्णतां व्रजेत्" (पूर्व "परिपूर्णतामृच्छेत्")।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Vaṃśastha (all four pādas scan). Pāda 2 reads "परिपूर्णतां व्रजेत्" (earlier "परिपूर्णतामृच्छेत्").
    shlok_en:
      author: ai_translation
      text: |
        "But I shall strive so that your wish is fulfilled very soon: my friend named Mudgala has a daughter, Marudvatī, divine, like Satī." (33)
    translation:
      author: amanuensis
      text: |
        इसके बाद आप के मनोरथ पूर्ति के लिए मैं प्रयास करूँगा। मेरे मुद्गल नामक मित्र के सती के समान मरुद्वती नाम की दिव्या कन्या है ॥ ३३ ॥
    notes:
      author: grandfather
      text: |
        अस्तु हे वर्णिप्रवर! मैं आप के इस मनोरथ पूर्ति के लिए अति शीघ्र अवश्य प्रयास करूँगा। मेरे एक अत्यन्त निकट के परम सुहृद् मुद्गल नामक ऋषि हैं, उनकी भगवती सती के समान अत्यन्त दिव्या मरुद्वती नाम की कन्या है। ३३
    translation_en:
      author: ai_translation
      text: |
        "After this I will try to fulfil your wish. My friend named Mudgala has a divine daughter named Marudvatī, like Satī." (33)
    notes_en:
      author: ai_translation
      text: |
        "So be it, excellent brahmacārī! I will certainly try very soon to fulfil this wish of yours. I have a very close, dearest friend, a sage named Mudgala; he has a very divine daughter named Marudvatī, like the goddess Satī." (33)
  - number: 34
    shlok: |
      सकृत्कुदो यौतकदेशवित्तवा-
      न्भवन्तमाश्वेव समागमिष्यति ।
      मया च पाणिग्रहणे तवाधुना
      द्विजैः सदाचार्यधुरा विवक्ष्यते ॥ ३४ ॥
    shlok_en:
      author: ai_translation
      text: |
        "[He is wealthy and able to give] dowry; he will come to you very soon. And I will now, with the brahmins, speak on [your] behalf in [arranging] your marriage." [Line 1 is imperfectly transcribed.] (34)
    translation:
      author: amanuensis
      text: |
        मेरा मित्र धनवान् है वह देश परिहर्त्त (दहेज) के साथ शीघ्र ही आप से मिलेगा। सम्प्रति आपके विवाह के सम्बन्ध में अन्य ब्राह्मणों के साथ अपनी सम्मति प्रकट करूँगा ॥ ३४ ॥
    notes:
      author: grandfather
      text: |
        वह मेरे मित्र अतिशय श्रेष्ठ व्यक्ति हैं, आपको यौतुक (दहेज) आदि देने की पूर्ण क्षमता भी रखते हैं। वह शीघ्र ही आप से मिलेंगे, मैं यथाशीघ्र आप के वैवाहिक सम्बन्ध के लिए अन्य ब्राह्मणों के साथ अपनी संस्तुति प्रस्तुत करूंगा। ३४
    translation_en:
      author: ai_translation
      text: |
        "My friend is wealthy; he will meet you soon with [unclear: "देश परिहर्त्त"] (dowry). For now, I will give my opinion, together with other brahmins, about your marriage." (34)
    notes_en:
      author: ai_translation
      text: |
        "My friend is a most excellent person and is fully able to give you a dowry (yautuka) and the like. He will meet you soon; I will put forward my recommendation for your marriage, together with other brahmins, as soon as possible." (34)
notes_uncertain: true
