page_number_devanagari: "३४"
page_number_arabic: 34
image: "images/pages/p034.jpg"
verses:
  - number: 3
    shlok: |
      तथैव मध्ये पयसः प्लवद्वयं
      प्रमज्जनोन्मज्जनजातविस्मयः ।
      जान्स्म संसारपयोनिधावमी
      प्रतर्कयामास भवाप्ययावपि ॥ ३ ॥
    translation:
      author: amanuensis
      text: |
        उसी प्रकार जल के बीच उसे तैरते देख प्रबल वायु के झकोरे से डूबते देख उन्हें विस्मय हुआ। तब वे संसार सागर में लोगों की जन्म-मरण की तर्कना किये ॥ ३ ॥
    notes:
      author: grandfather
      text: |
        वे दोनो भगवती गङ्गा की अत्यन्त समुज्जवल जल राशि में अपनी स्वाभाविक जल क्रीडा के क्रम में ऊपर नीचे डूबते उतराते रहे, जिसे देख मुनि शुकण्ड को अत्यन्त विस्मय हुआ, तथा इस संसार चक्र में निरन्तर गोता लगाते हुए डूबते और उतराते लोगों की सांसारिक जन्म मरण की भी तर्कणा की।
    translation_en:
      author: ai_translation
      text: |
        Likewise, watching waterfowls diving and resurfacing amidst the swirling currents, the sage was filled with philosophical wonder; in their submerging and rising, he discerned an allegory for mortal beings perpetually sinking and resurfacing in the ocean of worldly existence through the relentless cycle of birth and death (saṁsāra).
    notes_en:
      author: ai_translation
      text: |
        Observing the water-birds playfully diving beneath and bobbing up upon the radiant waters of Mother Gaṅgā, Sage Mṛkaṇḍu felt profound contemplation. In their effortless rising and plunging amidst turbulent waves, he drew a deep metaphysical parallel to human souls tossed about in the great ocean of material existence—ceaselessly drowning and resurfacing across repeated births and deaths.
  - number: 4
    shlok: |
      क्वचिद् बकं मीलितलोचनं पुन-
      र्हृदाशितिं शुक्लतरञ्च बाह्यतः ।
      स्वकार्यसिद्धि व्यपदेश निश्चयं
      जनं स दम्भाकृतं धिक्कृतं न्वमन्यत ॥ ४ ॥
    translation:
      author: amanuensis
      text: |
        कहीं पर आँख बन्द किये भीतर से काला बाहर से सफेद बगुला को देखा। तब वे अपने कार्य सिद्धि के बहाने दृढ़ निश्चयी दम्भी जन ऐसे ही होते हैं यह माने ॥ ४ ॥
    notes:
      author: grandfather
      text: |
        अपनी स्वाभाविक वृत्ति के कारण कहीं आँखे बन्द किए कहीं खुली हुई आँखों वाले, कलुषित अन्तस्तल (हृदय) अपने लक्ष्य के प्रति सतत सजग रहने वाले ऊपर से अत्यन्त धवल शरीर-धारी किन्तु भीतर से मत्स्य के प्रति अत्यन्त समुत्सुक हिंस्रवृत्ति-वाले बक पंक्ति को भी देखा, जिन्हें देख कर उनके अन्तः में यह धारणा हुई कि यह संसार अपने अर्थ सिद्धि के लिए कितना ढोंग रचकर स्वार्थ साधन में अत्यन्त दृढ़ता के साथ निरत रहता है, ऐसा अपने मन में विचार किया । ४
    translation_en:
      author: ai_translation
      text: |
        Elsewhere, he beheld a crane standing motionless with half-closed eyes—spotless white on the outside, yet dark and predatory within. Recognizing in it the embodiment of feigned meditation for self-serving ends, the sage reflected on the reprehensible nature of worldly hypocrites who mask their predatory greed behind pious pretension.
    notes_en:
      author: ai_translation
      text: |
        He observed a line of herons along the bank, standing with eyes half-shut in feigned trance, outwardly spotless white yet harboring predatory, lethal focus on unsuspecting fish. This striking natural scene stirred within him a vivid comparison to self-seeking hypocrites of the world, who adopt an outward veneer of piety, virtue, and renunciation solely to manipulate others and execute their selfish, calculated schemes.
