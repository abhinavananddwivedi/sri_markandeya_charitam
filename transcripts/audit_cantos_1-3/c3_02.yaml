- p: 68
  v: "15"
  g: {he: m, ne: m, s: B}
  se: |
    That very morning, having discerned with a clear mind, as [in] a mirror before him, [he knew of] Parāśara, on the bank of the Gomatī, three yojanas away to the south-west. (15)
  he: |
    That very morning, meditating with a clear mind, the excellent sage came to know that the great sage Parāśara was living on the bank of the Gomatī, three yojanas away to the south-west. (15)
  ne: |
    After his morning daily rites, the sage Mṛkaṇḍa focused his mind and, with a settled mind, came to know that at a distance of 3 yojanas (12 kos) to the south-west from here, on the lovely bank of the river Gomatī, was the meritorious hermitage of the great sage Parāśara, most excellent among the lords of sages. (15)
- p: 68
  v: "16"
  g: {he: m, ne: m, s: A}
  se: |
    "Surely Parāśara, generous of heart, will fulfil my wishes": so he thought in his heart, [resolving] only to see that great sage, who was like an elder brother. (16)
  he: |
    "The great sage Parāśara is very generous-minded; he will fulfil my wishes." Thus he resolved in his heart to see the great sage, who was like an elder brother. (16)
  ne: |
    "I have heard that the great sage Parāśara is very generous, warm-hearted and most excellent among sages. He will do me every kind of good; he will surely fulfil all my wishes; he is like my elder brother." With an intense longing to see him, he decided to go there. (16)
- p: 69
  v: "17"
  g: {he: m, ne: m, s: A}
  se: |
    Having finished all his daily rites, he, in great haste to reach that trustworthy one, went on for two watches of the day and reached the auspicious hermitage that takes away distress. (17)
  he: |
    That great soul Mṛkaṇḍu, having finished all his daily rites, hurried to reach the trustworthy one (āpta, one who speaks truly), and when two watches of the day had passed, at midday, he came to the auspicious hermitage that takes away distress. (17)
  ne: |
    The sage Mṛkaṇḍa rose very early, finished his daily rites, and, with an intense longing to meet Maharṣi Parāśara, a person very dear to him and a speaker of truth, walked on without stopping for two watches and at midday (noon) reached the sage Parāśara's hermitage, which was always peaceful and famous for taking away distress. (17)
- p: 69
  v: "18"
  g: {he: OK, ne: m, s: A}
  se: |
    From afar, on the bank of the Gomatī, he saw groups of Vaiṣṇava sages all around, intent on the midday rites, and brahmacārīs at their observances. (18)
  ne: |
    At that midday, on the bank of the holy goddess Gomatī, whose waters bring merit, he saw from afar Vaiṣṇava saints, elders and various groups of sages engaged in the midday sandhyā worship and other daily rites, and brahmacārī boys too performing their daily observances. (18)
- p: 70
  v: "19"
  g: {he: m, ne: m, s: A}
  se: |
    Then [he saw] many, in one place intent on bathing, in another busy spreading seats, others making fine svastikas, and elsewhere intent on worshipping the Sun (Vivasvat). (19)
  he: |
    He saw brahmacārīs bathing in one place, spreading seats in another, making svastika designs in another, and in another performing the upasthāna (vivasvataḥ: worship of the Sun). (19)
  ne: |
    In that hermitage he saw boys bathing in one place, arranging seats and the like for their teachers in another, making svastikas and the like for meritorious work in another, and in another performing the midday worship of the Lord beyond the highest, the god Āditya. (19)
- p: 70
  v: "20"
  g: {he: OK, ne: m, s: A}
  se: |
    [He saw] some seated in the lotus posture, some with the spine held visibly straight, [and others] with eyes closed in meditation, seeing within the heart a very bright light. (20)
  ne: |
    He saw the dwellers of the hermitage there, some seated in the lotus posture, some doing the posture of straightening the spine for its health, and some, in a state of meditation within, with eyes closed, seeing a most bright, radiant light. (20)
- p: 71
  v: "21"
  g: {he: OK, ne: m, s: B}
  se: |
    [He saw] sages intent on the japa of the Mother of the Vedas (Gāyatrī), with a stalk of kuśa in the left hand and in the right three kuśa blades with the pavitra, the forefinger kept outside the japa bag. (21)
  ne: |
    In one place he saw ever-attentive sages, holding a handful of kuśa in the left hand and in the right hand a pavitrī made of three kuśa roots, putting the forefinger out through the hole at the end of the japa bag, and engaged in the japa of the goddess Gāyatrī, Mother of the Vedas. (21)
- p: 72
  v: "22"
  g: {he: m, ne: m, s: B}
  se: |
    [He saw] some seated in the lotus posture, their hands turned behind their backs [holding the toes], and [others] intent on gazing at the tip of the nose. [Line 3 is imperfectly transcribed.] (22)
  he: |
    He saw some seated in the lotus posture, turning their hands behind them and holding their big toes, carefully intent on looking at the tip of the nose. (22)
  ne: |
    Here he saw some people doing the lotus posture, and some taking both hands behind the back, holding the big toes of both feet with both hands, and, carefully and attentively, looking only at the tip of the nose. (22)
- p: 72
  v: "23"
  g: {he: OK, ne: m, s: A}
  se: |
    In one place [he saw sages] in the bound, extended lotus posture, others intent on the cock posture, others in the arm-staff posture, and others again in the peacock posture. (23)
  ne: |
    With wonder he saw various sages, in one place doing the long lotus posture, in another practising the cock posture, in another the arm-staff posture, and in another the peacock posture. (23)
- p: 73
  v: "24"
  g: {he: OK, ne: OK, s: A}
  se: |
    [He saw] these and other [sages] intent on haṭha yoga, and others whose minds were in rāja yoga, beholding within themselves, through samādhi, the highest, very bright light. (24)
- p: 73
  v: "25-27"
  g: {he: OK, ne: m, s: B}
  se: |
    (25) In the middle of the altar, of bright splendour, his body golden in hue, tall in form, with golden hair and a long beard, his eyes closed in meditation, rich in austerity; (26) his forehead adorned with the upright mark (ūrdhvapuṇḍra), with fine tulasī garlands at his ears, high-nosed, [unclear] on his face, bearing the light of a gentle smile; (27) his mind sunk in the dense joy of consciousness, intent on restraining outward activity, worshipping with fitting offerings: Parāśara he recognised before him. (25-27)
  ne: |
    After this, [he saw] that excellent ascetic in the middle of the sacrificial altar, shining with divine splendour, whose tall body and grace of form outshone even the yellow glow of gold, with hair of yellow lustre, adorned with a long beard, his eyes closed because of samādhi: (1) his forehead adorned with the ūrdhvapuṇḍra (having received Vaiṣṇava initiation), wearing lovely strands of tulasī in both ears, with a high nose and long corners to his eyes, his bodily lustre joined with a soft, sweet smile; (2) meditating within his heart on the highest reality, able, through his experiences, to restrain all outward worldly activity, and worshipping the Supreme Brahman by various methods of worship of the gods. Seeing him, the sage Mṛkaṇḍa was convinced in his heart: "This is Maharṣi Parāśara." (25, 26, 27)
- p: 74
  v: "28"
  g: {he: m, ne: m, s: A}
  se: |
    Then he went before him and respectfully fell prostrate like a staff; [Parāśara], comforting him by a gesture, soon, as a good sage, duly received him too. (28)
  he: |
    Maharṣi Mṛkaṇḍu went to him and bowed respectfully, prostrate like a staff. Comforting him with a gesture, the good sage Parāśara too quickly wished to worship and honour him. (28)
  ne: |
    As soon as he saw Maharṣi Parāśara, the sage Mṛkaṇḍa went near him and respectfully prostrated himself like a staff at his feet; the generous Maharṣi Parāśara at once reassured him with a kind gesture and comforted him at once in a soothing way. (28)
- p: 74
  v: "29"
  g: {he: m, ne: m, s: B}
  se: |
    And the sage, with his disciples' help, calling out several times in haste, "water for the feet, arghya, madhuparka", now had Mṛkaṇḍu honoured by them. [Partly unclear.] (29)
  he: |
    And through his disciples, the sage Parāśara, respectfully calling out several times "water for the feet, arghya, madhuparka", now had Maharṣi Mṛkaṇḍu worshipped. (29)
  ne: |
    At the same time, calling out several times in haste to his dear disciple for water for the feet, arghya, madhuparka and the like, he duly and respectfully attended to the sage Mṛkaṇḍa with madhuparka and various other offerings. (29)
- p: 75
  v: "30"
  g: {he: m, ne: m, s: B}
  se: |
    Having given the cow with the madhuparka, and pleasing food, sweet and satisfying, [and] when [Mṛkaṇḍu] had quickly sat down on his seat, Parāśara spoke to Mṛkaṇḍu. (30)
  he: |
    Having offered a cow for the madhuparka, and [served] satisfying, sweet and tasty food, the excellent sage Parāśara expressed his heartfelt feelings in fine words to Mṛkaṇḍu, who was seated on a comfortable seat. (30)
  ne: |
    The sage Parāśara honoured him with excellent words full of goodwill and duly completed the hospitality with very fine, pleasing foods. After [Mṛkaṇḍa], satisfied and glad, had sat down on his seat, and just as the sage Mṛkaṇḍa was trying to say what he had to say, Maharṣi Parāśara began to speak to him in his very sweet voice. (30)
