- p: 61
  v: "1"
  g: {he: OK, ne: m, s: A}
  se: |
    By the power of his austerity he had the strength to go to Dardura in a single day; but, to teach the world, he travelled the whole way on foot. (1)
  he: |
    Although by the power of his austerity he had the strength to go to Dardura in one day, he went on foot to teach the world. (1)
  ne: |
    The sage Mṛkaṇḍa was a perfected ascetic; he had an unprecedented ability to do anything according to his wishes, and the power of his austerity was wonderful; he had the capacity to do everything in a moment. Had he wished, he could have reached the Dardura region from the valley of the Himālaya in a single moment; but, in the early period of creation, to teach the world, he thought it proper to walk from there on foot, and he set out. (1)
- p: 61
  v: "2"
  g: {he: m, ne: m, s: A}
  se: |
    Grazing his cow on the way, he went on, keeping place and time in mind; at night he lodged with good householders, at once teaching them the care of cows. (2)
  he: |
    He went on, keeping place and time in mind, so as to look after his cow on the way. At night he stayed with good householders, teaching them that one should always serve cows. (2)
  ne: |
    In that early period, to teach people in keeping with the conditions of place and time, he kept walking slowly behind his cow, grazing her along the way. When evening came he stayed in the house of some good householder who lived there, and told all good householders that everyone should serve cows, because cows are the basic means of the agnihotra for the householder's dharma; giving this direction (teaching), he went on with his journey. (2)
- p: 62
  v: "3"
  g: {he: m, ne: m, s: B}
  se: |
    Following the path pointed out by Dākṣi, the traveller, keeping to the appointed time, went in the slanting direction called Agni's (south-east), with the Gaṅgā's approval. [Partly unclear; "दाक्षिण्या" may name Dākṣi, the sage of canto 4.] (3)
  he: |
    That travelling great soul, having settled on the hermitage pointed out by Dakṣa [the Hindi glosses "(चातुर)", "clever one"; the Sanskrit "दाक्षिण्या" suggests Dākṣi], set out on the road slanting toward the south-east, with the Gaṅgā's approval. (3)
  ne: |
    Although the decision was to go only by the road shown to Mṛkaṇḍa by Dakṣa's son [the notes as transcribed add "(दधि)"; probably Dākṣi] for making his dwelling, he nonetheless decided to go toward his goal along the Gaṅgā's stream, which runs slanting toward the south-east, and set out in that direction. (3)
- p: 62
  v: "4"
  g: {he: OK, ne: OK, s: A}
  se: |
    Leaving the hilly land on his left and going quickly by a straight road, he reached Pītabhitti and lodged as a guest in someone's hermitage there. (4)
  he: |
    Leaving the hilly land on his left, he went quickly by a straight road to Pītabhitti (Pīlībhīt), and stayed as a guest in someone's lovely hermitage. (4)
  ne: |
    Going on from there, he left the hilly land on his left, walked along the straight road ahead over level ground, came to a place named Pīlībhīt, and spent the night as a guest in some good householder's lovely house or hermitage. (4)
- p: 63
  v: "5"
  g: {he: OK, ne: m, s: A}
  se: |
    Having stayed also at Naimiṣa, with its circle of sages, he came to the land of Rāma's birth; having spent the third night there, he reached the town of Dardura on the fourth [day]. (5)
  he: |
    Having stayed in Naimiṣāraṇya, with its groups of sages, he came to Ayodhyā, birthplace of Śrī Rāma. Spending the third night there, on the fourth day he reached the land of Dardura. (5)
  ne: |
    Walking on the next day with his cow and her calf, he stayed (spent the night) in the holy, meritorious land called Naimiṣāraṇya, with its many ascetics; then he came to the holy birthplace of Rāma, Ayodhyā, and spent the third night there; and on the fourth day, going on from there, he reached his goal, the Dardī region. (5)
- p: 63
  v: "6"
  g: {he: OK, ne: m, s: A}
  se: |
    Having drunk the water of the Gaṅgā and praised Keśava with an attentive mind, he became joyful, his mind shining, as he thought about the building of his future house. (6)
  he: |
    Having drunk Gaṅgā water and meditated on Keśava with an attentive mind, the great soul, glad at heart, reached suitable land. He began to think about building his future leaf hut. (6)
  ne: |
    On reaching there he drank the water of the goddess Gaṅgā, whose waters are holy, and, attentive, settled and glad at heart, praised Lord Keśava with feeling. Very happy and joyful at heart, the sage Mṛkaṇḍa began to think about building the future leaf hut he would live in. (6)
- p: 64
  v: "7"
  g: {he: OK, ne: m, s: A}
  se: |
    "Here the fire-house would be good, and there the pavilion for the upanayana; on one side a house for the students to live in, and here a garden for the rule of leaves and flowers." (7)
  he: |
    "Here the fire-house will be right; here build the upanayana pavilion; on one side a place for the students; and in one place a garden for leaves, flowers and the like is fitting." (7)
  ne: |
    In keeping with the science of building, the sage Mṛkaṇḍa thought: "Here a fire-hall (sacrificial hall) for the agnihotra will be right; here a pavilion for the upanayana of the boys will be right; here it will also be right to build a fine hostel for the brahmacārī students to live in. For carrying out sacrifices, worship and the like properly, a charming flower garden can be made here." (7)
- p: 64
  v: "8"
  g: {he: OK, ne: m, s: A}
  se: |
    "And for the rite of marriage, a four-sided house will be built here; for now let me have ten cows, and likewise a circle of a thousand disciples." (8)
  he: |
    "For the marriage, a four-sided house (catuḥśāla) will be built here. At present, ten cows and a thousand disciples are the right number for me." (8)
  ne: |
    "For carrying out the householder's dharma, after the marriage, a grand house with four storeys or four courtyards will be built here. So, for now, a herd of ten cows and a company of a thousand disciples can also be well arranged for me." (8)
- p: 65
  v: "9"
  g: {he: m, ne: m, s: B}
  se: |
    "Who is the ruler of this land now? And which excellent sage is awake (eminent) here? [Gaining] whose kindness I may at once come to be at one with him." (9)
  he: |
    "Who is the king of this country now? Which excellent sage is influential here? By whose kindness and favour I too may come to share his views." (9)
  ne: |
    "Now let me see who is the lord (king) of this region, and who is the best among the very awake, influential sages of this area, in whose company I may obtain even a particle of his favour and become settled as his associate." (9)
- p: 65
  v: "10"
  g: {he: OK, ne: m, s: A}
  se: |
    Having surveyed in his mind these and very many other wishes, he was content, and set about removing through sleep the weariness the road had laid on him. (10)
  he: |
    Having thus looked over many wishes in his mind, he was happy. He got ready to remove through sleep the tiredness in him caused by walking the road. (10)
  ne: |
    Thinking in this way about various imaginings and wishes in his mind, he felt very glad inwardly, became happy and found peace. Feeling very tired from walking constantly with the cow along the road, he fell into a calm sleep to remove his tiredness through deep sleep. (10)
- p: 66
  v: "11"
  g: {he: m, ne: m, s: C}
  se: |
    He tied the cow among the spread of the banyan's roots, [made] a pleasant seat on one side, and, [laying] a blanket toward the head, spread a bed of kuśa for sleeping. [Lines 3–4 are imperfectly transcribed.] (11)
  he: |
    He tied the cow at the roots of the banyan, tied one calf, [made] a lovely seat on one side, [put] a blanket toward the head, and spread a bed of kuśa grass to sleep on. (11)
  ne: |
    The sage duly tied the cow at the root of the great banyan tree standing in front, and on one side made a charming seat that kept the mind fully calm and settled; for his own sleep he also laid out a bed of excellent kuśa grass on a blanket below, with the head toward the east. (11)
- p: 66
  v: "12"
  g: {he: m, ne: m, s: A}
  se: |
    Having washed his feet and tender hands, he gladly ate a little forest food; then the sage, remembering the highest light, lay down to sleep in due form. (12)
  he: |
    Having joyfully washed his hands and feet, he ate some forest roots, tubers and fruits; then the great soul completed the rite of lying down, remembering the most divine light. (12)
  ne: |
    After this the sage washed his hands and feet with great joy and ate the roots, tubers, fruits and the like easily found in the forest; then, beholding the divine light of the Supreme Lord, he went to sleep, calm, settled and free of worry. (12)
- p: 67
  v: "13"
  g: {he: OK, ne: m, s: A}
  se: |
    And placing at his head a pot full of water with a bowl, and setting the remembrance of the Lord in his heart, [he slept] like a child that has fallen asleep in its mother's lap. (13)
  he: |
    Placing at his head a pot full of water and a bowl, and remembering the Lord, he slept like a child lying in its mother's lap. (13)
  ne: |
    After this the sage Mṛkaṇḍa covered a full pot of water with a bronze bowl and placed it at his head; remembering the Lord, just as a child sleeps peacefully and without worry in its mother's lap, so he slept, settled and calm, in the lap of the goddess Earth, who is like a mother. (13)
- p: 67
  v: "14"
  g: {he: m, ne: m, s: B}
  se: |
    His awareness lost in sleep, the sage shone as if practising true samādhi; when the dawn rose before him, he woke and performed his own observances. (14)
  he: |
    The great soul, his awareness lost in sleep, became radiant as though practising true samādhi. Then, when the glow of dawn spread, he woke and performed his sandhyā worship and other rites. (14)
  ne: |
    Although the sage Mṛkaṇḍa had fallen fully into deep sleep and his awareness had ceased, it seemed that the sage was absorbed in a very radiant, most exalted state of samādhi. In the morning, before the glow of dawn, he rose at the brāhma hour and duly completed his daily morning sandhyā worship and other rites. (14)
