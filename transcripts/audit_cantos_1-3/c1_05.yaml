- p: 21
  v: "41"
  g: {he: M, ne: m, s: D}
  se: |
    "Do not be careless toward prosperity and wealth, for heedlessness is never for anyone's good ..." [The rest of the Sanskrit as transcribed is too corrupt to construe.] (41)
  he: |
    "Do not be careless toward prosperity and wealth, for heedlessness is good for no one. Give the teachers a river [as written; "नदी" is probably a misreading, e.g. of "निधि", wealth], so that great good may come to you. Carry out all the above with a settled mind." (41)
  ne: |
    "Dear child! Throughout your life, never be in the least careless (mistaken) toward wealth (glory) and the prosperity that brings all welfare, for heedlessness or ignorance (carelessness) is never good for anyone. Whatever is truly dear and pleasing to you, give that to your revered elders. Do all your work with a very careful, clear mind; this is the best way to every aim on the path of worldly welfare." (41)
- p: 21
  v: "42"
  g: {he: m, ne: m, s: A}
  se: |
    "Do not be one who breaks the thread of offspring; be always devoted to honouring guests; carry out the sacrifices and works of merit (iṣṭa and pūrta), and offer the agnihotra without break." (42)
  he: |
    "Let your line of descendants not be broken; remain always engaged in honouring guests. Complete the beneficial works (sacrifices and the like), and become a keeper of the agnihotra." (42)
  ne: |
    "Dear child! In following the householder's dharma, the line of offspring must never be broken (prajātantuṃ mā vyavacchetsīḥ). Honouring guests in the householder's stage is always the way to everyone's welfare; remain constantly engaged in honouring guests, for (a guest is everyone's teacher). Keep performing sacrifices and works of merit, building wells, step-wells, ponds, gardens, temples and the like, and keep tending the agnihotra (the perpetual fire)." (42)
- p: 22
  v: "43"
  g: {he: m, ne: m, s: D}
  se: |
    [The Sanskrit as transcribed is largely corrupt; construable fragments:] "... the course of [such a doer] is well assured ... for who can stand [even a moment] without action?" (43)
  he: |
    "Doing good deeds, offer them to God; the progress of those who act thus is assured. This [world] is of the nature of action, for who can stay in this world even for a moment without action?" (43)
  ne: |
    "Dear child! Doing good deeds constantly in life, always keep offering them to God, for this is the rule laid down. Such activity is the very basis of life, for can anyone stay even for a moment without some action?" (43)
- p: 22
  v: "44"
  g: {he: m, ne: M, s: D}
  se: |
    [The Sanskrit as transcribed is largely corrupt; construable fragments:] "The hardship and misfortune of the path of renunciation [are known] ... see the wonder [of those who are] unattached in action." (44)
  he: |
    "Do we not know the hardship and misfortune of the path of renunciation? We know them. But see this wonder: those who are unattached in action and whose desires are fulfilled are honoured in the world." (44)
  ne: |
    "Dear child! Now consider all the hardships of those who withdraw from the world and take up the path of renunciation, and the many kinds of plight and misfortune that come with time; do we not know these things? Are not thousands of seekers of the active way, who are devoted to renunciation but engaged in worldly work with an unattached mind and are fulfilled in desire (giving up the fruits of action), greatly honoured in society? Is this worldly wonder (curiosity) not plain to see!" (44)
- p: 23
  v: "45"
  g: {he: m, ne: m, s: C}
  se: |
    "So, best of the twice-born, you are not being taught; rather, you, great one, teach your disciples in the same way. Great sage, you are anointed on earth as the first teacher of the path of [natural, active] life." (45)
  he: |
    "Twice-born one! You are not being taught; you are yourself able to teach disciples in the same way. Great sage! So we anoint you on this earth as the first teacher of the path of nature (prakṛti-mārga)." (45)
  ne: |
    "So, best of the twice-born! We are not giving you any teaching. You are able to teach worthy disciples properly. Great sage Mṛkaṇḍu! Today we formally anoint you on this earth to the office of first teacher of the path of nature, giving you authority for the proper running of the path of action, and, wishing you well, we hope for its constant support and organisation." (45)
- p: 23
  v: "46"
  g: {he: m, ne: m, s: C}
  se: |
    "You are to give the sacred thread to the boys of the twice-born, who, honouring this path [and immersed in it], deserve to live by your teaching." [Partly corrupt.] (46)
  he: |
    "Perform the upanayana of the boys of the twice-born, so that they become disciplined through your teaching. Those who take up this path through your teaching will be the ones worthy of dwelling [here]." (46)
  ne: |
    "Now perform the upanayana rite of the twice-born (brahmin boys) with due ceremony. Through your well-known teaching, may the boys become models of discipline and good manners; trusting in this very pleasant path of action and living on this earth by your teaching, may they become lively and inspiring followers of the path of knowledge and action, and remain constantly engaged in its growth and protection." (46)
- p: 24
  v: "47"
  g: {he: m, ne: m, s: B}
  se: |
    "This Gaṅgā, destroyer of all sins, is sung in the three worlds as Viṣṇupadī; wishing to raise up the descendants of Sagara, she runs to the ocean, giving life." (47)
  he: |
    "This Gaṅgā of the three worlds, destroyer of all sins, is sung by the name Viṣṇupadī. To deliver the descendants of Sagara she flows toward the eastern sea." (47)
  ne: |
    "See, this Gaṅgā Viṣṇupadī that comes out of Gomukh (flowing alike in all three worlds) is an excellent river that destroys all the stain of sin (the best of rivers). There is the memory of the 60,000 sons of the famous King Sagara, burned to ashes by the curse of the sage Kapila; to deliver them she comes from here to meet the eastern ocean." (47)
- p: 24
  v: "48"
  g: {he: OK, ne: m, s: C}
  se: |
    "Going a little way from here, you will come upon [the place] called Harahāra of the great lord (Śiva); [following the river] wherever your mind turns, there you may dwell." [Partly corrupt.] (48)
  he: |
    "Going a little way from here, you will find the place of Lord Śiva called Harahāra. Walking along the bank, wherever your mind is drawn, there you may live." (48)
  ne: |
    "Dear one! Go on from here; a short way off you will find Harahāra, the beloved place of the primal god, Lord Śiva. Following the river along that road, wherever you see land that suits your mind and favours study, japa and austerity (where your mind settles), there you may make your dwelling and live." (48)
- p: 25
  v: "49"
  g: {he: m, ne: m, s: C}
  se: |
    Having heard the teachers' instruction and accepted it gladly, he again circumambulated and worshipped them, and set out, ready to carry out the task entrusted to him. [Partly corrupt.] (49)
  he: |
    Having heard the teachers' instruction, he prostrated fully, circumambulated the two honoured divine ones, worshipped them, and, taking up the charge they had given him, set out toward the Gaṅgā. (49)
  ne: |
    Having heard the nectar-like teaching of those excellent teachers, he humbly touched their feet, circumambulated them with due rite, and, with an eager wish to carry out the weighty charge they had given him of running the path of action, set out very quickly toward the river of the gods, Gaṅgā, to obey the command. (49)
- p: 25
  v: "50"
  g: {he: m, ne: m, s: D}
  se: |
    [The Sanskrit as transcribed is largely corrupt; only "on the head", "for purification" and "from the kāya-tīrtha" can be made out.] (50)
  he: |
    Placing two handfuls of water of the Gaṅgā, destroyer of all sins, on his head and purifying himself, he sipped Gaṅgā water three times from the kāya-tīrtha [of the palm]. (50)
  ne: |
    Sprinkling his head with two handfuls of the holy water of the goddess Gaṅgā, who uproots the whole mass of sin, and fully satisfied with this outer purification, he sipped the Gaṅgā water three times through the kāya-tīrtha (the middle of the right palm) for inner purification, and considered himself fully pure. (50)
