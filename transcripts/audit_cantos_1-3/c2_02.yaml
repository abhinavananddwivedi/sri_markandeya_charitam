- p: 39
  v: "13"
  g: {he: m, ne: m, s: B}
  se: |
    Seeing the sun resting on the treetops and knowing that evening would soon come, the sage, [mindful of] the glorious deeds of Bhagīratha of old, [prepared] for the evening rites. (13)
  he: |
    Seeing the sun near the trees and knowing that evening was coming soon, he remembered the glorious deeds of Bhagīratha of old, for the evening rites. (13)
  ne: |
    When Lord Bhāskara had climbed onto the tops of the tall trees, the great sage thought that evening would soon come. Praising and bowing in memory of the goddess Bhāgīrathī, brought to earth by the unprecedented austerity of King Bhagīratha, best of sages, he began to make ready to perform the daily evening rites. (13)
- p: 39
  v: "14"
  g: {he: OK, ne: m, s: A}
  se: |
    Placing his deerskin and other things on the bank, and carrying water and earth in his water-pot, the sage went well away from the stream and performed the cleansing rite properly. (14)
  he: |
    Maharṣi Mṛkaṇḍu placed his deerskin and other things on the bank, took water and earth in his water-pot, went away from the stream, and completed his cleansing according to the method laid down in the Vedas. (14)
  ne: |
    Maharṣi Mṛkaṇḍu placed the deerskin and other things he had with him neatly on the bank of the holy goddess Bhāgīrathī, took water and clean earth in his water-pot, went quite far from the Gaṅgā's stream, and completed the cleansing according to the method laid down in the Vedic rules. (14)
- p: 40
  v: "15"
  g: {he: m, ne: m, s: A}
  se: |
    Then, turning back and bathing in the pure water of the Jāhnavī, giver of enjoyment and liberation, and performing the sandhyā, he, radiant by [Vedic] rule, worshipped Śiva at the time of pradoṣa. (15)
  he: |
    Having finished cleansing, he bathed in the clear water of the Gaṅgā, giver of enjoyment and liberation, and performed the sandhyā worship and other rites; then the powerful Maharṣi Mṛkaṇḍu pleased Lord Śaṅkara, the easily pleased, at the time of pradoṣa. (15)
  ne: |
    Having thus finished the cleansing rite, he bathed duly in the clear water of the goddess, daughter of Jahnu, giver of liberation and enjoyment, and completed the sandhyā worship and other daily rites; after that the radiant, splendid great sage Mṛkaṇḍu, at the time of pradoṣa, also worshipped Lord Śaṅkara, husband of Bhavānī, sustainer of beings, and fully pleased him. (15)
- p: 40
  v: "16"
  g: {he: OK, ne: OK, s: A}
  se: |
    "To cross the ocean of worldly life, every man among the born takes refuge in you alone; [rebirth] is held back [even] by deeds done over hundreds of births; without Bhava (Śiva), how can there be [freedom from] rebirth?" (16)
  he: |
    "To cross the ocean of worldly life, all people take refuge in you alone. For how can a person's rebirth, [caused] by deeds done in hundreds of births, be stopped without worshipping Lord Śiva?" (16)
  ne: |
    "Lord! All beings who take birth in the world take refuge in you alone to cross this boundless ocean of worldly life. For how can the rebirth that comes from deeds done in hundreds of births be stopped without worshipping Lord Sadāśiva?" (16)
- p: 41
  v: "17"
  g: {he: m, ne: m, s: A}
  se: |
    With eyes closed, entering samādhi and saying again and again "namaḥ śivāya", the skilful sage set Śiva in the middle of the maṇipūra [cakra] and attained oneness with him. (17)
  he: |
    Closing his eyes and entering samādhi, repeating again and again the mantra "oṃ namaḥ śivāya", he meditated for a long time on Śiva in the middle of the maṇipūra cakra; meditating, the great sage attained Śiva-hood. (17)
  ne: |
    Thus the great sage, with a collected mind, closed his eyes and, with a one-pointed, solitary, absorbed mind, constantly uttered the six-syllable mantra "oṃ namaḥ śivāya". Meditating for a long time on Lord Āśutoṣa Sadāśiva, who dwells constantly in the middle of the maṇipūraka cakra among the six cakras, he at once became one with Lord Śiva and became himself of Śiva's form. (17)
- p: 41
  v: "18"
  g: {he: m, ne: m, s: B}
  se: |
    Holding his breath, passing beyond the objects of sense, the sage pierced even the shell of resolve, contemplated the Lord, and afterwards, withdrawing from samādhi, thought about the night, eager to pass it. (18)
  he: |
    Holding his breath and passing beyond the objects of sense, the sage pierced the triad (tripuṭī), contemplated the Lord seated there, withdrew from samādhi, and began to think about spending the night ahead. (18)
  ne: |
    Thus the maharṣi, by holding the vital breath, made his mind wholly cease from the disturbance of objects, thoroughly pierced the triad (tripuṭī), and, constantly contemplating the Lord beyond the highest, seated at the crown of the head, gradually withdrew from samādhi; with a settled mind he began to think further about spending the night. (18)
- p: 42
  v: "19"
  g: {he: m, ne: m, s: B}
  se: |
    Wishing to rest, he saw near the bank the house of some modest, excellent brahmin, of fierce radiance, with six cows, the smoke of the evening oblation rising high. (19)
  he: |
    He was just about to say something when he saw the smoke rising from the evening oblation made by some excellent, modest brahmin of fierce radiance, and his house with six cows. (19)
  ne: |
    He was just now thinking of saying something when, on that very bank of the Gaṅgā, he saw the mass of smoke rising from the evening oblations made by some very modest, excellent brahmin, and with it the hut of some very radiant brahmin devoted to his duties, full of six cows. (19)
- p: 42
  v: "20"
  g: {he: OK, ne: m, s: A}
  se: |
    Having made the oblation, going in and out at the door, wearing sandals, carrying a child in his lap, setting his sons and grandsons to their work, the master of the house was then seen by him. (20)
  he: |
    He saw a master of a house who, having made the oblation and put on wooden sandals, held a child in his lap, set his sons and grandsons to work, and was going in and out at the door. (20)
  ne: |
    Meanwhile the sage Mṛkaṇḍu saw with wonder a brahmin devoted to his duties, a good householder and master of the house, who had finished the evening oblation, wore wooden sandals, held a tender child in his lap, and was going in and out of the house directing his sons, grandsons and other family members to do the necessary work as fitting. (20)
- p: 43
  v: "21"
  g: {he: m, ne: m, s: A}
  se: |
    Then, seeing the excellent brahmacārī coming toward his house from far off, he bowed, made the children bow, and gladly honoured him. (21)
  he: |
    After that, seeing the brahmacārī coming toward his house from far off, he bowed, made the children bow too, and worshipped him. (21)
  ne: |
    Meanwhile, seeing that brahmacārī coming toward his house from quite far off, the master of the house bowed humbly; he also had all the members of his household and the children bow respectfully to him, and he respectfully worshipped that unknown brahmacārī guest who had come to his house at sunset. (21)
- p: 43
  v: "22"
  g: {he: m, ne: m, s: A}
  se: |
    Then he brought him a sacrificial seat, a fine mat, water for the feet and an excellent arghya; then, when he had sipped water and was at ease, he brought the madhuparka, with a cow and calf. (22)
  he: |
    He gave the brahmacārī a sacrificial seat, a seat to sit on, water for the feet and an excellent arghya. After he had taken the water and arghya and was seated at ease, he offered him the madhuparka by means of a cow with her calf. (22)
  ne: |
    For that brahmacārī guest he provided a sacrificial seat to sit on, water for washing the feet, arghya and other proper honours; after the guest had washed his hands and feet, sipped water and sat down at ease, he also offered madhuparka mixed with honey, prepared [with milk] from his cow-goddess with her calf. (22)
- p: 44
  v: "23"
  g: {he: m, ne: m, s: B}
  se: |
    He went to his wife to have a good meal made, and that good woman directed her daughters-in-law; returning quickly, he spoke words like nectar to the sage of extraordinary appearance. (23)
  he: |
    He went to his wife and told her to prepare a fine meal; his wife gave orders to her daughters-in-law. Returning quickly, he spoke words sweet as nectar to the sage of extraordinary appearance. (23)
  ne: |
    Right after this, that good householder went inside his house and asked his fortunate wife to make an excellent meal fit for that visiting brahmacārī; his wife in turn ordered her daughters-in-law to arrange the meal quickly. Coming quickly out of the house, the householder went to that brahmacārī, whom he was seeing for the first time, and began to speak to the guest in a very sweet voice like nectar. (23)
- p: 44
  v: "24"
  g: {he: m, ne: m, s: A}
  se: |
    "As the very poor rejoice at the sight of wealth, as crops in a drought at rain, as a good man harassed [rejoices] at an enemy's defeat, so is my happiness today at seeing you." (24)
  he: |
    "As a very poor and wretched person is happy at the sight of wealth, and at a shower of wealth for him, and as a good man is happy when, having been harassed, the enemy is overpowered, so I am happy today at seeing you." (24)
  ne: |
    "Brahmacārī! The happiness that a very poor, wretched person gets from seeing plenty of wealth, that [farmers] get when fitting rain falls in a terrible drought, and that [people] get when, in a time of troubles, the troublemaker (the enemy) is calmed by some person of good character: O brahmacārī, that same unprecedented happiness I am getting today from seeing you." (24)
