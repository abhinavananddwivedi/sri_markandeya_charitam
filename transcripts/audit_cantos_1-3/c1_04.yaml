- p: 16
  v: "31"
  g: {he: m, ne: m, s: C}
  se: |
    "Hundreds of times I have heard of the two ancient sages practising austerity for a very long time; [my eyes] are fulfilled by seeing you, and my mind attains [contentment] on every side." [Lines 3–4 are imperfectly transcribed.] (31)
  he: |
    "I had heard many times that two ancient sages have been practising austerity for a long time. But now, by seeing you both, my sight has been fulfilled and my mind rejoices in this." (31)
  ne: |
    "Lord! I have often heard that two wonderful, excellent ones (named Nara and Nārāyaṇa) have been living here since endlessly ancient times, practising austerity by their own rules. I feel that you are those two great ones. Today, merely by seeing you both, these two eyes of mine are blessed, I am fulfilled, and today my mind has blossomed and is bursting with joy." (31)
- p: 16
  v: "32"
  g: {he: m, ne: m, s: B}
  se: |
    "The heavenly women, the apsarases of the dwellers in heaven, sent by Indra to destroy your austerity, met Urvaśī of the fine thighs, created from [your] thigh, and went back to their city, indignant." (32)
  he: |
    "Indra had sent apsarases from heaven to break your austerity. But Nārāyaṇa gave them a divine woman named Urvaśī, from his thigh; filled with indignation at her, they went back to their city (heaven)." (32)
  ne: |
    "I have heard that the king of the gods is always afraid of the austerities of sages. So, frightened by the austerity of you both, Indra sent Menakā and other divine apsarases to break your austerity. But Lord Nārāyaṇa brought out from his thigh a wonderful divine woman named Urvaśī and gave her to them; pained by her flawless beauty and sweetness, all the apsarases, full of indignation, took her with them and went to their city, Svargapurī." (32)
- p: 17
  v: "33"
  g: {he: m, ne: m, s: D}
  se: |
    [The Sanskrit as transcribed is largely corrupt; construable fragments:] Purandara (Indra), astonished, [honoured] ... the crest-jewel of all apsarases [Urvaśī] ... (33)
  he: |
    Thinking, "Even anger has been conquered", the astonished Indra honoured the excellent Urvaśī. From then on Urvaśī became the crest-jewel of the apsarases, that is, the very best, for she established the empire of her beauty even over Indra's heart. (33)
  ne: |
    Indra, king of the gods, had sent the apsarases to insult the sages, so that his wish would be fulfilled. But Hari, without anger, gave him Urvaśī, more matchlessly beautiful even than his apsarases. On receiving her, the king of the gods took it as his own victory; he honoured and respected Urvaśī, the divine maiden whose beauty surpassed all, made her [unclear: "भगवद्यागिणी"] in all the worlds and considered himself blessed, for she had established her empire even in the courtyard of the king of the gods' heart. (33)
- p: 17
  v: "34"
  g: {he: m, ne: m, s: C}
  se: |
    "So I have heard: the son of a daitya, proud of conquering the world, was defeated by your power, long ago, by a reed shot from a bow; and then, having praised you both, [he] pleased you again." (34)
  he: |
    "I had heard that the son of a daitya, drunk with pride at conquering the world, was defeated by the power of a reed arrow (iṣīkā) shot from a bow; afterwards he praised you both and pleased you." (34)
  ne: |
    "It is heard that the son of the daitya king had gone mad with the frenzy of conquering the world. Applying your power, you made a reed into an arrow, set it carefully on your bow and shot it; he fell, came again to take refuge with you, and praised you with undivided devotion, so that you both, melting with compassion, gladly forgave him." (34)
- p: 18
  v: "35"
  g: {he: m, ne: M, s: C}
  se: |
    "You two, shining like [suns] in the sky, abide in austerity for the peace of the whole world; [by whom are you not to be honoured?] [lines 3–4 are imperfectly transcribed]." (35)
  he: |
    "Lords! You two, peerless, are watchful for the welfare of the world. This being so, by which embodied being who desires good are you two, masses of radiance, not to be honoured? That is, you are honoured by all." (35)
  ne: |
    "Lord! You two, who bear the form of God before our eyes, remain constantly watchful through your matchless austerity for the welfare of the whole world. O Lord, single mass of all radiance! You two [are honoured] by [all] embodied beings in the world who desire their own rise for the good of the world [the Hindi as transcribed reads "सम्माननीय नहीं हैं", "are not honoured"; the rhetorical question of the verse is evidently meant]." (35)
- p: 18
  v: "36"
  g: {he: m, ne: m, s: D}
  se: |
    [The Sanskrit as transcribed is largely corrupt; construable fragment:] "Again and again I seek your favour for my own rise ..." (36)
  he: |
    "It is a matter of great joy that I have come to know you. Today I rejoice only for the sake of my later life (my deliverance). You two are all-knowing; so take me as one to be instructed on the path of [worldly] conduct." (36)
  ne: |
    "Lord! It is a matter of great joy that today I am fulfilled by your grace. Now I feel very assured and happy about my future rise. You are wholly all-knowing and all-capable; so you will surely be kind enough to guide me, an ignorant person, on the proper way in worldly conduct, discernment and the like." (36)
- p: 19
  v: "37"
  g: {he: OK, ne: m, s: C}
  se: |
    "I have nowhere understood place and time, nor have I discerned my direction; nor have I gained even a little power here. Therefore I take refuge with you two, to be taught." (37)
  he: |
    "I have no knowledge of place and time, nor have I been able to settle my direction. I have gained no power on this earth either; so I take refuge with you for the sake of knowledge." (37)
  ne: |
    "Lord! Ignorant as I am, I have not the least knowledge of the conditions of the present place and time, nor have I been able to think clearly (definitely) about the outlook for my coming life. Lord! I have not gained even a little power on this earth; so, to remove all my ignorance, I come to you both for refuge and beg for enlightenment." (37)
- p: 19
  v: "38"
  g: {he: m, ne: m, s: C}
  se: |
    "The son of Hiraṇyagarbha, born of his skin, was Bhṛgu; from him was born the one named Dhātā; from him, Mṛkaṇḍu, I, who have come to you two, seek your favour and greet you, my teachers." (38)
  he: |
    "Bhṛgu was the son born from the skin of Brahmā Hiraṇyagarbha; to him was born a son named Dhātā. I am Mṛkaṇḍu, the son of Dhātā, [nephew] of his brother Vidhātā. I, that same Mṛkaṇḍu, seek to please and greet you, the two excellent teachers." (38)
  ne: |
    "From the skin of that creator, Brahmā Hiraṇyagarbha, Maharṣi Bhṛgu was born; he had two sons named Dhātā and Vidhātā. I, Mṛkaṇḍu, son of that Dhātā, bow to you two most revered divine ones and pray that you gladly show me your favour." (38)
- p: 20
  v: "39"
  g: {he: OK, ne: m, s: B}
  se: |
    Having heard and taken in his praise, the two, pleased by his guileless devotion, then spoke to him the highest teaching for his good fortune [here and hereafter]. (39)
  he: |
    Hearing the praise made by Mṛkaṇḍu and pleased by his guileless devotion, the two began to speak to him, giving excellent teaching for good fortune in this world and the next. (39)
  ne: |
    When Maharṣi Mṛkaṇḍu had praised them with faith and guileless devotion, those two excellent sages became very pleased with his most noble devotion, and, through their unbroken grace, began to speak, giving him very beneficial teaching that would bring welfare and rise in this world and the next. (39)
- p: 20
  v: "40"
  g: {he: OK, ne: m, s: A}
  se: |
    "Always speak the truth; practise dharma; let there be no pause in your study; be devoted to your teacher, and regard your father as a god. Always be so, my son, in your own conduct." (40)
  he: |
    "Always speak the truth; practise dharma; let there never be a pause (break) in your study. Son! See divinity in the teacher who shows you the good path, and in your mother and father." (40)
  ne: |
    "Child! Remain always devoted to speaking the truth; keep following your own dharma as laid down in the Vedas and śāstras; never let any break come in your study of the six Vedas (let there be no hindrance to your study); and remain always faithful to your elders and your honoured, revered mother and father, regarding them as gods. By this excellent path you will have constant and great welfare." (40)
