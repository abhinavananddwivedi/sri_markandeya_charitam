- p: 26
  v: "51"
  g: {he: m, ne: m, s: C}
  se: |
    Recalling her virtues, the great sage, his voice choked, his hair long standing on end [with joy], with [flowers in his joined hands held] to his heart, began to praise the river of the gods. [Partly corrupt.] (51)
  he: |
    At the remembrance of the glorious Gaṅgā's virtues, the great sage's voice choked; from excess of joy, trembling and thrilling of the hair spread through his body for a long time. Joining his flower-filled hands at his heart, he began to praise the river of the gods, Gaṅgā. (51)
  ne: |
    At the mere remembrance of the endless virtues of the goddess Gaṅgā, purifier of the whole world, the great sage Mṛkaṇḍu's voice suddenly choked; from the excess of joy every hair on his body stood up (thrilled); taking heaps of flowers in both hands and holding them to his heart, he began to praise the supreme, adorable goddess, the river of the gods, Gaṅgā. (51)
- p: 26
  v: "52"
  g: {he: m, ne: m, s: B}
  se: |
    Wishing to raise up the people who had gone to Goloka, the Lord beyond the highest, full of compassion, desired an unearthly rāsa [dance] in the gathering, to show his own form. (52)
  he: |
    At the wish of those who had gone to Goloka, the Lord beyond the highest, becoming their deliverer, wished to perform the unearthly rāsa play. He wished for the rāsa also in order to show himself. (52)
  ne: |
    The Lord beyond the highest, leader of the endless universe, overcome by the intense longing of his own people dwelling in his Goloka, wished to perform the unearthly rāsa play for their deliverance. Wishing to make his supreme nature plain, he also [unclear: "अभय किया"] to give a direct sight of his compassionate form. (52)
- p: 27
  v: "53"
  g: {he: m, ne: m, s: C}
  se: |
    "The compassion that lives in beings is heard of in scripture, but is not seen by the eye; that, [O Gaṅgā,] is seen as you, its melting form." [Partly corrupt.] (53)
  he: |
    "The compassion that is felt (perceived) in living beings can be heard of with the ears; it is not seen with the eyes. Where is the moistness [melting] of that compassion, that we should think about it further? That very compassion, unseen by the eye, is seen today as your one form melting with compassion." (53)
  ne: |
    "In all the creatures of the world there is an inner softness of heart called compassion; it usually stays unexpressed in all beings and is only heard of with the ears. It is never seen before anyone's eyes. If we think where and how that invisible heartfelt compassion exists, it seems that you, the goddess Gaṅgā, the very visible form of human kindness of heart, are yourself seen in manifest form for the welfare of the world." (53)
- p: 27
  v: "54"
  g: {he: m, ne: m, s: C}
  se: |
    "The stream of him who melted in the rāsa at the sight of Śiva, which set out for the good of the world: that is seen as you, its melting form." [Partly corrupt.] (54)
  he: |
    "In the rāsa play, the stream of water of the unearthly great Lord, melted at the sight of Śiva, became ready for the good of the world; that same stream of water is seen today as [your] melting form." (54)
  ne: |
    "When the unearthly rāsa play was going on in the Goloka of Śrī Kṛṣṇacandra, root of joy, and Lord Śambhu came in [his own] form to see the rāsa play, a wonderful trembling suddenly arose in the body of the son of the lord of Vraja for the welfare of the world, so that his whole body melted into a stream of water filled with drops of sweat. That very stream, as a melting form for the welfare of the world, is seen directly as you, the goddess Viṣṇupadī Gaṅgā." (54)
- p: 28
  v: "55"
  g: {he: M, ne: m, s: C}
  se: |
    "Seeing your melted state, Śambhu held you in his matted locks; [now, as the purifier,] that is seen as you, its melting form." [Partly corrupt.] (55)
  he: |
    "Because Lord Śiva duly holds you on his head, seeing now your melted state, you appear again as a form melting with mercy and compassion." (55)
  ne: |
    "There Lord Śiva held you on his head with great affection, so that your melted state (your ego) went away. Then again, becoming the bringer of welfare to the world, you flow on this earth to give worldly creatures happiness and joy that bring good (śiva), and so give direct sight of this form." (55)
- p: 28
  v: "56"
  g: {he: m, ne: m, s: C}
  se: |
    "[The power] of Śiva and Viṣṇu, most forbearing, won for the good of the world, held by [them], now compassionate: that is seen as you, its melting form." [Partly corrupt.] (56)
  he: |
    "For the good of the world, the most forbearing power of Śiva and Viṣṇu was obtained. Lord Śiva held you on his head and cherished you for an appointed time, and Lord Viṣṇu kept you at his feet and cherished you; so now you appear as the form of compassion." (56)
  ne: |
    "For accomplishing the welfare of the whole world, Lord Śiva held on his head that knowledge-giving goddess, the river of the gods, [who has] the utmost tolerance and power of forgiveness (which no one in the world has), and Lord Viṣṇu gave her a place at his holy feet. You yourself appear, the visible form of compassion, a mass bearing the form of the energy and compassion (forgiveness) of those two." (56)
- p: 28
  v: "57"
  g: {ne: m}
  ne: |
    [End of the commentary on verse 57, continued from page 29:] "... why are you destroying your own great divine glory by not drinking the water? Through this your stain spreads in the world. Oh! What has been lost yet? Oh! Drink the Gaṅgā water right now, very quickly, and at once obtain the fruit of liberation, and remain always faithful to the goddess Gaṅgā; this is the good message of the greatness of Gaṅgā." (57)
- p: 29
  v: "57"
  g: {he: M, ne: M, s: D}
  se: |
    [The Sanskrit as transcribed (in a long metre) is largely corrupt; construable fragments:] "... in whose mud even, the lord of the gods (Indra) suffers ... seeing [his] beloved's entreaty ... 'Ah, ah, why did you abandon the lordship of heaven ...'" (57)
  he: |
    [The Hindi as transcribed is partly garbled.] A poor man, though stuck in the mud of the water, reaching the end of his contentment, mocks Indra, king of the gods. Seeing his beloved Indrāṇī's love and her giving of peace through gentle words of entreaty, [he says]: "O Indra, why do you dim your fame by not drinking the holy water of the Gaṅgā [unclear: "अनर्वाचित"]?" (this is the rebuke); "nothing has been lost yet; drink the Gaṅgā water [unclear] and become a sharer in liberation" (this is the invitation). (57)
  ne: |
    [The commentary as transcribed is partly garbled and continues on the next sheet.] The helpless poor man, as he likes, mocks even Indra, king of the gods. He respectfully says to Indra, king of the gods, [unclear: "सरोजिनियों का सिञ्चन करते हुए"]: "O Indrāṇī! Has even Indra, king of the gods, got past his unrest only through the entreaties of his beloved Śacī and many words of entreaty in [unclear] full of tears? Oh! In time of sorrow, even today, Mahendra, king of the gods, [needs] the goddess Gaṅgā, the free-flowing ..." [continued on the next sheet] (57)
- p: 29
  v: "58"
  g: {he: m, ne: m, s: C}
  se: |
    "Even in a soundless place, with nets of sound intent on a gentle murmur, calling and calling to living beings, you constantly give them water (life) [unclear] ... I make [my life] wholly pure [in you]." [Partly corrupt.] (58)
  he: |
    "Even in a deserted land, with your sweet murmuring sounds you call living beings again and again and constantly give them life-giving water (jīvana) so that they may live. Who has ever seen, anywhere, a heart so steeped in compassion? Constantly thinking of this, O Mother, I make this birth of mine sinless by obtaining your water, moist with compassion." (58)
  ne: |
    "O Mother Gaṅgā! Even in lonely, deserted, soundless places, with your indescribable rows of sounds you call various groups of creatures to you and freely keep giving them your life (your waters) so that they may live. O Mother Gaṅgā! Has anyone anywhere seen a stream of water with a heart as moist with compassion as yours? Constantly thinking of these things, I wish to make this earthly life pure and to merge into you." (58)
- p: 31
  v: "59"
  g: {he: m, ne: m, s: C}
  se: |
    [Verse numbered ६१ in the manuscript.] "In the wheel of teaching's course, though obstacles arise to your going, you move slowly, never stopping for a moment, from steadiness and depth; making those whom the world thinks lowly pure when they come to you for refuge, you reveal to the world a mystery not known before. We take refuge at your lotus feet." [Partly corrupt.] (59)
  he: |
    "Though your motion does not stop in the wheel of spreading teaching, you came to the earth with gravity before the obstructer could obstruct, giving the message of steadiness to the multitudes of people. When one regarded as lowly in the world's eyes comes to you for refuge, you make him pure; thus you reveal an unprecedented mystery in the world. Therefore I take refuge at your lotus feet." (59)
  ne: |
    "To establish in the whole world the importance of the arising of [unclear: "मन्यु"], and to teach how to attain devotion unhindered despite various obstacles, you came to this earth, ever moving, teaching gravity and giving creatures the message to go forward. Though people are very lowly, poor and wretched in the world's eyes, you take them into your refuge, show your noble generosity, express the mystery of purity of heart and teach the lesson of holiness. So, Mother, today I take refuge at your lotus feet." (59)
- p: 31
  v: "60-62"
  g: {he: m, ne: m, s: C}
  se: |
    [Verse numbered ६२ in the manuscript.] "Self-offering by the well-born truly takes place in you alone; toward others it is plainly seen to be a formality. Leaving you, how can one meditate on a light beyond qualities? [To claim] meditation on the objectless, and to reach space there, rests on [pretence]." [Partly corrupt.] (60-62)
  he: |
    "The self-offering of good people truly happens [only in you], for offering oneself to other people is plainly seen to be a formality. Leaving you, how can one meditate on an invisible light even more without qualities? [The claim that] one gains space in the objectless seems to rest only on pretence." (60-62)
  ne: |
    "Mother Gaṅgā, support of the world! Knowing the above facts and your unprecedented capacity and power, without desire, to carry us across the ocean of worldly life, it is proper and natural to surrender everything to you alone. Offering and surrendering oneself elsewhere (to gods and men) is only a formality (a show). Mother, leaving you who have a visible form, how can one meditate on another invisible light, without qualities and without form (a blaze of light)? Those who vainly boast of seeing the form of the Supreme Brahman, full of light, without qualities and without form, are mere hypocrites." (60-62)
- p: 32
  v: "63"
  g: {he: m, ne: m, s: C}
  se: |
    Having thus placed the flowers from his hands in the stream, holding his fingertips to his head, his knees touching the ground, the excellent sage, with his mind and awakened intellect, then duly completed the praise of the goddess. [Partly corrupt.] (63)
  he: |
    Placing the flowers held in his hands in the stream of water, and pressing both knees to the earth, the excellent sage Mṛkaṇḍu praised the goddess Gaṅgā with the five limbs, with his mind and intellect. (63)
  ne: |
    Thus the great sage Mṛkaṇḍu, bringing both knees to the ground, let the handful of flowers in his two hands flow into the most holy water of Mother Gaṅgā, like [the river] Śatadru, placed both hands on his head, and completed the worship and praise of the most adorable Mother Gaṅgā. (63)
- p: 32
  v: "64-66"
  g: {he: m, s: B}
  se: |
    (64) By the son of the wise Śrī Candrabhūṣaṇa, the fortunate grandson of Baccū Rāma, this [poem], rich in the nine virtues, was woven, after bowing in his mind to the pair of feet of the good-hearted, by that good disciple of Śiva. (65) By Dharaṇīdhara, born of the heart of Dhāneśvarī, worshipper of Śiva, devoted to honouring the learned: may this poem, full of auspiciousness and good purpose, be ever victorious by the grace of Śiva and Pārvatī. (66) In the poem "The Nectar of the Life of the Long-Lived", rich in the good conduct proper to good brahmins, this first section, so named, has come to its end here by the grace of Maheśa.
  he: |
    Composed by Dharaṇīdhara, son of the learned and excellent Śrī Candrabhūṣaṇa, grandson of Śrī Bacchūrāma, born of the goddess Dhāneśvarī, good disciple of Śrī Paṇḍita Śiva Prasāda, honourer of Śiva and of the learned: having bowed to the pairs of feet of the gods and the learned, may this auspicious mahākāvya, full of good purpose, composed by Dharaṇīdhara, be victorious for many years by the grace of Śiva and Pārvatī. In this mahākāvya, "The Nectar of the Life of the Long-Lived Mārkaṇḍeya", attained through the good conduct proper to good brahmins, this first canto, so named, is complete by the grace of Lord Maheśa. (64–66)
