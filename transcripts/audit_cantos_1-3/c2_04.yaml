- p: 51
  v: "37"
  g: {he: m, ne: m, s: A}
  se: |
    "This is tasty, and this, after it, even more, fit for a brahmin to enjoy; take as you like": overcome, as it were, by such entreaty, he ate as much as he wished. (37)
  he: |
    "This is tasty; this food too is tasty and fit for a brahmin to enjoy; take according to your liking." Won over by such entreaty, the brahmacārī ate as much as he wished. (37)
  ne: |
    "Oh, this is very tasty and sweet, take it; this is even more tasty than that, you must take it; oh, 'a brahmin loves sweets', this is sweeter still, you simply have to eat it; well, take according to your own liking." Overwhelmed in this way by the very great generosity of this good householder, the brahmacārī, who did not say "no", ate his fill and felt fully satisfied. (37)
- p: 51
  v: "38"
  g: {he: M, ne: M, s: B}
  se: |
    Then at the end the sage, freeing his speech and carefully honouring his hospitality, spoke in a steady voice, glowing with strength: "[By this,] your [unclear: "दारादिनिवृत्ति"] will come about here." [Line 4 is imperfectly transcribed.] (38)
  he: |
    At the end, honouring him with words, the householder great soul, full of authority, said in a steady voice: "That very maiden will surely be your wife (dārā)." [The Hindi makes the householder the speaker; the notes make the guest the speaker.] (38)
  ne: |
    After the meal the guest sage, opening up his speech, began to speak, greatly praising the combined hospitality given by the householder sage. In his very generous, cultured speech he praised again and again the hospitality they had given and said: "This service and care you have given will become famous everywhere, far and wide." (38)
- p: 52
  v: "39"
  g: {he: m, ne: m, s: B}
  se: |
    "Can milk that tastes like this be had anywhere apart from the Kāmadhenu? Or is this rice, never tasted before, what you have offered people from [heaven] today?" [Partly unclear.] (39)
  he: |
    "Where else, apart from the Kāmadhenu in heaven, can such tasty milk be had? The rice you served, which I have never tasted before: is it fruit or grain?" (39)
  ne: |
    "Sage! It seems that, apart from the world of heaven, without the Kāmadhenu, where else could such tasty, sweet milk be had? The dish you fed me by the name of rice: should it be called rice, or is it a very sweet fruit? I have never eaten such excellent food (rice) anywhere." (39)
- p: 52
  v: "40"
  g: {he: m, ne: m, s: A}
  se: |
    "Ah, the skill of your daughters-in-law's cooking shines, surpassing [even] the fourth rank; in it the six flavours, each distinct and pleasing, are perceived, [made] with a pure mind." (40)
  he: |
    "The daughters-in-law's skill in cooking is astonishing; it shines, having passed beyond the fourth class. One can feel in it the distinct, pleasing six flavours brought out." (40)
  ne: |
    "Best of great sages! What can be said of the very complete skill of your daughters-in-law in the art of cooking? It goes beyond the first, middle and best levels of skill and reaches the fourth, still higher class. These daughters-in-law have a wonderful mastery of the art of preparing food, by which one constantly feels and tastes these six flavours (sweet, sour, salty, pungent, astringent, bitter) together; such skill is very rare elsewhere." (40)
- p: 53
  v: "41"
  g: {he: m, ne: m, s: A}
  se: |
    "Your household has wonderful power; your sons and disciples follow your direction, sage; everything succeeds by the joy of your mind. Sage, you are most modest and fortunate." (41)
  he: |
    The brahmacārī great soul Mṛkaṇḍu said: "Householder sage! Your household is endowed with wonderful power; your sons and disciples are obedient. All the work you wish for is completed; so you are more modest and fortunate [than others]." (41)
  ne: |
    Praising him, the sage Mṛkaṇḍa said to the householder sage: "Sage! The order of your household has a very remarkable power. Your sons and disciples are very disciplined and obedient; all your well-considered work is completed of itself. So, sage, you are very high-minded, approved by the good, and fortunate." (41)
- p: 53
  v: "42"
  g: {he: m, ne: m, s: A}
  se: |
    Having praised him thus, when the guest rose to rinse his mouth and went to the door, the master of the house gladly ate, duly, before his wife, the excellent food served, left over from the brahmin. (42)
  he: |
    Having praised him thus, Mṛkaṇḍu went to the door to wash his hands; then the master of the house, before his wife (with his wife), lovingly began to eat the holy food left over after the brahmin's meal. (42)
  ne: |
    Thus the sage Mṛkaṇḍa praised the meal and other arrangements of that householder sage very highly. After he had gone to the door of the house to wash his hands, the householder sage, after the brahmin guest had eaten, lovingly ate the remaining holy food, left over from the sacrifice, himself, before his dear, good wife and in her company. (42)
- p: 54
  v: "43"
  g: {he: m, ne: m, s: A}
  se: |
    His sons, having had him rinse his mouth, laid him on a good bed, as servants [would] their master; placing a pot filled with water at his head, they went off, intent on the work of the house. (43)
  he: |
    The master of the house's sons washed the great soul's hands and laid him on a good bed. Placing a pot full of water at his head, they went and busied themselves with other work of the house. (43)
  ne: |
    The householder's obedient sons, after the meal, washed his hands and feet and laid him on a good, soft, clean bed; placing a covered pot full of water at his head, and completing the task humbly, as a servant serves his master in full obedience, they busied themselves with their daily household work. (43)
- p: 54
  v: "44"
  g: {he: m, ne: m, s: A}
  se: |
    And the sage on the bed, remembering his Lord, giver of what is desired, and the Gāruḍa mantras that destroy poison, lay down at ease and, in the second watch, began to sleep. (44)
  he: |
    The great soul Mṛkaṇḍu, on the bed, remembering his Lord who fulfils his wishes, and the Gāruḍa mantras that protect from poison, got ready to sleep at ease in the second watch. (44)
  ne: |
    The visiting sage Mṛkaṇḍa too, sleeping at ease on his bedding, remembering the Lord beyond the highest who fulfils his wishes, and remembering various Gāruḍa mantras relating to the god Garuḍa, wishing for protection from poison and other dangers of the night, slept at ease in the second watch of the night. (44)
- p: 55
  v: "45"
  g: {he: m, ne: m, s: B}
  se: |
    At the end of the night he, wishing to see [it], saw in a dream his own household life, beginning with his marriage; seized by fear of ill, he got up and long meditated on Kāśī and Kukkuṭa. (45)
  he: |
    At the end of the night, that is, at dawn, he saw a dream: he saw (in the dream) his household life before his marriage. Filled with fear of something bad, as soon as he rose he meditated for a long time on Kāśī and Kukkuṭa. (45)
  ne: |
    In the last watch of the night the sage Mṛkaṇḍa saw a wonderful dream of his state after his marriage was complete; it seemed that he had already had his wedding. At this his heart shuddered with fear of something bad; he sat up at once and for a long time kept remembering the holy city of Kāśī and Kukkuṭeśvara Mahādeva. (45)
- p: 55
  v: "46"
  g: {he: m, ne: m, s: A}
  se: |
    He went to the master of the house, who was engaged in his daily rites, to ask leave to depart; bowing and respectfully reciting his gotra and so on, with joined palms, the steady one spoke these words. (46)
  he: |
    He came to the master of the house, who was engaged in his daily rites, to ask leave to set out. Bowing respectfully, naming his gotra and so on, with joined hands, that steady one said this. (46)
  ne: |
    To the householder sage, who was engaged in his daily morning rites, the noble-minded sage Mṛkaṇḍa came to ask permission to leave; reciting his gotra, he bowed humbly, joined both hands, and very steadily and humbly said these things. (46)
- p: 56
  v: "47"
  g: {he: OK, ne: m, s: A}
  se: |
    "Though I have studied, sage, I cannot by myself find a [place] fit to live in. Following the science of building, direct me; only by your command am I eager to dwell here." (47)
  he: |
    "Householder sage! Though I have studied, I am not able to search out land fit to live on. Please direct me to a place in accordance with the science of building (vāstu), for I will live only by your command." (47)
  ne: |
    "Revered householder, great sage! I have studied various kinds of learning, but I still find myself wholly unable to decide on land fit for my dwelling. So please direct me yourself to a proper place approved by the science of building, so that I can obtain a proper place to live according to your direction." (47)
- p: 56
  v: "48"
  g: {he: m, ne: m, s: A}
  se: |
    "Even the wise are always uneasy when alone, when a weighty task has come. Settle me somewhere near you, so that [I may] often consult [you], and instruct me as befits a son." (48)
  he: |
    "When a great task comes, even the wise always become uneasy when alone. So settle me somewhere nearby, for consultation again and again, and teach me as you would a son." (48)
  ne: |
    The sage Mṛkaṇḍa said: "Lord! Even if a man is very intelligent, because he is alone he finds himself wholly unable to do any big, good task. So I want you to settle me (give me a place) somewhere near, regarding me as your own son, and arrange for me to live there, giving me proper advice." (48)
