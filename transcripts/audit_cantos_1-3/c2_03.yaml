- p: 45
  v: "25"
  g: {he: m, ne: M, s: B}
  se: |
    "Joy at honouring you does not fit in my small body, nor does my sight accept any interruption of [this] beloved [vision]; O sage, now that your wonderful form has been seen, my mind, settled among the good, does not want to let go." [Line 4 partly unclear.] (25)
  he: |
    "Excellent sage! The joy born of honouring you cannot fit into my small body, nor does my sight want any interruption in seeing the one I hold dear. My mind, delighting in a sāttvika feeling, does not want to let go quickly of this wonderful sight of you." (25)
  ne: |
    "O brahmacārī! Today, having found an unprecedented brahmacārī like you, who is a wonder, joy cannot fit into this small body of mine. My gaze does not want to turn away even for a moment from the sight of so greatly desired a person as you, who came of your own accord. The intense longing to see an unprecedented person like you (the eagerness in me) does not want to give up its haste (to grow calm)." (25)
- p: 45
  v: "26"
  g: {he: m, ne: m, s: B}
  se: |
    "You have completed your studies; what have you resolved today, O teacher of knowledge, teacher of the good? Does your mind wish for renunciation, or for return home (samāvartana)? O sage, clearly settle this question." (26)
  he: |
    "Excellent sage! Teacher of knowledge, you are the teacher of the good: what have you resolved (decided) today? Does your mind want renunciation, or is it set on samāvartana? Please give a clear answer to my questions." (26)
  ne: |
    "Best of the wise! Excellent teacher even of the good! You have studied all branches of learning thoroughly; having completed your study, what is your intention (need) today? Do you want to withdraw from worldly enjoyments? Or do you want to complete samāvartana and follow the householder's dharma? Please accept my request to answer these questions of mine clearly." (26)
- p: 46
  v: "27"
  g: {he: OK, ne: OK, s: A}
  se: |
    "Where were you born? Who is your father, and what is your name? Where are you going, and what do you wish to do? Or, O lord, has Śaṅkara himself come here, wishing to show me favour?" (27)
  he: |
    "Where were you born? Who is your father? What is your name? Where are you setting out for? What do you want? Or have you, Śaṅkara himself, come to my house wishing to show me favour?" (27)
  ne: |
    "Where were you born? Who is your father? What is your good name? Where are you going? What do you want to do next? Or have you come to my house as Lord Śaṅkara himself, wishing to show me favour without cause?" (27)
- p: 46
  v: "28"
  g: {he: M, ne: m, s: A}
  se: |
    Then that brahmacārī said with a smile: "Know me, great sage, as the son of Dhātā; having studied, and truly attained the highest knowledge, [I set out] then, wishing to understand the course of the world." (28)
  he: |
    Then that brahmacārī said with a smile: "Great sage! Know me as the son of Dhātā. Wishing to know the course of the world, I have obtained all the knowledge I could." (28)
  ne: |
    Hearing this, that brahmacārī began to speak with a very natural, soft smile: "Best of great sages! Know me as the son of Śrī Dhātā. To gain a proper knowledge of the course of the world, receiving it from my revered teachers, I have thoroughly studied both the higher and the lower (the higher knowledge that brings knowledge of the self, and the lower that brings all worldly knowledge), that is, both kinds of learning, of the good (śreyas) and of the pleasant (preyas)." (28)
- p: 47
  v: "29"
  g: {he: m, ne: m, s: B}
  se: |
    "[I am] named Mṛkaṇḍu; by my father's command, wishing to settle for good, [looking for] a good place for a hut, seeing the regions of the world all around, I came to Nara and Nārāyaṇa." (29)
  he: |
    "My name is Mṛkaṇḍu. By my father's command, wishing to settle for a long time, looking for good land for a hut and travelling through those regions, I reached Nara and Nārāyaṇa." (29)
  ne: |
    "Sage! My name is Mṛkaṇḍa. By my father's command, wishing for many days to obtain land fit for my dwelling, searching for land fit to build a hut and live on, and travelling through various regions, I suddenly came near the place of Nara-Nārāyaṇa." (29)
- p: 47
  v: "30"
  g: {he: m, ne: m, s: A}
  se: |
    "But those two showed me the householder's state, which gives both enjoyment and liberation: 'Then follow the Gaṅgā; where your liking is, there you yourself will dwell.'" (30)
  he: |
    "Then those two sages directed me to the householder's stage, which gives enjoyment and liberation, and said: 'Go along the bank of the Gaṅgā; live wherever you like', and so on." (30)
  ne: |
    "But those two sages also directed me: 'Go along the bank of the goddess Gaṅgā, giver of enjoyment and liberation, who brings welfare of both kinds; wherever you find land that pleases you and suits a householder, make a house there and live.'" (30)
- p: 48
  v: "31"
  g: {he: m, ne: m, s: A}
  se: |
    "So told, I came along this road; seeing you, who match their words, I have set my mind on the work of a householder. Instruct me, brahmin; I have taken you as my teacher." (31)
  he: |
    "On being told so by those two, I came by this road. Seeing you, who fit their words, I set my mind on the householder's dharma. Teach me, for you know; I have accepted you as my teacher." (31)
  ne: |
    "On such teaching from those excellent sages, I set out on this road. Finding you, who are most fitting according to their words, I too have made up my mind to follow the householder's dharma. Now give me proper teaching, for you have full knowledge of the householder's dharma; from today I have accepted you as my revered teacher." (31)
- p: 48
  v: "32"
  g: {he: m, ne: m, s: B}
  se: |
    When he had said this and stopped, the householder sage remained long in his mind as if indifferent; then, seeing a way to it, he spoke again: "Sage, [I have] no daughter [to give] in this matter." (32)
  he: |
    When Mṛkaṇḍu, having said this, fell silent, that householder sage remained for a long time in a somewhat downcast mood. Seeing a way for him, he spoke again: "Excellent sage! By my misfortune I have no daughter." (32)
  ne: |
    When the sage Mṛkaṇḍa had said this much and fell silent, that householder sage was very downcast in his mind for some time; but then, with a view to reassuring him, he spoke again: "Sage! As it happens, by misfortune I have no daughter." (32)
- p: 49
  v: "33"
  g: {he: m, ne: m, s: A}
  se: |
    "But I shall strive so that your wish is fulfilled very soon: my friend named Mudgala has a daughter, Marudvatī, divine, like Satī." (33)
  he: |
    "After this I will try to fulfil your wish. My friend named Mudgala has a divine daughter named Marudvatī, like Satī." (33)
  ne: |
    "So be it, excellent brahmacārī! I will certainly try very soon to fulfil this wish of yours. I have a very close, dearest friend, a sage named Mudgala; he has a very divine daughter named Marudvatī, like the goddess Satī." (33)
- p: 49
  v: "34"
  g: {he: M, ne: m, s: C}
  se: |
    "[He is wealthy and able to give] dowry; he will come to you very soon. And I will now, with the brahmins, speak on [your] behalf in [arranging] your marriage." [Line 1 is imperfectly transcribed.] (34)
  he: |
    "My friend is wealthy; he will meet you soon with [unclear: "देश परिहर्त्त"] (dowry). For now, I will give my opinion, together with other brahmins, about your marriage." (34)
  ne: |
    "My friend is a most excellent person and is fully able to give you a dowry (yautuka) and the like. He will meet you soon; I will put forward my recommendation for your marriage, together with other brahmins, as soon as possible." (34)
- p: 50
  v: "35"
  g: {he: m, ne: m, s: A}
  se: |
    As he was talking, his sons, carrying water, called them to the meal; then, inside the house, he who knew the householder's duties first offered the vaiśvadeva bali. (35)
  he: |
    As they were talking thus, boys with water in their hands called them to the meal. Then the householder, inside the house, offered the vaiśvadeva bali in accordance with the householder's dharma. (35)
  ne: |
    These things were still being discussed when the householder sage's son came with a pot of water and respectfully invited them to eat. Then the householder sage went inside the house and completed the first duty, the vaiśvadeva bali, in keeping with the conduct of the householder's dharma. (35)
- p: 50
  v: "36"
  g: {he: m, ne: m, s: B}
  se: |
    Then he sat by the honoured guest and brought rice like the moon, with many vegetables and soups, and with milk dishes, kilāṭa (thickened milk) and kūrcikā (curds). (36)
  he: |
    Then, sitting near the honoured guest, rice bright as the moon was served, with many kinds of vegetables and dishes, kūrcika with dal, and milk dishes. (36)
  ne: |
    After this the householder sage sat near the guest, who had already been honoured, and served rice very white like the moon's light, with various seasonal vegetables and dal, and various rich foods such as curd, ghee, paneer and rabṛī. (36)
