- p: 57
  v: "49"
  g: {he: m, ne: m, s: A}
  se: |
    Hearing his entreaty, the great sage, much surprised, said with a smile, to enlighten him: "Do not be afraid now on seeing the forest of worldly life, hard to bear because of the wicked senses; go." (49)
  he: |
    Hearing his request, the great householder sage was surprised and, explaining again, said with a smile: "Do not be afraid now on seeing the forest of worldly life, which is hard to bear because of the wicked senses." (49)
  ne: |
    Hearing the sage Mṛkaṇḍa's pleading words, the householder sage, smiling in surprise, began to explain to him: "Child! This great forest of the world is very fearsome; living in it, a peaceful life is wholly difficult for people who have not conquered their senses. Do not be afraid on seeing this." (49)
- p: 57
  v: "50"
  g: {he: m, ne: m, s: A}
  se: |
    "You are broad-minded and have conquered the six enemies; though a boy, you shine with a pure intellect; with discernment you have served the best of the wise; therefore, child, you will live happily wherever [you go]." (50)
  he: |
    "You have a broad mind; you have conquered the six enemies, desire and the rest. Though a boy, you are endowed with a broad mind. By your discernment you have served the best people; so, child, you will live happily wherever you are." (50)
  ne: |
    "Dear child! You have a very broad mind; through your noble discipline you have won an unhindered victory over the six enemies within the body, desire and the rest. Though you still look like an ordinary boy, in wealth of intellect you are most excellent. With your good discernment you have worshipped your teachers properly; so, dear child, wherever you live, you will live a life full of happiness, peace and prosperity." (50)
- p: 58
  v: "51"
  g: {he: m, ne: m, s: A}
  se: |
    "Go, following the Gaṅgā, to the land of Dardura, together with the cow given in the madhuparka; build there a hut fit for a hermitage, and direct [people] to the flourishing of the path of action." (51)
  he: |
    "With the cow I gave you in the madhuparka, follow the Gaṅgā; build a hut fit for a hermitage in the land of Dardura (Dardī), and direct [people] in the flourishing of the path of action." (51)
  ne: |
    "Now I have given you the cow for making the madhuparka and so on; taking it, follow this same Gaṅgā from here and go to the Dardara region (now Dardī, a town in Ballia district on the bank of the Gaṅgā). There, for the flourishing and spread of the path of action, build a hut and live there, and keep developing and spreading it." So he directed. (51)
- p: 58
  v: "52"
  g: {he: m, ne: m, s: A}
  se: |
    "You came alone at evening as a guest; today, with the cow and calf, you have become three. In a few days, my mind hurries to see you with your wife." (52)
  he: |
    "You came alone to me in the evening as a guest; I gave you madhuparka by means of a cow with her calf, so that you are no longer alone but have now become three. My mind is impatient to see you, some days from now, with your wife." (52)
  ne: |
    "Dear one! Yesterday evening you came here alone as a guest; today, with this cow given to you for the madhuparka together with her calf, you have become three creatures. Now I am very eager to see you, in a few days, with your future wife." (52)
- p: 59
  v: "53"
  g: {he: m, ne: m, s: B}
  se: |
    Having thus instructed him in what would help him, the famed householder sage performed his daily rites; and then, with his leave, the excellent brahmacārī too duly set out along the road by the Gaṅgā. (53)
  he: |
    That famed householder sage, having explained thus about the help [he would give], began his daily rites. In due course the brahmacārī too, eager to go, followed the road by the Gaṅgā. (53)
  ne: |
    That very famous ascetic, the householder sage, explained things well to the sage Mṛkaṇḍa, gave him proper directions for the welfare of the world and for spreading the path of action, and completed his daily morning rites. And the visiting sage Mṛkaṇḍa, devoted to his goal, wishing to go, followed the Gaṅgā road shown by the householder sage and began his journey with the cow and her calf. (53)
- p: 59
  v: "54"
  g: {he: m, ne: m, s: A}
  se: |
    Thinking the advice he had been given right, and bowing at his feet, gladdened by his blessing, he took the cow with her calf and set out to go to the tīrtha of Dardura. (54)
  he: |
    Considering it just, he gave him advice and greeted him with his blessings. The brahmacārī bowed at his feet and set out for the tīrtha of Dardura (Dardarī). (54)
  ne: |
    Thus that householder sage rightly gave good advice to the sage Mṛkaṇḍa and also greeted him with blessings; the sage Mṛkaṇḍa bowed at his feet, took the cow and her calf with him and at once set out to go to the tīrtha region of Dardura. (54)
- p: 60
  v: "55-57"
  g: {he: m, s: A}
  se: |
    (55) By the son of the wise Śrī Candrabhūṣaṇa, the fortunate grandson of Baccū Rāma, this [poem], rich in the nine virtues, was woven, after bowing in his mind to the pair of feet of the good-hearted, by that good disciple of Śiva. (56) By Dharaṇīdhara, born of the heart of Dhāneśvarī, worshipper of Śiva, devoted to honouring the learned: may this poem, full of auspiciousness and good purpose, be victorious for endless years by the grace of Śiva and Pārvatī. (57) In the poem "The Nectar of the Life of the Long-Lived", rich in the good conduct proper to good brahmins, this delightful second canto too has come to its end here by the grace of Maheśa.
  he: |
    (Note: for the Hindi translation of these three verses, 55–57, see page 31.) Composed by Dharaṇīdhara, son of the learned and excellent Śrī Candrabhūṣaṇa, grandson of Śrī Bacchūrāma, born of the goddess Dhāneśvarī, good disciple of Śrī Paṇḍita Śiva Prasāda, honourer of Śiva and of the learned: having bowed to the pairs of feet of the gods and the learned, may this auspicious mahākāvya, full of good purpose, composed by Dharaṇīdhara, be victorious for many years by the grace of Śiva and Pārvatī. In this mahākāvya, "The Nectar of the Life of the Long-Lived Mārkaṇḍeya", attained through the good conduct proper to good brahmins, this second canto is complete by the grace of Lord Maheśa. (55–57) (Thus the second canto of the very sweet poetic Hindi translation is complete.)
