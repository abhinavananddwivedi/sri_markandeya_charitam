- p: 75
  v: "31"
  g: {he: m, ne: m, s: A}
  se: |
    "Child, I know you: ornament of the Bhṛgu line, son of Dhātā, who has removed every fault, radiant, knower of the Vedas and of the Person, always the ornament of the soma at sacrifices." (31)
  he: |
    "Child! I know you, the ornament of the Bhṛgu line, son of Dhātā, free of all faults. By your power you know all the Vedas; you are like the sun, and a drinker of soma at sacrifices." (31)
  ne: |
    "Dear child! I know that you are the ornament of the Bhṛgu line; you are the good son of Maharṣi Dhātā, wholly faultless and always far from faults. With your intense mass of light you strengthen even the radiance of Lord Bhāskara, and you are always the best even among those who keep the vows of soma-drinking; that is, you have the highest place among excellent soma-drinkers." (31)
- p: 76
  v: "32"
  g: {he: m, ne: m, s: A}
  se: |
    "Your appearance truly tells, wonderfully, all your wishes. Are you Mṛkaṇḍu, son of Dhātā? So you seem; still, tell me quickly." (32)
  he: |
    "Your very appearance expresses a wonderful sāttvika feeling and all your wishes. Are you Mṛkaṇḍu, son of Dhātā? Quickly say everything plainly." (32)
  ne: |
    "Dear child! Your form itself shows your radiant vigour, and at the same time all the wishes in your heart are clearly visible to us. You are Mṛkaṇḍa, the good son of Maharṣi Dhātā, are you not? Please be so kind as to say all these things plainly." (32)
- p: 76
  v: "33"
  g: {he: m, ne: m, s: B}
  se: |
    Hearing the words of this one, who grasped knowledge born of time, past, future and present, [Mṛkaṇḍu,] amazed, named himself and spoke of his ancestors and their good conduct. (33)
  he: |
    Hearing his words, which gathered up knowledge of past, future and present, born of time, Mṛkaṇḍu was amazed and began to speak words befitting the virtues of his ancestors. (33)
  ne: |
    The sage Mṛkaṇḍu, hearing all that Maharṣi Parāśara said through his knowledge of past, future and present (what happens in all three times), that is, through Maharṣi Parāśara's knowledge of the three times, was very amazed; and on hearing the excellent virtues and glory of his own ancestors he became more amazed still. (33)
- p: 77
  v: "34"
  g: {he: m, ne: m, s: A}
  se: |
    He replied: "Knower of all, what is hidden from your mind, that I should tell it? Yet, having received your command, it is said to you out of affection, though you have learned it already." (34)
  he: |
    Maharṣi Mṛkaṇḍu said: "Knower of all! Nothing is hidden from your mind that I should say it. But having received your command I am speaking, because you have great affection for me." (34)
  ne: |
    Hearing the above words of Maharṣi Parāśara, the sage Mṛkaṇḍu began to say: "Maharṣi! What thing or matter of this world is there, given your intellect and knowledge of the three times? What is hidden from you? But having received this order of yours I speak, because you have such great love and affection for me." (34)
- p: 77
  v: "35"
  g: {he: m, ne: m, s: A}
  se: |
    "Father, what you say is just so; everything has been confirmed by you. I am he. I will not abandon gratitude as long as I live; so I say again." (35)
  he: |
    "Father! What you are saying about me is all just so, as you have confirmed. I am that one; but I cannot forget my gratitude as long as I live; this I say again." (35)
  ne: |
    "Revered one! All that you say about me, knowing it as it is, is exactly so, as you yourself have confirmed. Lord! I really am that one. Could I forget my gratitude to you all my life? Even so, placing your command on my head, I am saying what I have to say." (35)
- p: 78
  v: "36"
  g: {he: m, ne: m, s: B}
  se: |
    "Taught by the great sage Nara, and seen on the way by the southerner (Dākṣi), know me to have come to you, intent on taking up that path of action and to join myself to it." (36)
  he: |
    "What the sage Nārada [the Sanskrit has "नारेण", by Nara, the sage of canto 1] explained, and what Dākṣi explained on the way: know that I have come to you wishing to further the path of action; appoint me [to it]." (36)
  ne: |
    "Lord! What the most revered Maharṣi Nārada [cf. the Sanskrit "नारेण", Nara] told me, and what the sage Dākṣi again urged me to carry out on the road as I came, I want to join myself again to that same path of action for its full rise. So understand that I have come to you only for the growth of that path." (36)
- p: 78
  v: "37"
  g: {he: m, ne: m, s: A}
  se: |
    "Direct me to a fitting hermitage there, pleasing to me; and teach me well, Lord, how my wish may come to fulfilment." (37)
  he: |
    "Direct me where I should build a fitting hermitage for my own comfort. Tell me also how my wish will be fulfilled." (37)
  ne: |
    "So, Maharṣi, please tell me the proper place where I should make my dwelling, to live at ease while doing my work, and please also tell me how this work of mine will be completed, and such things." (37)
- p: 79
  v: "38"
  g: {he: OK, ne: m, s: C}
  se: |
    "From which king should [land] be asked? From where [should] the materials be gathered? And how would workmen, by their labour, eagerly do my work?" [Partly corrupt.] (38)
  ne: |
    The sage Mṛkaṇḍu very humbly asked: "Lord! Please tell me which king I should go to and ask for land fit to build a house on; where the other materials for building that house should be gathered from; and how craftsmen will be able to do my work well and eagerly without payment (wages)." (38)
- p: 79
  v: "39"
  g: {he: m, ne: m, s: A}
  se: |
    When the sage had said this and fallen silent, Parāśara, his face lovely as the moon, gladdening his own [visitor] with tender speech, spoke with a smile to that brahmin. (39)
  he: |
    As soon as Maharṣi Mṛkaṇḍu fell silent after saying this, Maharṣi Parāśara, whose face was lovely as the moon, gladdening him with his tender speech, spoke with a smile. (39)
  ne: |
    As soon as the sage Mṛkaṇḍu, having humbly said this much, fell silent, Maharṣi Parāśara, whose lotus face was in full bloom, began to speak with a smile, in a very loving, generous, sweet and tender voice, to that brahmin sage Mṛkaṇḍu who had come. (39)
- p: 80
  v: "40"
  g: {he: m, ne: m, s: A}
  se: |
    "Coming to me first, consulting me, you were ready for my instruction; since you have shown me reverence, honoured one, by that you are of good qualities and worthy." (40)
  he: |
    "Child! You first came to me and consulted me, and then asked me to give directions. Since you have honoured me by showing my worthiness of reverence, I understand your fitness fully." (40)
  ne: |
    "Dear child! Coming here first, you praised me, consulted me and asked to receive proper directions from me; from the honour you have shown here to my worthiness and seniority, I understand well your fitness in action." (40)
- p: 80
  v: "41"
  g: {he: OK, ne: m, s: A}
  se: |
    "Do not ask King Priyavrata, and do not worry about the materials either; craftsmen will do your work well, as the works of a brahmin [are done], without wages." (41)
  ne: |
    "Dear one! The whole kingdom of this region belongs to King Priyavrata, but you need not go and ask him for land; nor will you have to worry about the various materials for building a house; for capable people, each skilled in his own work, will do it themselves, because all the work of a brahmin is done without any payment." (41)
- p: 81
  v: "42"
  g: {he: m, ne: m, s: A}
  se: |
    "Excellent brahmins, here, whatever they desire in their minds attains fulfilment; by this the people of Bhārata here eagerly do it, to bring it to you." (42)
  he: |
    "There is power of fulfilment in the speech of brahmins; whatever you have wished in your mind, all the people of Bhārata will bring before you." (42)
  ne: |
    "The speech of generous, high-minded, excellent brahmins is fulfilled of itself; whatever things they imagine in their minds, the people living in this land provide them of their own accord. It has been the special quality of the people of this land of Bhāratavarṣa that, at the mere imagining of brahmins, all the work they hold dear is completed of itself." (42)
- p: 81
  v: "43"
  g: {he: OK, ne: OK, s: A}
  se: |
    "As much land as is needed, and whatever implements [are needed] now, the people who follow my direction will bring them to you." (43)
- p: 82
  v: "44"
  g: {he: m, ne: m, s: B}
  se: |
    "Go quickly, child, to the land of Dardura; all you desire will come to be. Mudgala too will soon come to you, to give his own daughter." (44)
  he: |
    "Child! Set out quickly for Dardura; all your wishes will be fulfilled. Mudgala too will come to you very soon, to give his daughter." (44)
  ne: |
    "Dear child! Now set out at once (quickly) for the Dardura region; as soon as you get there, all the wishes in your mind will be fulfilled; and the sage Mudgala too will certainly come at once to meet you, to have his daughter's marriage performed." (44)
