- p: 82
  v: "45"
  g: {he: m, ne: m, s: B}
  se: |
    "I am the one here to speak [the rites] in your taking of a wife; I know the lagna (auspicious moment), full of great joy. I too have regard for you as you will be, since you go on by taking up [the path of] action." (45)
  he: |
    "In your marriage I myself am the one who speaks the marriage rite, for I know the whole lagna (auspicious timing) of this marriage. You are a follower of the path of action, so I too have regard for you." (45)
  ne: |
    "Dear child! Having understood everything from the lagna of this present time, I tell you that I myself am the officiant (the arranger, the wedding paṇḍit) of your coming marriage. I also respect your coming marriage, because you too wish to conduct yourself according to the path of action." (45)
- p: 83
  v: "46"
  g: {he: m, ne: m, s: B}
  se: |
    "This one, born in the Āṅgirasa gotra, will be your helper at every step; skilled in all work, he will now carry out [the building of] the hermitage, following your wishes." (46)
  he: |
    "I am giving you this man of the Āṅgirasa gotra to help you. He is hard-working, so he will now build the hermitage in keeping with your wishes." (46)
  ne: |
    "I am giving you, for your support, this distinguished person born in the Āṅgirasa gotra, because he is fully able to give you proper help. This man is skilled in his work and fully hard-working; he will have the hermitage built as you conceive it, just as you wish." (46)
- p: 83
  v: "47"
  g: {he: m, ne: m, s: A}
  se: |
    "Tomorrow, now as it were, let him go there with this cow and her calf that were given; may the Lord fully fulfil your every wish, by my blessing." (47)
  he: |
    "Tomorrow let him go there with the cow and her calf offered in the madhuparka. May the Lord fulfil all your wishes; this is my blessing." (47)
  ne: |
    "Tomorrow, with this cow and her calf given by me, take this same Āṅgirasa sage with you and go to the place Dardura; there the Lord will fulfil all your wishes. This is my heartfelt wish and full blessing." (47)
- p: 84
  v: "48"
  g: {he: m, ne: m, s: C}
  se: |
    When the great sage Parāśara had spoken these good words thus, [Mṛkaṇḍu,] very glad of mind, settled gratitude in his heart, modestly, with his own heart [unclear]. [Partly corrupt.] (48)
  he: |
    When the sage Parāśara had said such fine words, the great soul Mṛkaṇḍu, glad of mind [the Hindi as transcribed reads "विद्या प्रसन्न"] and with unblinking, wide-eyed wonder, expressed his gratitude to him from his modest heart. (48)
  ne: |
    Thus, hearing the very generous, very powerful, excellent words of Maharṣi Parāśara, the generous-hearted sage Mṛkaṇḍu, very glad of mind, expressed his gratitude with unblinking eyes and warmly thanked him. (48)
- p: 84
  v: "49"
  g: {he: m, ne: m, s: A}
  se: |
    And having found [his] mind free of guile, he spoke sweetly, in a tuneful voice: "Noble one, where your kindness falls, and your full gaze, what more is there to say of that?" (49)
  he: |
    Having received the great sage's sweet, tuneful words and his guileless, clear mind, he said: "Noble one! Where your kind gaze falls, what need is there to speak of it?" (49)
  ne: |
    Constantly reflecting in his heart on the very charming, guileless and fully generous nature of Maharṣi Parāśara, with his very sweet voice, the sage Mṛkaṇḍu said: "Lord, where the gaze of your full kindness falls, what can be said of that place? That is, what is not possible through your favour?" (49)
- p: 85
  v: "50"
  g: {he: OK, ne: m, s: B}
  se: |
    "If you had had no such feeling for one like me, unknown to you, how would [my] intention reach fulfilment? Now I respectfully take refuge at your lotus feet." (50)
  ne: |
    The sage Mṛkaṇḍu began to say humbly: "Lord! If you had not had this generous, compassionate feeling toward an unknown, poor person like me, how could my wishes have been fulfilled? I am wholly grateful; now, [taking refuge at] your lotus feet with my whole self, I consider myself fulfilled." (50)
- p: 85
  v: "51"
  g: {he: m, ne: m, s: A}
  se: |
    "And the sage born of the Āṅgirasa line whom you have given me as companion will, like a wish-granting tree, having received your direction, fulfil what I seek." (51)
  he: |
    "You have given me this sage, the ornament of the Āṅgirasa line, as my companion; having received your direction, he will fulfil my wish like a wish-granting tree." (51)
  ne: |
    "Maharṣi! The excellent sage born in the high line of the sage Āṅgirasa, whom you have also ordered to go with me to help me, will himself, like a wish-granting tree, obeying your commands, certainly fulfil all my wishes completely." (51)
- p: 86
  v: "52"
  g: {he: M, ne: M, s: C}
  se: |
    Having spoken thus, he went to cleanse himself, bowed gladly, his body thrilling and his mind on his own task; full of many thoughts, absorbed [unclear], his enjoyment of comfort gone, he slowly passed the night in sleep. [Partly corrupt.] (52)
  he: |
    [The Hindi as transcribed is partly garbled.] Thus, bowed by the excellent sage Parāśara's command [unclear: "संवत्स"] (or his kindness), with joy in his trembling mind and his limbs thrilling, staying awake, absorbed in reflecting on obtaining a fine hermitage for himself, free of fear, the sage Mṛkaṇḍu passed the night like everyone else (was glad to lie down). (52)
  ne: |
    Thus, respectfully bowing his head to the wish-fulfilling, delightful words of the excellent sage Parāśara, the sage Mṛkaṇḍu, his body thrilling and his hair standing on end, thinking with affection, spent the whole night with sleepy eyes. Constantly thinking over in his mind the various things Maharṣi Parāśara had said, and ever sinking and rising in the feeling of attaining his wishes, the sage Mṛkaṇḍu, with a calm mind [unclear: "विस्मृति"], passed the whole long night as if it were a moment. (52)
- p: 86
  v: "53-55"
  g: {he: M, s: D}
  se: |
    [The Sanskrit of this colophon triad is corrupt as transcribed. It is the same triad as on pages 32 and 60, where it reads, in short: (53) composed by the son of Śrī Candrabhūṣaṇa, grandson of Baccū Rāma, disciple of Śiva, after bowing to the feet of the good; (54) by Dharaṇīdhara, son of Dhāneśvarī, worshipper of Śiva: may this auspicious poem be victorious by the grace of Śiva and Pārvatī; (55) in "The Nectar of the Life of the Long-Lived", this third canto has come to its end. Re-reading from the scan is recommended.]
  he: |
    Note: for the meaning of verses 53–55, please see page 32. Here the third canto is complete.
