- p: 10
  v: "19"
  shlok: |
    तयोश्च यज्ञे सुतयाः स्वरोचिषा
    मृकण्डुनामा मुनिरूर्जितप्रभः ।
    अधीतविद्यः परितोषितद्विजो
    गुरूननुप्रच्छ्य समावृतोऽभवत् ॥ १९ ॥
  manuscript_note: |
    वृत्त: वंशस्थ। पाद १ "यज्ञे सुतयाः" हस्तलेख के अनुसार (सम्भवतः "जज्ञे सुतया"); पाद ४ "गुरूननुप्रच्छ्य" में "प्रच्छ्य" पर अधिलेखन है। पूर्व पाठ "…मुनिरप्रतिमप्रभः / अधीत्य वेदान् परिकीर्त्यमाहलो / गृहस्थधर्मस्य समाचरेत् पदम्" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha. Pāda 1 "यज्ञे सुतयाः" follows the manuscript (probably for "जज्ञे सुतया"); in pāda 4, "प्रच्छ्य" of "गुरूननुप्रच्छ्य" is overwritten. The earlier reading ("…मुनिरप्रतिमप्रभः / अधीत्य वेदान् परिकीर्त्यमाहलो / गृहस्थधर्मस्य समाचरेत् पदम्") was wrong.
  shlok_en: |
    And from those two was born, by his own radiance, a son, the sage named Mṛkaṇḍu, of mighty splendour; having completed his learning and satisfied the twice-born, he took leave of his teachers and completed his student life (samāvartana). (19)
  translation: |
    धाता और आयती के अपनी कान्ति से महान् तपस्वी तथा वर्द्धितप्रभा सम्पन्न मृकण्डु नामक मुनि हुए। उन्होंने विद्या पढ़ी, सद्व्रत का आचरण किया, गुरुओं को प्रसन्न कर समावर्तन संस्कार से युक्त हुए ॥ १९ ॥
  notes: |
    अत्यन्त तेजोदीप्त धाता और आयती से अत्यन्त तेजस्वी एवं महान् तपस्वी, अतिशय कान्तियुक्त मृकण्ड नामक पुत्र का जन्म हुआ। उन्होंने सभी वेद-वेदाङ्गों का सम्यक् अध्ययन किया, सदाचरण का सम्यक् परिपालन किया, अपनी अपूर्व शिष्यनिष्ठा से गुरुओं की समाराधना की तथा उनकी आज्ञा से समावर्तन विधानानन्तर विद्यान्त संस्कार पूर्ण कर उनकी आज्ञा से गृहस्थ धर्म परिपालन के लिए उद्यत हो गुरुकुल से निकले। १९
  translation_en: |
    From Dhātā and Āyatī was born the sage named Mṛkaṇḍu, a great ascetic by his radiance and endowed with growing splendour. He studied, practised good vows, pleased his teachers and completed the samāvartana rite. (19)
  notes_en: |
    From the very radiant Dhātā and Āyatī a son named Mṛkaṇḍa was born, very splendid and a great ascetic, of great lustre. He studied all the Vedas and Vedāṅgas thoroughly, practised good conduct properly, worshipped his teachers with his unequalled devotion as a disciple, and, with their permission, after the samāvartana rite completed the rite marking the end of study; and, with their permission, ready to follow the householder's dharma, he left the teacher's household. (19)
- p: 10
  v: "20"
  shlok: |
    गृहाश्रमाय प्रयतो विशालधी-
    र्मनस्युदीयाय मनोरथान् बहून् ।
    स वै तदा पितुरुपदेशतो भुवं
    निवासयोग्यां विचचार मार्गितुम् ॥ २० ॥
  manuscript_note: |
    वृत्त: वंशस्थ (पाद ३ में एक लघु वर्ण अधिक, हस्तलेख के अनुसार)। पूर्व पाठ "प्रयततो विशानधी / मनस्युदीयाय मनो मयान् बहून् / स वै तदा विभुषदेशतो भुवि / निवास योग्यां विचारचार मार्गितुम्" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (pāda 3 has one extra light syllable, as written). The earlier reading ("प्रयततो विशानधी / मनस्युदीयाय मनो मयान् बहून् / स वै तदा विभुषदेशतो भुवि / निवास योग्यां विचारचार मार्गितुम्") was wrong.
  shlok_en: |
    As the broad-minded one strove toward the householder's stage, many wishes rose in his mind; then, by his father's instruction, he wandered over the earth to look for land fit to live on. (20)
  translation: |
    वे विशालबुद्धिशाली महात्मा मृकण्डु जब गृहस्थाश्रम के लिये प्रयत्नशील हुए तब उनके मन में अनेक मनोरथ उद्भूत हुए। तब उन्होंने अपने पिता के उपदेश से निवासयोग्य भूमि-अन्वेषणार्थ पृथ्वी पर भ्रमण करने लगे ॥ २० ॥
  notes: |
    अतिशय उदारचेता, मनस्वी मुनि मृकण्ड गृहस्थाश्रम के लिए जब विचार करने लगे तब उन्होंने अपने पूज्य पिता की आज्ञा से अपने योग्य (ब्राह्मणोचित) आवास निर्माण भूमि के प्राप्ति हेतु मन में अनेक विचार उठते गिरते रहे। उन्होंने सभी द्वीपों के उत्तमोत्तम स्थानों का अन्वेषण आरम्भ किया, विविध स्थानों पर जाकर निरीक्षण किया। २०
  translation_en: |
    When that broad-minded great soul Mṛkaṇḍu made efforts toward the householder's stage, many wishes arose in his mind. Then, on his father's advice, he began to travel the earth to search for land fit to live on. (20)
  notes_en: |
    When the very generous-hearted, high-minded sage Mṛkaṇḍa began to think about the householder's stage, then, at his revered father's command, many thoughts kept rising and falling in his mind about obtaining land, suitable for himself (fit for a brahmin), on which to build a dwelling. He began to search the best places in all the dvīpas, going to various places and inspecting them. (20)
- p: 11
  v: "21"
  shlok: |
    सः पुष्करद्वीपमुपेत्य निर्वृतिं
    न्यचोपलेभेऽयुतवर्षजीविनाम् ।
    हितन्नवा क्रौञ्चममन्यतात्मने
    वनैर्गिरीणामयुतैर्विराजितम् ॥ २१ ॥
  manuscript_note: |
    वृत्त: वंशस्थ। पाद २ "न्यचोपलेभे" (= नैवोपलेभे) हस्तलेख का पाठ है। पूर्व पाठ "…न्यको पालेभेऽयुतवर्षजीविनाम् / सहस्रशैलैः समनन्तशालिनो / वने विश्रामममुलेर्विराजितम्" भ्रान्त था; पाद ३ में "क्रौञ्च" स्पष्ट है।
  manuscript_note_en: |
    Metre: Vaṃśastha. Pāda 2 "न्यचोपलेभे" (= naivopalebhe) is the manuscript reading. The earlier reading ("…न्यको पालेभेऽयुतवर्षजीविनाम् / सहस्रशैलैः समनन्तशालिनो / वने विश्रामममुलेर्विराजितम्") was wrong; "क्रौञ्च" is clear in pāda 3.
  shlok_en: |
    Reaching Puṣkaradvīpa, [land] of people who live ten thousand years, he found no contentment; nor did he think Krauñca, adorned with forests and ten thousand mountains, good for himself. (21)
  translation: |
    मुनि मृकण्डु ने पुष्करद्वीप को पाकर सुखी नहीं हुए जहाँ के लोग दश हजार वर्ष तक जीवित रहते हैं। हजारों पर्वत तथा वनों से व्याप्त क्रौञ्चद्वीप को भी उन्होंने अपने लिए हितकर नहीं माना ॥ २१ ॥
  notes: |
    सर्वप्रथम उन्होंने जाकर पुष्करद्वीप का निरीक्षण किया, जहाँ के लोगों की आयु दश हजार वर्ष की होती है किन्तु उन्हें वह स्थान मनोऽनुकूल नहीं लगा और वे वहाँ से क्रौञ्च द्वीप में जाकर वहाँ के हजारों पर्वतों, घाटियों एवं अनेक सुरम्य वनों का भी अपने रहने के लिए विचार कर देखा किन्तु वह द्वीप भी उनके आवास निर्माण के लिए उपयुक्त नहीं प्रतीत हुआ। २१
  notes_en: |
    First he went and inspected Puṣkaradvīpa, where people's lifespan is ten thousand years, but the place did not suit his mind. From there he went to Krauñcadvīpa and looked over its thousands of mountains, valleys and many lovely forests too, considering them as places to live; but that dvīpa too did not seem suitable for building his dwelling. (21)
- p: 11
  v: "22"
  shlok: |
    कुशाग्रविद्धक्षतभीतिभावना-
    परः कुशद्वीपममन्यताऽशुभम् ।
    यमालये शाल्मलिकण्टकश्रुते
    न शाल्मली मोदवहोऽभवन्मुनेः ॥ २२ ॥
  manuscript_note: |
    वृत्त: वंशस्थ। पूर्व पाठ "…भीतिभाषणम् / … यमालये शाल्मलिकण्टकाकुले / न शाल्मली मोदनही बभूव मुनेः" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha. The earlier reading ("…भीतिभाषणम् / … यमालये शाल्मलिकण्टकाकुले / न शाल्मली मोदनही बभूव मुनेः") was wrong.
  shlok_en: |
    Moved by the fear of being pierced and wounded by the tips of kuśa grass, he thought Kuśadvīpa inauspicious; and since he had heard of the śālmali thorns in Yama's abode, Śālmali gave the sage no joy. (22)
