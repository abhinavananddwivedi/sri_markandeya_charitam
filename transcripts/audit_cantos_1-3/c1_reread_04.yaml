- p: 8
  v: "15"
  shlok: |
    निवासयोग्यां क्षितिमुद्धृतामसौ
    मनुं निवस्तुं प्रदिदेश सत्वरम् ।
    मनुस्तु तस्यां निजभावितोः प्रजाः
    शशास धर्मेण विधिं समर्चयन् ॥ १५ ॥
  manuscript_note: |
    वृत्त: वंशस्थ। पाद ३ का "निजभावितोः" अंश कुछ अस्पष्ट है। पूर्व पाठ "निरास योग्या क्षितियुद्धतायो / मनुं विलम्बु … मनुस्तु तत्तो निजकाममोक्षजाः / शकास लोकैन विविध समेधनाम्" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha. The part "निजभावितोः" of pāda 3 is somewhat unclear. The earlier reading ("निरास योग्या क्षितियुद्धतायो / मनुं विलम्बु … मनुस्तु तत्तो निजकाममोक्षजाः / शकास लोकैन विविध समेधनाम्") was wrong.
  shlok_en: |
    He quickly directed Manu to dwell on the earth that had been raised up and was fit to live on; and Manu, honouring the Creator, ruled with dharma the creatures he himself had brought forth on it. (15)
  translation: |
    ब्रह्मा ने निवासयोग्य पृथ्वी को जानकर शीघ्र ही उसमें निवास करने के लिए मनु को आदेश दिया। आदेश पाकर मनु ने उस पृथ्वी पर ब्रह्मा के आदर करते हुए धर्मपूर्वक उन्होंने अपनी प्रजाओं का शासन किया ॥ १५ ॥
  notes: |
    उस समय विधाता ने प्रलयकालीन अथाह जलराशि में डूबी हुई उस भूमि को आदि सूकर द्वारा निकाल कर प्रतिष्ठापित किये जाने पर, जिसके ऊपर प्राणियों का सुखद जीवन संचालित हो सके, उसे मनु को निवास करने के लिए तुरन्त आदेश दिया। मनु ने भी अपने स्रष्टा विधाता का सम्मान करते हुए अपने द्वारा समुत्पादित मानवी प्रजा को धर्मपूर्वक उत्पादन कर उसका प्रशासन करना प्रारम्भ कर दिया। १५
  translation_en: |
    Knowing the earth to be fit to live on, Brahmā quickly ordered Manu to dwell on it. Receiving the order, Manu, honouring Brahmā, ruled his creatures on that earth according to dharma. (15)
  notes_en: |
    At that time, when the Creator had brought out, through the primal boar, the land sunk in the bottomless waters of the dissolution and set it in place, so that the happy life of creatures could go on upon it, he at once ordered Manu to dwell on it. Manu too, honouring his maker the Creator, began to produce, according to dharma, the human creatures he brought forth and to govern them. (15)
- p: 8
  v: "16"
  shlok: |
    प्रियव्रतस्तस्य सुतः सतां गुरु-
    र्लघुस्तथोत्तानपदोऽभ्यजायत ।
    प्रसूतिरेवान्तरजा सुमध्यमा
    सुदेवहूतिः किल भर्तृतत्परा ॥ १६ ॥
  manuscript_note: |
    वृत्त: वंशस्थ। पूर्व पाठ "…अध्यायता / प्रसूतिदेकान्तरजा … किल यत्परागा" भ्रान्त था; पाद ४ "भर्तृतत्परा" (पतिपरायणा, अनुवाद से पुष्ट)।
  manuscript_note_en: |
    Metre: Vaṃśastha. The earlier reading ("…अध्यायता / प्रसूतिदेकान्तरजा … किल यत्परागा") was wrong; pāda 4 reads "भर्तृतत्परा" ("devoted to her husband", confirmed by the Hindi).
  shlok_en: |
    His son Priyavrata, a teacher among the good, and likewise the younger, Uttānapāda, were born; then Prasūti, born between, slender-waisted; and Devahūti, devoted to her husband. (16)
  translation: |
    उनका बड़ा पुत्र सज्जनों में श्रेष्ठ प्रियव्रत हुए, लघु पुत्र का नाम उत्तानपाद हुआ, उसके बाद प्रसूति तदनन्तर पतिपरायणा देवहूति नाम की कन्या हुई ॥ १६ ॥
  translation_en: |
    His elder son was Priyavrata, best among the good; the younger son was named Uttānapāda. After that came Prasūti, and then a daughter named Devahūti, devoted to her husband. (16)
- p: 9
  v: "17"
  shlok: |
    सुसन्ततिः कर्दमदेवहूतिजा
    बभूव या ख्यातिरिति प्रसिद्धिभाक् ।
    हिरण्यगर्भात्प्रभवाप्तलिप्सितो
    भृगुः प्रजिघ्ये स्वप्रजाविवर्धिषुः ॥ १७ ॥
  manuscript_note: |
    वृत्त: वंशस्थ। पाद ३ और ४ का पाठ कुछ अनिश्चित है ("प्रभवाप्तलिप्सितो", "प्रजिघ्ये")। पूर्व पाठ "…वदन्न या ख्यातिरिति प्रसिद्धिमान् / हिरण्यगर्भीय मुतायसो / यया प्रजाभ्यः स्वाभिमताविधिश्चुः" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha. The readings of pādas 3 and 4 ("प्रभवाप्तलिप्सितो", "प्रजिघ्ये") are somewhat uncertain. The earlier reading ("…वदन्न या ख्यातिरिति प्रसिद्धिमान् / हिरण्यगर्भीय मुतायसो / यया प्रजाभ्यः स्वाभिमताविधिश्चुः") was wrong.
  shlok_en: |
    The fine offspring born of Kardama and Devahūti became famous by the name Khyāti; Bhṛgu, born of Hiraṇyagarbha, wishing to increase his own progeny, [took her as wife]. [Lines 3–4 partly unclear.] (17)
  translation: |
    कर्दम और देवहूति से जो सन्तति हुई वह ख्याति के नाम से प्रसिद्ध हुई। ब्रह्मा से जन्म प्राप्त कर महर्षि भृगु ने अपनी प्रजा बढ़ाने की इच्छा से ख्याति के साथ विवाह किया ॥ १७ ॥
  notes: |
    महामुनि मनु ने अपनी छोटी कन्या देवहूति का विवाह सन्तति वृद्धि के लिए ऋषिप्रवर कर्दम जी के साथ किया, जिससे ख्याति नामक कन्या उत्पन्न हुई, जिसका विवाह हिरण्यगर्भ से उत्पन्न महर्षिप्रवर भृगु से हुआ, जिन्होंने विविध प्रजाओं के उत्पादनार्थ मनुकन्या ख्याति से सृष्टिक्रम की विविध विकास प्रक्रिया आरम्भ की। १७
  translation_en: |
    The offspring born of Kardama and Devahūti became famous by the name Khyāti. Maharṣi Bhṛgu, born of Brahmā, married Khyāti, wishing to increase his progeny. (17)
  notes_en: |
    For the increase of offspring, the great sage Manu married his younger daughter Devahūti to the excellent sage Kardama. From them a daughter named Khyāti was born, who was married to the excellent maharṣi Bhṛgu, born of Hiraṇyagarbha; to produce various kinds of creatures, he began with Khyāti, [grand]daughter of Manu, the varied process of developing the order of creation. (17)
- p: 9
  v: "18"
  shlok: |
    भृगुः सुतौ धातृविधातृनामका-
    वजीजनत्ख्यातगुणौ स्वकर्मतः ।
    तयोस्तु धाता प्रथमामुदूढवान्
    सतीडितां मेरुसुतामथायतीम् ॥ १८ ॥
  manuscript_note: |
    वृत्त: वंशस्थ। पूर्व पाठ "…वजीजनत्ख्यातौ गुणौ एकाकर्मतः / … सताडितां मेरुसुताममायतीम्" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha. The earlier reading ("…वजीजनत्ख्यातौ गुणौ एकाकर्मतः / … सताडितां मेरुसुताममायतीम्") was wrong.
  shlok_en: |
    Bhṛgu begot two sons, named Dhātā and Vidhātā, renowned in virtue through their deeds; of the two, Dhātā first married Āyatī, Meru's daughter, praised by the virtuous. (18)
  translation: |
    भृगु ने अपने कर्म से प्रसिद्ध गुणवाले धाता और विधाता नामक दो पुत्रों को उत्पन्न किया। उन दोनों में धाता ने सतीत्व से प्रशंसित मेरु कन्या आयती से विवाह किया ॥ १८ ॥
  notes: |
    महर्षि भृगु ने अपनी पत्नी ख्याति से उदात्त सत्कर्मों द्वारा अत्यन्त प्रसिद्धि प्राप्त धाता और विधाता नामक दो पुत्रों को उत्पन्न किया, जिनमें ज्येष्ठ पुत्र धाता ने सतियों में श्रेष्ठ प्रशंसित मेरुसुता 'आयती' से अपना विवाह किया। १८
  translation_en: |
    Bhṛgu, by his deeds, begot two sons of renowned qualities, named Dhātā and Vidhātā. Of the two, Dhātā married Āyatī, Meru's daughter, praised for her chastity. (18)
