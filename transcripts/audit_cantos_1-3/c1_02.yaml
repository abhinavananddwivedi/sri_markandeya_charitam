- p: 6
  v: "11"
  g: {he: m, ne: m, s: D}
  se: |
    Even then the creatures did not increase [the rest of the verse is too corrupt in the transcription to construe; it mentions a man and Śatarūpā]. (11)
  he: |
    Seeing no increase in the creatures, he took recourse to austerity. After that his body became two parts: from the right part Manu appeared, and from the left part Śatarūpā. (11)
  ne: |
    When his earlier effort proved insufficient for running creation on a firm footing, the Creator performed severe austerity. By the power of that austerity a man (Svāyambhuva Manu) and a woman (Śatarūpā) appeared from his body, and this opened the way for creation through sexual union. (11)
- p: 6
  v: "12"
  g: {he: m, ne: m, s: D}
  se: |
    [Only partly construable:] Svāyambhuva [Manu] ... his own skill in the work of increasing the creatures; seeing [this], the maker [rejoiced]. (12)
  he: |
    In the mind of Svāyambhuva Manu, desire (resolve) arose to increase the creatures. Seeing this skilful course of action, Brahmā was very pleased. (12)
  ne: |
    Prompted by Nature, mutual attraction and the wish for offspring awoke in the minds of that couple (Manu and Śatarūpā). Seeing the success of this natural process of producing creatures, the Creator became fully satisfied and free of worry. (12)
- p: 7
  v: "13"
  g: {he: m, ne: m, s: D}
  se: |
    [Only partly construable:] With joined palms the two [asked] their father [for their names and work] ... the lord, the Creator himself [decided]. (13)
  he: |
    Before their father, with joined hands, the two asked for their form, and for the name and duty of "patināmā" (Śatarūpā). The Creator decided. (13)
  ne: |
    Then the two, man and woman, joined both hands before their revered father, the Creator, and asked for their work and their names: "Father! What will our names be? And what will our work be?" Hearing this, the grandfather, the first creator, said: "Child! Your name will be Manu and this woman's name Śatarūpā. From now on you must carry out the new creation through union." (13)
- p: 7
  v: "14"
  g: {he: m, ne: m, s: D}
  se: |
    [Only partly construable:] Having appointed the two to the work of human creation, he thought about raising [the earth] ... [a form] came out [of him]. (14)
  he: |
    Then Brahmā, having appointed the two to the work of human creation, thought about bringing the earth out of Pātāla. After that, a great form came forth, out of his face, from the nostril. (14)
  ne: |
    Then the Creator, having ordered the couple to carry out human creation through union, became busy with the worry of where creation should take place. As Brahmā was absorbed in the means (from moment to moment) of bringing the submerged earth out of Pātāla, the form of a strange creature (a boar) appeared before him from his nostril; seeing it, he was overjoyed and fully satisfied. (14)
- p: 8
  v: "15"
  g: {he: m, ne: m, s: D}
  se: |
    [Only partly construable:] [Seeing] the earth raised and fit to dwell in, he quickly directed Manu [to it]; and Manu then [ruled] the many people. (15)
  he: |
    Seeing the earth fit to live in, Brahmā ordered Manu to dwell in it. Receiving the order, Manu, honouring Brahmā, ruled his people according to dharma. (15)
  ne: |
    At that time the Creator, in the form of the primal boar, brought out that landmass sunk in the bottomless waters of the dissolution and set it firmly in place, so that the happy life of living beings could go on upon it, and he again ordered Manu to develop it. Manu too, honouring his maker the Creator, began to produce the human creatures he had brought forth according to dharma, and to govern them. (15)
- p: 8
  v: "16"
  g: {he: OK, ne: m, s: B}
  se: |
    His son Priyavrata was the elder, a teacher among the good, and the younger was Uttānapāda; then Prasūti, born after them, slender-waisted, and Devahūti, who was indeed devoted to the highest. (16)
  he: |
    His elder son was Priyavrata, best among the good; the younger son was named Uttānapāda. After that came Prasūti, and then the youngest daughter, named Devahūti. (16)
  ne: |
    Thus, for the proper running of creation through union, the great soul Manu, through his first wife, produced an excellent eldest son named Priyavrata and a younger son named Uttānapāda. He also begot an elder daughter named Prasūti and a younger one, devoted to her husband, named Devahūti. (16)
- p: 9
  v: "17"
  g: {he: m, ne: m, s: C}
  se: |
    [Partly unclear.] The good offspring of Kardama and Devahūti was renowned as Khyāti; [a son] of Hiraṇyagarbha [married her], through whom [he produced] progeny as he wished. (17)
  he: |
    The child born of Kardama and Devahūti became famous by the name Khyāti. The maharṣi, born of Brahmā, married Khyāti with the wish to increase his progeny. (17)
  ne: |
    For the increase of progeny, the great sage Manu married his younger daughter Devahūti to the most excellent sage Kardama. From them a daughter named Khyāti was born, who was married to the great Bhṛgu, born of Hiraṇyagarbha; with Khyāti, who pleased him, he began the varied process of developing creation, to produce various kinds of creatures. (17)
- p: 9
  v: "18"
  g: {he: OK, ne: m, s: B}
  se: |
    Bhṛgu begot two sons named Dhātā and Vidhātā, renowned for their qualities [and deeds]; of the two, Dhātā married first Āyatī, daughter of Meru, praised for her virtue. (18)
  he: |
    Bhṛgu, by his deeds, begot two sons of renowned qualities, named Dhātā and Vidhātā. Of the two, Dhātā married Āyatī, Meru's daughter, praised for her chastity. (18)
  ne: |
    Through his wife Khyāti, Maharṣi Bhṛgu begot two sons named Dhātā and Vidhātā, who became very famous through their noble good deeds. Of them the elder son, Dhātā, married Āyatī, the celebrated daughter of Meru, best among chaste women. (18)
- p: 10
  v: "19"
  g: {he: m, ne: m, s: B}
  se: |
    From those two was born, by his own radiance, the sage named Mṛkaṇḍu, of matchless splendour; having studied the Vedas and [pleased his teachers], he set foot on the path of the householder's dharma. (19)
  he: |
    From Dhātā and Āyatī was born the sage named Mṛkaṇḍu, a great ascetic by his radiance. He studied, took on the form of a good householder, pleased his teachers, and completed the samāvartana rite. (19)
  ne: |
    A son named Mṛkaṇḍu was born, very radiant and a great ascetic, of boundless splendour. He studied all the Vedas and Vedāṅgas thoroughly, observed good conduct properly, worshipped his teachers with his wonderful learning, and, with their permission, performed the samāvartana and completed the Vedānta rite; with their leave he left the teacher's household, ready to follow the householder's dharma. (19)
- p: 10
  v: "20"
  g: {he: m, ne: m, s: C}
  se: |
    As he strove toward the householder's stage, many wishes arose in his mind; then, by [his father's] instruction, he set out on earth to search for a place fit to live in. (20)
  he: |
    When he made efforts toward the householder's stage, many wishes arose in his mind. Then, on his father's advice, he began to travel the earth to search for land fit to live on. (20)
  ne: |
    When the very generous-hearted, high-minded sage Mṛkaṇḍu began to think about the householder's stage, many thoughts kept arising in his mind, at his revered father's command, about obtaining land suitable for himself (for building a dwelling fit for life). He searched out the best places in all the dvīpas, going to various places and inspecting them. (20)
