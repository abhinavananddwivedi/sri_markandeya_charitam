- p: 33
  v: "1"
  g: {he: m, ne: m, s: A}
  se: |
    Then, having crossed with difficulty the snow-covered mountain on the bank of the Gaṅgā, like an autumn cloud, he went to level ground; seeing it, joy arose in him. (1)
  he: |
    After that, the sage Mṛkaṇḍu [the Hindi as transcribed reads "शुकण्ड" here and in vv. 1–2] crossed with great difficulty the snow-covered mountain on the bank of the Gaṅgā, white like an autumn cloud, and was glad on seeing the level ground. (1)
  ne: |
    After his praise of the goddess, the river of the gods, the sage Mṛkaṇḍu crossed with great difficulty the forest near the mountain ranges, decked with masses of very white snow, very white like autumn, clear like rows of clouds. Gradually reaching the level land, he saw its charming beauty, and his mind filled with joy. (1)
- p: 33
  v: "2"
  g: {he: m, ne: m, s: A}
  se: |
    On the sandy bank of the river of the gods, the sage saw a pair of cakravāka birds long moving together, bound in union, and he pondered their love, which was itself unearthly. (2)
  he: |
    The great soul Mṛkaṇḍu saw on the sandy bank of the Gaṅgā a pair of cakravāka birds that had long been wandering there, and he contemplated their unearthly love, bound in the feeling of being a pair. (2)
  ne: |
    As soon as he reached the level land, the great soul Mṛkaṇḍu saw, on the holy bank of the goddess Gaṅgā with its very clean white sand, a pair of cakravākas: the male, attached in love to his beloved, had been wandering with her for many days in a state of self-forgetfulness. He felt the intensity of their love as a pair, and a wonderful idea of unearthly, divine love arose in his mind. (2)
- p: 34
  v: "3"
  g: {he: m, ne: m, s: A}
  se: |
    Likewise, the pair floating in the middle of the water filled him with wonder as they sank and rose; he reflected that these [are] people in the ocean of worldly life, and on [their] birth and death too. (3)
  he: |
    In the same way, seeing them floating in the middle of the water and sinking under the gusts of strong wind, he was amazed. Then he reflected on the birth and death of people in the ocean of worldly life. (3)
  ne: |
    The two kept sinking and rising in the very bright waters of the goddess Gaṅgā in the course of their natural water play. Seeing this, the sage Mṛkaṇḍu was very amazed, and he also reflected on the worldly birth and death of people who keep diving, sinking and rising in this wheel of worldly life. (3)
- p: 34
  v: "4"
  g: {he: m, ne: m, s: A}
  se: |
    Somewhere, seeing a heron with closed eyes, dark at heart yet very white outside, he deemed contemptible the hypocrite who is set on his own ends under a pretext. (4)
  he: |
    Somewhere he saw a heron with closed eyes, black inside and white outside. Then he concluded that hypocritical people, firmly set on accomplishing their own ends under a pretext, are just like this. (4)
  ne: |
    He also saw a row of herons, by their nature with eyes closed in one place and open in another, impure of heart, ever alert to their target, outwardly bearing very white bodies but inwardly very eager and violent toward fish. Seeing them, the idea came into his mind how much hypocrisy this world creates to gain its ends and how firmly it stays engaged in serving itself; so he thought in his mind. (4)
- p: 35
  v: "5"
  g: {he: m, ne: m, s: B}
  se: |
    He saw the sāras cranes on both banks, crying with hunger, flatterers, like belly-fillers who, though [repulsed], wait respectfully at the door of a rich man. (5)
  he: |
    Again, on both banks of the Gaṅgā, he saw flattering sāras birds, crying out in distress from hunger, like belly-fillers (gluttons) who stand respectfully at the doors of rich men who scorn them, speaking sweetly. (5)
  ne: |
    Seeing the sāras birds, very distressed by hunger, chattering on both banks of the Gaṅgā, it seemed that they were only praising the goddess Gaṅgā to satisfy their hunger; just as, at the door of some very prosperous and wealthy person, people devoted to filling their bellies (gluttons) do not think of leaving even when driven away again and again. (5)
- p: 35
  v: "6"
  g: {he: m, ne: m, s: B}
  se: |
    He saw a cluster of lotuses again and again disturbed by herons, ignorant of them, with untimely tāṇḍava dances, like the circle of a king's good ministers repeatedly defeated by groups of bad ministers. (6)
  he: |
    Again he saw clusters of lotuses scorned by herons engaged in an untimely tāṇḍava dance and ignorant of the lotus's excellence, like the good ministers of kings repeatedly harassed by bad ministers. (6)
  ne: |
    Then the sage Mṛkaṇḍu also saw those foolish herons (a row of herons), who could not judge merit and fault, by whom the very lovely, charming lotus, playing with soft laughter, was again and again insulted and scorned in various ways because they did not know her fragrance, sweetness and beauty; just as, in a king's council, the bad influence of crooked, impure, undiscerning ministers falls, or is brought to bear, again and again even on excellent, noble, high-minded ministers. (6)
- p: 36
  v: "7"
  g: {he: m, ne: m, s: B}
  se: |
    Somewhere he saw a night lotus, her mind pained at the sight of the sun, her slender stalk worn by the herons' stirring, standing with jealousy because her husband [the moon] was dull. (7)
  he: |
    Again, somewhere he saw the night lotus (kumudvatī), her mind afflicted at seeing the sun, her leaves worn and torn by the herons' stirring, standing in jealousy because her husband had become dull (lustreless). (7)
  ne: |
    Then the sage Mṛkaṇḍu also saw a row of night-lotus (koī) flowers, crushed again and again by the constant trampling of the foolish herons, and lying very faint and limp at the sight of the sharp rays of Lord Bhāskara; because their husband the moon had become waned and lustreless, they lay senseless, very dim and full of jealousy. (7)
- p: 36
  v: "8"
  g: {he: OK, ne: m, s: A}
  se: |
    Somewhere, in masses of water that had left the stream and lay in hollows, he saw a lotus plant in full bloom, of wonderful splendour, covered with fine leaves like emeralds. (8)
  he: |
    Again he saw, in the water standing in a hollow, having left the stream, a blooming lotus plant of wonderful splendour, covered with lovely leaves like emeralds. (8)
  ne: |
    Also, in places, where water had collected in small hollows, separated from the main stream, the sage Mṛkaṇḍu looked with great delight at the charming, delicate, blooming lotus plants in them, with green leaves of unequalled divine beauty that outshone even green emeralds of rare splendour. (8)
- p: 37
  v: "9"
  g: {he: m, ne: m, s: B}
  se: |
    Somewhere [he saw] rows of fields with their dykes, rich in crops, delighting the farmers, about to bear fruit, like a bride adorned to please her husband [the third line is imperfectly transcribed]. (9)
  he: |
    Somewhere he saw rows of fields with their dykes, waving with grain, giving delight to the farmers, about to bear fruit (with ears of grain), like a pregnant new bride covered in clothes for her husband's joy. (9)
  ne: |
    On this level land the sage Mṛkaṇḍu also saw endless rows of the farmers' fields, divided into small plots, in which crops waving with grain and swaying with ears, giving the farmers great joy, had charmed the farmers' minds. It seemed as if some brand-new, beautiful bride, covered in green clothes, were trying to draw her husband's mind toward herself. (9)
- p: 37
  v: "10"
  g: {he: m, ne: m, s: A}
  se: |
    Seeing a herd of cows that had grazed on green shoots of grass by day, drunk the Gaṅgā's water and were turning homeward, he was content, and thought a dwelling place was near. (10)
  he: |
    Seeing a herd of cows, which had grazed on green grass in the day and drunk Gaṅgā water and were ready to go home, he was very happy and concluded that there must surely be a village nearby. (10)
  ne: |
    Seeing a herd of cows that had grazed all day on the green grass of the Gaṅgā's bank and, at evening, had drunk the holy, clear water of the most purifying goddess Gaṅgā, and were eager to go to their dwelling, the sage was very pleased, and also understood that there was likely some settlement (village) close by. (10)
- p: 38
  v: "11"
  g: {he: m, ne: m, s: A}
  se: |
    Somewhere he saw a lotus plant, lovely with the humming of rows of bees, covered with a garment of green moss, as if made to dance by the stream of water, swelling and raised up. (11)
  he: |
    Somewhere he saw a blooming lotus plant, full of the lovely humming of rows of bees, covered with a garment of green moss, made to dance by the stream of water. (11)
  ne: |
    Somewhere he heard rows of bees humming softly and sweetly; somewhere he also saw a row of blooming lotus plants, covered with soft green moss leaves, adorned in green garments, made to dance in various forms by the free stream of water, bending a little under the great weight of their flowers. (11)
- p: 38
  v: "12"
  g: {he: m, ne: m, s: A}
  se: |
    Somewhere he saw turtles like wooden seats, elsewhere fish and makaras gliding, and in the middle of the stream a wonderful dolphin (śiśumāra) turning over and diving again and again. (12)
  he: |
    Somewhere he saw turtles like wooden seats (low stools), elsewhere fish and makaras swimming, and in the middle of the stream dolphins (śiśumāra, the sõs) turning over and diving. (12)
  ne: |
    Somewhere he saw turtles moving about like wooden seats (low stools); on the other side, large fish and large makaras swimming; and in the middle current of the great mass of water, wonderful creatures of the śiśumāra (sõs) kind, turning over and sinking and rising. (12)
