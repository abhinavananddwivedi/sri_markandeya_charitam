- p: 15
  v: "29"
  shlok: |
    अदृष्टपूर्वावपि तौ तपस्विना
    प्रभावितेन प्रतिनन्दितौ मुहुः ।
    सतां हि सम्भाषण-दर्शनादिना
    मनोगतं लक्ष्यत एव सत्वरम् ॥ २९ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ "प्रमाणिलेन … पुनः / सतो हि … / … मत्परम्" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). The earlier reading ("प्रमाणिलेन … पुनः / सतो हि … / … मत्परम्") was wrong.
  shlok_en: |
    Though they had never been seen before, the two were greeted again and again by the ascetic, who was deeply impressed; for through conversing with, seeing and so on, the good, what lies in the mind is quickly perceived. (29)
  translation: |
    यद्यपि प्रभावित उस तपस्वी ने उन दोनों को पहिले नहीं देखा था तथापि उनका अभिनन्दन किया। क्योंकि सज्जनों के साथ सम्भाषण-दर्शनादि से मनोगत भाव शीघ्र ही लक्षित होता है ॥ २९ ॥
  notes: |
    यद्यपि उस मृकण्डु ने उन्हें पहले कभी देखा न था किन्तु उन दोनों की अतिशय तेजस्विनी मूर्त्ति ने उन्हें अत्यन्त प्रभावित किया, वे उनका बार २ अभिनन्दन करते रहे क्योंकि सन्तों सज्जनों के साथ सम्भाषण एवं उनके दर्शनादि से अपने मनोभाव स्वतः शीघ्र परिलक्षित होने लगते हैं। २९
  translation_en: |
    Although that ascetic, deeply impressed, had not seen the two before, he greeted them. For through conversing with and seeing the good, the feelings in the mind quickly become apparent. (29)
  notes_en: |
    Although Mṛkaṇḍu had never seen them before, the very radiant figures of the two impressed him greatly, and he kept greeting them again and again; for through conversing with saints and good people and seeing them, one's own feelings soon show of themselves. (29)
- p: 15
  v: "30"
  shlok: |
    तयोश्च सम्प्रेक्ष्य मुदं स्वदर्शनात्
    स्तुतिं विधातुं मनसा प्रचक्रमे ।
    स्वतश्च जिज्ञासुतया प्रवृद्धधी-
    र्मनोऽभिलाषं गदितुं मनो दधे ॥ ३० ॥
  manuscript_note: |
    वृत्त: वंशस्थ। पाद ३–४ की सन्धि में "र्" (प्रवृद्धधीर्मनो…) पाण्डुलिपि में नहीं लिखा है; यहाँ जोड़ा गया। पाद २ में "मनसा" के स्थान पर "मनसः" भी पढ़ा जा सकता है।
  manuscript_note_en: |
    Metre: Vaṃśastha. The sandhi "r" across pādas 3–4 (प्रवृद्धधीर्मनो…) is not written in the manuscript and has been supplied. In pāda 2, "मनसा" could also be read "मनसः".
  shlok_en: |
    Seeing their joy at the sight of him, he began to praise them in his mind; and of his own accord, his understanding grown through the wish to know, he set his mind on speaking his heart's desire. (30)
  translation: |
    अपने देखने मात्र से उनके आनन्दातिरेक को देखकर मन से स्तुति करना प्रारम्भ किया। स्वतः जिज्ञासावशात् वर्द्धित बुद्धिवाले तपस्वी ने अपने मनोभाव को व्यक्त करने के लिए ठान लिया ॥ ३० ॥
  notes: |
    उन दोनों आदि पुरुषों (नरनारायण) को अपने दर्शनकाल से ही देखकर मुनि के अन्तःकरण में अतिशय आनन्दानुभूति हुई, उन्होंने उन आदि पुरुषों की समाहितचित्त होकर मन ही मन स्तुति करना प्रारम्भ किया, उनकी अलौकिक उपस्थिति तथा उनकी अनुपम उदाराशयता देखकर मुनि मृकण्डु ने जिज्ञासावश अपनी मनोभिलषित भावनाओं को व्यक्त करने के लिए दृढ़ निश्चय कर लिया। ३०
  translation_en: |
    Seeing their great joy at merely seeing him, he began to praise them in his mind. Of his own accord, the ascetic, his understanding grown through the wish to know, resolved to express his feelings. (30)
  notes_en: |
    Seeing the two primal persons (Nara and Nārāyaṇa) from the very moment he beheld them, the sage felt great joy in his heart. With a collected mind he began inwardly to praise those primal persons; and seeing their unearthly presence and their matchless generosity of heart, the sage Mṛkaṇḍu, out of the wish to know, firmly resolved to express the feelings his mind desired. (30)
- p: 16
  v: "31"
  shlok: |
    मुनी पुराणौ शतशः श्रुतौ मया
    तपश्चरन्तावतिदीर्घकालतः ।
    दृशौ कृतार्थे युवयोर्विलोकनात्
    मनः परां निर्वृतिमेति सर्वतः ॥ ३१ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ के पाद ३–४ ("तौ कृतार्थो युष्मद्विलोकनात् / न्मनः सन्नितिमेति…") भ्रान्त थे।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). The earlier reading of pādas 3–4 ("तौ कृतार्थो युष्मद्विलोकनात् / न्मनः सन्नितिमेति…") was wrong.
  shlok_en: |
    "Hundreds of times I have heard of the two ancient sages practising austerity for a very long time. My eyes are fulfilled by seeing you two, and my mind attains supreme bliss on every side." (31)
  translation: |
    मैंने प्राचीन दो मुनि अतिदीर्घकाल से तपस्या कर रहे हैं यह बात अनेक बार सुना था। किन्तु सम्प्रति आपदोनों के दर्शन से मेरी दृष्टि कृतार्थ हो गई और मन पूर्णरूप से आनन्दित हो रहा ॥ ३१ ॥
  notes: |
    हे विभो! मैंने अनेक बार सुन रखा है कि दो ऋषि प्रवर (नरनारायण नामक) अनन्त प्राचीन काल से अगणित दिनों से तपस्या करते हुए रह रहे हैं, मुझे लगता है वे दोनों मुनि आप ही हैं, आज आप युगल (दोनों) के दर्शन करने मात्र से मेरी ये दोनों आँखें धन्य हो गईं, मैं कृतार्थ हुआ, आज मेरा मन अत्यन्त प्रफुल्लित होकर आनन्दातिरेक से प्रफुल्लित हो उठा है। ३१
  translation_en: |
    "I had heard many times that two ancient sages have been practising austerity for a very long time. But now, by seeing you both, my sight has been fulfilled and my mind is wholly joyful." (31)
  notes_en: |
    "Lord! I have often heard that two excellent sages (named Nara and Nārāyaṇa) have been living here practising austerity since endlessly ancient times, for countless days. I feel that you are those two sages. Today, merely by seeing you two, these two eyes of mine are blessed, I am fulfilled, and today my mind, greatly delighted, has blossomed with overflowing joy." (31)
- p: 16
  v: "32"
  shlok: |
    तपो निहन्तुं प्रहिता सुराङ्गना
    दिवौकसामप्सरसो वृषेण [unclear] ।
    ऊरुं विनिर्भिद्य वरोरुमुर्वशीं
    समेत्य जग्मुः स्वपुराण्यमर्षिताः ॥ ३२ ॥
  manuscript_note: |
    वृत्त: वंशस्थ/इन्द्रवंशा (उपजाति)। पाद २ पाण्डुलिपि में "दिवौकसामप्सरसो वृषेण" लिखा है, जो एक अक्षर कम (११) है; कोई अक्षर छूटा प्रतीत होता है। पाद ३ में "विनिर्भिद्य" का पाठ अर्थ (नारायण की ऊरु से उर्वशी) के आधार पर; अक्षर "विनिर्मिद्य" जैसे दिखते हैं। पूर्व पाठ "वृषणा / उरु विनिर्मित" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha/Indravaṃśā (Upajāti). Pāda 2 is written "दिवौकसामप्सरसो वृषेण", one syllable short (11); a syllable seems to have dropped out. In pāda 3, "विनिर्भिद्य" is read from the sense (Urvaśī from Nārāyaṇa's thigh); the letters look like "विनिर्मिद्य". The earlier reading ("वृषणा / उरु विनिर्मित") was wrong.
  shlok_en: |
    "The divine women, the apsarases of the dwellers in heaven, sent by Indra to destroy [your] austerity, met Urvaśī of the lovely thighs, whom [Nārāyaṇa] produced by splitting open his thigh, and went back to their own city, indignant." (32)
  translation: |
    इन्द्र ने उनकी तपस्या भङ्ग करने के लिए स्वर्ग से मेनकादि सुराङ्गनाओं को प्रेषित किया था। किन्तु नारायण ने अपने ऊरु से एक उर्वशी नामक दिव्याङ्गना उन्हें प्रदान किया, वे उसे लेकर अमर्ष से भरी हुई अपनी नगरी (स्वर्ग) चली गयीं ॥ ३२ ॥
  notes: |
    सुना है ऋषियों की तपस्या से देवराज सदा भयभीत रहा करते हैं। अतः आप दोनों की तपस्या से डरकर देवराज इन्द्र ने मेनकादि दिव्य अप्सराओं को आप [की] तपस्या भङ्ग करने के लिए भेजा था किन्तु भगवान् नारायण ने अपने ऊरु से निकाल कर एक अद्भुत दिव्याङ्गना उर्वशी नाम वाली को उन्हें दिया, जिसके अनिन्द्य सौन्दर्य और माधुरी [से] व्यथित होकर सभी अप्सरायें अमर्ष से भरी हुई उसे साथ लेकर अपनी नगरी स्वर्गपुरी में चली गईं। ३२
  translation_en: |
    "Indra had sent Menakā and other divine women from heaven to break your austerity. But Nārāyaṇa gave them a divine woman named Urvaśī, from his thigh; taking her, they went back to their city (heaven), filled with indignation." (32)
  notes_en: |
    "I have heard that the king of the gods is always afraid of the austerities of sages. So, frightened by the austerity of you both, Indra, king of the gods, sent Menakā and other divine apsarases to break your austerity. But Lord Nārāyaṇa brought out from his thigh a wonderful divine woman named Urvaśī and gave her to them; pained by her flawless beauty and sweetness, all the apsarases, full of indignation, took her with them and went to their city, Svargapurī." (32)
- p: 17
  v: "33"
  shlok: |
    विमृश्य कोपेऽपि जयं विलक्षितः
    पुरन्दरोऽप्यादृतवान् वरोर्वशीम् ।
    बभूव सर्वाप्सरसां शिरोमणि-
    र्हृदि व्यधात्तस्य पदं स्वसौभगम् ॥ ३३ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद १ "कोपेऽपि" का अक्षर अधिलिखित (overwritten) है। पाद २ "ऽप्यादृतवान्" हिन्दी ("आदर किया") के आधार पर पढ़ा गया; अक्षर "ऽप्याहृततां" जैसे दिखते हैं। पाद ४ "हृदि व्यधात्" पाण्डुलिपि में "हृदित्वधात्" जैसा लिखा है। पूर्व पाठ "को येउति / इल्याह्रततां न गर्दिशीम् / नमून / र्हिदन्यथातत्य परं स्थलोमगम्" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). In pāda 1 the akṣara of "कोपेऽपि" is overwritten. In pāda 2, "ऽप्यादृतवान्" is read with the help of the Hindi ("honoured"); the letters look like "ऽप्याहृततां". In pāda 4, "हृदि व्यधात्" is written like "हृदित्वधात्". The earlier reading ("को येउति / इल्याह्रततां न गर्दिशीम् / नमून / र्हिदन्यथातत्य परं स्थलोमगम्") was wrong.
  shlok_en: |
    Reflecting that there was victory even in [the sages'] anger, Purandara (Indra), abashed, honoured the excellent Urvaśī. She became the crest-jewel of all the apsarases, and set her own beauty's foothold in his heart. (33)
  translation: |
    क्रोध का भी जय है, यह विचार कर विलक्षित इन्द्र ने श्रेष्ठ उर्वशी का आदर किया। तब से उर्वशी अप्सराओं की शिरोमणि अर्थात् सर्वश्रेष्ठ हो गई। क्योंकि उसने इन्द्र के हृदय पर भी अपने सौन्दर्य का साम्राज्य स्थापित कर लिया ॥ ३३ ॥
  notes: |
    यद्यपि देवराज इन्द्र ने ऋषि का अपमान करने के लिए अप्सराओं को भेजा था जिससे उनकी इच्छापूर्ति होती किन्तु आदि ऋषि ने क्रोध करके भी उनकी अप्सराओं से भी अनुपम सौन्दर्यशालिनी उर्वशी को दिया, जिसे पाकर देवराज ने अपनी विजय ही समझा और अपने लक्ष्य से गिर जाने पर भी सर्वातिशायी रूपसौन्दर्यशालिनी देवाङ्गनाग्रगण्य उर्वशी का सादर सम्मान किया और उसे सभी अप्सराओं में अग्रगण्य, शिरोमणि बनाकर अपने को धन्य माना क्योंकि उसने देवराज के हृदय पर भी अपना साम्राज्य स्थापित कर लिया था। ३३
  translation_en: |
    Thinking, "There is victory even in anger", the abashed Indra honoured the excellent Urvaśī. From then on Urvaśī became the crest-jewel of the apsarases, that is, the very best, for she established the empire of her beauty even over Indra's heart. (33)
  notes_en: |
    Although Indra, king of the gods, had sent the apsarases to insult the sage, so that his wish would be fulfilled, the primal sage, even in anger, gave him Urvaśī, more matchlessly beautiful than even his apsarases. On receiving her, the king of the gods took it as his own victory; even though he had fallen short of his aim, he respectfully honoured Urvaśī, foremost of the divine women, whose beauty surpassed all, made her the foremost, the crest-jewel, among all the apsarases, and considered himself blessed, for she had established her empire even over the heart of the king of the gods. (33)
- p: 17
  v: "34"
  shlok: |
    इति श्रुतं विश्वजयेन गर्वितं
    पराजितं दैत्यसुतं प्रभावतः ।
    इषीकया चापविमुक्तया पुरा
    स्तुतौ युवां तेन पुनः प्रसादितौ ॥ ३४ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद ४ "युवां तेन" पाण्डुलिपि में "सुवान्तेन" जैसा दिखता है (य/स समान); अर्थ से "युवां तेन"। पूर्व पाठ "गर्वित / पराजित दैत्यमुते / प्रलादितौ" में मात्रा-त्रुटियाँ थीं।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). In pāda 4, "युवां तेन" looks like "सुवान्तेन" (य and स are alike in this hand); the sense requires "युवां तेन". The earlier reading ("गर्वित / पराजित दैत्यमुते / प्रलादितौ") had letter errors.
  shlok_en: |
    "So I have heard: long ago the son of a daitya, proud of conquering the world, was defeated by your power with a reed shot from a bow; you two were then praised by him and propitiated once more." (34)
  translation: |
    विश्वविजय से गर्वीले दैत्यसुत का धनुष से छोड़े सींक-बाण के प्रभाव से पराजय हुआ था यह सुना था, बाद उन्होंने आप दोनों की स्तुति कर प्रसन्न किया था ॥ ३४ ॥
  notes: |
    ऐसा सुना जाता है कि दैत्यराज का पुत्र (          ) विश्वविजयोन्माद से पागल हो उठा था उसे आपने शक्ति संचालन कर अपने धनुष पर सींक रखकर एक बाण बनाकर फेंका जिससे वह पराजित होकर पुनः वह आपके शरण में आया, और अनन्य भाव से स्तुति किया जिससे आप दोनों ने करुणार्द्र होकर उसे प्रसन्नतापूर्वक क्षमादान दिया था। ३४
  translation_en: |
    "I had heard that the son of a daitya, proud from conquering the world, was defeated by the power of a reed arrow shot from a bow; afterwards he praised you both and pleased you." (34)
  notes_en: |
    "It is heard that the son of the daitya king (          ) [the name is left blank in the manuscript] had gone mad with the frenzy of conquering the world. Applying your power, you set a reed on your bow, made it an arrow and shot it at him; defeated by it, he came again to take refuge with you and praised you with undivided devotion, so that you both, melting with compassion, gladly forgave him." (34)
- p: 18
  v: "35"
  shlok: |
    समग्रविश्वस्य शमाय जाग्रतौ
    तपोभिरुग्रैर्भगवत्स्वरूपिणौ ।
    न माननीयौ कतमेन रोचिषां
    चयौ भुवां जन्मजुषा वरार्थिना ॥ ३५ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ "शमाय जगतो / तपोभिरास्ते गगनेवरोचिषौ / … धियो / थयो क्षयां जनन्त्युषा यार्थिना" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). The earlier reading ("शमाय जगतो / तपोभिरास्ते गगनेवरोचिषौ / … धियो / थयो क्षयां जनन्त्युषा यार्थिना") was wrong.
  shlok_en: |
    "You two, embodiments of the Lord, keep watch through fierce austerities for the peace of the whole world. By which embodied being on earth who seeks a boon are you two, masses of radiance, not to be honoured?" (35)
  translation: |
    भगवत्स्वरूप आप दोनों अपनी उग्र तपस्या से समस्त विश्व के कल्याणार्थ जागरूक हैं। ऐसी स्थिति में तेजोराशि आप दोनों किस जन्मधारी वरेच्छुओं से माननीय नहीं हैं अर्थात् सभी से मान्य हैं ॥ ३५ ॥
  notes: |
    हे प्रभो! प्रत्यक्ष भगवत्स्वरूप धारण करने वाले आप दोनों अपनी अत्युग्र तपस्या द्वारा समस्त विश्व कल्याणार्थ सतत जागरूक रह रहे हैं। समग्र तेजोराशि के एकान्त पुञ्जस्वरूप हे प्रभो! आप दोनों संसार में रहकर विश्व कल्याण के लिए निज वरप्राप्ति की कामना रखने वाले देहधारियों (प्राणियों) द्वारा सम्माननीय नहीं हैं। ३५
  translation_en: |
    "You two, embodiments of the Lord, keep watch through your fierce austerity for the welfare of the whole world. This being so, by which embodied being seeking a boon are you two, masses of radiance, not to be honoured? That is, you are honoured by all." (35)
  notes_en: |
    "Lord! You two, who bear the very form of God before our eyes, remain constantly watchful through your exceedingly fierce austerity for the welfare of the whole world. O Lord, sole concentrated mass of all radiance! Dwelling in the world for its welfare, you two are [not] honoured by embodied beings (creatures) who desire to obtain boons for themselves." [The Hindi reads "सम्माननीय नहीं हैं", "are not honoured"; the verse's rhetorical question, "by whom are you not to be honoured?", is evidently meant.] (35)
- p: 18
  v: "36"
  shlok: |
    अहन्त्विदानीं बत जातसंस्तवो
    मुहुः प्रसीदामि निजोदयं प्रति ।
    चिरादभिज्ञावनभिज्ञमर्हथो
    विबोधुमद्धा व्यवहारवर्त्मनि ॥ ३६ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ "अहन्नित्यादानों बतजात संस्तथो / … प्रसाद्यामि … / चिरादमिशावनमिश्रमध्ये / विवोधुमच्छा सवरम् वलेनि" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). The earlier reading ("अहन्नित्यादानों बतजात संस्तथो / … प्रसाद्यामि … / चिरादमिशावनमिश्रमध्ये / विवोधुमच्छा सवरम् वलेनि") was wrong.
  shlok_en: |
    "But now, oh joy, having come to know you, I rejoice again and again in view of my own rise. You two, long all-knowing, ought indeed to instruct me, who am ignorant, in the path of conduct." (36)
  translation: |
    बड़े हर्ष की बात है मैं परिचय वाला हो गया अतः अपने उत्तरकाल के (तरक्की) के लिए प्रसन्न हो रहा हूँ। आपदोनों जानते हैं अतः व्यवहार मार्ग में मुझे अनभिज्ञ ही समझें ॥ ३६ ॥
  notes: |
    भगवन्! यह बड़े हर्ष की बात है कि मैं आज आप लोगों की कृपा से कृतार्थ हुआ अब मैं अपने भावी अभ्युदय के लिए अतिशय आश्वस्त हूँ एवं प्रसन्नता का अनुभव कर रहा हूँ, आप लोग सर्वथा सर्वज्ञ एवं सर्वसमर्थ हैं; अतः मुझ अनजाने व्यक्ति को आपलोग लौकिक व्यवहार विवेकादि के लिए अवश्य ही समुचित मार्ग निर्देश करने की कृपा करेंगे। ३६
  translation_en: |
    "It is a matter of great joy that I have come to know you; so I am glad for the sake of my later life (my advancement). You two know [all]; so in the path of conduct consider me simply ignorant." (36)
  notes_en: |
    "Lord! It is a matter of great joy that today I am fulfilled by your grace. Now I am very assured about my future rise and feel happy. You are wholly all-knowing and all-capable; so you will surely be kind enough to give me, an ignorant person, proper guidance in worldly conduct, discernment and the like." (36)
- p: 19
  v: "37"
  shlok: |
    न देशकालौ कलितौ मया क्वचि-
    न्नवाप्तदिग्दर्शनमेव भावितम् ।
    न शक्तिरप्याकलिता मनाक् क्षितौ
    ततो युवां बोधयितुं समाश्रये ॥ ३७ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद २ का "नवाप्त" अनिश्चित है; अक्षर "न्नवाह्म" जैसे दिखते हैं। पाद ३ "शक्तिरप्याकलिता" ("रस्याकलिता" भी सम्भव)। पूर्व पाठ "फलितो / न्नवाहमदिग्दर्शनमेव भाचितम् / न शक्तिरस्यामाभाचिता मनाक् / त्वित्थे ततो…" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). In pāda 2, "नवाप्त" is uncertain; the letters look like "न्नवाह्म". Pāda 3 reads "शक्तिरप्याकलिता" ("रस्याकलिता" is also possible). The earlier reading ("फलितो / न्नवाहमदिग्दर्शनमेव भाचितम् / न शक्तिरस्यामाभाचिता मनाक् / त्वित्थे ततो…") was wrong.
  shlok_en: |
    "I have nowhere grasped place and time, nor have I [unclear: attained] a sense of direction; nor have I gained even a little power on earth. Therefore I take refuge with you two, to be taught." (37)
  notes: |
    हे प्रभो! मुझ अनजाने को सामयिक देशकाल की स्थिति का तनिक भी ज्ञान नहीं है और न मैं अपने अग्रिम जीवन दर्शन का कुछ भी निश्चित विचार ही कर पाया हूँ, भगवन्! इस धरती पर मैंने न तनिक भी शक्ति का भी अर्जन किया है, अतः अपनी सर्वविध अज्ञानता के निवारणार्थ आप दोनों के शरण में आया हुआ हूँ। ३७
  notes_en: |
    "Lord! I, an ignorant man, have not the least knowledge of the present state of place and time, nor have I been able to form any settled idea of how my life ahead should go. Lord! On this earth I have not acquired even the least power. So, to remove my ignorance of every kind, I have come to take refuge with you two." (37)
- p: 19
  v: "38"
  shlok: |
    हिरण्यगर्भस्य त्वगुद्भवः सुतो
    भृगुस्ततोऽजायत धातृनामकः ।
    ततो मृकण्डोऽस्मि स भार्गवो युवां
    प्रसादये चाप्यभिवादये गुरू ॥ ३८ ॥
  manuscript_note: |
    वृत्त: वंशस्थ। पाद १ में "स्य त्वगु…" का "स्य" संयोग-पूर्व होने से गुरु है (छठा अक्षर लघु होना चाहिए) — छन्दोभङ्ग, पाण्डुलिपि यथावत्। पाद ३ "स भार्गवो" पाण्डुलिपि में "समार्गवो" जैसा लिखा है (टिप्पणी: "भृगुवंशोत्पन्न")। पाद ४ "चाप्यभिवादये" ("और अभिवादन") अक्षर "न्याम्यमिवादये" जैसे दिखते हैं। पूर्व पाठ "ततो मृकण्डोऽजस्म समागकौ युवां / प्रसादये न्याम्यमिवादये गुरू" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha. In pāda 1, the "स्य" before "त्वगु…" is heavy by position, where the sixth syllable should be light: a metrical fault, kept as written. In pāda 3, "स भार्गवो" is written like "समार्गवो" (the note says "born in Bhṛgu's line"). In pāda 4, "चाप्यभिवादये" ("and salute") looks like "न्याम्यमिवादये". The earlier reading ("ततो मृकण्डोऽजस्म समागकौ युवां / प्रसादये न्याम्यमिवादये गुरू") was wrong.
  shlok_en: |
    "The son born of Hiraṇyagarbha's skin was Bhṛgu; from him was born the one named Dhātā; from him I am Mṛkaṇḍu, that descendant of Bhṛgu. I propitiate you two, my teachers, and salute you." (38)
  translation: |
    हिरण्यगर्भ ब्रह्मा के त्वक् से उत्पन्न पुत्र भृगु हुए उनके धातृ (धाता) नामक पुत्र हुआ। धाता का पुत्र अपने भाई विधाता के मैं मृकण्डु हुआ, वही मृकण्डु नामा मैं आप दोनों गुरुओं को प्रसन्न कर रहा हूँ और अभिवादन कर रहा हूँ ॥ ३८ ॥
  notes: |
    आद्य स्रष्टा हिरण्यगर्भ ब्रह्मा के त्वक् (चमड़ी) से उत्पन्न महर्षि भृगु हुए, उनके धाता विधाता नामक दो पुत्र हुए, उस धाता का पुत्र मैं मृकण्डु भृगुवंशोत्पन्न आप दोनों परमपूज्य देववरों की प्रणति एवं प्रसन्नतापूर्वक अपने ऊपर कृपा प्राप्त करने की प्रार्थना कर रहा हूँ। ३८
  translation_en: |
    "Bhṛgu was the son born from the skin of Brahmā Hiraṇyagarbha; to him was born a son named Dhātṛ (Dhātā). [As] the son of Dhātā, [with] his brother Vidhātā, I, Mṛkaṇḍu, was born; I, that same Mṛkaṇḍu by name, seek to please you two teachers and greet you." [The Hindi of the second sentence is broken as written.] (38)
  notes_en: |
    "From the skin of the first creator, Brahmā Hiraṇyagarbha, was born the great sage Bhṛgu; he had two sons named Dhātā and Vidhātā. I, Mṛkaṇḍu, son of that Dhātā, born in Bhṛgu's line, bow to you two most venerable, excellent gods and pray that I may gladly receive your grace upon me." (38)
- p: 20
  v: "39"
  shlok: |
    अमुष्य संस्तावममुं निशम्य तौ
    प्रसेदतुर्निश्छलभक्तिभावतः ।
    तथोपदेशं परमं तमूचतुः
    परत्र चात्रापि शुभोदयं प्रति ॥ ३९ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ "संस्तुतमाकर्ण्य / प्रसन्नान्निश्छल… / ततोऽपदेशं… / शुभोदयं प्रति" (पाद ४ अधूरा) भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). The earlier reading ("संस्तुतमाकर्ण्य / प्रसन्नान्निश्छल… / ततोऽपदेशं… / शुभोदयं प्रति", with pāda 4 incomplete) was wrong.
  shlok_en: |
    Hearing this praise of his, the two were pleased by his guileless devotion, and they spoke to him the highest teaching, for his good fortune both in the next world and in this. (39)
  translation: |
    मृकण्डु कृत स्तुति को सुनकर तथा उसकी निश्छल भक्तिभाव से वे दोनों प्रसन्न हुए और इस लोक तथा परलोक में शुभोदयार्थ उत्तम उपदेश देते हुए उससे कहने लगे ॥ ३९ ॥
  notes: |
    भार्गव मृकण्डु द्वारा निश्छल भक्तिभावपूर्ण सश्रद्ध स्तुति किये जाने पर उनकी अतिशय उदात्त भक्तिभावना से वे दोनों आद्य मुनि अतिशय प्रसन्न हो उठे, और उन पर अविरल कृपादृष्टि कर कल्याणकारी इहलोक तथा परलोक का भी अभ्युदयकारक अतिशय हितावह उपदेश देते हुए कहना शुरू किया। ३९
  translation_en: |
    Hearing the praise made by Mṛkaṇḍu, and pleased by his guileless devotion, the two began to speak to him, giving excellent teaching for good fortune in this world and the next. (39)
  notes_en: |
    When Mṛkaṇḍu, of Bhṛgu's line, had praised them with faith and with guileless devotion, the two primal sages were greatly pleased by his very noble devotion; casting on him their unbroken gracious glance, they began to speak, giving him most beneficial teaching, auspicious and conducive to his rise in this world and in the next. (39)
- p: 20
  v: "40"
  shlok: |
    सदैव सत्यं वद धर्ममाचरे-
    न्न वै विरामोऽध्ययने भवेत्तव ।
    गुरौ जनन्यां जनके च देवव-
    त्सदा भवेः पुत्रक वर्त्मनाऽऽत्मनः ॥ ४० ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद १ में "सत्यं" से पहले एक शब्द काटा गया है। पूर्व पाठ "धर्ममाचर / गुरौ अनन्यो / वर्त्तमात्मनः" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). In pāda 1 a word before "सत्यं" is struck out. The earlier reading ("धर्ममाचर / गुरौ अनन्यो / वर्त्तमात्मनः") was wrong.
  shlok_en: |
    "Always speak the truth, practise dharma; let there be no pause in your study. Son, by your own conduct always be [devoted] to your teacher, your mother and your father as to gods." (40)
  translation: |
    हमेशा सत्य बोलो, धर्म का आचरण करो, तुम्हारा स्वाध्याय में कभी विराम (रुकावट) न आवे। हे पुत्र! अपने सन्मार्ग से गुरु माता-पिता में देवत्व भावना करो ॥ ४० ॥
  notes: |
    वत्स! तुम निरन्तर सत्य सम्भाषण करने में निरत होवो, विधि सम्मत स्वधर्म का परिपालन करते रहो, षडङ्ग वेदाध्ययन में कभी भी कोई व्यवधान न आने पावे, (स्वाध्याय में कोई विघ्न न आये) तुम अपने श्रेष्ठ जनों समादरणीय पूज्य माता और पिता में सदैव देवबुद्धिपूर्वक निष्ठावान बने रहो, इस उत्तम मार्ग से तुम्हारा निरन्तर अतिशय कल्याण होगा। ४०
  translation_en: |
    "Always speak the truth; practise dharma; let there never be a pause (break) in your study. Son! By your own good path, regard your teacher, mother and father as divine." (40)
  notes_en: |
    "Child! Be constantly devoted to speaking the truth; keep observing your own dharma as the rules prescribe; let no break ever come in your study of the Veda with its six auxiliaries (let no obstacle come in your study). Always remain faithful to your elders, and to your honoured, venerable mother and father, regarding them as gods. By this excellent path you will continually prosper greatly." (40)
- p: 21
  v: "41"
  shlok: |
    श्रियै विभूत्यै विमना स्म मा भवो
    न वा प्रमादोऽपि हिताय कल्पते ।
    गुरोश्च देयं यदतिप्रियं भवे-
    त्तदप्युपेयाः [unclear] मनसा समाहितः ॥ ४१ ॥
  manuscript_note: |
    वृत्त: वंशस्थ। पाद ४ का आरम्भ ("त्तदप्युपेयाः") अनिश्चित है; अक्षर "त्पप्रुपेयथा" जैसे दिखते हैं; छन्द और "मनसा समाहितः" सुपाठ्य हैं। पूर्व पाठ में पाद ३ नहीं था और "न माययो / नया प्रमादो… / त्युपायिथा" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha. The opening of pāda 4 ("त्तदप्युपेयाः") is uncertain; the letters look like "त्पप्रुपेयथा". The metre and "मनसा समाहितः" are clear. The earlier reading lacked pāda 3 entirely and had "न माययो / नया प्रमादो… / त्युपायिथा", which was wrong.
  shlok_en: |
    "Never be careless about prosperity and wealth, for heedlessness never serves one's good. Whatever is dearest to you should be given to your teacher; [unclear: attend to] that too with a composed mind." (41)
  translation: |
    श्री और विभूति के प्रति असावधान न हो, क्योंकि प्रमाद कभी भी हितकर नहीं होता। गुरु को वही प्रदान करो जो तुम्हारा अतिशय प्रिय हो, उपर्युक्त सभी बातों को सावधान मन से पूर्ण करो ॥ ४१ ॥
  notes: |
    प्रिय वत्स! विश्वजनीन समृद्धि (धन) एवं सर्वकल्याणकारी ऐश्वर्य (वैभव) के प्रति जीवन भर तनिक भी असावधानी (चूक) न करना क्योंकि प्रमाद अनवधानता (लापरवाही) कभी किसी के लिए भी कल्याणकारी नहीं होती। जो वस्तु अपनी अतिशय प्रिय एवं सुखावह हो वही अपने पूज्यों श्रेष्ठ जनों को प्रदान करो। सभी कार्य अत्यन्त सावधान निश्छल मन से पूर्ण करो, यही लौकिक कल्याण मार्ग का सर्वाभ्युदय का उत्तम मार्ग है। ४१
  translation_en: |
    "Do not be careless toward prosperity and wealth, for heedlessness is never beneficial. Give your teacher that which is dearest to you. Carry out all the above with a careful mind." (41)
  notes_en: |
    "Dear child! Never in your life be the least careless (negligent) about prosperity (wealth) that serves the whole world, or about splendour (riches) that does good to all; for heedlessness, inattention (carelessness), is never beneficial to anyone. Whatever is most dear and pleasing to you, give that to your venerable elders. Do every task with a very careful, guileless mind. This is the excellent path of worldly welfare, the path to all-round prosperity." (41)
- p: 21
  v: "42"
  shlok: |
    न वा प्रजातन्तुविलोपको भवेः
    सपर्ययाऽभ्यागततत्परः सदा ।
    निवर्तयेरिष्टमथापि पूर्तकं
    तथाऽग्निहोत्रं जुहुयान्निरन्तरम् ॥ ४२ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ "निवर्त्तयेदिष्टमयादि पूर्वकं" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). The earlier reading ("निवर्त्तयेदिष्टमयादि पूर्वकं") was wrong.
  shlok_en: |
    "Never be one who breaks the thread of offspring; be always intent on honouring guests. Accomplish the iṣṭa (sacrifices) and the pūrta (works of public benefit), and offer the agnihotra without ceasing." (42)
  translation: |
    तुम्हारी सन्तानपरम्परा का लोप न हो, अभ्यागतों के सत्कार में सतत संलग्न रहो। कल्याणकारी कुआँ बावली तालाब आदि पूर्त यज्ञ पूर्ण करो तथा अग्निहोत्री बनो ॥ ४२ ॥
  notes: |
    प्रिय वत्स! गृहस्थधर्म के परिपालनार्थ कभी भी सन्तान परम्परा का विलोप नहीं होना चाहिए (प्रजातन्तुं मा व्यवच्छेत्सीः)। गृहस्थाश्रम अतिथि सत्कार सर्वश्रेष्ठ कल्याण का मार्ग है, अभ्यागतों के सत्कार में निरन्तर संलग्न रहना क्योंकि (सर्वस्याभ्यागतो गुरुः)। निरन्तर गृहस्थधर्माश्रित व्यक्ति को इष्ट अर्थात् वैदिक विधि द्वारा अनुष्ठित होने वाले यज्ञ यागादि एवं पूर्त कुएँ बावली तालाब वाटिका देवालयादि के निर्माणपूर्वक सदा अग्निहोत्र द्वारा नित्य गार्हपत्याग्नि की परिचर्या करते रहना। ४२
  translation_en: |
    "Let your line of descendants not be broken; remain always engaged in honouring guests. Complete the beneficial pūrta works, such as wells, step-wells and tanks, and become a keeper of the agnihotra." (42)
  notes_en: |
    "Dear child! To uphold the householder's dharma, the line of offspring must never be broken (prajātantuṃ mā vyavacchetsīḥ). For the householder's stage of life, hospitality to guests is the best path to welfare; remain constantly engaged in honouring guests, because (sarvasyābhyāgato guruḥ, 'the guest is everyone's teacher'). One who lives by the householder's dharma should constantly perform the iṣṭa, that is, sacrifices and rites performed by Vedic rule, and the pūrta, building wells, step-wells, tanks, gardens, temples and the like; and through the agnihotra he should always tend the household fire (gārhapatya) daily." (42)
- p: 22
  v: "43"
  shlok: |
    क्रियाश्च कुर्वन् परमेश्वरेऽर्पये-
    त्सनातनी तस्य गतिः सुनिश्चिता ।
    क्रियात्मकस्यास्य हि दायरूपकः [unclear]
    विना च तां कः क्षणमत्र तिष्ठति ॥ ४३ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद ३ का उत्तरार्ध ("हि दायरूपकः") अधिलिखित और अनिश्चित है; हिन्दी ("इस क्रियात्मक का यही अधिकार है") और टिप्पणी ("दायित्व") के आधार पर पढ़ा गया। पूर्व पाठ "क्रियास्वेव कुर्वन्त्येवमेव तद्वत् / त्सन्नाम्नि… / क्रियात्मक स्वाभावो ह्यस्य देशस्य / विना किञ्चित्कोऽपि तिष्ठेद्विधाव" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). The second half of pāda 3 ("हि दायरूपकः") is overwritten and uncertain; it is read with the help of the Hindi ("this is the right of what is of the nature of action") and the note ("दायित्व", duty). The earlier reading ("क्रियास्वेव कुर्वन्त्येवमेव तद्वत् / त्सन्नाम्नि… / क्रियात्मक स्वाभावो ह्यस्य देशस्य / विना किञ्चित्कोऽपि तिष्ठेद्विधाव") was wrong.
  shlok_en: |
    "Doing your works, offer them to the Supreme Lord; the eternal goal of one who does so is assured. This is the [unclear: birthright] of what is of the nature of action; for without it, who here stays even for a moment?" (43)
  translation: |
    शुभकर्म करते हुए परमेश्वर को अर्पित करो, ऐसे करने वालों की सनातनी गति सुनिश्चित होती है। इस क्रियात्मक का यही अधिकार है, क्योंकि बिना क्रिया किये इस संसार में कौन क्षण भर रहता है ॥ ४३ ॥
  notes: |
    प्रिय वत्स! जीवन में निरन्तर शुभ कर्म करते हुए उसे सदा ईश्वरार्पण करते रहो क्योंकि यह सार्वकालिक प्राकृत नियम है जो विधिसम्मत निर्धारित है, इस प्रकार की नित्य क्रियाशीलता का तो आधार ही (दायित्व) है, क्योंकि बिना किसी क्रिया के क्षण भर भी क्या कोई रह सकता है? ४३
  translation_en: |
    "Doing good deeds, offer them to the Supreme Lord; the eternal goal of those who act thus is assured. This is the very right of what is of the nature of action; for without doing action, who stays in this world even for a moment?" (43)
  notes_en: |
    "Dear child! Constantly doing good deeds in life, always keep offering them to God, for this is a natural law for all time, laid down by rule. This kind of constant activity is indeed the very basis (a duty); for can anyone remain even for a moment without some action?" (43)
- p: 22
  v: "44"
  shlok: |
    निवृत्तिमार्गस्य दुरूहता तथा
    सुदुर्गतिः किं विदिताऽस्ति नावयोः ।
    समादरस्तत्र च पूर्णकामयो-
    रसक्तयोः कर्मसु पश्य कौतुकम् ॥ ४४ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। "आवयोः" (हम दोनों को) — नर-नारायण स्वयं के विषय में बोल रहे हैं। पूर्व पाठ "निवृत्तिमार्गीय गुरुता तथा सुदुर्गतिः / किं विदिताहित समादरस्तथा / च पूर्णकामानां- / र्माऽसक्तेः…" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). "आवयोः" ("to us two"): Nara and Nārāyaṇa are speaking of themselves. The earlier reading ("निवृत्तिमार्गीय गुरुता तथा सुदुर्गतिः / किं विदिताहित समादरस्तथा / च पूर्णकामानां- / र्माऽसक्तेः…") was wrong.
  shlok_en: |
    "Are the hardness of the path of renunciation and its grave misfortune unknown to us two? And yet see the wonder: the honour there of us two, whose desires are fulfilled and who are unattached in our actions." (44)
  translation: |
    निवृत्तिमार्ग की कठिनता तथा सुदुर्गतिता क्या हमें मालूम नहीं? मालूम है। किन्तु कर्म में असक्त पूर्णकाम वालों का वहाँ समादर होता है, यह कौतुक देखो ॥ ४४ ॥
  notes: |
    चिरञ्जीवक! अब तुम संसार से विरक्त होकर निवृत्ति मार्ग का अनुसरण करने वालों की विविध कठिनाइयों तथा उस कारण होने वाली अनेकविध दुर्दशाओं, दुर्गतियों की ओर ध्यान दो, क्या उन शारीरिक यंत्रणाओं द्वारा आत्मा का उत्पीडन नहीं किया जाता? यह बात सही है? प्रवृत्ति मार्ग में निरन्तर रहने वाले किन्तु असक्त भावना से सांसारिक कार्यों में संलग्न होते हुए भी पूर्णकाम (कर्मफल त्यागने वाली प्रवृत्ति) सद्गृहस्थों का समाज में अतिशय समादर नहीं होता? यह लौकिक आश्चर्यपूर्ण कौतुक (उत्कण्ठा) क्या स्पष्ट नहीं दीखती? ४४
  translation_en: |
    "Do we not know the hardness and the grave misfortune of the path of renunciation? We know them. But see this wonder: those who are unattached in action and whose desires are fulfilled are honoured there." (44)
  notes_en: |
    "Long-lived one! Now consider the many hardships of those who turn away from the world and follow the path of renunciation, and the manifold sufferings and misfortunes that come of it: is the soul not tormented by those bodily torments? Is this not so? Are not good householders, who remain always on the path of active life (pravṛtti) and, though engaged in worldly work, do it with unattached feeling and are fulfilled in desire (disposed to give up the fruits of action), greatly honoured in society? Is this wonderful worldly marvel (eagerness) not plain to see?" (44)
- p: 23
  v: "45"
  shlok: |
    अतो द्विज! त्वां प्रति नोपदिश्यते
    तथैव शिष्यानुपदेष्टुमर्हसि ।
    प्रवृत्तिमार्गे प्रथमो महामुने!
    भुवि त्वमाचार्यपदेऽभिषिच्यसे ॥ ४५ ॥
  manuscript_note: |
    वृत्त: वंशस्थ। पाद २ "शिष्यानुपदेष्टुमर्हसि" (= शिष्यान् उपदेष्टुम्; छन्द शुद्ध)। पाद ३ "प्रवृत्तिमार्गे" (पूर्व पाठ "प्रकृतिमार्ग" भ्रान्त था); पाद २ का पूर्व पाठ "शिष्यांस्त्वमुपदिक्ष महोदया" भी भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha. Pāda 2 reads "शिष्यानुपदेष्टुमर्हसि" (= शिष्यान् उपदेष्टुम्; it scans). Pāda 3 reads "प्रवृत्तिमार्गे" (the earlier "प्रकृतिमार्ग" was wrong); the earlier pāda 2, "शिष्यांस्त्वमुपदिक्ष महोदया", was also wrong.
  shlok_en: |
    "So, twice-born one, you are not [being] taught; you are yourself fit to teach disciples in the same way. Great sage! On earth you are consecrated to the office of first teacher of the path of active life (pravṛtti)." (45)
  translation: |
    हे द्विज! तुम्हें उपदेश नहीं दिया जा रहा है, वैसे ही तुम शिष्यों को उपदेश देने में समर्थ हो। हे महामुने! पहिले इस पृथ्वीपर तुम्हें हम प्रवृत्तिमार्ग पद पर आचार्य के रूप में अभिषिक्त करते हैं ॥ ४५ ॥
  notes: |
    अतः हे द्विज श्रेष्ठ! हम तुझे कोई उपदेश नहीं दे रहे हैं, तुम स्वयं शिष्यों को यथावत् उपदेश देने की क्षमता रखते हो। हे महामुने मृकण्डु! आज हम तुम्हें इस धरती पर प्रवृत्तिमार्ग के प्रथम आचार्य के पद पर विधिवत् अभिषिक्त कर इस सरल प्रवृत्ति मार्ग के सविधि सञ्चालन के लिए आशीर्वाद देकर कल्याण-कामना द्वारा इसके निरन्तर समर्थन एवं संयोजन की आकांक्षा करते हैं। ४५
  translation_en: |
    "Twice-born one! You are not being taught; you are yourself able to teach disciples in the same way. Great sage! First, on this earth, we consecrate you as teacher in the office of the path of active life (pravṛtti)." (45)
  notes_en: |
    "So, best of the twice-born! We are giving you no teaching; you yourself are able to teach disciples properly. Great sage Mṛkaṇḍu! Today, having duly consecrated you on this earth to the office of first teacher of the path of active life, we bless you to conduct this simple path of active life as prescribed, and, wishing you well, we hope that you will constantly support and organise it." (45)
- p: 23
  v: "46"
  shlok: |
    त्वयोपनेया वटवो द्विजन्मनां
    तथा विनेयाश्च भवेयुरेव ते ।
    य आप्लुता मार्गमिमं सुखप्रदं
    निवस्तुमर्हन्ति तवोपदेशतः ॥ ४६ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ में पाद २ नहीं था, और पाद ३ "पुरस्कृता" भ्रान्त था (पाण्डुलिपि: "सुखप्रदं")।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). The earlier reading lacked pāda 2, and its pāda 3 ending "पुरस्कृता" was wrong (the manuscript has "सुखप्रदं").
  shlok_en: |
    "You are to give the sacred thread to the boys of the twice-born, and they should indeed become well disciplined. Those who are steeped in this joy-giving path are fit to dwell [here] by your teaching." (46)
  translation: |
    आप द्विजन्मों के बालकों को उपनीत करें वे आपके द्वारा विनयी बनें। आपके उपदेश से जो इस मार्ग पर आरूढ़ [होंगे], वे ही निवास के योग्य होंगे ॥ ४६ ॥
  notes: |
    अब आप द्विजन्मा (ब्राह्मणवटुकों) का सविधि उपनयन संस्कार सम्पादित करें, आप द्वारा सदुपदिष्ट वे द्विजवटुक विनयशील एवं शालीनता के प्रतीक बनें, वे इस अत्यन्त सुखप्रदान करने वाले इस प्रवृत्ति मार्ग पर आस्थावान बनकर आपके सदुपदेश से इस भूतल पर रहते हुए प्रवृत्तिमार्ग की सरस एवं प्रेरणाप्रद बनकर रहते हुए इसके संवर्धन संरक्षण में सतत प्रवृत्त होवें। ४६
  translation_en: |
    "Perform the upanayana of the boys of the twice-born; let them become disciplined through you. Those who [will] take up this path through your teaching, they alone will be worthy of dwelling [here]." (46)
  notes_en: |
    "Now duly perform the upanayana rite for the twice-born (brāhmaṇa boys). Well taught by you, may those twice-born boys become models of discipline and good conduct. Gaining faith in this most joy-giving path of active life, may they, living on this earth by your good teaching, become [exemplars] of the path of active life, delightful and inspiring, and remain constantly engaged in its growth and protection." (46)
- p: 24
  v: "47"
  shlok: |
    सरिद्वरेयं सकलाघनाशिनी
    त्रिलोकगा विष्णुपदीति गीयते ।
    समुद्दिधीर्षुः सगरस्य सन्ततिं
    पयोनिधिं प्राच्यमसौ प्रगच्छति ॥ ४७ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ "अरिष्टयः सकलपापनाशिनी / त्रिलोके गङ्गा… / सगरात्मजा… / प्राणदमसो प्रधावति" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). The earlier reading ("अरिष्टयः सकलपापनाशिनी / त्रिलोके गङ्गा… / सगरात्मजा… / प्राणदमसो प्रधावति") was wrong.
  shlok_en: |
    "This best of rivers, destroyer of all sins, flowing through the three worlds, is sung as Viṣṇupadī. Wishing to raise up Sagara's descendants, she goes to the eastern ocean." (47)
  translation: |
    यह समस्तपापनाशिनी त्रिलोकगा सरिद्वरा गङ्गा विष्णुपदी के नाम से गाई जाती है। सगर की सन्ततियों के उद्धारार्थ यह पूर्व समुद्र की ओर प्रवाहित हो रही है ॥ ४७ ॥
  notes: |
    आप देखें, यह गोमुख से निकलने वाली भगवती विष्णुपदी (स्वर्ग मर्त्य पाताल) तीनों भुवनों में समानरूप से प्रवाहित होने वाली सम्पूर्ण पापों की नाशिनी उत्तम सरिता है (नदियों में सर्वश्रेष्ठ है)। इतिहास प्रसिद्ध महाराज सगर के ६० हजार सन्तान परम्परा जिसको महामुनि कपिल के शाप से भस्म होने की अनुभूति है, उनके समुद्धरणार्थ यहाँ से पूर्वी महासागर में मिलने जा रही है। ४७
  translation_en: |
    "This best of rivers, the Gaṅgā, destroyer of all sins, flowing through the three worlds, is sung by the name Viṣṇupadī. To deliver the descendants of Sagara she flows toward the eastern sea." (47)
  notes_en: |
    "See: this goddess Viṣṇupadī, rising from Gomukh, flowing alike through the three worlds (heaven, earth and the netherworld), is the excellent river that destroys all sins (the best of rivers). To deliver the sixty thousand descendants of the famous King Sagara, who suffered being burned to ashes by the curse of the great sage Kapila, she goes from here to meet the eastern ocean." (47)
- p: 24
  v: "48"
  shlok: |
    इतो गतेऽल्पेऽध्वनि ते मिलिष्यति
    पदं हरद्वारमिदं महेशितुः ।
    तटोपमार्गं व्रजतो यतो मनः
    प्रवर्तते तत्र निवस्तुमर्हसि ॥ ४८ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद २ "हरद्वारम्" (पूर्व पाठ "हरहाराभिधं" भ्रान्त था); पूर्व पाठ "इतोजगतेऽल्पेऽपि / तदेपमार भजतो" भी भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). Pāda 2 reads "हरद्वारम्" (the earlier "हरहाराभिधं" was wrong); the earlier "इतोजगतेऽल्पेऽपि / तदेपमार भजतो" was also wrong.
  shlok_en: |
    "When you have gone a short way from here, you will come upon this place of the great Lord (Śiva), Haradvāra. Walking the path along the bank, wherever your mind is drawn, there you should dwell." (48)
  translation: |
    यहाँ से थोड़े कुछ मार्ग में जाने पर तुम्हें भगवान् शिव का हरद्वार नामक स्थान मिलेगा। तट पर चलते हुए जहाँ तुम्हारा मन रम जाय वहाँ तुम निवास कर सकते हो ॥ ४८ ॥
  notes: |
    प्रिय! आप यहाँ से आगे चलें, कुछ ही दूरी पर आदि देव भगवान् शिव का प्रियस्थान 'हरद्वार' आपको मिलेगा। यह स्थान अद्भुत मनोरम होगा, उस मार्ग से नदी का अनुसरण करते हुए आप जायँ तो जहाँ कहीं भी आपको मनस्तुष्टिपूर्वक स्वाध्याय, तपः प्रसादिनी भूमि दिखे मन रम जाय आप वहीं अपना निवास बनाकर रह सकते हैं। ४८
  translation_en: |
    "Going a little way from here, you will find the place of Lord Śiva called Haradvāra. Walking along the bank, wherever your mind delights, there you may live." (48)
  notes_en: |
    "Dear one! Go on from here; a short distance away you will find Haradvāra, the beloved place of the first god, Lord Śiva. This place will be wonderfully lovely. Following the river along that way, wherever you see land that gladdens your heart and favours study and austerity, where your mind delights, there you may make your home." (48)
- p: 25
  v: "49"
  shlok: |
    गुरूपदेशं स निशम्य सत्वरं
    तयोश्चकाराशु पदोपसंग्रहम् ।
    पुनः परिक्रम्य ययौ सुरापगां
    तदाहितं कार्यभरं समुद्वहन् ॥ ४९ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद २ में "चकाराशु" के अक्षर अधिलिखित हैं; हाशिये में एक संशोधन (सम्भवतः "…काराशु") लिखा है। पूर्व पाठ "तथेच्छयाऽऽगृह्य वयोदयंगताः / … मयो सुपूजयन् / … कार्यकरे समुद्यतौ" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). In pāda 2 the letters of "चकाराशु" are overwritten, and a correction (probably "…काराशु") is written in the margin. The earlier reading ("तथेच्छयाऽऽगृह्य वयोदयंगताः / … मयो सुपूजयन् / … कार्यकरे समुद्यतौ") was wrong.
  shlok_en: |
    Having heard his teachers' instruction, he quickly clasped the feet of the two; then, circling them once more, he set out for the river of the gods, bearing the burden of the task they had laid on him. (49)
  translation: |
    गुरुओं के उपदेश को सुनकर शीघ्रतापूर्वक दोनों का चरणस्पर्श कर एवं परिक्रमा कर उनके द्वारा प्रदत्त कार्यभार को धारण करते हुए गङ्गा की ओर चल पड़े ॥ ४९ ॥
  notes: |
    उन गुरुप्रवरों के अमृतमय उपदेश सुनकर सविनय उनके चरणों का स्पर्श करते हुए सविधि उनकी परिक्रमा कर उनके द्वारा आदिष्ट प्रवृत्ति मार्ग सञ्चालन के गुरुतर कार्यभार का सम्पादन करने की अनन्य अभिलाषा लिए आदेश परिपालनार्थ अतिशय शीघ्रतापूर्वक देवधुनी गङ्गा की ओर चल पड़े। ४९
  translation_en: |
    Having heard the teachers' instruction, he quickly touched the feet of the two, circumambulated them, and, taking up the charge they had given him, set out toward the Gaṅgā. (49)
  notes_en: |
    Having heard the nectar-like teaching of those excellent teachers, he humbly touched their feet, circumambulated them as prescribed, and, with the single-minded wish to carry out the weighty charge they had laid on him, of directing the path of active life, he set out in great haste toward the divine river Gaṅgā to fulfil their command. (49)
- p: 25
  v: "50"
  shlok: |
    शिरस्यथाधाय समस्तकिल्बिष-
    प्रधर्षिणीः सच्चुलकद्वयीरपः ।
    बहिर्विशुद्धोऽन्तरपि प्रशोधयं-
    स्त्रिराचचामाथ स कायतीर्थतः ॥ ५० ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद २ पाण्डुलिपि में "प्रधर्षिणी सच्चुकद्वयीरपः" जैसा लिखा है; छन्द के लिए "सच्चुलक" (चार अक्षर) चाहिए। पाद ३ "ऽन्तरपि प्रशोधयन्" ("विप्रशोधयन्" जैसा दिखता है; "यौ" ऊपर संशोधित)। पूर्व पाठ "शिरस्यथाधां समस्तेकात्वष / प्रसाध्यार्थिनी सच्युकईयारमः / ह्योर्निंहुडो उत्ता विप्रशोधये / स्थिरा चचायाध स कामतीर्थतः" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). Pāda 2 is written like "प्रधर्षिणी सच्चुकद्वयीरपः"; the metre requires "सच्चुलक" (four syllables). Pāda 3 reads "ऽन्तरपि प्रशोधयन्" (it looks like "विप्रशोधयन्", with "यौ" corrected above the line). The earlier reading ("शिरस्यथाधां समस्तेकात्वष / प्रसाध्यार्थिनी सच्युकईयारमः / ह्योर्निंहुडो उत्ता विप्रशोधये / स्थिरा चचायाध स कामतीर्थतः") was wrong.
  shlok_en: |
    Then, placing on his head two good handfuls of the water that overpowers all sin, purified outwardly and cleansing himself within as well, he sipped [the water] three times from the kāya-tīrtha [of his palm]. (50)
  translation: |
    समस्तपापनाशिनी गङ्गा के दो चुल्लू जल को शिर पर धारण कर बाह्यशुद्धि सम्पन्न हो भीतर को शुद्ध करते हुए कायतीर्थ से गङ्गाजल का तीन बार आचमन किया ॥ ५० ॥
  notes: |
    सम्पूर्ण पापराशि की समूलोन्मूलन करने वाली उस भगवती गङ्गा के पावन जल के दो चुल्लुओं से अपने शिर का मार्जन कर बाह्य शुद्धि से पूर्ण सन्तुष्ट होकर अन्तःशुद्धि के लिए काय तीर्थ (अर्थात् दाहिने हाथ के मध्यभाग) द्वारा गङ्गाजल का तीन बार आचमन कर अपने को पूर्ण पवित्र समझा। ५०
  translation_en: |
    Placing on his head two handfuls of the water of the Gaṅgā, destroyer of all sins, and having achieved outer purity, he sipped Gaṅgā water three times from the kāya-tīrtha, purifying himself within. (50)
  notes_en: |
    Sprinkling his head with two handfuls of the holy water of the goddess Gaṅgā, who uproots the whole mass of sin, and fully content with his outer purity, he sipped Gaṅgā water three times through the kāya-tīrtha (that is, the middle part of the right hand) for inner purity, and considered himself wholly purified. (50)
- p: 26
  v: "51"
  shlok: |
    गुणस्मृतेर्गद्गदवाङ्महामुनिः
    प्रबुद्धलोमाञ्चितवेपथुश्चिरम् ।
    संयोज्य हस्तौ हृदये सुमान्वितौ
    प्रचक्रमे स्तोतुमसौ सुरापगाम् ॥ ५१ ॥
  manuscript_note: |
    वृत्त: उपजाति (पाद १, २, ४ वंशस्थ; पाद ३ इन्द्रवंशा)। पूर्व पाठ "गुणस्मृते … / … धेषयुश्चिरम् / संधोटस हानी हरये सुभावतो / … स्तोतुमथो…" भ्रान्त था।
  manuscript_note_en: |
    Metre: Upajāti (pādas 1, 2 and 4 Vaṃśastha; pāda 3 Indravaṃśā). The earlier reading ("गुणस्मृते … / … धेषयुश्चिरम् / संधोटस हानी हरये सुभावतो / … स्तोतुमथो…") was wrong.
  shlok_en: |
    At the remembrance of her virtues the great sage's voice faltered; his hair stood on end and he trembled for a long while. Joining his flower-filled hands at his heart, he began to praise the river of the gods. (51)
  translation: |
    यशस्वती गङ्गा के गुणस्मरण से महामुनि की वाणी गद्गद हो उठी, शरीर में आनन्दातिरेक से चिरकालतक कम्पन के साथ रोमाञ्च व्याप्त हो गया। कुसुमान्वित हाथों को हृदय में जोड़कर देवी गङ्गा की स्तुति करना प्रारम्भ किये ॥ ५१ ॥
  notes: |
    समस्त विश्वपावनी भगवती गङ्गा के अनन्त गुणराशि के स्मरण मात्र से महामुनि मृकण्डु की वाणी सहसा गद्गद हो उठी, आनन्द की अतिशयिता से सकम्पन शरीर की समस्त रोमराजि कण्टकित हो उठी (समस्त रोंगटे अचानक खड़े हो गये) सश्रद्ध दोनों हाथों में पुष्पों की राशि लेकर हृदय से लगाकर परमाराध्या भगवती देवनदी गङ्गा की स्तुति करना प्रारम्भ किया। ५१
  translation_en: |
    At the remembrance of the glorious Gaṅgā's virtues, the great sage's voice choked; from excess of joy, trembling and thrilling of the hair spread through his body for a long time. Joining his flower-filled hands at his heart, he began to praise the goddess Gaṅgā. (51)
  notes_en: |
    At the mere remembrance of the endless virtues of the goddess Gaṅgā, who purifies the whole world, the great sage Mṛkaṇḍu's voice suddenly choked; from the excess of joy all the hair of his trembling body bristled (all his hair suddenly stood on end). With faith, taking heaps of flowers in both hands and holding them to his heart, he began to praise the most worshipful goddess, the divine river Gaṅgā. (51)
- p: 26
  v: "52"
  shlok: |
    जनस्य गोलोकगतस्य वाञ्छया
    समुद्दिधीर्षुर्भगवान् परात्परः ।
    अलौकिकं रासमियेष संस्फुटं
    दयामयीं दर्शयितुं स्विकां तनुम् ॥ ५२ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ "जनान् गोलोकगतस्य / … रासमियेष संयुगे / दयामयों…" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). The earlier reading ("जनान् गोलोकगतस्य / … रासमियेष संयुगे / दयामयों…") was wrong.
  shlok_en: |
    At the longing of the folk who had gone to Goloka, the Lord beyond the highest, wishing to raise them up, desired the unearthly rāsa, so as to show plainly his own compassionate form. (52)
  translation: |
    गोलोकगत व्यक्ति की इच्छा से परात्पर भगवान् उन्हें उद्धार करने की कामना वाले होकर अलौकिक रासक्रीडा करने की इच्छा की। और दयामयी संस्फुट अपने आपके शरीर को दिखाने के लिए भी रास की इच्छा की ॥ ५२ ॥
  notes: |
    अनन्त ब्रह्माण्ड नायक परात्पर भगवान् ने अपने गोलोक के निवासी स्वजनों की उत्कट अभिलाषा से अभिभूत होकर अलौकिक रासक्रीडा करने की इच्छा की और उनके समुद्धार हेतु अपनी परा प्रकृति को स्पष्ट स्वरूप देने की अभिलाषा से अपनी दयामयी मूर्ति का प्रत्यक्ष दर्शन देने का भी [unclear: अनुभव] किया। ५२
  translation_en: |
    At the wish of those who had gone to Goloka, the Lord beyond the highest, wishing to deliver them, desired to perform the unearthly rāsa play; and he desired the rāsa also in order to show his own compassionate body plainly. (52)
  notes_en: |
    The Lord beyond the highest, master of endless universes, overcome by the ardent longing of his own people dwelling in Goloka, wished to perform the unearthly rāsa play; and, wishing to give his supreme nature a visible form for their deliverance, he also [unclear] to give them a direct sight of his compassionate figure. (52)
- p: 27
  v: "53"
  shlok: |
    दया च या जीवगता विभाव्यते
    श्रुतौ श्रुतिभ्यां न च नेत्रगोचरा ।
    तदार्द्रता क्वेति कथं विमृश्यतां
    तदार्द्रमूर्तिर्भवती प्रदृश्यते ॥ ५३ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पूर्व पाठ में पाद ३ नहीं था, और "विमले / श्रुतिभ्यो" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). The earlier reading lacked pāda 3 entirely, and its "विमले / श्रुतिभ्यो" was wrong.
  shlok_en: |
    "The compassion that is perceived as dwelling in living beings is heard by the two ears but is not seen by the eye. How, then, should one consider where its tenderness lies? You are seen as its melting form." (53)
  translation: |
    जीवगता जो दया विभावित (प्रतीत) होती है उसे कानों से सुना जा सकता है वह नेत्र-दृश्य नहीं होती। उस दया से आर्द्रता कहाँ कैसी? विचार करें, नेत्रगोचर वह दया तो अत एव दयार्द्रमूर्ति भगवती गङ्गा दिखाई देती हैं ॥ ५३ ॥
  notes: |
    संसार के सभी प्राणियों में एक आन्तरिक हृदय की स्निग्धता (जिसे दया कहते हैं) वह प्रायः समस्त प्राणियों में अव्यक्त रूप से स्थित रहती है, उसे केवल कानों से ही सुना जाता है वह कभी भी किसी प्राणी के आँखों के समक्ष दिखाई नहीं देती, वह अदृश्य हार्दिक करुणा एवं आर्द्रता (दया) कहाँ कैसी होती है इसका विचार करें तो लगता है कि वही मानवीय हार्दिक दयार्द्रता की प्रत्यक्ष मूर्तिस्वरूपा आप भगवती गङ्गा स्वयं विश्वकल्याणार्थ व्यक्त स्वरूप में प्रत्यक्ष दिखाई देती हैं। ५३
  translation_en: |
    "The compassion that is felt (perceived) in living beings can be heard of with the ears; it is not seen with the eye. Where and of what kind is the tenderness of that compassion? Consider: that compassion, made visible, is therefore seen as the goddess Gaṅgā, the form melting with compassion." (53)
  notes_en: |
    "In all the creatures of the world there is an inner tenderness of heart (which is called compassion). It dwells, mostly unmanifest, in all creatures; it is only heard of with the ears and is never seen before anyone's eyes. If we consider where and of what kind that invisible heartfelt pity and tenderness (compassion) is, it seems that you, goddess Gaṅgā, the visible embodiment of that same human, heartfelt tenderness, are yourself plainly seen in manifest form for the good of the world." (53)
- p: 27
  v: "54"
  shlok: |
    द्रुतस्य रासे शिवदर्शनादहो
    ह्यलौकिकस्यास्य महाप्रभोरयम् ।
    पयःप्रवाहो जगतो हितोद्यत-
    स्तदार्द्रमूर्तिर्भवती प्रदृश्यते ॥ ५४ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। पाद २ का अन्त "महाप्रभोरयम्" (अक्षर "महाप्रभोरर्यम्" जैसे दिखते हैं)। पूर्व पाठ में पाद २ नहीं था, और "शिवदर्शनादतो / यः प्रवाहः जगत् हितोद्यतः" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). Pāda 2 ends "महाप्रभोरयम्" (the letters look like "महाप्रभोरर्यम्"). The earlier reading lacked pāda 2 entirely, and its "शिवदर्शनादतो / यः प्रवाहः जगत् हितोद्यतः" was wrong.
  shlok_en: |
    "Ah! This stream of water of the unearthly great Lord, who melted in the rāsa at the sight of Śiva, set out for the good of the world: you are seen as its melting form." (54)
  translation: |
    रासक्रीडा में शिवदर्शन से द्रवित अलौकिक महाप्रभु के जलप्रवाह ही संसार के हितार्थ तत्पर हुआ, अत एव उसी जलप्रवाह आप आर्द्रमूर्ति दिखाई देती हैं ॥ ५४ ॥
  notes: |
    आनन्दकन्द श्रीकृष्णचन्द्र के गोलोक में जब अलौकिक रासक्रीडा चल रही थी उस समय आकस्मिक रूप से भगवान् शम्भु के रासलीला दर्शनार्थ उपस्थित हो जाने पर व्रजेन्द्रनन्दन के शरीर में सहसा विश्वकल्याणार्थ अद्भुत प्रकम्पन हो उठा जिससे उनका सारा शरीर स्वेदबिन्दुओं से व्याप्त जलप्रवाह रूप में द्रवित हो उठा, वही जलप्रवाह विश्व के कल्याणार्थ आर्द्रमूर्ति स्वरूप आप भगवती विष्णुपदी गङ्गा प्रत्यक्ष दिखाई दे रही हैं। ५४
  translation_en: |
    "In the rāsa play, the stream of water of the unearthly great Lord, melted at the sight of Śiva, became ready for the good of the world; therefore you, that same stream of water, are seen as the melting form." (54)
  notes_en: |
    "When the unearthly rāsa play was going on in the Goloka of Śrī Kṛṣṇacandra, root of bliss, Lord Śambhu suddenly arrived to see the rāsa-līlā. At that, a wonderful trembling suddenly arose, for the good of the world, in the body of the son of the lord of Vraja, so that his whole body melted into a stream of water covered with drops of sweat. You, goddess Viṣṇupadī Gaṅgā, are that same stream, plainly seen as the melting form for the good of the world." (54)
- p: 28
  v: "55"
  shlok: |
    विलीनभावं सुविलोक्य शम्भुना
    धृतस्य मूर्ध्ना विनयेन साम्प्रतम् ।
    स्वरूपिणी तस्य पुनः स्वरूपदा
    तदार्द्रमूर्तिर्भवती प्रदृश्यते ॥ ५५ ॥
  manuscript_note: |
    वृत्त: वंशस्थ (चारों पाद शुद्ध)। श्लोक-संख्या के पहले "स्य" लिखा है (सम्भवतः असावधानी)। पूर्व पाठ "धृता मुधैव जटायन… / हतारथिनी तव पुनन्न स्वरूपा" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha (all four pādas scan). "स्य" is written before the verse number (probably a slip). The earlier reading ("धृता मुधैव जटायन… / हतारथिनी तव पुनन्न स्वरूपा") was wrong.
  shlok_en: |
    "Seeing the melted state of him whom Śambhu now humbly bore on his head, you, bearing his form and again bestowing his form, are seen as its melting form." (55)
  translation: |
    भगवान् शिव द्वारा विनयपूर्वक शिर से धारण किये जाने से सम्प्रति अपने विलीनभाव को देखकर आप पुनः यथानुरूप शिवस्वरूपदायिनी - विष्णुरूपदायिनी रूपवाली हो गईं अतः आप दयार्द्रमूर्ति दिखाई देती हैं ॥ ५५ ॥
  notes: |
    वहाँ आपको भगवान् शिव द्वारा अतिशय विनम्रतापूर्वक अपने शिर पर धारण किया गया, जिससे आपका स्वरूप अदृश्य हो गया, किन्तु पुनः आप विश्वकल्याणकारिणी होकर सांसारिक प्राणियों को शिव विष्णु स्वरूप प्रदान की अभिलाषा से आप दयार्द्र स्वरूप जलमयी होकर इस गङ्गा के स्वरूप में प्रत्यक्ष दर्शन दे रही हैं। ५५
  translation_en: |
    "Because Lord Śiva humbly holds you on his head, seeing now your melted state, you have again taken a form that, as befits, bestows the form of Śiva and the form of Viṣṇu; therefore you appear as the form melting with compassion." (55)
  notes_en: |
    "There Lord Śiva, with great humility, held you on his head, so that your form became invisible. But again, becoming the bringer of welfare to the world, wishing to grant worldly creatures the form of Śiva and Viṣṇu, you, made of water and tender with compassion, give direct sight of yourself in the form of this Gaṅgā." (55)
- p: 28
  v: "56"
  shlok: |
    अतिद्रवी यज्जगतो हिताय
    शिवस्य विष्णोरपि शक्तिरूर्जिता ।
    शिरस्तनुभ्यामनुलालिता चिरं
    तदार्द्रमूर्तिर्भवती प्रदृश्यते ॥ ५६ ॥
  manuscript_note: |
    वृत्त: वंशस्थ। पाद १ में ११ ही अक्षर हैं (एक अक्षर छूटा प्रतीत होता है); पाण्डुलिपि यथावत्। पाद २ "शक्तिरूर्जिता" (हिन्दी: "उर्जित (वर्द्धित)")। पूर्व पाठ "अतिक्षमी / शिवात्म विष्णोररीय शक्तिदर्जिता / धृता स्तनु भ्यामधुनाऽनुकम्पिता" भ्रान्त था।
  manuscript_note_en: |
    Metre: Vaṃśastha. Pāda 1 has only eleven syllables (one seems to have dropped out); it is kept as written. Pāda 2 reads "शक्तिरूर्जिता" (the Hindi has "उर्जित (वर्द्धित)", "strengthened (increased)"). The earlier reading ("अतिक्षमी / शिवात्म विष्णोररीय शक्तिदर्जिता / धृता स्तनु भ्यामधुनाऽनुकम्पिता") was wrong.
  shlok_en: |
    "The exceedingly fluid power of Śiva and of Viṣṇu, strengthened for the good of the world and long cherished by [Śiva's] head and [Viṣṇu's] body: you are seen as its melting form." (56)
  translation: |
    संसार-हितार्थ शिव-विष्णु की अतिद्रवी शक्ति उर्जित (वर्द्धित) हुई। भगवान् शिव ने शिर पर धारण कर चिरकाल तक लालित किया और भगवान् विष्णु ने चरणों में चिरकाल तक धारण कर लालित किया अत एव आप दयार्द्रमूर्ति आप दिखाई देती हैं ॥ ५६ ॥
  notes: |
    विश्व कल्याण सम्पादन हेतु जो अतिशय द्रवशील शक्ति सम्पन्न (जो विश्व में किसी के पास नहीं) उस परम्परा भगवती देवी देवधुनी को भगवान् शिव ने [unclear] अपने शिर पर तथा भगवान् विष्णु ने अपने शरीर में धारण किया, उन्हीं दोनों की ऊर्जामयी तेजःपुञ्ज स्वरूपिणी द्रवस्वरूपा भगवती गङ्गा आप प्रत्यक्ष दयामूर्तिस्वरूप स्वयं दिखाई दे रही हैं। ५६
  translation_en: |
    "For the good of the world, the exceedingly fluid power of Śiva and Viṣṇu was strengthened (increased). Lord Śiva held it on his head and cherished it for a long time, and Lord Viṣṇu held it at his feet for a long time and cherished it; therefore you appear as the form melting with compassion." (56)
  notes_en: |
    "To bring about the welfare of the world, Lord Śiva [unclear] held on his head, and Lord Viṣṇu held in his body, that goddess, the divine river, endowed with an exceedingly fluid power (which no one else in the world has). You, goddess Gaṅgā, in fluid form, embodying the energy and mass of radiance of those two, are yourself plainly seen as the very form of compassion." (56)
- p: 29
  v: "57"
  shlok: |
    यस्याः पङ्केऽपि रङ्को हसति सुरपतिं स्वैरवृत्त्या प्रतुष्टः
    जुष्टं दृष्ट्वा प्रियाया अनुनयवचनैः शान्तिदानं विलोक्य ।
    रे रे नाकाधिप! त्वं किमिति निजयशो म्लापयस्य[unclear: स्वदित्वा]
    नैवाम्भो विष्णुपद्याः सपदि तु समाचम्य मुक्तिं भजेथाः ॥ ५७ ॥
  manuscript_note: |
    वृत्त: स्रग्धरा। पाद १–३ शुद्ध। पाद ३ का अन्तिम शब्द अनिश्चित है: अक्षर "स्वतन्मो" जैसे दिखते हैं; हिन्दी ("जल का पान न कर") के आधार पर "स्वदित्वा" सम्भावित है। पाद ४ के मध्य खण्ड ("सपदि तु समाचम्य") में छन्दोभङ्ग है (७ के स्थान पर ६ लघु-गुरु क्रम ठीक नहीं बैठता); पाण्डुलिपि यथावत्। पूर्व पाठ "रङ्को … शौरिराक्रन्दयुक्तः / प्रियसमा अनुनय शान्तिं / … विजह्यो यत्स्मरन्तातन्मो- / न्निता राहूतः" भ्रान्त था।
  manuscript_note_en: |
    Metre: Sragdharā. Pādas 1–3 scan. The last word of pāda 3 is uncertain: the letters look like "स्वतन्मो"; "स्वदित्वा" (tasting) is likely from the Hindi ("not drinking the water"). The middle segment of pāda 4 ("सपदि तु समाचम्य") does not scan; kept as written. The earlier reading ("… शौरिराक्रन्दयुक्तः / प्रियसमा अनुनय शान्तिं / … विजह्यो यत्स्मरन्तातन्मो- / न्निता राहूतः") was wrong.
  shlok_en: |
    In whose mud even a pauper, content in his own free way of life, laughs at the lord of the gods, seeing him soothed only by his beloved's entreating words: "Ho, lord of heaven! Why do you let your fame fade, not [unclear: tasting] the water of Viṣṇupadī? Sip it at once and win liberation." (57)
  translation: |
    जिस गङ्गा के कीचड़ में भी सना हुआ गरीब अपनी वृत्ति से सन्तुष्ट होकर देवराज इन्द्र की खिल्ली उड़ाता है। अपनी प्रियतमा इन्द्राणी के प्रीति एवं भर्त्सनामय अनुनयवचनों से शान्तिदान को देखकर कि - अरे-ओ स्वर्गाधिप! गङ्गा के पावन जल का पान न कर क्यों अपने यश को धूमिल कर रहे हो (यह है भर्त्सना) अभी भी कुछ बिगड़ा नहीं शीघ्रतापूर्वक गङ्गाजल पान कर मुक्ति के भागी बनो (यह है प्रीति वचन) ॥ ५७ ॥
  notes: |
    अरी माँ विष्णुपगे! आपके कीचड़ में भी सना हुआ अत्यन्त दरिद्र व्यक्ति अपनी दयनीय स्थिति में सन्तुष्ट रहता हुआ भी परमैश्वर्यशाली देवराज इन्द्र की भी सर्वलक्ष्मी का तिरस्कार करते हुए उपहासपूर्वक कहता है कि हे देवराज, महेन्द्र! आज भी आप अपनी प्रियतमा शची देवी के प्रणयपूर्ण एवं समयोचित भर्त्सनापूर्ण विविध अनुनयवचनों द्वारा शान्ति को पा रहे हो? अरे स्वर्लोकाधिपति महाराज महेन्द्र! क्यों आज भी आप भगवती स्वर्धुनी देवी गंगा के जल का पान न कर अपनी देवाधिराज की महनीय यशस्विता का विनाश क्यों कर रहे हैं जिससे आपकी यशःमलिनता विश्व में व्याप्त हो रही है। अरे! अभी क्या बिगड़ा है? देवराज! अभी आप तत्काल अत्यन्त शीघ्रतापूर्वक गङ्गाजल का पान कर सद्यः मुक्तिफल प्राप्त करें एवं यशस्वितालाभ भी। भगवती गङ्गा के प्रति विरक्त व्यक्तियों के प्रति भर्त्सनापूर्वक अनुनयवचनों से गङ्गा महिमा का सदुपदेश है। ५७
  translation_en: |
    A poor man, smeared even with the mud of the Gaṅgā, content with his way of life, mocks Indra, king of the gods. Seeing [Indra] given peace by the loving yet chiding words of entreaty of his beloved Indrāṇī, [he says]: "Ho there, lord of heaven! Why are you dimming your fame by not drinking the holy water of the Gaṅgā?" (this is the rebuke); "nothing is lost yet; drink Gaṅgā water quickly and become a sharer in liberation" (these are words of affection). (57)
  notes_en: |
    O Mother, who flows from Viṣṇu's foot! A very poor man, smeared even with your mud, though content in his pitiable state, scorns all the wealth even of Indra, the supremely glorious king of the gods, and says mockingly: "King of the gods, Mahendra! Even today do you find peace through the many loving, timely and chiding words of entreaty of your beloved, the goddess Śacī? Ho, lord of the heavenly world, great king Mahendra! Why, even today, do you not drink the water of the goddess Gaṅgā, the heavenly river, and so destroy the great glory that belongs to you as overlord of the gods, so that the stain on your fame spreads through the world? Ho! What is lost yet? King of the gods! Drink Gaṅgā water now, at once, with all speed, and gain immediately the fruit of liberation, and the gain of fame as well." Through words of entreaty that chide those indifferent to the goddess Gaṅgā, this is good teaching on the greatness of Gaṅgā. (57)
- p: 29
  v: "58"
  shlok: |
    निःशब्देऽपि प्रदेशे कलकलकलनातत्परैः शब्दजालै-
    राहूयाहूय जीवान् वितरसि सततं जीवनं जीवनाय ।
    क्वेदं दृष्टं दयार्द्रं हृदयमिति चिरं चिन्तयन्तः सदैव
    त्वय्येवाऽऽलम्ब्य मातर्जनुरिदममलं कल्पयामो नितान्तम् ॥ ५८ ॥
  manuscript_note: |
    वृत्त: स्रग्धरा (चारों पाद शुद्ध)। पाद ३ में "चिन्तयन्" के बाद एक शब्द काटा गया है। पूर्व पाठ "मन्दकलकलनातत्परैः / … लेखनं जीवनम् / तन्मेऽह्याद्रैः सुदयामयो ममल कल्पयामि नितान्तम्" (पाद ३–४ एक में मिले) भ्रान्त था।
  manuscript_note_en: |
    Metre: Sragdharā (all four pādas scan). In pāda 3 a word after "चिन्तयन्" is struck out. The earlier reading ("मन्दकलकलनातत्परैः / … लेखनं जीवनम् / तन्मेऽह्याद्रैः सुदयामयो ममल कल्पयामि नितान्तम्", with pādas 3–4 run together) was wrong.
  shlok_en: |
    "Even in a soundless region, with nets of sound intent on murmuring, you call and call to living beings and constantly give them water (life) for their living. Ever pondering, 'Where has such a heart, moist with compassion, been seen?', we, resting on you alone, Mother, make this birth wholly pure." (58)
  translation: |
    क्योंकि हे गङ्गे! आप धन्य हो, निर्जन प्रदेश में भी अपनी कलकल मधुर ध्वनिसमूहों से जीवों को बार-बार बुलाकर निरन्तर जीवित रहने के लिए प्राणप्रद जीवन (जल) प्रदान करती हो। इस प्रकार दया से आर्द्र (ओतप्रोत) हृदय किसने कहाँ देखा? इसी बात का सतत चिन्तन करता हुआ हे माँ! आपका ही आश्रय ग्रहण कर मैं अपने इस जन्म को निर्मल बनाता हूँ ॥ ५८ ॥
  notes: |
    अरी माँ गङ्गे! क्या कोई तुम्हारी [unclear: तुलना कर सकता] है? क्योंकि माँ, जनशून्य एकान्त निःशब्द स्थानों में भी निरन्तर कलकल मधुर ध्वन्यात्मक शब्दावलियों से विविध जीव समूहों को अपने निकट बुलाकर उन्हें जीवित रहने के लिए अपना जीवन (जलराशि) निःसंकोच वितरण करती रहती हो। अरी माँ गङ्गे! आपजैसी दयार्द्र हृदयवाली जननी क्या कहीं किसीने देखा है? इन्हीं बातों को निरन्तर विचार करता हुआ आज मैं इस क्षुद्र जीवन को निर्मल बनाकर आपमें समाहित होना चाहता हूँ। ५८
  translation_en: |
    "For, O Gaṅgā, you are blessed: even in a deserted land, with your sweet murmuring sounds you call living beings again and again and constantly give them life-giving water (jīvana) so that they may live. Who has ever seen, anywhere, a heart so moist (steeped) with compassion? Constantly thinking of this, O Mother, taking refuge in you alone, I make this birth of mine pure." (58)
  notes_en: |
    "O Mother Gaṅgā! Can anyone [unclear: compare with] you? For, Mother, even in lonely, deserted, soundless places, with your constant sweet murmuring strings of sound you call many kinds of creatures near you and freely keep giving them your life (your waters) so that they may live. O Mother Gaṅgā! Has anyone anywhere seen a mother with a heart as moist with compassion as yours? Constantly thinking on these things, today I wish to make this petty life pure and to merge into you." (58)
- p: 31
  v: "61"
  shlok: |
    शिक्षासञ्चारचक्रेऽप्यनिरतगमने बाधकाबाधपूर्वं
    धैर्यं गाम्भीर्यभावात् स्वयमवनिगता सन्दिशन्ती जनौघान् ।
    तुच्छे लोकस्य दृष्ट्या निजशरणगते कुर्वती स्वच्छभावं
    लोकेऽपूर्वं रहस्यं प्रकटयसि ततस्त्वत्पदाब्जं श्रयामः ॥ ६१ ॥
  manuscript_note: |
    वृत्त: स्रग्धरा (चारों पाद शुद्ध)। पूर्व पाठ "गमनिरहगमने बाधकस्योद्भवं / … क्षणमनिगता गच्छन्ती मन्दयानम् / … शिजसहागते … / … प्रकटयितलतस्त्वत्पदान्जे…" भ्रान्त था, और श्लोक-संख्या "५९" भूल थी।
  manuscript_note_en: |
    Metre: Sragdharā (all four pādas scan). The earlier reading ("गमनिरहगमने बाधकस्योद्भवं / … क्षणमनिगता गच्छन्ती मन्दयानम् / … शिजसहागते … / … प्रकटयितलतस्त्वत्पदान्जे…") was wrong, and its verse numeral "५९" was a slip.
  shlok_en: |
    "Unceasing in your course even in the wheel of spreading teaching, [arriving] before any obstructer could obstruct, you came down to earth of yourself and, from your gravity, bring the multitudes the message of steadfastness. Making pure in heart one whom the world's eye counts lowly, once he takes refuge in you, you reveal to the world a mystery never seen before; therefore we resort to your lotus feet." (61)
  translation: |
    शिक्षासञ्चार चक्र में गति न रुकने पर भी बाधक के बाध होने से पहिले गम्भीरतापूर्वक पृथ्वीतल पर आकर जनसमूहों को धैर्य का सन्देश देती हुई। लोकदृष्टि तुच्छ माने गये व्यक्ति के शरणागत होने पर स्वच्छ भाव को करती हुई आप संसार में अपूर्व रहस्य का उद्घाटन करती हैं अतः मैं आपके चरणकमलों का आश्रय लेता हूँ ॥ ६१ ॥
  notes: |
    समस्त विश्व में [unclear: भक्त्युद्रेक] की महत्ता का प्रतिपादन के लिए विविध बाधाओं के होने पर उससे निर्बाध होकर भक्ति प्राप्ति की शिक्षा देने के लिए निरन्तर गतिशील इस भूमि पर आकर परम धीरता का उपदेश देती हुई प्राणियों को आगे बढ़ने का सन्देश दे रही है। सांसारिक दृष्टि से अत्यन्त तुच्छ दीनहीन होने पर भी उन्हें अपने शरण में लेकर अपनी उदात्त उदारता का परिचय देकर हार्दिक निर्मलता के रहस्य को अभिव्यक्त कर पवित्रता का पाठ पढ़ाती हो अतः माँ आज मैं आपके चरणकमलों का आश्रयण कर रहा हूँ। ६१
  translation_en: |
    "Though your motion does not stop in the wheel of spreading teaching, before the obstructer could obstruct you came with gravity to the surface of the earth, giving the multitudes of people the message of steadfastness. When one counted lowly in the world's eyes comes to you for refuge, you make his heart pure; thus you reveal an unprecedented mystery in the world. Therefore I take refuge at your lotus feet." (61)
  notes_en: |
    "To establish in the whole world the importance of the [unclear: surge of devotion], and to teach how to attain devotion unhindered despite many obstacles, you came to this earth, ever moving, teaching supreme steadfastness and giving creatures the message to go forward. Though people are very lowly, poor and wretched in the world's eyes, you take them into your refuge, show your noble generosity, reveal the mystery of purity of heart and teach the lesson of holiness. So, Mother, today I take refuge at your lotus feet." (61)
- p: 31
  v: "62"
  shlok: |
    त्वय्येवात्मनिवेदनं सुजनुषां सञ्जाघटीत्यर्थतः
    अन्येषाञ्च तदौपचारिकमिति प्रत्यक्षतो दृश्यते ।
    त्वां हित्वाऽन्यददृष्टनिर्गुणतरं ज्योतिः कथं ध्यायतां
    ध्यानं निर्विषयेऽवकाशमलभं [unclear: दम्भार्थञ्च] समाश्रितम् ॥ ६२ ॥
  manuscript_note: |
    वृत्त: शार्दूलविक्रीडित। पाद १–३ शुद्ध। पाद ४ का उत्तरार्ध अनिश्चित है: अक्षर "…मलभद्व्यर्थञ्च सम्माश्रितम्" जैसे दिखते हैं; हिन्दी ("केवल दम्भाश्रित") के आधार पर "दम्भ" अभिप्रेत प्रतीत होता है; इस पाठ में एक अक्षर अधिक है। पूर्व पाठ "सेन्जाघटीत्यर्थतः / अन्येष्वञ्च तदोपचारिकमिति / त्वाहित्वा सदहन्निगुर्गुणतरं / … दृश्यर्थ च…" भ्रान्त था, और श्लोक-संख्या "६०" भूल थी।
  manuscript_note_en: |
    Metre: Śārdūlavikrīḍita. Pādas 1–3 scan. The second half of pāda 4 is uncertain: the letters look like "…मलभद्व्यर्थञ्च सम्माश्रितम्"; the Hindi ("resting only on pretence") suggests "दम्भ" (pretence) is meant; the reading given has one syllable too many. The earlier reading ("सेन्जाघटीत्यर्थतः / अन्येष्वञ्च तदोपचारिकमिति / त्वाहित्वा सदहन्निगुर्गुणतरं / … दृश्यर्थ च…") was wrong, and its verse numeral "६०" was a slip.
  shlok_en: |
    "The self-offering of the well-born truly comes about in you alone; that of others is plainly seen to be a mere formality. Leaving you, how can those who meditate on some other unseen light, still more beyond qualities, [claim] meditation, finding room in the objectless? That rests on [unclear: pretence]." (62)
  translation: |
    सज्जनों का आत्मनिवेदन तथ्यतः घटित होता है, क्योंकि अन्य लोगों के प्रति आत्मनिवेदन करना तो प्रत्यक्षतः औपचारिक दिखाई देता है। आप को छोड़कर न दिखाई देने वाला निर्गुणतर ज्योति का ध्यान कैसे किया जा सकता है? निर्विषय में अवकाश (स्थान) प्राप्त होते हैं (यह कहना तो) केवल दम्भाश्रित प्रतीत होता है ॥ ६२ ॥
  notes: |
    जगदाधार माँ गङ्गे! उपर्युक्त तथ्यों तथा आपकी निष्काम निर्बाध संसार सागर से सन्तारण करने की अपूर्व क्षमता और शक्ति जानकर तुम्हें ही अपना सर्वस्व समर्पित कर देना उचित एवं स्वाभाविक है। अन्य स्थानों (देवों तथा मानवों) में आत्मनिवेदन समर्पण करना तो एकमात्र औपचारिकता (प्रदर्शन) मात्र है। माँ प्रत्यक्ष स्वरूपवाली तुम्हें छोड़कर अन्य अदृश्य ज्योति निर्गुण निराकार (प्रकाशपुञ्ज ब्रह्म) का ध्यान कैसे किया जा सकता है? जो लोग निर्गुण निराकार परब्रह्म ज्योतिःस्वरूप के दर्शन का व्यर्थ में दम्भ भरते हैं वे मात्र केवल ढोंगी होते हैं। क्योंकि मन वाणी को अगम अगोचर (सो जानै जो पावै)। न तत्र वाग्गच्छति, न मनः, नेन्द्रियाणि। अतः सगुण स्नेहमयी प्रत्यक्ष मूर्ति मातृस्वरूपा भगवती गङ्गा का हम सदा आश्रयण करते हैं। ६२
  translation_en: |
    "The self-offering of good people truly comes about [in you], for offering oneself to other people is plainly seen to be a formality. Leaving you, how can one meditate on an invisible light even more beyond qualities? [To say that] one finds room (a place) in the objectless seems to rest only on pretence." (62)
  notes_en: |
    "Mother Gaṅgā, support of the world! Knowing the facts above, and your matchless, selfless and unhindered power and ability to carry us across the ocean of worldly existence, it is right and natural to surrender our all to you alone. Self-offering and surrender in other places (to gods and to men) is a mere formality (a show). Mother, leaving you, whose form is before our eyes, how can one meditate on some other invisible light, without qualities and without form (brahman, a mass of light)? Those who vainly boast of seeing the formless supreme brahman, without qualities, whose nature is light, are mere pretenders. For it is beyond the reach of mind and speech ('he knows it who attains it'): 'na tatra vāg gacchati, na manaḥ, nendriyāṇi' (speech does not go there, nor the mind, nor the senses). Therefore we always take refuge in the goddess Gaṅgā, whose form is a mother's, loving, endowed with qualities, visible before us." (62)
- p: 32
  v: "63"
  shlok: |
    इति करकुसुमानि न्यस्य पाथःप्रवाहे
    शिरसि धृतकराग्रो जानुसंस्पृष्टभूमिः ।
    नुतिमथ भगवत्याश्चेतसा [unclear: चाऽऽर्द्र]बुद्ध्या
    मुनिवर उपचक्रे साधु पञ्चाङ्गयुक्ताम् ॥ ६३ ॥
  manuscript_note: |
    वृत्त: मालिनी (चारों पाद शुद्ध)। पाद ३ का "चाऽऽर्द्र" अनिश्चित है (अक्षर "चाऽऽद्रि" जैसे दिखते हैं)। पूर्व पाठ "पाशप्रवाहे / … चोद्धि बुद्ध्या / मुनिवर उमयत्के साधु पश्चाञ्चकार" भ्रान्त था।
  manuscript_note_en: |
    Metre: Mālinī (all four pādas scan). In pāda 3, "चाऽऽर्द्र" is uncertain (the letters look like "चाऽऽद्रि"). The earlier reading ("पाशप्रवाहे / … चोद्धि बुद्ध्या / मुनिवर उमयत्के साधु पश्चाञ्चकार") was wrong.
  shlok_en: |
    Having thus placed the flowers from his hands in the flowing water, holding his fingertips to his head, his knees touching the ground, the excellent sage then duly offered the goddess a praise complete in its five limbs, with his mind and [unclear: tender] understanding. (63)
  translation: |
    हाथ में रखे फूलों को जलप्रवाह में डालकर शिर पर हाथ रखकर पृथ्वी पर दोनों जानुओं को सटाकर मुनिवर मृकण्डु ने भगवती गङ्गा की पञ्चाङ्ग पूर्ण स्तुति चित्त तथा बुद्धि से की ॥ ६३ ॥
  notes: |
    इस प्रकार महामुनि मृकण्डु ने अपने दोनों घुटनों को भूमिसात् कर दोनों हाथों में रखे हुए पुष्पाञ्जलि को भगवती माता गङ्गा के परम पावन [unclear] सदृश जल राशि में प्रवाहित कर दोनों हाथों को शिर पर धारण कर परमाराध्या माता गङ्गा की पूजनपूर्वक स्तुति पूर्ण किया। ६३
  translation_en: |
    Putting the flowers held in his hands into the stream of water, placing his hands on his head and pressing both knees to the earth, the excellent sage Mṛkaṇḍu offered the goddess Gaṅgā a praise complete in its five limbs, with mind and intellect. (63)
  notes_en: |
    Thus the great sage Mṛkaṇḍu, bringing both knees to the ground, let the handful of flowers in his two hands flow into the most holy, [unclear]-like waters of Mother Gaṅgā, placed both hands on his head, and completed the worship and praise of the most adorable Mother Gaṅgā. (63)
- p: 32
  v: "64-66"
  shlok: |
    श्रीचन्द्रभूषणसुधीसुतकेन बच्चू-
    रामस्य पौत्रसुभगेन नवंगुणाढ्यम् ।
    संगुम्फितं सुमनसां मनसाऽङ्घ्रियुग्म-
    मानम्य तेन हि शिवस्य सुशिष्यकेण ॥ ६४ ॥
    धानेश्वरीहृदयजेन शिवार्चकेन
    विद्वज्जनार्चनरता धरणीधरेण ।
    काव्यं सुमङ्गलमयं सुप्रवृत्तिपूर्णं
    शश्वत् समा विजयतां शिवयोः प्रसादात् ॥ ६५ ॥
    दीर्घजीविचरितामृतकाव्ये
    सद्द्विजोचितसदाचरणाढ्ये ।
    [unclear: सर्ग एष प्रथमोऽयमभिधेयो]
    व्यत्यगादिह महेशकृपातः ॥ ६६ ॥
  manuscript_note: |
    वृत्त: श्लोक ६४–६५ वसन्ततिलका, श्लोक ६६ स्वागता। पाण्डुलिपि में तीनों श्लोक लम्बी पंक्तियों में लिखे हैं; यहाँ पादों में विभक्त (पृष्ठ ११८ के समान)। श्लोक ६६ का तीसरा पाद अनिश्चित है: "सर्ग एष प्रथमोऽयमभिधेयो" लिखा है ("प्रथमो" रेखांकित, ऊपर पंक्तियों के बीच एक अस्पष्ट संशोधन), और यह पाठ स्वागता में नहीं बैठता। चौथा पाद "व्यत्यगादिह महेशकृपातः" शुद्ध है। पृष्ठ पर संस्कृत "इति … सर्गः समाप्तः" पुष्पिका-वाक्य नहीं है; पूर्व पाठ में वह जोड़ा गया था, अब हटाया गया।
  manuscript_note_en: |
    Metre: verses 64–65 Vasantatilakā, verse 66 Svāgatā. The manuscript writes the three verses in long lines; they are divided into pādas here (as on page 118). The third pāda of verse 66 is uncertain: it is written "सर्ग एष प्रथमोऽयमभिधेयो" ("प्रथमो" underlined, with an unclear interlinear correction above), and this reading does not scan as Svāgatā. The fourth pāda, "व्यत्यगादिह महेशकृपातः", scans. The page has no Sanskrit "इति … सर्गः समाप्तः" rubric; the earlier transcript had added one, and it has been removed.
  shlok_en: |
    (64) By the son of the wise Śrī Candrabhūṣaṇa, the fortunate grandson of Baccū Rāma, this [poem], rich in the nine virtues, was woven, after bowing in his mind to the feet of the good-hearted, by that good disciple of Śiva. (65) By Dharaṇīdhara, born of the heart of Dhāneśvarī, worshipper of Śiva, devoted to honouring the learned: may this poem, full of auspiciousness and good purpose, be victorious for endless years by the grace of Śiva and Pārvatī. (66) In the poem "The Nectar of the Life of the Long-Lived", rich in the good conduct proper to good brahmins, [unclear: this first canto, so called,] has here come to its close by the grace of Maheśa.
  translation: |
    श्री विद्वद्वरेण्य चन्द्रभूषण के पुत्र, श्री बच्चूराम के पौत्र देवी धानेश्वरी गर्भ जन्मा श्रीपण्डित शिव प्रसाद के सुशिष्य शिव तथा विद्वज्जनपूजक देवों एवं विद्वानों के चरणयुगलों को प्रणाम कर धरणीधर रचित सुप्रवृत्तिपूर्ण मङ्गलमय यह महाकाव्य शिवपार्वती की कृपा से बहुवर्ष पर्यन्त विजयशील हो। सद्द्विजोचित सदाचरणसम्पन्न दीर्घजीवी मार्कण्डेय चरितामृत इस महाकाव्य में महेश भगवान् की कृपा से यह प्रथम [unclear: अनुनामक] सर्ग पूर्ण हुआ ॥ ६४-६५-६६ ॥
  translation_en: |
    Composed by Dharaṇīdhara, son of the learned and excellent Śrī Candrabhūṣaṇa, grandson of Śrī Baccūrāma, born of the womb of the goddess Dhāneśvarī, good disciple of Śrī Paṇḍita Śiva Prasāda, honourer of Śiva and of the learned: having bowed to the pairs of feet of the gods and the learned, may this auspicious mahākāvya, full of good purpose, be victorious for many years by the grace of Śiva and Pārvatī. In this mahākāvya, "The Nectar of the Life of the Long-Lived Mārkaṇḍeya", rich in the good conduct proper to good brahmins, this first [unclear] canto is complete by the grace of Lord Maheśa. (64–66) [In the manuscript the words "धरणीधर रचित" first written after "विद्वज्जनपूजक" are struck out.]
