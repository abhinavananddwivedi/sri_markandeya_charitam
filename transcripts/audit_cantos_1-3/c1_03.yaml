- p: 11
  v: "21"
  g: {he: OK, ne: M, s: C}
  se: |
    Reaching Puṣkaradvīpa, home of people who live ten thousand years, he found no contentment [there]; [nor in the dvīpa] rich in a thousand mountains, adorned with forests and resting places [unclear]. (21)
  he: |
    Sage Mṛkaṇḍu reached Puṣkaradvīpa, where people live for ten thousand years, but was not content. Nor did he consider Krauñcadvīpa, full of thousands of mountains and forests, good for himself. (21)
  ne: |
    First he went and inspected Puṣkaradvīpa, where people's lifespan is ten thousand years, but the place did not suit his mind. From there he went to Krauñcadvīpa and considered, as places to live, its thousands of mountains and valleys and the lovely forests on its many islands; but that dvīpa too did not seem suitable for building his dwelling. (21)
- p: 11
  v: "22"
  g: {he: OK, ne: OK, s: B}
  se: |
    Fearing wounds from being pierced by the tips of kuśa grass, the sage thought Kuśadvīpa inauspicious; and Śālmali, full of the thorns of the śālmali tree as in Yama's abode, did not delight him. (22)
  he: |
    Moved by the fear of being pierced and wounded by the tips of kuśa grass, he considered Kuśadvīpa inauspicious. Hearing that in Yama's abode there are thorny śālmali (silk-cotton) trees, the land of Śālmalidvīpa too gave him no joy. (22)
  ne: |
    Inspecting the various dvīpas, the sage Mṛkaṇḍu reached Kuśadvīpa. Seeing land thick with kuśa grass there, he feared that its sharp tips would pierce and wound him, and considered Kuśadvīpa inauspicious too. Then, hearing in talk of the śālmali tree in Yama's abode that the silk-cotton tree is very thorny, he did not find Śālmalidvīpa desirable or pleasing either; he considered it inauspicious and left it. (22)
- p: 12
  v: "23"
  g: {he: m, ne: m, s: B}
  se: |
    "What is there in living on the land of Śāka?" [So thinking,] he passed over Plakṣa, which gives fruit, and saw the land shining with gold (Jambūdvīpa), surrounded on every side by water. (23)
  he: |
    What will come of serving Śākadvīpa? That is, it is useless. He passed over fruitful Plakṣadvīpa. [He saw the land that is] joined with the Jambū river, and so shining, and surrounded on all sides by the sea. (23)
  ne: |
    "What can be done by living in this ordinary Śākadvīpa?" Thinking of its pointlessness, he passed over Plakṣadvīpa, full of fruit, while looking at it. At last he saw Jambūdvīpa, fully protected and surrounded on all sides by the moat of the sea, jāmbūnada (full of mines of gleaming gold), and very radiant. (23)
- p: 12
  v: "24"
  g: {he: m, ne: m, s: B}
  se: |
    Between the Himālaya and the Vindhya ranges lies the land called Ārya[varta], reaching from the eastern to the western sea; thinking "this gives the good the fruit of their deeds", he came, as if drawn by longing, to the Himālaya. (24)
  he: |
    The middle region between the Himālaya and the Vindhya mountains is famous by the name Āryāvarta; its boundaries are the eastern and western seas. This part of the earth gives the good the fruit of their deeds; drawn by this, he came near the Himālaya. (24)
  ne: |
    The middle region between the Himālaya and the Vindhya ranges is famous by the name Āryāvarta. It is always touched by the waves of the seas on both east and west, and the eastern and western seas mark its boundaries. This land is famous by the name Karmabhūmi (land of action), where the good obtain fruit according to their noble deeds. Moved by these thoughts, and drawn without effort, he arrived in the valley of the Himavān mountain. (24)
- p: 13
  v: "25"
  g: {he: m, ne: m, s: C}
  se: |
    [Partly unclear.] Before him, falling from a cleft in the snowy mountain, issuing like [water through] a gateway at Gomukha, he saw the stream that has long dwelt on Śiva's head. (25)
  he: |
    [The stream] falling downward from the Gomukha that issues from a cave of the Himālaya: he saw the stream that has been present for a long time on the head of Śiva, established since time without beginning. (25)
  ne: |
    Here he saw the clear stream of the goddess Bhāgīrathī, which comes out of a cave of the Himālaya mountain and falls downward to Gomukh, murmuring, and which has been present with great force since time without beginning on the head of Lord Sadāśiva. (25)
- p: 13
  v: "26"
  g: {he: m, ne: m, s: C}
  se: |
    [Partly unclear.] Gazing long and unblinking in that direction and finding contentment like nectar, he, wishing to live there, followed [the river]. (26)
  he: |
    Fixing his unblinking gaze in that direction, he experienced joy like obtaining nectar. Wishing to live [there], devoted to keeping [the ways] of the best of Manu's line, he set off upstream. (26)
  ne: |
    Hearing the murmuring of this flowing, very radiant goddess Bhāgīrathī and gazing at it with unblinking eyes for endless time, Mṛkaṇḍu obtained the highest peace, like obtaining nectar, and kept diving into an ocean of joy. Now, to live on the bank of that holy goddess Gaṅgā, he set off following her stream along her bank, which gives merit. (26)
- p: 14
  v: "27"
  g: {he: OK, ne: m, s: C}
  se: |
    Seeing her, in places moving with mighty speed, [in places with] deep waters and lofty waves, consoling and making a sweet murmur, he deemed his mind's purpose fulfilled. (27)
  he: |
    Seeing the fortunate Gaṅgā, in places moving forward with mighty speed, in places spreading deep whirlpools, with her murmuring sound, he considered his mind fulfilled. (27)
  ne: |
    Following the most revered goddess Gaṅgā, the sage Mṛkaṇḍu saw that this mountain stream in places flowed forward with very great speed, in places spread fearsome whirlpools and turned the mass of water into eddies; and seeing that river of the gods, Gaṅgā, resounding in places with a murmuring sound, he considered his life blessed forever. (27)
- p: 14
  v: "28"
  g: {he: m, ne: m, s: C}
  se: |
    Having gone four yojanas along the bank, he saw the two who roam in Badarī, Nara and Nārāyaṇa, the primal person, and [worshipped them] [the last line is corrupt in the transcription]. (28)
  he: |
    Having gone four yojanas along the river bank, he saw Nara and the primal person Nārāyaṇa, who roam the Badarī forest; worshipping them as prescribed, he was filled with wonder. (28)
  ne: |
    Going downstream along the bank, four yojanas (that is, 16 kos) from the lovely Gomukh of that river of the gods, the sage Mṛkaṇḍu saw the primal persons Nara and Nārāyaṇa, who roam in the Badarī forest, densely covered with badarī trees. Then he worshipped them with due rites and, overjoyed, was struck with wonder and overwhelmed. (28)
- p: 15
  v: "29"
  g: {he: m, ne: m, s: C}
  se: |
    Though he had not seen them before, the ascetic greeted the two again and again [unclear]; for through conversing with and seeing the good, what is in the mind is indeed perceived. (29)
  he: |
    Although that impressed ascetic had not seen the two before, he greeted them. For in conversing with and seeing the good, the feelings in the mind quickly become apparent. (29)
  ne: |
    Although Mṛkaṇḍu had never seen them before, the very radiant figures of the two impressed him greatly, and he began to greet them again and again; for through conversing with and seeing saints and good people, one's own feelings soon show of themselves. (29)
- p: 15
  v: "30"
  g: {he: M, ne: m, s: A}
  se: |
    Seeing their joy at the sight of him, he began to praise them in his mind; and, of his own accord, his mind grown keen with the wish to know, he resolved to speak his heart's desire. (30)
  he: |
    Seeing their great joy at merely seeing him, he began to praise them in his mind. Then the ascetic, whose good thoughts had grown through his wish to know, made an effort to express his feelings. (30)
  ne: |
    On the mere sight of the two primal persons (Nara and Nārāyaṇa), the sage felt great joy in his heart at seeing them. With a collected mind he began to praise those primal persons inwardly. Seeing their unearthly presence and their matchless generosity of heart, the sage Mṛkaṇḍu, out of the wish to know, firmly resolved to express the feelings he desired in his mind. (30)
