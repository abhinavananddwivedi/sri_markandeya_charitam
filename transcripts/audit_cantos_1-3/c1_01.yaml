- p: 1
  v: "1"
  g: {he: M, ne: M, s: C}
  se: |
    When the creator's mind [unclear] wishes to show its own skill, it quietly accomplishes a renowned and extraordinary work; [unclear: the rest of the line is corrupt in the transcription]. (1)
  he: |
    To show his skill in the work of making a poem, the apt intellect of a young maker comes forth, and a renowned, extraordinary work is accomplished; even so, it is fitting that he should suddenly feel abashed at completing that very work. (1)
  ne: |
    Because God, the lord of the endless universe, pervades the work of creating the world, the poet [the transcription reads "कबीर"] wishes to present an example of his finest art. At that time, to show the fullness of his highest skill, he gives his all and creates a wonderful new creation, by which, putting to shame with his highest art even the gods, who are full of divine wealth and are the best form of creation, he creates something wonderful, matchless and wholly praiseworthy. (1)
- p: 1
  v: "2"
  g: {he: m, ne: m, s: B}
  se: |
    Where is life, made very short by the force of the Kali age, and where the sage whose life lasts for seven kalpas? To write the story of Mṛkaṇḍu's son, I take up an iron pen [as best I can]. (2)
  he: |
    Where is my short life, under the influence of the Kali age, and where the sage Mārkaṇḍeya, who lives for seven kalpas? To write the life of such a one, Mārkaṇḍeya, son of Mṛkaṇḍu, I take the support of my iron pen. (2)
  ne: |
    Today, in remembrance of one link of that most exalted creation, I wish to describe his glory with this iron pen of the Kali age, rigid as a post. The life of us worldly beings is fleeting and insignificant in itself, and on top of that there is the influence of this terrible Kali age! Even so, today, in this fleeting life of mine, I wish to tell the most exalted life story of the great sage Mārkaṇḍeya, who makes the long journey of life to the end of seven kalpas (living for seven kalpas). Although this is altogether difficult, I still wish to speak of it. (2)
- p: 2
  v: "3"
  g: {he: OK, ne: m, s: C}
  se: |
    [Partly unclear.] Having worshipped first that one from whose gracious kindness the long-lived sage obtained his boon, as the teachers have shown, I bow to Mṛtyuñjaya, the conqueror of death. (3)
  he: |
    I constantly bow to Lord Mṛtyuñjaya, by whose gracious kindness the sage Mārkaṇḍeya received an honoured boon and became long-lived, having first worshipped him in the way shown by the teachers. (3)
  ne: |
    By worshipping the beginningless, primal god, Lord Sadāśiva Mṛtyuñjaya, and receiving only a particle of the grace that came from his pleasure, the sage Mārkaṇḍeya became long-lived. Today, filled with devotion, I constantly bow to that same Mṛtyuñjaya, the one lord of creation, preservation and dissolution, who removes fear, as shown and relied upon by those who saw before us. (3)
- p: 2
  v: "4"
  g: {he: m, ne: m, s: C}
  se: |
    [Partly unclear.] In the three worlds the glory of the poet's craft constantly grows; therefore I always revere, with respect, the noble-minded son of Pracetas (Vālmīki). (4)
  he: |
    In the three worlds, knowledge filled with the glory of the poet's craft grows quickly and constantly; therefore I always worship with respect the noble-minded Prācetasa (Vālmīki). (4)
  ne: |
    It is generally seen that in these three worlds (the world), even ordinary knowledge, when filled with the poet's craft, keeps growing (through skill, constant practice of the other śāstras, and so on); the direct proof of this is the Maharṣi Vālmīki, son of Pracetas. From my heart I worship that Maharṣi Vālmīki, noble-minded, of noble devotion to the poet's craft, engaged in the welfare of all the world. (4)
- p: 3
  v: "5"
  g: {he: m, ne: m, s: B}
  se: |
    Bali, Vāli's son (Aṅgada), the son of the Wind (Hanumān), Vibhīṣaṇa, Droṇa's son and Kṛpa: may I honour this band of the long-lived, together with Bhārgava Rāma. (5)
  he: |
    Bali, Vāli's son, Hanumān, Vibhīṣaṇa, Droṇa's son Aśvatthāmā, Kṛpācārya and Bhārgava Rāma (Paraśurāma): I remember all these long-lived ones, wishing to obtain a boon and success. (5)
  ne: |
    Among those who attained long life to the end of seven kalpas, like my hero, I first, for the completion [of the work] before [describing his] devotion to Śiva, bow from the heart to this group of seven long-lived ones: Hanumān, son of the Wind; the great Vibhīṣaṇa, lord of Laṅkā and single-minded devotee; Aśvatthāmā, son of Droṇa, a matchless and most daring warrior; the wise Guru Kṛpa, family teacher of the Kauravas and Pāṇḍavas and eyewitness of the Mahābhārata war; Bali, king of the daityas; and Bhārgava Rāma (Paraśurāma), so that they may give me the ability to accomplish my aim. (5)
- p: 3
  v: "6"
  g: {he: m, ne: m, s: C}
  se: |
    My mind is not absorbed in gaining poetic skill, nor have I thought even a little of spreading my fame; since [by remembrance] one gains the highest immortality, [I tell] that story [unclear]. (6)
  he: |
    My mind is not engaged in gaining poetic skill, nor have I even a little desire to spread my fame; because remembrance attains immortality, therefore my mind has become ready to tell the story. (6)
  ne: |
    Putting aside the pride of the poet through the feeling in his heart, the poet says: I have no wish to become famous as a distinguished poet. I have not the least desire for my own fame and renown; but the highest immortality is gained through remembrance, so the wish to tell the story of Maharṣi Mārkaṇḍeya has settled in my mind. (6)
- p: 4
  v: "7"
  g: {he: m, ne: m, s: B}
  se: |
    Order and truth were born from kindled austerity; from that the night was born, and from that the surging ocean. From the surging ocean the year was born, ordaining days and nights, ruler of all that blinks. (7) [This is the Ṛgvedic aghamarṣaṇa hymn, RV 10.190.1–2, quoted with small variations.]
  he: |
    After the dissolution, from the austerity of the Supreme Self arose ṛta (truth of the mind) and satya (truth of speech); after that night arose. Then the ocean (arṇava) came into being, which became the regulator of day and night and of time. (7)
  ne: |
    In the state of total emptiness at the time of dissolution, ṛta and satya arose from the resolve of the Supreme Self. After this, from the dark night and from the ocean that covered everything with water, the divisions of time were made, years, months, lunar days and so on, which regulate and run the whole world. (7)
- p: 4
  v: "8"
  g: {he: m, ne: m, s: C}
  se: |
    [Largely unclear.] In the beginning, from the changeless [Nature] the unmanifest qualities appeared; [then] Hiraṇyagarbha, lord of embodied beings, the supreme Prajāpati [arose]. (8)
  he: |
    From changeless Nature, made of the three guṇas, the unmanifest qualities arose first; after that Prajāpati Hiraṇyagarbha, the lord of embodied beings, appeared. (8)
  ne: |
    From the inner consciousness of the Supreme beyond all, unchanged Nature made of the three guṇas (sattva, rajas, tamas) appeared. After that, the first Prajāpati, Hiraṇyagarbha, arose in the whole world; he is called in the Vedic literature the material cause of creation. (8)
- p: 5
  v: "9"
  g: {he: m, ne: m, s: D}
  se: |
    [The Sanskrit as transcribed ("जो नही चतुर्मुख प्रजापति चहा / तमन्ना शरीरिणां") is not construable; it needs re-reading from the scan.] (9)
  he: |
    The four-faced Prajāpati created the four kinds of dwellings (worlds) for living beings, and various flowering plants and lands. (9)
  ne: |
    The self-born Prajāpati, by his mental power, keeping balance in the natural state, created all the worlds, the world of the gods, the world of men, Pātāla and the rest, and made various realms for beings to live in according to their qualities and deeds. (9)
- p: 5
  v: "10"
  g: {he: m, ne: m, s: C}
  se: |
    [Partly unclear.] Then that great-minded one, [considering creation], created the gods, the sages, the lights and the planets. (10)
  he: |
    That very wise Prajāpati, having thought about mental creation, created the gods, the sages, the hosts of lights and the planets. (10)
  ne: |
    The glorious Prajāpati, of boundless intellect, thought about making a mental creation full of various qualities, and then created in order the gods, the sages, the masses of light (stars) and all the planetary spheres. (10)
