    वृत्त: श्लोक ५३–५४ वसन्ततिलका, श्लोक ५५ स्वागता। यह वही पुष्पिका-त्रयी है जो पृष्ठ ३२ और ११८ पर है; पाठ पृष्ठ ८६ से पढ़कर उन्हीं के अनुरूप पादों में विभक्त किया गया (पूर्व पाठ "बन्धुपौत्रेण / ज्ञानेश्वरी चरणयोजन / संकाव्यं सुसङ्गलमयं…" भ्रान्त था)। श्लोक ५५ का अन्तिम पाद "सर्ग आशु गमितोऽस्ति तृतीयः" स्वागता में शुद्ध है; तीसरे पाद का उत्तरार्ध अस्पष्ट है। पृष्ठ पर संस्कृत "इति … सर्गः समाप्तः" पुष्पिका-वाक्य नहीं है; त्रयी के बाद लिपिकार का "विशेष" और "यहाँ तृतीय सर्ग पूर्ण हुआ" आता है। पूर्व पाठ में जोड़ा गया पुष्पिका-वाक्य हटाया गया।
