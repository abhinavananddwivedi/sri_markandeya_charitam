# Canto-3 targeted Sanskrit re-read, Claude (Opus 5.5), 2026-10-25.
# Scope: only the verses whose lines failed the Rathoddhatā scan (triage via scripts/tools/scan_metre.R), plus a full
# re-read of p086 (v52 and the colophon). Each flagged verse was read from an upright crop of the scan. Hindi and notes
# were not re-read. Applied with scripts/tools/apply_page_patches.R.
# Canto-3 metre: Rathoddhatā (ऽ।ऽ।।।ऽ।ऽ।ऽ). Prosodic licence: in this poem a short vowel before "pr"/"kr" is often
# treated as light (e.g. "प्रातरेव प्रविकल्प्य"); such lines were left as written.
- p: 61
  v: "1"
  shlok: |
    शक्तिरस्ति तपसः प्रभावतो
    गन्तुमेक दिन एव दर्दुरम् ।
    किन्तु लोकपरिशिक्षणाय य-
    त्पर्यगात् खलु पदातिरेव सः ॥ १ ॥
  manuscript_note: |
    वृत्त: रथोद्धता (चारों पाद शुद्ध)। पूर्व पाठ "शक्तिरासीत् / …शिक्षणार्थ य- / त्पर्य्यटात्स…" भ्रान्त था।
  manuscript_note_en: |
    Metre: Rathoddhatā (all four pādas scan). The earlier reading ("शक्तिरासीत् / …शिक्षणार्थ य- / त्पर्य्यटात्स…") was wrong.
  shlok_en: |
    By the power of his austerity he had the strength to reach Dardura in a single day; but, to teach the world, he went there on foot. (1)
- p: 62
  v: "3"
  shlok: |
    दाक्षिणा समुपदिष्टमाश्रमं
    निश्चितं समयकारि गन्तुकः ।
    तिर्यगग्निदिशि [unclear]
    गङ्गया समनुमोदितो ययौ ॥ ३ ॥
  manuscript_note: |
    वृत्त: रथोद्धता। पाद १ "दाक्षिणा" (= दक्षपुत्र दाक्षि द्वारा; टिप्पणी: "दक्षपुत्र (दधि)") और "समुपदिष्टम्" छन्द से; पूर्व पाठ "दाक्षिण्या समुद्दिष्ट मार्गं" (९ अक्षर) भ्रान्त था। पाद ३ का उत्तरार्ध अस्पष्ट है ("…वाहिनी…" जैसा); पूर्व पाठ "वह्निसंज्ञकायाम्" छन्द में नहीं बैठता। पाद ४ "गङ्गया" (पूर्व "गङ्गाया")।
  manuscript_note_en: |
    Metre: Rathoddhatā. Pāda 1 reads "दाक्षिणा" (by Dākṣi, Dakṣa's son; the note says "दक्षपुत्र") and "समुपदिष्टम्", as the metre requires; the earlier "दाक्षिण्या समुद्दिष्ट मार्गं" (nine syllables) was wrong. The second half of pāda 3 is unclear (it looks like "…वाहिनी…"); the earlier "वह्निसंज्ञकायाम्" does not scan. Pāda 4 reads "गङ्गया" (earlier "गङ्गाया").
  shlok_en: |
    Having fixed on the hermitage pointed out by Dākṣi, the traveller, keeping to his time, set out in the oblique, south-eastern direction [unclear], with the Gaṅgā's assent. (3)
- p: 62
