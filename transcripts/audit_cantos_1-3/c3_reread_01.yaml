    source: "Transcribed via antigravity by the user (2026-08/2026-09) from the manuscript scan ('dialect B' markdown). Slokas 53-55 are the recurring colophon triad, whose Hindi gloss the manuscript defers to page 32 ('श्लोकों का अर्थ कृपया पृष्ठ ३२ में अवलोकन करें'); that verse carries only the pointer and the Hindi canto-close as translation. 2026-10-25: Claude re-read the triad from the scan and aligned it with pages 32 and 118; the Sanskrit rubric formerly appended to it is not on the page and was removed. Verse 52 could not be resolved and is flagged in its manuscript_note."
