page_number_devanagari: "७१"
page_number_arabic: 71
image: "images/pages/p071.jpg"
verses:
  - number: 21
    shlok: |
      वामहस्तकुशकाण्डच दक्षिणे
      सत्पवित्रसहितं कुशत्रयम् ।
      तर्जनीं जपवटोर्बहिस्कृतां
      वेदमातृजपतत्परान्मुनीन् ॥ २१ ॥
    shlok_en:
      author: ai_translation
      text: |
        [He saw] sages intent on the japa of the Mother of the Vedas (Gāyatrī), with a stalk of kuśa in the left hand and in the right three kuśa blades with the pavitra, the forefinger kept outside the japa bag. (21)
    translation:
      author: amanuensis
      text: |
        कहीं पर उन्होंने बायें हाथ में कुशों को दाहिने हाथ में पवित्री (पैंती) के साथ तीन कुशों को धारण किये हुए, जपकाल में ब्रह्मचारी की तर्जनी अंगुली को गोमुखी से बाहर करते हुए वेदमाता गायत्री मन्त्र के जप के तत्पर मुनियों को देखा ॥ २१ ॥
    notes:
      author: grandfather
      text: |
        उन्होने कहीं पर बाँये हाथ में कुशमुष्टि धारण किए हुए, तथा दक्षिण हाथ में तीन कुश मूलों से विरचित पवित्री धारण किए हुए, जपवटी के अन्तिम भाग में बने छिद्र से तर्जनी अंगुली को बाहर की ओर निकाल-कर भगवती वेदमाता गायत्री के जप में निरत रहते हुए सदा सावधान ऋषियों को देखा । २१
    translation_en:
      author: ai_translation
      text: |
        He observed sages holding a bundle of kuśa grass in the left hand, and three sacred blades of kuśa grass alongside the ritual ring (pavitrī) in the right hand; keeping the index finger extended outside the rosary pouch (japa-vaṭī / gomukhī), they were wholly absorbed in repeating the sacred hymn of Mother Gāyatrī (the Mother of the Vedas).
    notes_en:
      author: ai_translation
      text: |
        In one place he saw ever-attentive sages, holding a handful of kuśa in the left hand and in the right hand a pavitrī made of three kuśa roots, putting the forefinger out through the hole at the end of the japa bag, and engaged in the japa of the goddess Gāyatrī, Mother of the Vedas. (21)
source: "Transcribed via antigravity by the user (2026-08/2026-09) from the manuscript scan; cross-checked against the independent Hindi/Sanskrit copy embedded in the English-translation export. Page 71's manuscript had a struck-out draft of the description of Parasara in the top margin; the scribal note recording that it was crossed out and re-entered in order on page 73 as slokas 25-27 is preserved here: (टिप्पणी: पृष्ठ ७१ के ऊपरी भाग में महर्षि पराशर के स्वरूप-वर्णन का प्रारम्भिक आलेखन था, जिसे पाण्डुलिपि में वृत्त बनाकर निरस्त (crossed-out) किया गया है और आगे पृष्ठ ७३ पर श्लोक संख्या २५-२६-२७ के रूप में व्यवस्थित रूप से सम्मिलित किया गया है।)"
