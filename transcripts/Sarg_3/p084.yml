page_number_devanagari: "८४"
page_number_arabic: 84
image: "images/pages/p084.jpg"
verses:
  - number: 48
    shlok: |
      इत्युदीरितमतिप्रसन्नधी-
      र्महर्षिणा सुवचस्तेन पराशरे।
      निर्विवेश हृदये कृतज्ञतां
      शालिनता स्वहृदयेन निर्विधे॥ ४८॥
    manuscript_note:
      author: ai_transcription
      text: |
        हस्तलेख पाठभेद/लिपि-टिप्पणी: पाण्डुलिपि में पाद १-२ में `इत्युदीरितमति प्रसन्नधी- / र्महर्षिणा सुवचस्तेन पराशरे` तथा पाद ३-४ में `निर्विवेश हृदये कृतज्ञतां / शालिनता स्वहृदयेन निर्विधे` लिखा है। वृत्त: रथोद्धता
    manuscript_note_en:
      author: ai_transcription
      text: |
        Paleographic / Textual Note: Lines 1–2 record Mṛkaṇḍu’s uplifted spirit upon hearing the benevolent pronouncements of Maharṣi Parāśara. Lines 3–4 express how Mṛkaṇḍu absorbed this benediction deep into his grateful heart with unblinking reverence and decorum. Meter: Rathoddhatā [– ⏑ – | ⏑ ⏑ ⏑ | – ⏑ – | ⏑ –]
    shlok_en:
      author: ai_translation
      text: |
        When the great sage Parāśara had spoken these good words thus, [Mṛkaṇḍu,] very glad of mind, settled gratitude in his heart, modestly, with his own heart [unclear]. [Partly corrupt.] (48)
    translation:
      author: amanuensis
      text: |
        पराशर मुनि के ऐसे सुन्दर वचन कहे जाने पर विद्या प्रसन्न बुद्धि एवं निर्निमेष बड़े बड़े आश्चर्य वाले महात्मा के मृकण्डु ने शालीन अपने हृदय से उनके प्रति कृतज्ञता व्यक्त की॥ ४८॥
    notes:
      author: grandfather
      text: |
        यों महर्षि पराशर जी के अत्यन्त उदार एवं अत्यन्त प्रभावशाली उत्तम वाणी को सुनकर उदारहृदय अतिशय प्रसन्न बुद्धिवाले मुनि मृकण्डु ने अपलक नयनों से उनकी कृतज्ञता ज्ञापित करते हुए सहृदय पूर्वक उनका आभार व्यक्त किया। ४८
    translation_en:
      author: ai_translation
      text: |
        When the sage Parāśara had said such fine words, the great soul Mṛkaṇḍu, glad of mind [the Hindi as transcribed reads "विद्या प्रसन्न"] and with unblinking, wide-eyed wonder, expressed his gratitude to him from his modest heart. (48)
    notes_en:
      author: ai_translation
      text: |
        Thus, hearing the very generous, very powerful, excellent words of Maharṣi Parāśara, the generous-hearted sage Mṛkaṇḍu, very glad of mind, expressed his gratitude with unblinking eyes and warmly thanked him. (48)
  - number: 49
    shlok: |
      ऊचिवांश्च मधुरं स्वरान्वितं
      निर्व्यलीकमुपलभ्य मानसम्।
      आर्य! निष्पतति यत्र ते कृपा
      पूर्णदृष्टिरथ तस्य का कथा॥ ४९॥
    manuscript_note:
      author: ai_transcription
      text: |
        हस्तलेख पाठभेद/लिपि-टिप्पणी: पाण्डुलिपि में पाद १ में `ऋचिवांच्च मधुरं स्वरान्वितं` लिखा है जो `ऊचिवांश्च मधुरं स्वरान्वितं` का द्योतक है। पाद ३ में 'आर्य!' का सम्बोधन है। वृत्त: रथोद्धता
    manuscript_note_en:
      author: ai_transcription
      text: |
        Paleographic / Textual Note: In line 1, the amanuensis writes `ऋचिवांच्च मधुरं स्वरान्वितं`, which stands for `ऊचिवांश्च मधुरं स्वरान्वितं`. Line 2 notes the transparent, unblemished purity of Parāśara’s heart (nirvyalīkam). Meter: Rathoddhatā [– ⏑ – | ⏑ ⏑ ⏑ | – ⏑ – | ⏑ –]
    shlok_en:
      author: ai_translation
      text: |
        And having found [his] mind free of guile, he spoke sweetly, in a tuneful voice: "Noble one, where your kindness falls, and your full gaze, what more is there to say of that?" (49)
    translation:
      author: amanuensis
      text: |
        महर्षि के स्वरान्वित मधुर वचन तथा निर्व्यलीक स्वच्छ मन को पाकर बोले- हे आर्य! आपकी कृपापूर्ण दृष्टि जहाँ पड़ती है तो उसके विषय में कहना ही क्या?॥ ४९॥
    notes:
      author: grandfather
      text: |
        महर्षि पराशर के अत्यन्त मधुर स्वरों से सर्वथा मनोहर, निष्छल एवं पूर्ण उदारशयता का अपने हृदय में निरन्तर विचार करते हुए मुनि मृकण्डु ने कहा कि हे प्रभो यहाँ आपकी पूर्ण कृपा की दृष्टि पड़ जाती है वहाँ की बात क्या कही जाय? अर्थात् आपकी अनुग्रह भंग से क्या सम्भव नहीं है? ४९
    translation_en:
      author: ai_translation
      text: |
        Having received the great sage's sweet, tuneful words and his guileless, clear mind, he said: "Noble one! Where your kind gaze falls, what need is there to speak of it?" (49)
    notes_en:
      author: ai_translation
      text: |
        Constantly reflecting in his heart on the very charming, guileless and fully generous nature of Maharṣi Parāśara, with his very sweet voice, the sage Mṛkaṇḍu said: "Lord, where the gaze of your full kindness falls, what can be said of that place? That is, what is not possible through your favour?" (49)
