page_number_devanagari: "८३"
page_number_arabic: 83
image: "images/pages/p083.jpg"
verses:
  - number: 46
    shlok: |
      एष आङ्गिरसगोत्रसम्भवः
      स्यात् सहायकतया पदे पदे ।
      आश्रमान्वयमनोरथानुगं
      सर्वकर्मनिपुणोऽप्यधुना विधास्यति ॥ ४६ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: रथोद्धता। पाद २ "सहायकतया" (पूर्व "सहायकस्तथा")। पाद ४ अधिलिखित और अस्पष्ट है; पूर्व पाठ (१४ अक्षर) छन्द में नहीं बैठता, यथावत् रखा है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Rathoddhatā. Pāda 2 reads "सहायकतया" (earlier "सहायकस्तथा"). Pāda 4 is overwritten and unclear; the earlier reading (fourteen syllables) does not scan and is kept as it was.
    shlok_en:
      author: ai_translation
      text: |
        "This one, born in the Āṅgirasa gotra, will be your helper at every step; skilled in all work, he will now carry out [the building of] the hermitage, following your wishes." (46)
    translation:
      author: amanuensis
      text: |
        इस आङ्गिरस गोत्रीय को मैं तुम्हारे सहायतार्थ दे रहा हूँ यह कर्मठ है अतः सम्प्रति तुम्हारे मनोरथ्रानुरूप आश्रम का निर्माण कर करेगा॥ ४६॥
    notes:
      author: grandfather
      text: |
        इस आङ्गिरस गोत्र में उत्पन्न होने वाले विशिष्ट व्यक्ति को मैं तुम्हारी उचित सहायता करने में सर्वथा सक्षम होने के कारण तुम्हारे सहयोग के लिए दे रहा हूँ। यह व्यक्ति अपने कार्य निपुण एवं पूर्ण कर्मठ है यह तुम्हारी परिकल्पना के अनुरूप जैसा चाहोगे वैसे आश्रम का निर्माण करवा देगा। ४६
    translation_en:
      author: ai_translation
      text: |
        "I am giving you this man of the Āṅgirasa gotra to help you. He is hard-working, so he will now build the hermitage in keeping with your wishes." (46)
    notes_en:
      author: ai_translation
      text: |
        "I am giving you, for your support, this distinguished person born in the Āṅgirasa gotra, because he is fully able to give you proper help. This man is skilled in his work and fully hard-working; he will have the hermitage built as you conceive it, just as you wish." (46)
  - number: 47
    shlok: |
      श्वोऽधुनेव सह दत्तयाऽमुया
      तत्र गच्छतु सवत्सया गवा।
      सर्वमेव भगवान् मनोरथं
      सुप्रपूरयतु ते ममाशिषा॥ ४७॥
    manuscript_note:
      author: ai_transcription
      text: |
        हस्तलेख पाठभेद/लिपि-टिप्पणी: पाण्डुलिपि में पाद १ में `श्वोऽधुनेव सह दत्तयाऽमुया`, पाद २ में `तत्र गच्छतु सवत्सया गवा`, पाद ४ में `सुप्रपूरयतु ते ममाशिषः / ममाशिषा` लिखा है। वृत्त: रथोद्धता
    manuscript_note_en:
      author: ai_transcription
      text: |
        Paleographic / Textual Note: Line 1–2 instructs Mṛkaṇḍu to depart on the morrow accompanied by the Āṅgirasa sage and the sacred cow with her young calf (savatsā gauḥ) gifted during the reception rites. Line 4 conveys Parāśara’s heartfelt blessing. Meter: Rathoddhatā [– ⏑ – | ⏑ ⏑ ⏑ | – ⏑ – | ⏑ –]
    shlok_en:
      author: ai_translation
      text: |
        "Tomorrow, now as it were, let him go there with this cow and her calf that were given; may the Lord fully fulfil your every wish, by my blessing." (47)
    translation:
      author: amanuensis
      text: |
        कल मधुपर्क में समर्पित सवत्सा गौ के साथ यह वहाँ जावे। भगवान् तुम्हारे समस्त मनोरथ को पूर्ण करे यह मेरा आशीर्वाद है॥ ४७॥
    notes:
      author: grandfather
      text: |
        इस मेरे द्वारा दी गई सवत्सा गौ के साथ कल तुम इसी आंगिरस ऋषि को साथ लेकर दर्दुर स्थान जावो, वहाँ भगवान् तुम्हारे सारे मनोरथ पूर्ण करेंगे यह मेरी हार्दिक अभिलाषा एवं पूर्ण आशीर्वाद है। ४७
    translation_en:
      author: ai_translation
      text: |
        "Tomorrow let him go there with the cow and her calf offered in the madhuparka. May the Lord fulfil all your wishes; this is my blessing." (47)
    notes_en:
      author: ai_translation
      text: |
        "Tomorrow, with this cow and her calf given by me, take this same Āṅgirasa sage with you and go to the place Dardura; there the Lord will fulfil all your wishes. This is my heartfelt wish and full blessing." (47)
