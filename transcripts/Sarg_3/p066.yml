page_number_devanagari: "६६"
page_number_arabic: 66
image: "images/pages/p066.jpg"
verses:
  - number: 11
    shlok: |
      गां बबन्ध वटमूलसन्ततौ
      दृश्यमेकदिशि रम्यमासनम् ।
      [unclear: शिरोदिशि कमनु कम्बलोत्तरं]
      [unclear: कौशमास्तृण शयनाय संस्तरे] ॥ ११ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: रथोद्धता। पाद १–२ शुद्ध ("बबन्ध", "एकदिशि"; पूर्व पाठ "बबन्धा / एकादिशि" भ्रान्त था)। पाद ३–४ फीके हैं और पूर्व पाठ छन्द में नहीं बैठता; पुनः पठन आवश्यक।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Rathoddhatā. Pādas 1–2 scan ("बबन्ध", "एकदिशि"; the earlier "बबन्धा / एकादिशि" was wrong). Pādas 3–4 are faint, and the earlier reading, kept here in brackets, does not scan; they need re-reading.
    shlok_en:
      author: ai_translation
      text: |
        He tied the cow among the spread of the banyan's roots, [made] a pleasant seat on one side, and, [laying] a blanket toward the head, spread a bed of kuśa for sleeping. [Lines 3–4 are imperfectly transcribed.] (11)
    translation:
      author: amanuensis
      text: |
        बरगद के जड़ों में गाय को बाँधा, एक वत्स को बाँधा, एक तरफ सुन्दर आसन या शिर के ओर कम्बल तथा अपने शयनार्थ कुशा का बिस्तर बिछाया ॥ ११ ॥
    notes:
      author: grandfather
      text: |
        ऋषि ने, सामने स्थित विशाल वटवृक्ष के जड़ में गाँय को सविधि बाँधा तथा एक ओर चित्तवृत्ति को पूर्ण शान्त स्वस्थ रखने वाला मनोहर आसन बनाया, साथ ही अपने शयन के लिए पूर्व सिरान्हा कर नीचे कम्बलासन पर उत्तम कुशासन का बिस्तर भी लगाया । ११
    translation_en:
      author: ai_translation
      text: |
        He tied the cow at the roots of the banyan, tied one calf, [made] a lovely seat on one side, [put] a blanket toward the head, and spread a bed of kuśa grass to sleep on. (11)
    notes_en:
      author: ai_translation
      text: |
        The sage duly tied the cow at the root of the great banyan tree standing in front, and on one side made a charming seat that kept the mind fully calm and settled; for his own sleep he also laid out a bed of excellent kuśa grass on a blanket below, with the head toward the east. (11)
  - number: 12
    shlok: |
      धौतपादकरपल्लवो मुदा
      वन्यमभ्यवजहार किञ्चन ।
      संस्मरन्परतरं महो मुनिः
      सन्दधेऽनु शयनं विधानतः ॥ १२ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: रथोद्धता (चारों पाद शुद्ध)। पाद ४ "विधानतः" (पूर्व पाठ "विधिवतः" भ्रान्त था)। पाद २ पहले "स्वन्मूथवजहार" जैसा लिखकर पंक्ति के अन्त में शुद्ध रूप दोहराया गया है।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Rathoddhatā (all four pādas scan). Pāda 4 reads "विधानतः" (the earlier "विधिवतः" was wrong). Pāda 2 was first miswritten and then rewritten correctly at the end of the line.
    shlok_en:
      author: ai_translation
      text: |
        Having washed his feet and tender hands, he gladly ate a little forest food; then the sage, remembering the highest light, lay down to sleep in due form. (12)
    translation:
      author: amanuensis
      text: |
        आनन्दपूर्वक हाथ-पैर धोकर कुछ वन्य कन्द-मूल-फल दिखाये (खाये), बाद में महात्मा अतिदिव्य ज्योति का स्मरण करते हुए शयन विधि पूर्ण किया ॥ १२ ॥
    notes:
      author: grandfather
      text: |
        इसके बाद ऋषि ने परम आनन्द के साथ हाथ-पैर धोये, वन में सुगमता से प्राप्त होने वाले कन्द मूल-फलादि का भोजन किया, अनन्तर परमात्म प्रभु के दिव्य ज्योति का दर्शन करते हुए शान्त स्वस्थ निश्चिन्त होकर सो गये । १२
    translation_en:
      author: ai_translation
      text: |
        Having joyfully washed his hands and feet, he ate some forest roots, tubers and fruits; then the great soul completed the rite of lying down, remembering the most divine light. (12)
    notes_en:
      author: ai_translation
      text: |
        After this the sage washed his hands and feet with great joy and ate the roots, tubers, fruits and the like easily found in the forest; then, beholding the divine light of the Supreme Lord, he went to sleep, calm, settled and free of worry. (12)
notes_uncertain: true
