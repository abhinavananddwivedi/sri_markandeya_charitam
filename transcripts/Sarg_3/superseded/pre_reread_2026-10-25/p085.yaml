page_number_devanagari: "८५"
page_number_arabic: 85
image: "images/pages/p085.jpg"
verses:
  - number: 50
    shlok: |
      मादृशेऽप्यविदिते त्वयीदृशी
      भावना यदि न काचनाभवत्।
      पूर्त्तिमेष्यति कथं मतिः सादरं
      पादपङ्कजमधुना समाश्रये॥ ५०॥
    manuscript_note:
      author: ai_transcription
      text: |
        हस्तलेख पाठभेद/लिपि-टिप्पणी: पाण्डुलिपि में पाद १ में `मादृशोऽप्यविचिते त्वयीदृशी`, पाद २ में `भावना यदि न काचनाभवात्`, पाद ३ में `पूर्तिमेष्यति कथं मति सादरं` तथा पाद ४ में `पादपङ्कजमधुना समाश्रये` लिखा है। वृत्त: रथोद्धता
    manuscript_note_en:
      author: ai_transcription
      text: |
        Paleographic / Textual Note: Lines 1–2 record Mṛkaṇḍu acknowledging his humility as an unknown aspirant receiving such extraordinary grace. Lines 3–4 express heartfelt gratitude and complete refuge at the sage's lotus feet. Meter: Rathoddhatā [– ⏑ – | ⏑ ⏑ ⏑ | – ⏑ – | ⏑ –]
    shlok_en:
      author: ai_translation
      text: |
        "If you had had no such feeling for one like me, unknown to you, how would [my] intention reach fulfilment? Now I respectfully take refuge at your lotus feet." (50)
    translation:
      author: amanuensis
      text: |
        यदि मुझ अपरिचित व्यक्ति पर आपकी ऐसी भावना न होती तो मेरी कामना की पूर्ति कैसे सम्भव होती, इस सम्बन्ध में आपके पाद कमलों का आश्रयण कर रहा हूँ॥ ५०॥
    notes:
      author: grandfather
      text: |
        मुनि मृकण्डु ने सविनय कहना शुरू किया हे प्रभो! यदि मेरे जैसे अपरिचित अकिंचन व्यक्ति के प्रति आपकी यह उदारता पूर्ण दयार्द्र भावना नहीं होती तो मेरी कामनाओं की पूर्ति कैसे सम्भव होती? मैं सर्वथा कृतज्ञ हुआ अब मैं आप के चरणकमलों को आत्मभाव से अपने को कृतार्थ मानता हूँ। ५०
    translation_en:
      author: ai_translation
      text: |
        "If such divine compassion had not welled up within you toward an unknown, humble person like me, how could my heartfelt aspirations ever have found fulfillment? In deepest reverence, I now take shelter at your lotus feet." (Verse 50)
    notes_en:
      author: ai_translation
      text: |
        The sage Mṛkaṇḍu began to say humbly: "Lord! If you had not had this generous, compassionate feeling toward an unknown, poor person like me, how could my wishes have been fulfilled? I am wholly grateful; now, [taking refuge at] your lotus feet with my whole self, I consider myself fulfilled." (50)
  - number: 51
    shlok: |
      योऽपि मे सहचरोऽर्पितस्त्वया
      त्वाङ्गिरःकुलसमुद्भवो मुनिः।
      कल्पवृक्ष इव पूरयिष्यति
      त्वन्निदेशमधिगत्य मेऽर्थिनाम्॥ ५१॥
    manuscript_note:
      author: ai_transcription
      text: |
        हस्तलेख पाठभेद/लिपि-टिप्पणी: पाण्डुलिपि में पाद १ में `योऽपि मे सहचरोऽर्पितस्त्वया-`, पाद २ में `वाङ्गिरः कुलसमुद्भवो मुनिः`, पाद ४ में `त्वन्निदेशमधिगत्य मेऽर्थिनाम्` लिखा है। वृत्त: रथोद्धता
    manuscript_note_en:
      author: ai_transcription
      text: |
        Paleographic / Textual Note: In line 2, the scribal text reads `वाङ्गिरः कुलसमुद्भवो मुनिः` (the sage born of the Āṅgirasa lineage). Lines 3–4 compare the sage’s cooperative assistance to the wish-fulfilling tree (kalpavṛkṣa). Meter: Rathoddhatā [– ⏑ – | ⏑ ⏑ ⏑ | – ⏑ – | ⏑ –]
    shlok_en:
      author: ai_translation
      text: |
        "And the sage born of the Āṅgirasa line whom you have given me as companion will, like a wish-granting tree, having received your direction, fulfil what I seek." (51)
    translation:
      author: amanuensis
      text: |
        आप ने आङ्गिरसकुलभूषण इस मुनि को मेरे सहचर के अर्पित किया है, वे ही कल्पवृक्ष के समान आपके निर्देश को पाकर मेरी अभिलाषा को पूर्ण करेगा॥ ५१॥
    notes:
      author: grandfather
      text: |
        महर्षे! आपने जिस आंगिरस ऋषि के उच्च कुल में उत्पन्न होने वाले महर्षि प्रवर को मेरा सहयोग करने के लिए साथ में जाने के लिए भी आदेश दिया है वे स्वयं कल्पवृक्ष के समान आपकी आज्ञाओं का पालन करते हुए मेरी सभी कामनायें सर्वथा अवश्य पूर्ण करेंगे। ५१
    translation_en:
      author: ai_translation
      text: |
        "You have given me this sage, the ornament of the Āṅgirasa line, as my companion; having received your direction, he will fulfil my wish like a wish-granting tree." (51)
    notes_en:
      author: ai_translation
      text: |
        "Maharṣi! The excellent sage born in the high line of the sage Āṅgirasa, whom you have also ordered to go with me to help me, will himself, like a wish-granting tree, obeying your commands, certainly fulfil all my wishes completely." (51)
