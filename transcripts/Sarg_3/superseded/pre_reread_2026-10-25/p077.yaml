page_number_devanagari: "७७"
page_number_arabic: 77
image: "images/pages/p077.jpg"
verses:
  - number: 34
    shlok: |
      प्रत्युवाच सकलज्ञ ते धिया
      किं तिरोहितमथो ब्रवीमि यत्।
      किन्तु शासनमुपेत्य गद्यते
      त्वामधीतमपि वत्सलत्वतः॥ ३४॥
    manuscript_note:
      author: ai_transcription
      text: |
        हस्तलेख पाठभेद/लिपि-टिप्पणी: पाद ३ में पाण्डुलिपि में `किन्तु शासनसुचेतथ गद्यते` जैसा अक्षराभास है जो लिपिकार के प्रमाद से `किन्तु शासनमुपेत्य गद्यते` है। पाद ४ में `त्वामधीतमपि / स्वामभीष्टमपि मयि वत्सलत्वतः` भाव प्रकट करता है। वृत्त: रथोद्धता
    manuscript_note_en:
      author: ai_transcription
      text: |
        Paleographic / Textual Note: In line 3, the cursive script has an ambiguous cluster resembling `शासनसुचेतथ`, which corresponds to `शासनमुपेत्य गद्यते` [spoken having received your holy instruction]. Line 4 conveys his speech uttered under the shelter of the sage's boundless affection [vatsalatvataḥ]. Meter: Rathoddhatā [– ⏑ – | ⏑ ⏑ ⏑ | – ⏑ – | ⏑ –]
    shlok_en:
      author: ai_translation
      text: |
        He replied: "Knower of all, what is hidden from your mind, that I should tell it? Yet, having received your command, it is said to you out of affection, though you have learned it already." (34)
    translation:
      author: amanuensis
      text: |
        महर्षि मृकण्डु बोले हे सकलज्ञ! आपकी बुद्धि से कुछ तिरोहित (छिपा) नहीं है, जिसे मैं बोलूँ। कि आपकी आज्ञा पाकर मैं कह रहा हूँ क्योंकि मुझ पर आपकी महती वत्सलता युक्त ॥ ३४॥
    notes:
      author: grandfather
      text: |
        महर्षि पराशर की उपर्युक्त बाते सुनकर मुनि मृकण्डु कहने लगे, हे महर्षि! आपकी बुद्धितथा त्रिकालज्ञता से इस विश्व की कौन सी वस्तु वा बात ही है आप से कौन बात छिपी हुई है, कि आपके यह आदेश पाकर कहता हूँ क्योंकि आपकी मेरे ऊपर अतिशय स्नेह वा वात्सल्यता जो है। ३४
    translation_en:
      author: ai_translation
      text: |
        Maharṣi Mṛkaṇḍu said: "Knower of all! Nothing is hidden from your mind that I should say it. But having received your command I am speaking, because you have great affection for me." (34)
    notes_en:
      author: ai_translation
      text: |
        Hearing the above words of Maharṣi Parāśara, the sage Mṛkaṇḍu began to say: "Maharṣi! What thing or matter of this world is there, given your intellect and knowledge of the three times? What is hidden from you? But having received this order of yours I speak, because you have such great love and affection for me." (34)
  - number: 35
    shlok: |
      तात! यद्वदसि तत् तथैव मे
      सर्वमेव भवता समर्थितम्।
      सोऽहमास्मि न कृतज्ञतां त्यजे
      यावदायुषमितीरये पुनः॥ ३५॥
    manuscript_note:
      author: ai_transcription
      text: |
        हस्तलेख पाठभेद/लिपि-टिप्पणी: पाण्डुलिपि में `सोऽहमाह्मि न कृतज्ञतान्त्यजे` लिपिकार का लेख है, जो शुद्धतः `सोऽहमास्मि न कृतज्ञतां त्यजे` है। वृत्त: रथोद्धता
    manuscript_note_en:
      author: ai_transcription
      text: |
        Paleographic / Textual Note: Line 3 has scribal orthography `सोऽहमाह्मि न कृतज्ञतान्त्यजे`, representing standard `सोऽहमास्मि न कृतज्ञतां त्यजे`. Meter: Rathoddhatā [– ⏑ – | ⏑ ⏑ ⏑ | – ⏑ – | ⏑ –]
    shlok_en:
      author: ai_translation
      text: |
        "Father, what you say is just so; everything has been confirmed by you. I am he. I will not abandon gratitude as long as I live; so I say again." (35)
    translation:
      author: amanuensis
      text: |
        हे तात! जो आप कह रहे हैं, मेरे विषय में वह सब वैसा ही है जिसे आपने समर्थन किया है। मैं वही हूँ, किन्तु जीवन पर्यन्त मैं कृतज्ञता नहीं भूल सकता यह मैं पुनः कह रहा हूँ॥ ३५॥
    notes:
      author: grandfather
      text: |
        पूज्यपाद! आप मेरे सम्बन्ध में जो जितना जैसा जानकर कह रहे हैं वह सब बिल्कुल वैसा ही है जिसे आपने स्वयं समर्थन किया है। प्रभो! मैं सचमुच वही हूँ, आपकी कृतज्ञता क्या मैं आजीवन भूल सकता हूँ? इसे फिर भी आप की आज्ञा शिरोधार्य कर अपनी बातें कह रहा हूँ। ३५
    translation_en:
      author: ai_translation
      text: |
        "Father! What you are saying about me is all just so, as you have confirmed. I am that one; but I cannot forget my gratitude as long as I live; this I say again." (35)
    notes_en:
      author: ai_translation
      text: |
        "Revered one! All that you say about me, knowing it as it is, is exactly so, as you yourself have confirmed. Lord! I really am that one. Could I forget my gratitude to you all my life? Even so, placing your command on my head, I am saying what I have to say." (35)
