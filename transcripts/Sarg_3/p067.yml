page_number_devanagari: "६७"
page_number_arabic: 67
image: "images/pages/p067.jpg"
verses:
  - number: 13
    shlok: |
      सन्निधाय च शिरः प्रदेशके
      वारिपूर्णकलशं सकटोरम् ।
      सन्निवेश्य भगवत्स्मृतिं हृदि
      मातुरङ्कपतितो यथा शिशुः ॥ १३ ॥
    shlok_en:
      author: ai_translation
      text: |
        And placing at his head a pot full of water with a bowl, and setting the remembrance of the Lord in his heart, [he slept] like a child that has fallen asleep in its mother's lap. (13)
    translation:
      author: amanuensis
      text: |
        शिरःप्रदेश में जलपूर्ण कलश तथा कटोरा रखकर भगवान् का स्मरण करते हुए माता के गोद में पड़ा हुआ शिशुवत् सो गये ॥ १३ ॥
    notes:
      author: grandfather
      text: |
        इसके बाद मुनि मृकण्ड ने जल से भरे हुए पूर्ण कलश को काँसे के कटोरे से ढंककर अपने सिरहाने रखा, भगवान् का स्मरण करते हुए जैसे माता की गोद में शान्तिपूर्वक निश्चिन्त कोई बालक सो जाये वैसे ही स्वस्थ शान्त मातृ सदृशी भगवती धरा की गोद में स्वस्थ हो सो गये । १३
    translation_en:
      author: ai_translation
      text: |
        Placing at his head a pot full of water and a bowl, and remembering the Lord, he slept like a child lying in its mother's lap. (13)
    notes_en:
      author: ai_translation
      text: |
        After this the sage Mṛkaṇḍa covered a full pot of water with a bronze bowl and placed it at his head; remembering the Lord, just as a child sleeps peacefully and without worry in its mother's lap, so he slept, settled and calm, in the lap of the goddess Earth, who is like a mother. (13)
  - number: 14
    shlok: |
      निद्रया व्यपगतस्मृतिर्बभौ
      सत्समाधिमनुशीलयन्मुनिः ।
      आरुणे समुपजृम्भिते पुरो
      जाग्रतः स्वनियमं चकार सः ॥ १४ ॥
    manuscript_note:
      author: ai_transcription
      text: |
        वृत्त: रथोद्धता (चारों पाद शुद्ध)। पाद २ "मनुशीलयन्" और पाद ३ "आरुणे समुपजृम्भिते" (पूर्व पाठ "मिव शीलयन् / अरुणे समुदञ्चिते" भ्रान्त था)।
    manuscript_note_en:
      author: ai_transcription
      text: |
        Metre: Rathoddhatā (all four pādas scan). Pāda 2 reads "मनुशीलयन्" and pāda 3 "आरुणे समुपजृम्भिते" (the earlier "मिव शीलयन् / अरुणे समुदञ्चिते" was wrong).
    shlok_en:
      author: ai_translation
      text: |
        His awareness withdrawn in sleep, the sage shone as if practising true samādhi; when the dawn spread out before him, he awoke and performed his own observances. (14)
    translation:
      author: amanuensis
      text: |
        निद्रा से लुप्त स्मृति वाले महात्मा सत् समाधि का अभ्यास करता हुआ दीप्तिमान हो गये । आगे, अरुणोभा छा जाने पर जागकर अपने सन्ध्यावन्दनादि किये ॥ १४ ॥
    notes:
      author: grandfather
      text: |
        यद्यपि मुनि मृकण्ड गहरी नींद में पूर्ण सो गये थे, उनकी स्मृतियाँ समाप्त हो गई थीं, लगता था कि मुनि अत्यन्त तेजोदीप्त उदात्ततम समाधि की अवस्था में समाहित हो गये हैं, प्रातःकाल अरुणोभा के पूर्व ब्राह्मवेला में ही उठकर प्रात्याहिक दैनन्दिन सन्ध्यावन्दनादि का कार्य सविधि सम्पन्न किया । १४
    translation_en:
      author: ai_translation
      text: |
        The great soul, his awareness lost in sleep, became radiant as though practising true samādhi. Then, when the glow of dawn spread, he woke and performed his sandhyā worship and other rites. (14)
    notes_en:
      author: ai_translation
      text: |
        Although the sage Mṛkaṇḍa had fallen fully into deep sleep and his awareness had ceased, it seemed that the sage was absorbed in a very radiant, most exalted state of samādhi. In the morning, before the glow of dawn, he rose at the brāhma hour and duly completed his daily morning sandhyā worship and other rites. (14)
